<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생산기술팀 업무 프로세스 보드</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f4f'/%3E%3Crect x='6' y='13' width='6' height='14' rx='2' fill='%23eef3ef'/%3E%3Crect x='13' y='6' width='6' height='21' rx='2' fill='%23e0ac2f'/%3E%3Crect x='20' y='16' width='6' height='11' rx='2' fill='%23eef3ef'/%3E%3C/svg%3E">
<script>
// 화면이 그려지기 전에 저장된 테마를 먼저 적용해서, 밝은 화면이 잠깐 번쩍이는 걸 방지한다.
(function(){ try{ var t=localStorage.getItem('ppe_theme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme', t); }catch(e){} })();
</script>
<style>
  :root{
    --ink:#1c2321;
    --paper:#f7f8f6;
    --surface:#ffffff;
    --border:#d8dcd8;
    --border-soft:#e5e8e3;
    --muted:#4a5450;
    --muted-2:#8b948f;
    --primary:#2f6f4f;
    --primary-ink:#234f39;
    --primary-tint:#e7f0ea;
    --accent:#b8860b;
    --accent-tint:#fff6df;

    --s-start:#8b948f;       --s-start-tint:#eef0ed;
    --s-assigned:#5b6eae;    --s-assigned-tint:#e9ecf7;
    --s-progress:#3a6b78;    --s-progress-tint:#e7eef0;
    --s-waiting:#7b5ea7;     --s-waiting-tint:#efe9f6;
    --s-delay:#b3423a;       --s-delay-tint:#faeae9;
    --s-done:#2f6f4f;        --s-done-tint:#e7f0ea;

    --t-mdm:#3a6b78;   --t-mdm-tint:#e7eef0;
    --t-eco:#b8860b;   --t-eco-tint:#fff6df;
    --t-auto:#a6337a;  --t-auto-tint:#f6e8f1;
    --t-etc:#78807c;   --t-etc-tint:#eef0ed;

    /* 대시보드/칸반보드 재설계용 토큰 — 노션풍의 둥글고 부드러운 표면 + 은은한 그림자 */
    --radius-lg:18px; --radius-md:12px;
    --shadow-1:0 1px 2px rgba(28,35,33,.04), 0 8px 20px -8px rgba(28,35,33,.10);
    --shadow-2:0 2px 6px rgba(28,35,33,.06), 0 14px 32px -10px rgba(28,35,33,.16);

    color-scheme: light;
  }
  /* 다크 모드 — 저장된 선택이 없으면 OS 설정을 따르고, "테마" 버튼으로 직접 켜고 끌 수 있다 */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8ebe9; --paper:#14181a; --surface:#1c2224; --border:#33393b; --border-soft:#282e30;
      --muted:#9aa4a0; --muted-2:#6b7470;
      --primary:#4a9c6f; --primary-ink:#7ecba0; --primary-tint:#1c3226;
      --accent:#d4a017; --accent-tint:#3a2f10;
      --s-start:#9aa4a0;    --s-start-tint:#262b29;
      --s-assigned:#8592cf; --s-assigned-tint:#1f2436;
      --s-progress:#5c98a6; --s-progress-tint:#1a2c30;
      --s-waiting:#a58bd0;  --s-waiting-tint:#2a2036;
      --s-delay:#e0736a;    --s-delay-tint:#3a201e;
      --s-done:#4a9c6f;     --s-done-tint:#1c3226;
      --t-mdm:#5c98a6;  --t-mdm-tint:#1a2c30;
      --t-eco:#d4a017;  --t-eco-tint:#3a2f10;
      --t-auto:#cf6bab; --t-auto-tint:#331f2c;
      --t-etc:#9aa19c;  --t-etc-tint:#262b29;
      --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -8px rgba(0,0,0,.5);
      --shadow-2:0 2px 8px rgba(0,0,0,.35), 0 16px 36px -10px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e8ebe9; --paper:#14181a; --surface:#1c2224; --border:#33393b; --border-soft:#282e30;
    --muted:#9aa4a0; --muted-2:#6b7470;
    --primary:#4a9c6f; --primary-ink:#7ecba0; --primary-tint:#1c3226;
    --accent:#d4a017; --accent-tint:#3a2f10;
    --s-start:#9aa4a0;    --s-start-tint:#262b29;
    --s-assigned:#8592cf; --s-assigned-tint:#1f2436;
    --s-progress:#5c98a6; --s-progress-tint:#1a2c30;
    --s-waiting:#a58bd0;  --s-waiting-tint:#2a2036;
    --s-delay:#e0736a;    --s-delay-tint:#3a201e;
    --s-done:#4a9c6f;     --s-done-tint:#1c3226;
    --t-mdm:#5c98a6;  --t-mdm-tint:#1a2c30;
    --t-eco:#d4a017;  --t-eco-tint:#3a2f10;
    --t-auto:#cf6bab; --t-auto-tint:#331f2c;
    --t-etc:#9aa19c;  --t-etc-tint:#262b29;
    --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -8px rgba(0,0,0,.5);
    --shadow-2:0 2px 8px rgba(0,0,0,.35), 0 16px 36px -10px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;}
  button{font-family:inherit;}
  ::selection{background:color-mix(in srgb, #ff8a3d 40%, transparent);}

  /* ---------- layout ---------- */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:212px; flex:0 0 212px;
    background:var(--surface); color:var(--ink);
    border-right:1px solid var(--border);
    padding:20px 14px; display:flex; flex-direction:column; gap:2px;
    position:sticky; top:0; height:100vh;
  }
  /* 로고를 아이콘+문구가 한 덩어리로 보이는 "배지" 하나로 디자인 — 고정된 브랜드 색 배경이라
     라이트/다크 모드 어느 쪽에서 봐도 항상 같은 모습으로 또렷하게 보임(테마 색상에 의존하지 않음). */
  .brand{
    display:flex; align-items:center; gap:9px; text-align:left; width:100%;
    background:#2f6f4f; border:none; border-radius:10px; cursor:pointer;
    padding:11px 12px; margin-bottom:14px; font-family:inherit;
    transition:background .12s, transform .12s;
  }
  .brand:hover{background:#285f42;}
  .brand:active{transform:scale(.98);}
  .brand-icon{flex:0 0 auto;}
  .brand-word{
    flex:1; min-width:0; color:#fff; font-weight:800; font-size:14px; letter-spacing:-.01em;
    display:flex; flex-direction:column; line-height:1.3;
  }
  .brand-sub{font-weight:500; font-size:11px; color:rgba(255,255,255,.75); margin-top:1px;}
  .navbtn{
    display:flex; align-items:center; gap:9px;
    padding:9px 10px; border-radius:7px; border:none; background:transparent;
    color:var(--muted); text-align:left; font-size:13.5px; font-weight:500; cursor:pointer;
    transition:background .12s, color .12s;
  }
  .navbtn:hover{background:var(--paper); color:var(--ink);}
  .navbtn.active{background:var(--primary); color:#fff;}
  .navbtn .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex:0 0 auto;}
  .navbtn .nav-ico{font-size:14px; line-height:1; width:18px; text-align:center; flex:0 0 auto;}
  .nav-list{display:flex; flex-direction:column; gap:2px;}
  .navbtn.nav-hidden{display:none;}
  .nav-edit-btn{margin-top:6px; padding:6px 10px; border:none; background:transparent; color:var(--muted-2); font:inherit; font-size:11.5px; text-align:left; cursor:pointer; border-radius:7px;}
  .nav-edit-btn:hover{background:var(--paper); color:var(--ink);}
  .menu-edit-list{display:flex; flex-direction:column; gap:6px;}
  .menu-edit-row{display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--border); border-radius:9px; background:var(--paper); cursor:grab;}
  .menu-edit-row.off .menu-edit-name{opacity:.45; text-decoration:line-through;}
  .menu-edit-row.dragging{opacity:.4;}
  .menu-edit-grip{color:var(--muted-2); font-size:12px; letter-spacing:-2px;}
  .menu-edit-name{flex:1; display:flex; align-items:center; gap:8px; font-size:13px;}
  .menu-edit-show{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .menu-edit-show input{width:auto; margin:0;}
  .nav-badge{
    margin-left:auto; background:var(--accent); color:#fff; font-size:10px; font-weight:700;
    border-radius:20px; padding:1px 6px; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--border-soft);}
  .user-box{margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border-soft);}
  .user-box-label{font-size:10.5px; color:var(--muted-2); font-weight:600; margin-bottom:7px;}
  .user-row{display:flex; align-items:center; gap:8px;}
  .user-avatar{
    width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff;
    font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .sync{font-size:11px; color:var(--muted-2); display:flex; align-items:center; gap:6px; padding:6px 10px;}
  .sync .led{width:6px; height:6px; border-radius:50%; background:var(--primary);}
  .sync.saving .led{background:var(--accent);}
  .resetbtn{
    width:100%; margin-top:6px; background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:7px 10px; border-radius:7px; font-size:11.5px; cursor:pointer;
  }
  .resetbtn:hover{color:var(--ink); border-color:var(--muted-2);}

  .main{flex:1; min-width:0; padding:26px 32px 60px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .topbar h1{font-size:19px; margin:0; font-weight:700;}
  .topbar .sub{color:var(--muted); font-size:12.5px; margin-top:3px;}
  .save-status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap; flex:0 0 auto; align-self:center;}
  .save-status-dot{width:7px; height:7px; border-radius:50%; background:#8fae94; flex:0 0 auto;}
  .save-status.pending .save-status-dot{background:var(--warn, #b8860b); animation:saveDotPulse 1.1s ease-in-out infinite;}
  .save-status.error .save-status-dot{background:var(--danger, #b3423a);}
  .login-top-btn{margin-left:6px; padding:5px 11px; border-radius:8px; border:1px solid var(--primary); background:var(--primary); color:#fff; font:inherit; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .login-top-btn:hover{filter:brightness(1.08);}
  .login-top-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .login-top-btn[hidden]{display:none;}
  /* 로그인 전 화면 — 업무 내용이 보이지 않도록 전체를 덮는다 */
  #loginGate{position:fixed; inset:0; z-index:9500; background:var(--paper); display:flex; align-items:center; justify-content:center; padding:16px;}
  .login-gate-card{width:min(420px,100%); background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:16px; padding:30px 26px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .login-gate-logo{font-size:34px; margin-bottom:6px;}
  .login-gate-card h2{margin:0 0 8px; font-size:18px;}
  .login-gate-card p{margin:0 0 18px; font-size:13.5px; color:var(--muted); line-height:1.6;}
  /* 내 계정 선택 */
  .acct-dialog{width:min(520px,100%);}
  .acct-list{display:flex; flex-direction:column; gap:8px; margin:6px 0 12px;}
  .acct-opt{display:flex; align-items:center; gap:10px; text-align:left; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--paper); color:var(--ink); font:inherit; font-size:13.5px; cursor:pointer;}
  .acct-opt:hover{border-color:var(--primary); background:var(--primary-tint);}
  .acct-opt:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  .acct-opt:disabled{opacity:.6; cursor:default;}
  .acct-opt.armed{border-color:var(--primary); background:var(--primary-tint); box-shadow:0 0 0 1px var(--primary) inset;}
  /* 사이드바의 로그인 사용자 표시 */
  .cur-user-who{flex:1; min-width:0; text-align:left; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:transparent; color:inherit; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cur-user-who:hover{border-color:var(--primary);}
  /* GUEST(조회만): 수정용 버튼을 숨기고, 저장 시도 시 안내 */
  body.guest-mode #addTaskBtn, body.guest-mode .advance-btn, body.guest-mode .quick-assign, body.guest-mode #manageUsersBtn{display:none !important;}
  body.guest-mode .card{cursor:default;}
  .guest-modal-note{margin:0 0 10px; padding:8px 12px; border-radius:10px; background:var(--accent-tint); color:var(--ink); font-size:12.8px; font-weight:700;}
  #guestNotice{position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); z-index:9600; background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:10px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:calc(100vw - 32px);}
  #guestNotice.show{opacity:1; transform:translate(-50%, 0);}
  @keyframes saveDotPulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- process tab ---------- */
  .proc-intro{max-width:640px; color:var(--muted); margin-bottom:26px; font-size:13.5px;}
  /* 그리드 기반 레이아웃: 폭이 줄어도 칸 수가 고정 배율로만 바뀌어 상자 비율이 흐트러지지 않음
     (예전 flex-wrap 방식은 임의 폭에서 어중간하게 줄바꿈되며 화살표가 허공을 가리키는 문제가 있었음) */
  .flow{display:grid; grid-template-columns:repeat(4, 1fr); gap:28px; margin-bottom:34px;}
  .flow-step{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; position:relative;
  }
  .flow-step::after{
    content:"→"; position:absolute; right:-22px; top:50%; transform:translateY(-50%);
    color:var(--muted-2); font-size:16px;
  }
  .flow-step:last-child::after{content:none;}
  @media (max-width:1150px){
    .flow{grid-template-columns:repeat(2, 1fr); gap:24px 28px;}
    .flow-step::after{content:none;} /* 2열로 접히면 화살표 방향이 애매해지므로 번호만으로 순서 표시 */
  }
  @media (max-width:640px){
    .flow{grid-template-columns:1fr;}
  }
  .flow-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; background:var(--primary-tint); color:var(--primary-ink);
    font-size:11.5px; font-weight:700; margin-bottom:10px;
  }
  .flow-step h3{font-size:13.5px; margin:0 0 6px;}
  .flow-step p{margin:0; font-size:12px; color:var(--muted); line-height:1.55;}

  .proc-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:20px; align-items:start;}
  @media (max-width:980px){.proc-grid{grid-template-columns:1fr;}}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px 20px;}
  .panel h3{font-size:13.5px; margin:0 0 12px;}
  .checklist-demo{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .checklist-demo li{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink);}
  .checklist-demo .box{width:15px; height:15px; border-radius:4px; border:1.5px solid var(--border); flex:0 0 auto;}
  .legend-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--border-soft); font-size:12.8px;}
  .legend-row:last-child{border-bottom:none;}
  .legend-left{display:flex; align-items:center; gap:9px;}
  .swatch{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .legend-count{color:var(--muted-2); font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:11.5px;}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center;}
  .search{
    flex:1 1 220px; min-width:180px;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; font-size:13px; color:var(--ink);
  }
  .search:focus{outline:none; border-color:var(--primary);}
  select.filt{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:7px 10px; font-size:12.5px; color:var(--ink); cursor:pointer;
  }
  .btn{
    background:var(--primary); color:#fff; border:none; border-radius:8px;
    padding:8px 14px; font-size:12.8px; font-weight:600; cursor:pointer;
  }
  .btn:hover{background:var(--primary-ink);}
  .btn-ghost{background:var(--surface); color:var(--ink); border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--muted-2);}
  .mytoggle{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 12px;
    font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap;
  }
  .mytoggle:hover{border-color:var(--muted-2);}
  .mytoggle.on{background:var(--primary); border-color:var(--primary); color:#fff;}
  .filter-active-badge{
    display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--primary-ink);
    background:var(--primary-tint); border-radius:7px; padding:6px 12px; margin:-6px 0 14px; width:fit-content;
  }
  .filter-active-badge button{
    background:transparent; border:none; color:var(--primary-ink); text-decoration:underline; font-size:11.5px; cursor:pointer; padding:0;
  }
  .stat-strip{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .notif-filter-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .stat-chip{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; font-size:11.8px; color:var(--muted); display:flex; align-items:center; gap:7px;
  }
  .stat-chip b{color:var(--ink); font-size:14px; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;}

  /* ---------- board (kanban, redesigned) ---------- */
  .board{display:flex; gap:16px; overflow-x:auto; padding-bottom:10px; align-items:flex-start;}
  .col{
    background:color-mix(in srgb, var(--col-tint, var(--paper)) 55%, var(--paper)); border-radius:var(--radius-lg); padding:14px; flex:1 1 264px; min-width:264px;
    border:1px solid color-mix(in srgb, var(--col-accent, var(--border-soft)) 30%, var(--border-soft));
  }
  .col-head{display:flex; align-items:center; gap:8px; padding:2px 4px 10px;}
  .col-head .dot{width:9px; height:9px; border-radius:50%; box-shadow:0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);}
  .col-head span.name{font-weight:800; font-size:13.5px;}
  .col-head span.cnt{margin-left:auto; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:11.5px; color:var(--muted); background:var(--surface); border-radius:999px; padding:1px 8px;}
  .col-progress{height:5px; border-radius:999px; background:rgba(120,120,120,.18); overflow:hidden; margin:0 2px 12px;}
  .col-progress-fill{height:100%; border-radius:999px; transition:width .4s ease;}
  .col-body{display:flex; flex-direction:column; gap:10px; max-height:calc(100vh - 260px); overflow-y:auto; padding:4px; border-radius:var(--radius-md); transition:background .12s, outline-color .12s;}
  .col-body.drag-over, .delay-sublist.drag-over{background:color-mix(in srgb, var(--primary) 12%, transparent); outline:2px dashed var(--primary); outline-offset:-2px;}
  /* 다크모드: 흰 배경 기준으로 만든 색 톤이 어두운 배경에서는 채도가 죽어 보이므로,
     컬럼 배경/테두리를 --surface 기준으로 더 진하게 섞고, 드래그 상태 표시도 더 또렷하게 보정한다. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .col{
      background:color-mix(in srgb, var(--col-tint, var(--surface)) 78%, var(--surface));
      border-color:color-mix(in srgb, var(--col-accent, var(--border)) 55%, var(--border));
    }
    :root:not([data-theme="light"]) .col-body.drag-over, :root:not([data-theme="light"]) .delay-sublist.drag-over{
      background:color-mix(in srgb, #ff8a3d 28%, transparent); outline-color:#ff8a3d;
    }
    :root:not([data-theme="light"]) .card.dragging{opacity:.55; outline:2px dashed #ff8a3d; outline-offset:2px;}
  }
  :root[data-theme="dark"] .col{
    background:color-mix(in srgb, var(--col-tint, var(--surface)) 78%, var(--surface));
    border-color:color-mix(in srgb, var(--col-accent, var(--border)) 55%, var(--border));
  }
  :root[data-theme="dark"] .col-body.drag-over, :root[data-theme="dark"] .delay-sublist.drag-over{
    background:color-mix(in srgb, #ff8a3d 28%, transparent); outline-color:#ff8a3d;
  }
  :root[data-theme="dark"] .card.dragging{opacity:.55; outline:2px dashed #ff8a3d; outline-offset:2px;}
  .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md);
    padding:12px 13px; cursor:grab; box-shadow:var(--shadow-1); position:relative;
    transition:box-shadow .14s ease, transform .14s ease, opacity .14s ease;
  }
  .card::before{
    content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:999px;
    background:var(--card-accent, var(--muted-2));
  }
  .card{padding-left:16px;}
  .card:hover{box-shadow:var(--shadow-2);}
  .card.dragging{opacity:.4; cursor:grabbing;}
  .card .badges{display:flex; gap:5px; margin-bottom:8px; flex-wrap:wrap; align-items:center;}
  .k-ring{
    margin-left:auto; width:28px; height:28px; border-radius:50%; flex:0 0 auto; position:relative;
    background:conic-gradient(var(--primary) calc(var(--pct)*1%), var(--border-soft) 0);
    display:flex; align-items:center; justify-content:center;
    font-size:7.5px; font-weight:800; color:var(--ink);
  }
  .k-ring::before{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--surface); z-index:-1;}
  .card-author{display:flex; align-items:center; gap:6px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border-soft); font-size:10.5px;}
  .card.card-overdue{box-shadow:var(--shadow-1), 0 0 0 1.5px var(--s-delay) inset;}
  .card.card-soon{box-shadow:var(--shadow-1), 0 0 0 1.5px var(--accent) inset;}
  .due-badge{font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; border:1px solid; white-space:nowrap;}
  .unread-badge{
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; white-space:nowrap;
    background:var(--accent-tint); color:var(--accent);
  }
  .same-author-dot{display:inline-block; width:9px; height:9px; border-radius:50%;}
  .undo-toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#232b28; color:#fff; padding:10px 12px 10px 16px; border-radius:9px;
    display:flex; align-items:center; gap:14px; font-size:12.8px; box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:80; max-width:90vw;
  }
  .undo-toast.show{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0);}
  .undo-toast b{color:#fff;}
  .undo-toast button{
    background:#fff; color:var(--ink); border:none; border-radius:6px; padding:6px 10px;
    font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .undo-toast button:hover{background:#e7eef8;}
  .excel-review-list{display:flex; flex-direction:column; gap:8px; margin-bottom:6px;}
  .excel-review-row{
    display:flex; align-items:center; gap:12px; padding:9px 12px; background:var(--paper); border-radius:8px; flex-wrap:wrap;
  }
  .excel-review-main{display:flex; align-items:center; gap:9px; flex:1; min-width:220px; flex-wrap:wrap;}
  .excel-review-title{font-size:12.6px; font-weight:500;}
  .excel-model-input{
    border:1px solid var(--border); border-radius:7px; padding:6px 9px; font-size:12.5px; font-family:inherit;
    width:180px; flex:0 0 auto;
  }
  .excel-model-input:focus{outline:none; border-color:var(--primary);}
  .combo-wrap{position:relative;}
  .combo-list{
    position:absolute; top:100%; left:0; right:0; margin-top:3px; background:var(--surface);
    border:1px solid var(--border); border-radius:8px; max-height:170px; overflow-y:auto;
    box-shadow:0 6px 18px rgba(28,35,33,.12); z-index:30; display:none;
  }
  .combo-opt{padding:7px 11px; font-size:12.5px; cursor:pointer;}
  .combo-opt:hover{background:var(--primary-tint);}
  .notif-list{display:flex; flex-direction:column; gap:8px;}
  .notif-item{
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    cursor:pointer; display:flex; gap:12px; align-items:flex-start; transition:box-shadow .12s;
  }
  .notif-item:hover{box-shadow:0 2px 10px rgba(28,35,33,.08); border-color:var(--muted-2);}
  .notif-icon{
    width:28px; height:28px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-size:13px; background:var(--primary-tint); color:var(--primary-ink);
  }
  .notif-body{flex:1; min-width:0;}
  .notif-msg{font-size:13px; color:var(--ink); line-height:1.5;}
  .notif-msg b{font-weight:600;}
  .notif-time{font-size:11px; color:var(--muted-2); margin-top:3px;}
  .notif-empty{color:var(--muted-2); font-size:13px; text-align:center; padding:60px 20px;}
  .announce-list{display:flex; flex-direction:column; gap:10px; max-width:640px;}
  .announce-item{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px;}
  .announce-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .announce-title{font-size:14px; font-weight:700; color:var(--ink);}
  .announce-body{font-size:13px; color:var(--ink); line-height:1.6; margin-top:8px; white-space:pre-wrap;}
  .announce-meta{font-size:11px; color:var(--muted-2); margin-top:8px;}
  .settings-tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border-soft); padding-bottom:0;}
  .settings-tab{
    background:transparent; border:none; padding:9px 16px; font-size:13px; font-weight:600; color:var(--muted);
    cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .settings-tab.active{color:var(--primary); border-bottom-color:var(--primary);}
  .settings-desc{font-size:12.5px; color:var(--muted); margin:0 0 14px;}
  .settings-item-list{display:flex; flex-direction:column; gap:7px; margin-bottom:4px;}
  .settings-item-row{
    display:flex; align-items:center; justify-content:space-between; padding:8px 12px;
    background:var(--paper); border-radius:8px; font-size:13px;
  }
  .checklist-item-wrap{border-radius:8px; padding:0 4px; transition:background .12s, outline-color .12s;}
  .checklist-item-wrap.dragging{opacity:.4;}
  .checklist-item-wrap.drag-over{outline:2px dashed var(--primary); outline-offset:-2px; background:color-mix(in srgb, var(--primary) 10%, transparent);}
  .ci-drag-handle{cursor:grab; color:var(--muted); font-size:15px; padding:0 2px; user-select:none;}
  .checklist-edit-row{display:flex; align-items:center; gap:8px; padding:6px 0;}
  .checklist-edit-row input.ci-label{
    border:1px solid var(--border); border-radius:7px; padding:6px 9px; font-size:12.8px; font-family:inherit;
  }
  .ci-email-template{
    width:100%; border:1px solid var(--border); border-radius:7px; padding:8px 10px; font-size:12px; font-family:inherit;
    min-height:70px; margin:2px 0 8px; resize:vertical; color:var(--muted);
  }
  .checklist-add-row{display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border-soft);}
  .checklist-add-row input{flex:1; border:1px solid var(--border); border-radius:7px; padding:7px 10px; font-size:12.5px;}
  .checklist-add-row select{border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:12.5px;}
  .advance-btn{
    width:100%; margin-top:10px; background:var(--primary-tint); color:var(--primary-ink); border:none;
    border-radius:999px; padding:7px 10px; font-size:11px; font-weight:700; cursor:pointer; text-align:center;
    transition:background .12s, color .12s;
  }
  .advance-btn:hover{background:var(--primary); color:#fff;}
  .tag{
    font-size:10px; font-weight:600; padding:2px 6px; border-radius:4px; letter-spacing:.2px;
  }
  .k-tag{
    font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.2px;
  }
  /* 동시 수정 비교 화면 — 좌(내 것)/우(상대 것), 다른 부분은 음영, 고른 쪽은 테두리 강조 */
  .cf-backdrop{position:fixed; inset:0; z-index:9200; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px;}
  .cf-dialog{width:min(920px,100%); max-height:calc(100vh - 32px); overflow:auto; background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:14px; padding:22px 22px 16px; box-shadow:0 20px 50px rgba(0,0,0,.4); box-sizing:border-box;}
  .cf-dialog h3{margin:0 0 6px; font-size:16.5px;}
  .cf-sub{margin:0 0 12px; font-size:13px; color:var(--muted); line-height:1.55;}
  .cf-auto{color:var(--primary-ink); font-weight:600;}
  .cf-bulk{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .cf-field{margin-bottom:14px;}
  .cf-label{font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:6px;}
  .cf-cols{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .cf-opt{display:flex; flex-direction:column; gap:6px; text-align:left; padding:10px 12px; border:2px solid var(--border); border-radius:10px; background:var(--paper); color:var(--ink); cursor:pointer; font:inherit; min-width:0;}
  .cf-opt:hover{border-color:var(--muted-2);}
  .cf-opt:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  .cf-opt[aria-pressed="true"]{border-color:var(--primary); background:var(--primary-tint); box-shadow:0 0 0 1px var(--primary) inset;}
  .cf-opt[aria-pressed="true"] .cf-head::before{content:"✓ 선택됨 · "; color:var(--primary-ink);}
  .cf-head{font-size:11.5px; font-weight:700; color:var(--muted);}
  .cf-body{font-size:13px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; max-height:260px; overflow:auto;}
  .cf-diff{background:var(--accent-tint); color:inherit; box-shadow:0 0 0 1px var(--accent) inset; border-radius:3px; padding:0 1px;}
  .cf-actions{position:sticky; bottom:-16px; display:flex; justify-content:flex-end; align-items:center; gap:12px; padding:12px 0 4px; background:var(--surface); border-top:1px solid var(--border-soft);}
  .cf-hint{font-size:12.5px; color:var(--muted); margin-right:auto;}
  @media (max-width:640px){ .cf-cols{grid-template-columns:1fr;} .cf-dialog{padding:16px;} }
  /* 접속 표시 — 카드를 보고 있는 다른 사용자 아이콘(편집 중이면 강조 테두리 + 연필) */
  .pres-stack{display:inline-flex; align-items:center; gap:6px;}
  .card > .pres-stack{position:absolute; top:9px; right:10px; z-index:1;}
  .card:has(> .pres-stack) .badges{padding-right:calc(var(--pres-count, 2) * 26px);}
  tr .pres-stack{margin-left:8px; vertical-align:middle;}
  .pres-icon{position:relative; display:inline-flex; border-radius:999px; background:var(--surface);}
  .pres-icon .avatar{margin:0;}
  .pres-icon.pres-edit{box-shadow:0 0 0 2px var(--accent);}
  /* 누군가 보고 있는 카드: 테두리를 그 사람 색으로(여러 명이면 링이 겹침) */
  .card.pres-on{box-shadow:var(--pres-ring), var(--shadow-1); transition:box-shadow .2s ease;}
  tr.pres-on > td:first-child{box-shadow:inset 3px 0 0 var(--pres-color);}
  .pres-pencil{position:absolute; right:-5px; bottom:-5px; width:13px; height:13px; border-radius:999px; background:var(--accent); color:#fff; font-size:9px; line-height:13px; text-align:center; box-shadow:0 0 0 1.5px var(--surface);}
  .pres-bar{display:flex; align-items:center; gap:10px; margin:0 0 12px; padding:8px 12px; border-radius:10px; background:var(--accent-tint); color:var(--ink); font-size:12.8px; line-height:1.45;}
  .pres-bar-icons{display:inline-flex; gap:6px; flex:none;}
  /* 등록된 지 24시간 안 된 업무에 붙는 표시 — 칸반 보드를 훑어볼 때 새로 들어온 건을 바로 알아채도록 */
  .k-new-badge{
    font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:999px; letter-spacing:.4px;
    background:#ff8a3d; color:#fff; box-shadow:0 0 0 1px color-mix(in srgb, #ff8a3d 40%, transparent);
  }
  .card .title{font-size:13.8px; font-weight:700; line-height:1.4; margin-bottom:8px; letter-spacing:-.01em;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .card .meta{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--muted-2); gap:8px;}
  .card .doc{font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* ---- 상태별 보드: 상세/요약 뷰 전환 ---- */
  .board-viewmode{display:flex; gap:6px; margin-bottom:10px;}
  .btn-toggle{
    background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:7px;
    padding:6px 14px; font-size:12.5px; font-weight:600; cursor:pointer; transition:background .12s, color .12s;
  }
  .btn-toggle:hover{color:var(--ink);}
  .btn-toggle.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .card.card-summary{padding:6px 10px 6px 12px;}
  .card.card-summary .badges{margin-bottom:3px; gap:4px;}
  .card.card-summary .title{font-size:12px; margin-bottom:2px; -webkit-line-clamp:1;}
  .card.card-summary .meta{font-size:10px;}
  .k-assignee{display:flex; align-items:center; gap:5px; flex:0 0 auto; font-weight:600; color:var(--ink);}
  .empty-col{color:var(--muted-2); font-size:11.5px; text-align:center; padding:22px 4px; border:1.5px dashed var(--border); border-radius:var(--radius-md);}
  .delay-subsection{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}
  .delay-subhead{
    width:100%; display:flex; align-items:center; gap:7px; background:transparent; border:none; cursor:pointer;
    padding:4px 2px 8px; font-size:12px; font-weight:700; color:var(--ink); text-align:left;
  }
  .delay-subhead .chev{font-size:9px; color:var(--muted-2); transition:transform .15s;}
  .delay-subsection.collapsed .chev{transform:rotate(-90deg);}
  .delay-subhead .cnt{margin-left:auto; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:11px; color:var(--muted); background:var(--surface); border-radius:999px; padding:1px 8px;}
  .delay-sublist{display:flex; flex-direction:column; gap:10px;}
  .delay-subsection.collapsed .delay-sublist{display:none;}

  /* ---------- list (table) ---------- */
  .group{margin-bottom:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .group-head{
    display:flex; align-items:center; gap:10px; padding:11px 16px; cursor:pointer;
    background:var(--paper); user-select:none;
  }
  .group-head:hover{background:var(--border-soft);}
  .group-head .chev{font-size:10px; color:var(--muted-2); transition:transform .15s; width:10px;}
  .group.collapsed .chev{transform:rotate(-90deg);}
  .group-head .gname{font-weight:600; font-size:13px;}
  .group-head .gcount{font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:11.5px; color:var(--muted-2); background:var(--paper); padding:1px 8px; border-radius:20px;}
  table{width:100%; border-collapse:collapse; font-size:12.6px;}
  .group.collapsed table{display:none;}
  thead th{
    text-align:left; font-weight:600; color:var(--muted); font-size:11px;
    padding:8px 14px; border-bottom:1px solid var(--border-soft); background:var(--paper);
  }
  tbody td{padding:9px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--paper);}
  tbody tr:last-child td{border-bottom:none;}
  .td-title{max-width:340px;}
  .status-pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .status-pill .d{width:6px; height:6px; border-radius:50%;}
  .assignee-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink);
  }
  .avatar{
    width:17px; height:17px; border-radius:50%; background:var(--primary-tint); color:var(--primary-ink);
    font-size:9px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .muted-cell{color:var(--muted-2);}
  .no-result{padding:40px 20px; text-align:center; color:var(--muted-2); font-size:13px;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,20,26,.42); display:none;
    align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface); border-radius:12px; width:100%; max-width:640px;
    box-shadow:0 20px 60px rgba(10,15,25,.25); margin-bottom:5vh;
  }
  .modal-head{padding:22px 26px 16px; border-bottom:1px solid var(--border-soft);}
  .modal-head .badges{display:flex; gap:6px; margin-bottom:10px;}
  .modal-head h2{font-size:16.5px; margin:0; line-height:1.4;}
  /* 상세 화면 제목: 평소엔 제목 글자처럼 보이다가 마우스를 올리거나 클릭하면 입력칸 테두리가 나타난다 */
  .modal-title-input{
    display:block; width:100%; box-sizing:border-box; resize:none; overflow:hidden;
    font:inherit; font-weight:700; line-height:1.4; color:var(--ink); background:transparent;
    border:1px solid transparent; border-radius:7px; padding:3px 8px; margin:-3px -8px; width:calc(100% + 16px);
    transition:border-color .12s, background .12s;
  }
  .modal-title-input:hover{border-color:var(--border);}
  .modal-title-input:focus{outline:none; border-color:var(--primary); background:var(--surface);}
  .modal-body{padding:20px 26px;}
  .field-row{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:16px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11px; color:var(--muted); font-weight:600;}
  .field .val{font-size:13px;}
  .field select, .field input[type=text], .field input[type=url]{
    border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:12.8px; font-family:inherit; color:var(--ink);
  }
  .field select:focus, .field input:focus{outline:none; border-color:var(--primary);}
  /* ---------- 커스텀 날짜 선택기 ---------- */
  .date-picker-field{position:relative; display:flex; align-items:stretch; gap:6px;}
  .date-picker-input{flex:1; border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:12.8px; font-family:inherit; color:var(--ink); background:var(--surface); cursor:pointer;}
  .date-picker-input:focus{outline:none; border-color:var(--primary);}
  .date-picker-icon-btn{
    display:flex; align-items:center; justify-content:center; width:38px; height:auto; flex:0 0 auto;
    border:1px solid var(--border); border-radius:7px; background:var(--surface); cursor:pointer; font-size:20px; line-height:1;
  }
  .date-picker-icon-btn:hover{background:var(--paper); border-color:var(--primary);}
  .date-picker-popup{
    position:absolute; top:calc(100% + 6px); left:0; z-index:80; width:280px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg,14px); box-shadow:var(--shadow-2, 0 12px 32px rgba(10,15,25,.22));
    padding:12px;
  }
  .dp-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .dp-head .dp-title{font-weight:700; font-size:13.5px;}
  .dp-nav-btn{border:none; background:transparent; cursor:pointer; font-size:17px; padding:4px 9px; border-radius:7px; color:var(--muted);}
  .dp-nav-btn:hover{background:var(--paper); color:var(--ink);}
  .dp-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10.5px; color:var(--muted); margin-bottom:4px;}
  .dp-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .dp-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border:none; background:transparent; border-radius:9px; font-size:12.5px; cursor:pointer; color:var(--ink); font-family:inherit;}
  .dp-cell:hover{background:var(--paper);}
  .dp-cell.dp-muted{color:var(--muted); opacity:.4;}
  .dp-cell.dp-today{box-shadow:inset 0 0 0 1.5px var(--primary);}
  .dp-cell.dp-selected{background:var(--primary); color:#fff; font-weight:700;}
  .dp-foot{display:flex; justify-content:space-between; margin-top:10px; padding-top:8px; border-top:1px dashed var(--border-soft);}
  .dp-foot button{border:none; background:transparent; color:var(--primary); font-size:12px; cursor:pointer; font-weight:600; padding:4px 6px; border-radius:6px;}
  .dp-foot button:hover{background:var(--primary-tint);}
  .doclink{color:var(--primary); text-decoration:none; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:12.6px;}
  .doclink:hover{text-decoration:underline;}
  .section-title{font-size:12px; font-weight:700; color:var(--muted); margin:20px 0 10px; text-transform:none;}
  .radio-row{display:flex; gap:16px; margin-bottom:4px;}
  .radio-opt{display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer;}
  .radio-opt input{accent-color:var(--primary); width:15px; height:15px;}
  .check-list{display:flex; flex-direction:column; gap:9px; margin-top:2px;}
  .check-opt{display:flex; align-items:center; gap:9px; font-size:13px; cursor:pointer;}
  .check-opt input{accent-color:var(--primary); width:15px; height:15px;}
  .check-opt.done span{color:var(--muted-2); text-decoration:line-through;}
  .check-opt-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .mini-action-btn{
    background:var(--primary-tint); color:var(--primary-ink); border:none; border-radius:6px;
    padding:5px 10px; font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap; flex:0 0 auto;
  }
  .mini-action-btn:hover{background:var(--primary); color:#fff;}
  .mail-preview{margin-top:8px; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .mail-preview-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 11px;
    background:var(--paper); font-size:11.5px; color:var(--muted);
  }
  .mail-preview-text{
    display:block; width:100%; min-height:150px; border:none; padding:12px; font-size:12.6px;
    font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; color:var(--ink); resize:vertical; background:var(--surface);
  }
  .mail-preview-text:focus{outline:none;}
  .material-list-block{display:flex; flex-direction:column; gap:8px;}
  .material-rows{display:flex; flex-direction:column; gap:6px;}
  .material-row{display:flex; align-items:center; gap:8px;}
  .material-input{flex:1; border:1px solid var(--border); border-radius:7px; padding:7px 10px; font-size:12.8px;}
  .material-row-del{background:none; border:none; color:var(--muted-2); cursor:pointer; font-size:13px; padding:2px 6px; flex:0 0 auto;}
  .material-row-del:hover{color:var(--danger, #b3423a);}
  .material-add-btn{align-self:flex-start;}
  .material-empty{font-size:12px; color:var(--muted-2); padding:2px 0;}
  .comments-list{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
  .comment-item{background:var(--paper); border-radius:8px; padding:8px 11px;}
  .comment-item .c-head{display:flex; align-items:baseline; gap:7px; margin-bottom:3px;}
  .comment-item .c-author{font-size:12px; font-weight:700; color:var(--ink);}
  .comment-item .c-time{font-size:10.5px; color:var(--muted-2);}
  .comment-item .c-text{font-size:12.6px; color:var(--ink); line-height:1.5; white-space:pre-wrap;}
  .comment-item .c-head{justify-content:space-between;}
  .comment-item .c-time-wrap{display:flex; align-items:baseline; gap:7px;}
  .comment-item .c-actions{display:flex; gap:2px;}
  .comment-item .c-actions button{border:none; background:none; color:var(--muted-2); cursor:pointer; font-size:11px; padding:2px 5px; border-radius:5px;}
  .comment-item .c-actions button:hover{background:var(--border); color:var(--ink);}
  .comment-edit-row{display:flex; gap:6px; align-items:center;}
  .comment-edit-row input{flex:1; border:1px solid var(--border); border-radius:6px; padding:6px 9px; font-size:12.6px; font-family:inherit;}
  .comment-empty{font-size:12px; color:var(--muted-2); padding:4px 0 10px;}
  /* 눈에 보이는 로딩 진행 표시 — 정확한 %를 알 수 없는 요청이라도, 시간이 지날수록 채워져서
     "진행되고 있다"는 느낌을 주고(90%까지 서서히 다가가다 느려짐), 실제로 끝나면 100%로 채운다.
     JS(startProgressBar)가 폭을 직접 조절하므로 CSS는 전환 애니메이션만 담당한다. */
  .progress-bar{height:4px; border-radius:999px; background:var(--border-soft); overflow:hidden;}
  .progress-bar-fill{height:100%; width:0%; border-radius:999px; background:var(--primary); transition:width .3s ease-out;}
  .sapbom-loading-overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; background:color-mix(in srgb, var(--surface) 88%, transparent); z-index:5; border-radius:10px;
  }
  .comment-input-row{display:flex; gap:8px;}
  .comment-input-row input{
    flex:1; border:1px solid var(--border); border-radius:7px; padding:8px 10px; font-size:12.8px; font-family:inherit;
  }
  .comment-input-row input:focus{outline:none; border-color:var(--primary);}
  .comment-as{font-size:11px; color:var(--muted-2); margin-top:6px;}
  .comment-input-row{position:relative;}
  .mention-dropdown{
    position:absolute; left:0; bottom:calc(100% + 4px); z-index:60;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.15); max-height:180px; overflow-y:auto; min-width:180px;
  }
  .mention-dropdown .mention-item{padding:7px 10px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:7px;}
  .mention-dropdown .mention-item.active, .mention-dropdown .mention-item:hover{background:var(--primary-tint,var(--border));}
  mark.mention-tag{background:none; color:var(--primary); font-weight:700;}
  div.note{
    width:100%; border:1px solid var(--border); border-radius:7px; padding:9px 10px; font-family:inherit;
    font-size:12.8px; min-height:56px; max-height:340px; overflow-y:auto; color:var(--ink);
    white-space:pre-wrap; line-height:1.5; cursor:text;
  }
  div.note:empty::before{content:attr(data-placeholder); color:var(--muted-2);}
  div.note:focus{outline:none; border-color:var(--primary);}
  div.note img{max-width:100%; border-radius:6px; display:block; margin:4px 0;}
  div.note a{color:var(--primary); text-decoration:underline; word-break:break-all;}
  .modal-foot{padding:14px 26px 20px; display:flex; justify-content:space-between; align-items:center;}
  .save-hint{font-size:11px; color:var(--muted-2);}
  .closebtn{background:transparent; border:none; font-size:20px; color:var(--muted-2); cursor:pointer; line-height:1; padding:4px;}
  .modal-x{display:flex; justify-content:flex-end; padding:14px 18px 0;}

  /* add form — screenshot dropzone */
  .dropzone{
    border:1.5px dashed var(--border); border-radius:10px; padding:22px 16px; text-align:center;
    cursor:pointer; background:var(--paper); transition:border-color .12s, background .12s;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--primary); background:var(--primary-tint);}
  .dz-icon{font-size:22px; margin-bottom:6px;}
  .dz-text{font-size:12.5px; color:var(--muted); line-height:1.6;}
  .dz-text b{color:var(--ink);}
  .shot-status{font-size:11.5px; margin-top:8px; min-height:14px;}
  .shot-status.busy{color:var(--accent);}
  .shot-status.done{color:var(--s-done);}
  .shot-status.error{color:var(--s-delay);}

  /* add form */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .form-grid label{display:block; font-size:11px; color:var(--muted); font-weight:600; margin-bottom:5px;}
  .form-grid input, .form-grid select, .form-grid textarea{
    width:100%; border:1px solid var(--border); border-radius:7px; padding:8px 10px; font-size:12.8px; font-family:inherit;
    background:var(--paper); transition:background .12s, border-color .12s;
  }
  /* 비어있는 칸(placeholder만 보이는 상태)은 점선 테두리로, 값이 채워진 칸은 은은한 강조 배경으로
     한눈에 구분되게 한다 — select는 placeholder가 없어 :has()로 "미배정/빈 값" 옵션 선택 여부를 본다. */
  .form-grid input:placeholder-shown, .form-grid textarea:placeholder-shown{ border-style:dashed; }
  .form-grid input:not(:placeholder-shown), .form-grid textarea:not(:placeholder-shown){
    background:color-mix(in srgb, var(--primary) 7%, var(--surface));
    border-color:color-mix(in srgb, var(--primary) 45%, var(--border));
  }
  .form-grid select:has(option[value=""]:checked){ border-style:dashed; }
  .form-grid select:not(:has(option[value=""]:checked)){
    background:color-mix(in srgb, var(--primary) 7%, var(--surface));
    border-color:color-mix(in srgb, var(--primary) 45%, var(--border));
  }
  /* 스크린샷 OCR 등으로 자동 채워진 값은 값을 직접 확인하라는 의미로 글자색을 다르게 표시한다.
     사용자가 그 칸을 직접 고치면(=진짜 타이핑이 발생하면) 자동 표시를 벗겨서 일반 글자색으로 되돌린다. */
  .form-grid input.auto-filled, .form-grid select.auto-filled, .form-grid textarea.auto-filled{ color:var(--primary-ink); font-weight:600; }

  .menubtn{display:none; background:var(--primary); color:#fff; border:none; border-radius:7px; padding:7px 10px; font-size:16px; margin-bottom:10px;}
  @media (max-width:760px){
    .sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
    .sidebar.open{transform:translateX(0); box-shadow:0 0 0 100vmax rgba(0,0,0,.35);}
    .main{padding:18px 14px 50px;}
    .menubtn{display:inline-flex;}
    .field-row{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
  }
/* ---------- dashboard (redesigned) ---------- */
.dq-hero{display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.dq-ring-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1); padding:20px; display:flex; align-items:center; gap:16px; flex:0 0 auto;
  cursor:pointer; font-family:inherit; transition:border-color .12s, box-shadow .12s;
}
.dq-ring-card:hover{border-color:var(--primary);}
.dq-ring-card.is-open{border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-tint, var(--paper)) inset, var(--shadow-1);}
.dq-ring-wrap{position:relative; width:104px; height:104px; flex:0 0 auto;}
.dq-ring{width:104px; height:104px; transform:rotate(-90deg);}
.dq-ring-track{fill:none; stroke:var(--border-soft); stroke-width:10;}
.dq-ring-fill{fill:none; stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .5s ease;}
.dq-ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.dq-ring-label strong{font-size:26px; line-height:1.1; font-weight:800;}
.dq-ring-label span{font-size:11px; color:var(--muted); margin-top:2px;}
.dq-tiles{display:flex; gap:12px; flex:1; flex-wrap:wrap;}
.dq-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  box-shadow:var(--shadow-1); padding:14px 18px; display:flex; align-items:center; gap:14px; flex:1; min-width:140px;
  cursor:pointer; transition:border-color .12s, box-shadow .12s;
}
.dq-tile:hover{border-color:var(--primary);}
.dq-tile.is-open{border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-tint, var(--paper)) inset, var(--shadow-1);}
.dq-tile-ico{font-size:24px; flex:0 0 auto;}
.dq-tile strong{display:block; font-size:34px; line-height:1.15; font-weight:800; letter-spacing:-.02em;}
.dq-tile span{font-size:12px; color:var(--muted); white-space:nowrap;}
.dq-tile-warn{border-color:var(--s-delay); background:var(--s-delay-tint);}
.dq-tile-warn strong{color:var(--s-delay);}
.dq-tile-warn.is-open{border-color:var(--s-delay); box-shadow:0 0 0 2px var(--s-delay-tint) inset, var(--shadow-1);}
.dq-tile-detail{margin-top:14px;}

.dq-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media(max-width:960px){.dq-grid{grid-template-columns:1fr;}}

.dash-panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1); padding:20px; margin-bottom:20px;
}
.dash-panel h2{font-size:15px; margin:0 0 6px; display:flex; align-items:center; gap:8px;}
.dash-note{color:var(--muted); font-size:12px; margin:6px 0 14px;}

.dq-workload{display:flex; flex-direction:column; gap:10px;}
.dq-wl-row{
  display:grid; grid-template-columns:88px 1fr 30px; align-items:center; gap:10px; width:100%;
  background:none; border:none; padding:5px 6px; margin:0 -6px; border-radius:8px; cursor:pointer; font:inherit; text-align:left;
  transition:background .12s;
}
.dq-wl-row:hover{background:var(--paper);}
.dq-wl-name{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dq-wl-bar-track{background:var(--paper); border-radius:999px; height:10px; overflow:hidden;}
.dq-wl-bar-fill{height:100%; border-radius:999px; transition:width .4s ease;}
.dq-wl-count{font-size:12px; font-weight:700; text-align:right; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;}

.dq-stack{display:flex; height:16px; border-radius:999px; overflow:hidden; background:var(--paper); margin-bottom:12px;}
.dq-stack-seg{transition:width .4s ease;}
.dq-stack-legend{display:flex; flex-wrap:wrap; gap:10px 14px; font-size:11.5px; color:var(--muted);}
.dq-stack-legend i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}
.dq-stack-legend b{color:var(--ink);}

.dq-deadline-row{display:flex; gap:10px; overflow-x:auto; overflow-y:visible; padding:6px 4px 8px;}
.dq-deadline-card{
  flex:0 0 auto; min-width:180px; max-width:220px; text-align:left; background:var(--paper);
  border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; cursor:pointer;
  transition:box-shadow .12s, transform .12s;
}
.dq-deadline-card:hover{box-shadow:var(--shadow-2); transform:translateY(-2px);}
.dq-deadline-card.is-overdue{background:var(--s-delay-tint); border-color:var(--s-delay);}
.dq-dl-days{display:block; font-size:11px; font-weight:700; color:var(--accent); margin-bottom:6px;}
.dq-deadline-card.is-overdue .dq-dl-days{color:var(--s-delay);}
.dq-dl-title{display:-webkit-box; font-size:12.5px; font-weight:600; line-height:1.4; margin-bottom:6px; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.dq-dl-meta{display:block; font-size:11px; color:var(--muted);}

.dash-controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:18px;}
.dash-controls h2{font-size:16px; margin:0 auto 0 6px;}

.dash-scroll{overflow:auto;}
.dash-week{display:grid; grid-template-columns:repeat(7,minmax(140px,1fr)); min-width:980px; gap:8px;}
.dash-day{
  background:var(--surface); border-radius:var(--radius-md); min-height:185px; padding:11px;
  max-height:330px; overflow:auto; border:1px solid var(--border-soft);
}
.dash-day.today{background:var(--primary-tint); border-color:var(--primary);}
.dash-day h3{font-size:12px; margin:0 0 10px;}
.dash-day.weekend h3{color:var(--muted-2);}
.dash-event{
  display:block; width:100%; text-align:left; border:1px solid var(--border-soft); border-left:3px solid var(--primary);
  background:var(--surface); border-radius:8px; padding:8px; margin:6px 0; cursor:pointer; font-size:11px; line-height:1.5;
  box-shadow:var(--shadow-1); transition:transform .12s;
}
.dash-event:hover{border-color:var(--primary); transform:translateX(2px);}
.dash-event span{display:block; color:var(--muted);}

.dash-gantt{min-width:calc(290px + var(--gcols,7) * 32px); max-height:450px; overflow:auto;}
.dash-gantt-head,.dash-gantt-row{display:grid; grid-template-columns:290px repeat(var(--gcols,7),minmax(32px,1fr)); align-items:stretch;}
.dash-gantt-head{position:sticky; top:0; background:var(--paper); z-index:2; font-size:11px; text-align:center; border-radius:var(--radius-md) var(--radius-md) 0 0;}
.dash-gantt-head>div{padding:9px;}
.dash-gantt-row{border-bottom:1px solid var(--border-soft); min-height:52px;}
.dash-task{grid-column:1; grid-row:1; border:none; background:var(--surface); text-align:left; padding:8px; cursor:pointer; min-width:0;}
.dash-task b{display:block; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dash-task span{display:block; color:var(--muted); font-size:10px;}
.dash-track{
  grid-column:2 / calc(var(--gcols,7) + 2); grid-row:1; display:grid;
  grid-template-columns:repeat(var(--gcols,7),1fr); align-items:center;
  background:repeating-linear-gradient(to right,transparent 0,transparent calc(100% / var(--gcols,7) - 1px),var(--border-soft) calc(100% / var(--gcols,7) - 1px),var(--border-soft) calc(100% / var(--gcols,7)));
}
.dash-bar{border:0; border-radius:999px; margin:10px 2px; padding:4px 10px; font-size:10px; font-weight:600; cursor:pointer; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; min-height:25px; transition:transform .12s;}
.dash-bar:hover{transform:scaleY(1.15);}
.dash-legend{display:flex; gap:14px; flex-wrap:wrap; margin:10px 0; font-size:11px;}
.dash-legend i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px;}
.dash-empty{padding:22px; color:var(--muted); text-align:center; font-size:12px;}
.dash-undated{display:grid; gap:6px; max-height:240px; overflow:auto;}
.dash-undated button{text-align:left; background:var(--paper); border:1px solid var(--border); border-radius:8px; padding:9px; cursor:pointer;}

@media(max-width:800px){
  .dash-panel{padding:14px;}
  .dash-controls h2{order:-1; width:100%; margin-bottom:8px;}
  .dq-grid{grid-template-columns:1fr;}
  .dq-hero{flex-direction:column;}
}

/* ---- 선적용 업무 ---- */
.pa-list{display:flex; flex-direction:column; gap:10px;}
.pa-card{display:flex; gap:12px; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:10px; cursor:pointer; background:var(--surface);}
.pa-card:hover{border-color:var(--primary); background:color-mix(in srgb, var(--primary) 6%, var(--surface));}
.pa-thumb{width:56px; height:56px; object-fit:cover; border-radius:8px; flex:0 0 auto; border:1px solid var(--border);}
.pa-thumb-empty{display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--paper);}
.pa-card-body{flex:1; min-width:0;}
.pa-doc{font-weight:700; font-size:13px; color:var(--primary);}
.pa-title{font-size:13.5px; margin-top:2px;}
.pa-meta{font-size:11.5px; color:var(--muted); margin-top:3px;}

.pa-modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px;}
.pa-modal{background:var(--surface); border-radius:12px; padding:22px 24px; width:min(640px,100%); box-shadow:0 12px 40px rgba(0,0,0,.25);}
.pa-modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.pa-modal-head h2{font-size:16px; margin:0;}
.pa-modal-close{background:none; border:none; font-size:16px; cursor:pointer; color:var(--muted);}
.pa-modal label{display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px;}
.pa-modal input[type=text], .pa-modal input[type=url], .pa-modal textarea{width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; box-sizing:border-box;}
.pa-modal .req{color:var(--danger,#b3423a);}
.pa-warn{color:var(--danger,#b3423a); font-size:12px; margin-top:4px;}
.pa-modal-actions{display:flex; gap:8px; margin-top:18px; align-items:center;}
.pa-danger{border-color:var(--danger,#b3423a) !important; color:var(--danger,#b3423a) !important;}

.pa-dropzone{border:2px dashed var(--border); border-radius:8px; padding:16px; text-align:center; cursor:pointer; margin-top:4px;}
.pa-dropzone:hover, .pa-dropzone.drag{border-color:var(--primary);}
.pa-img-grid{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
.pa-img-box{position:relative; resize:both; overflow:hidden; border:1px solid var(--border); border-radius:6px; min-width:80px; min-height:60px; max-width:100%;}
.pa-img-box img{display:block;}
.pa-img-remove{position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; border:none; background:rgba(0,0,0,.55); color:#fff; cursor:pointer; font-size:11px; line-height:1;}
.pa-img-overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; background:rgba(0,0,0,.35);}

.pa-panel-warn{font-size:12px; color:var(--muted); margin-top:6px;}
.pa-toggle-btn{margin-top:8px; background:var(--accent-soft,var(--paper)); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink);}
.pa-toggle-btn:hover{border-color:var(--primary);}
.pa-toggle-body{margin-top:8px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--paper);}
.pa-toggle-title{font-weight:700; font-size:13px; margin-bottom:4px;}
.pa-toggle-text{font-size:12.5px; white-space:pre-wrap; color:var(--ink-soft,var(--muted));}
.pa-toggle-imgs{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.pa-panel-thumb{max-width:160px; max-height:120px; border:1px solid var(--border); border-radius:6px; object-fit:contain;}

/* ===================== 벤토 테마 (2026-10-06, 1단계: 색·글꼴·모양) =====================
   위의 기존 스타일은 그대로 두고 여기서 덮어쓴다 — 이 블록만 지우면 예전 모습으로 돌아간다.
   밝은 모드: 따뜻한 미색 바탕 + 흰 둥근 타일 + 검정 버튼 + 주황 강조 / 다크: 짙은 갈색 바탕 + 주황 버튼 */
:root{
  --ink:#191714; --paper:#f4f1ec; --surface:#ffffff; --border:#e4dfd6; --border-soft:#eeeae3;
  --muted:#5f5a52; --muted-2:#8a847a;
  --primary:#191714; --primary-ink:#000000; --primary-tint:#efebe4;
  --accent:#ff6b3d; --accent-tint:#ffe9e0;
  --bento-hot:#ff6b3d; --bento-lime:#c9e86b; --bento-sky:#bfd7ff; --bento-ink:#1d1b18;
  --radius-lg:26px; --radius-md:16px;
  --shadow-1:0 1px 0 rgba(25,23,20,.04), 0 6px 18px -10px rgba(25,23,20,.18);
  --shadow-2:0 2px 0 rgba(25,23,20,.05), 0 16px 34px -14px rgba(25,23,20,.28);
  --font-display:"Bricolage Grotesque","Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
  --font-body:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f2eee7; --paper:#12110f; --surface:#1d1b18; --border:#302d28; --border-soft:#26231f;
    --muted:#a8a196; --muted-2:#7d776d;
    --primary:#ff7a4d; --primary-ink:#ffa27f; --primary-tint:#3a2219;
    --accent:#ff7a4d; --accent-tint:#3a2219;
    --bento-hot:#ff7a4d; --bento-lime:#a9c94e; --bento-sky:#7f9fd6; --bento-ink:#f2eee7;
    --shadow-1:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.6);
    --shadow-2:0 2px 0 rgba(0,0,0,.35), 0 18px 36px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ink:#f2eee7; --paper:#12110f; --surface:#1d1b18; --border:#302d28; --border-soft:#26231f;
  --muted:#a8a196; --muted-2:#7d776d;
  --primary:#ff7a4d; --primary-ink:#ffa27f; --primary-tint:#3a2219;
  --accent:#ff7a4d; --accent-tint:#3a2219;
  --bento-hot:#ff7a4d; --bento-lime:#a9c94e; --bento-sky:#7f9fd6; --bento-ink:#f2eee7;
  --shadow-1:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.6);
  --shadow-2:0 2px 0 rgba(0,0,0,.35), 0 18px 36px -14px rgba(0,0,0,.7);
}
body{font-family:var(--font-body); letter-spacing:-.005em;}
.topbar h1, .dash-panel h2, .modal-head h2, .col-head span.name, .dq-tile strong, .dq-ring-label strong{font-family:var(--font-display); letter-spacing:-.02em;}
.topbar h1{font-size:26px; font-weight:800;}
.topbar{margin-bottom:22px;}

/* 사이드바: 바탕과 한 몸, 메뉴는 알약 모양 */
.sidebar{background:var(--paper); border-right:0; padding:22px 14px;}
.brand{background:var(--bento-ink); border-radius:18px; padding:13px 14px;}
.brand:hover{background:var(--bento-ink); filter:brightness(1.15);}
.brand-word{color:var(--paper);}
.brand-sub{color:color-mix(in srgb, var(--paper) 70%, transparent);}
.navbtn{border-radius:999px; padding:9px 14px; color:var(--muted);}
.navbtn:hover{background:var(--surface); color:var(--ink);}
.navbtn.active{background:var(--primary); color:#fff; box-shadow:var(--shadow-1);}
.sidebar-foot{border-top:0;}
.user-box{border-bottom:0; background:var(--surface); border-radius:18px; padding:12px; box-shadow:var(--shadow-1);}
.resetbtn, .cur-user-who{border-radius:999px;}

/* 버튼·입력칸: 알약 모양 */
.btn{border-radius:999px; padding:9px 18px; font-weight:700;}
.btn:hover{background:var(--primary-ink);}
.btn-ghost{background:var(--surface); color:var(--ink); border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface); border-color:var(--ink);}
.mytoggle, select.filt, .search, .btn-toggle{border-radius:999px;}
.search{padding:9px 16px;}
.search:focus, select.filt:focus{border-color:var(--ink); outline:none;}
.mytoggle.on{background:var(--primary); border-color:var(--primary);}

/* 판(패널·타일·모달): 크게 둥글게, 테두리 대신 그림자 */
.panel, .dash-panel, .dq-ring-card, .dq-tile, .stat-chip, .announce-item, .notif-item, .pa-card{border-color:transparent; box-shadow:var(--shadow-1);}
.panel, .dash-panel, .dq-ring-card{border-radius:var(--radius-lg);}
.dq-tile, .stat-chip, .announce-item, .pa-card{border-radius:20px;}
.dq-tile:hover, .dq-ring-card:hover{border-color:transparent; box-shadow:var(--shadow-2); transform:translateY(-2px);}
.dq-tile, .dq-ring-card{transition:box-shadow .18s, transform .18s;}
.modal, .cf-dialog, .pa-modal, .login-gate-card{border-radius:28px;}
.overlay{background:rgba(25,23,20,.38); backdrop-filter:blur(3px);}

/* 칸반: 칸은 반투명 판, 카드는 흰 둥근 타일 */
.col{background:color-mix(in srgb, var(--surface) 55%, var(--paper)); border:0; border-radius:var(--radius-lg);}
.col-head span.cnt{background:var(--paper);}
.card{border:0; border-radius:var(--radius-md); box-shadow:var(--shadow-1); transition:box-shadow .18s ease, transform .18s ease, opacity .14s ease;}
.card:hover{box-shadow:var(--shadow-2); transform:translateY(-2px) rotate(-.3deg);}
/* 마감 경고는 배지(⏱ ○일 지남)로만 — 테두리는 다른 사람이 보고/편집 중인 표시(접속 표시)에만 쓴다 */
.card.card-overdue, .card.card-soon{box-shadow:var(--shadow-1);}
.card.card-overdue:hover, .card.card-soon:hover{box-shadow:var(--shadow-2);}
.card.pres-on{box-shadow:var(--pres-ring), var(--shadow-1);}
.card.pres-on:hover{box-shadow:var(--pres-ring), var(--shadow-2);}
/* 실행 취소 알림 버튼: 흰 배경이므로 글자는 테마와 상관없이 진한 색(다크 모드에서 흰 글씨로 안 보이던 문제) */
.undo-toast button{color:#191714;}
.card::before{top:14px; bottom:auto; height:14px; left:7px; width:4px;}
.advance-btn{border-radius:999px;}
.k-tag, .tag, .due-badge, .unread-badge, .status-pill{border-radius:999px;}

/* ===== 벤토 2단계: 대시보드 (원색 타일·흐르는 소식 띠·추이 차트·빛 번짐) ===== */
.dq-hero{position:relative; isolation:isolate;}
.dq-hero::before{content:""; position:absolute; z-index:-1; inset:-40px -20px auto 30%; height:260px; border-radius:50%;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--bento-hot) 45%, transparent), transparent),
             radial-gradient(closest-side, color-mix(in srgb, var(--bento-sky) 55%, transparent), transparent) 60% 40% / 70% 90% no-repeat;
  filter:blur(40px); opacity:.55; animation:dqFloat 14s ease-in-out infinite alternate; pointer-events:none;}
@keyframes dqFloat{0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-80px,20px) scale(1.15)} 100%{transform:translate(40px,-10px) scale(.95)}}
.dq-ring-card, .dq-tile{transform-style:preserve-3d; will-change:transform;}
.dq-ring-card{background:var(--surface); padding:22px 26px;}
.dq-ring-fill{transition:none; filter:drop-shadow(0 0 6px color-mix(in srgb, var(--primary) 45%, transparent));}
.dq-tiles{display:grid; grid-template-columns:repeat(4,minmax(110px,1fr)); gap:14px; min-width:0;}
@media (max-width:900px){ .dq-tiles{grid-template-columns:repeat(2,1fr);} }
.dq-tile{padding:18px 20px; align-items:flex-end; min-height:116px; position:relative; overflow:hidden;}
.dq-tile-ico{position:absolute; right:14px; top:12px; font-size:22px; opacity:.9;}
.dq-tile strong{font-size:44px;}
.dq-tile span{color:inherit; opacity:.75;}
.dq-tile[data-dash-tile="total"]{background:var(--bento-hot); color:#fff;}
.dq-tile[data-dash-tile="active"]{background:var(--bento-ink); color:var(--paper);}
.dq-tile[data-dash-tile="done"]{background:var(--bento-lime); color:#191714;}
.dq-tile-warn{background:var(--s-delay-tint); color:var(--s-delay);}
.dq-tile.is-open{box-shadow:0 0 0 3px var(--ink), var(--shadow-2);}
/* 실시간 소식 띠 */
.dq-ticker{display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:999px; box-shadow:var(--shadow-1); padding:8px 8px 8px 16px; margin-bottom:16px; overflow:hidden;}
.dq-ticker-live{display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:800; letter-spacing:.06em; white-space:nowrap; color:var(--bento-hot);}
.dq-ticker-live i{width:8px; height:8px; border-radius:50%; background:var(--bento-hot); animation:dqPulse 1.6s ease-out infinite;}
@keyframes dqPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--bento-hot) 60%, transparent)} 100%{box-shadow:0 0 0 10px transparent}}
.dq-ticker-win{flex:1; min-width:0; overflow:hidden; mask-image:linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);}
.dq-ticker-track{display:inline-flex; gap:34px; white-space:nowrap; animation:dqMarquee var(--dq-dur, 60s) linear infinite; font-size:12.5px;}
.dq-ticker:hover .dq-ticker-track{animation-play-state:paused;}
.dq-ticker-item{display:inline-flex; gap:6px; align-items:center; color:var(--ink); background:none; border:0; padding:0; font:inherit; cursor:pointer;}
.dq-ticker-item small{color:var(--muted-2);}
@keyframes dqMarquee{to{transform:translateX(-50%)}}
/* 12주 완료 추이 */
.dq-trend{display:grid; grid-template-columns:auto 1fr; gap:6px 18px; align-items:end;}
.dq-trend-big strong{display:block; font-family:var(--font-display); font-size:56px; line-height:1; letter-spacing:-.03em;}
.dq-trend-big span{font-size:12px; color:var(--muted);}
.dq-trend svg{width:100%; height:150px; overflow:visible; display:block;}
.dq-trend-dot{fill:var(--bento-hot); animation:dqPulseSvg 1.8s ease-out infinite; transform-box:fill-box; transform-origin:center;}
@keyframes dqPulseSvg{0%,100%{transform:scale(1)} 50%{transform:scale(1.45)}}
.dq-trend-axis{display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted-2); grid-column:2;}

@media (prefers-reduced-motion: reduce){
  .card:hover, .dq-tile:hover, .dq-ring-card:hover{transform:none;}
  .dq-hero::before, .dq-ticker-track, .dq-ticker-live i, .dq-trend-dot{animation:none;}
}
