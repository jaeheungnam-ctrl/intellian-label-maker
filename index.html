    boardSyncStatus();
  }catch(e){
    ind.classList.remove('saving'); txt.textContent = '이 PC에 백업됨 · 공유 저장 실패'; txt.title=e.message;
  }
}

function escapeHtml(s){
  // s가 문자열이 아니면(숫자 등) String으로 감싸지 않은 채 .replace를 호출해서 "(s || "").replace is not
  // a function" 오류가 났다 — 구글시트가 숫자처럼 보이는 문자열(작지번호 등)을 자동으로 숫자형으로
  // 바꿔버리는 경우가 있어서, 공유 저장소에서 내려온 값은 숫자로 올 수 있다. 항상 String으로 감싼다.
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// ---------- 업무 비고칸(rich note): 링크/이미지 붙여넣기 ----------
// t.note는 예전엔 순수 텍스트였는데, 이제부터는 우리가 직접 만든 안전한 HTML 조각(escape된 텍스트 +
// 우리가 넣은 <img>/<a>/<br>만)을 담는다. 그 전에 저장된 순수 텍스트 노트와 구분하려고, "우리가 만든
// 태그가 하나도 없으면 옛날 방식(순수 텍스트)"으로 간주해서 그때만 escape+개행변환을 해준다.
function noteToHtml(note){
  const s = note || '';
  if(/<(img|a|br)\b/i.test(s)) return s; // 이미 이 기능으로 저장된 HTML
  return escapeHtml(s).replace(/\n/g,'<br>');
}
// contenteditable에 커서 위치에 HTML을 끼워 넣는다. execCommand는 표준에서 빠졌지만 크롬/엣지에서는
// 여전히 동작해서(이 도구는 사내 크롬/엣지 사용 전제) 가장 간단하고 안전하게 쓸 수 있다.
function insertHtmlAtCaret(el, html){
  el.focus();
  if(document.queryCommandSupported && document.queryCommandSupported('insertHTML')){
    document.execCommand('insertHTML', false, html);
    return;
  }
  // 폴백: Range API로 직접 삽입
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount){ el.insertAdjacentHTML('beforeend', html); return; }
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const frag = range.createContextualFragment(html);
  range.insertNode(frag);
  range.collapse(false);
}
// 붙여넣은 이미지를 캔버스로 축소 + JPEG 압축해서 데이터 URL로 반환 (구글시트 셀 용량 제한 대응)
function compressImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale); h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('이미지를 열 수 없습니다'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('파일을 읽을 수 없습니다'));
    reader.readAsDataURL(file);
  });
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  if(parts.length >= 2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}

/* ================= 라벨데이터 변환기 (iframe 임베드) ================= */
// 별도로 관리되는 패킹리스트→LABEL DATA 변환 도구를 그대로 담아온다.
// base64로 인코딩해 문자열 충돌(따옴표, 백틱, 스크립트 종료 태그 등) 걱정 없이 안전하게 내장한다.
// 주의: 브라우저는 iframe을 다른 부모로 옮기면(appendChild로 재배치) 내용을 다시 로드한다.
// 그래서 이 iframe은 항상 view-labeldata 안에만 유지하고, 다른 화면(기본 설정 등)에서는
// "옮겨서 보여주기"가 아니라 이 화면으로 바로 이동시키는 방식으로 접근한다 (goToLabelData 참고).
function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function renderLabelData(){
  const el = document.getElementById('view-labeldata');
  if(document.getElementById('labelDataFrame')){ syncLabelLinkToFrame(); return; } // 이미 있으면 재생성하지 않음 (작업 중이던 내용 보존)
  // 처음 들어올 때 화면이 잠깐(약 1.5초) 멈추는 문제 대응: 도구 본문이 커서(~700KB) atob 디코딩 +
  // iframe에 그 내용을 통째로 올리는 작업이 메인 스레드를 막는다. 두 가지로 체감을 줄인다 —
  // (1) 지금 누른 메뉴 전환(활성 표시/제목)이 먼저 화면에 그려지도록 무거운 작업을 다음 프레임으로 미루고,
  // (2) srcdoc에 큰 문자열을 그대로 대입하는 대신 Blob URL로 열어서 브라우저의 일반 문서 로딩 경로를
  //     타게 한다(체감 끊김이 덜하다). 로딩 중에는 스피너를 보여주고 iframe은 로드 완료 후에 드러낸다.
  el.innerHTML =
    '<div id="labelDataLoading" style="padding:80px 20px; text-align:center; color:var(--muted); font-size:13.5px;">라벨데이터 변환기를 불러오는 중…</div>' +
    '<iframe id="labelDataFrame" style="display:none; width:100%; height:calc(100vh - 140px); min-height:640px; border:1px solid var(--border); border-radius:10px; background:var(--surface);"></iframe>';
  const frame = document.getElementById('labelDataFrame');
  frame.addEventListener('load', ()=>{
    const loading = document.getElementById('labelDataLoading');
    if(loading) loading.remove();
    frame.style.display = '';
  }, {once:true});
  // requestAnimationFrame은 탭/화면이 안 보이는 상태(백그라운드 탭 등)에서는 아예 실행되지 않을 수 있어
  // setTimeout을 쓴다 — 화면이 보이지 않아도 반드시 실행되어야, 다시 눌렀을 때 확실히 로드가 시작된다.
  setTimeout(()=>{
    const html = b64ToUtf8(LABEL_DATA_TOOL_B64);
    const blobUrl = URL.createObjectURL(new Blob([html], {type:'text/html'}));
    frame.src = blobUrl;
    frame.addEventListener('load', ()=> URL.revokeObjectURL(blobUrl), {once:true});
  }, 0);
}

/* ---------- 업무 카드 ↔ 변환기 연결 ----------
   연결 정보는 taskId 하나만 들고 있고, 표시에 쓰는 문서번호/MODEL/제목은 그때그때 TASKS에서 다시 읽는다.
   (업무 제목이나 MODEL이 바뀌어도 표시가 옛날 값으로 남지 않게 하려는 것)
   화면 이동으로는 연결이 끊기지 않고, 변환기 위쪽 표시의 "연결 해제"를 눌러야만 해제된다. */
const LABELDATA_LINK_KEY = 'ppe_labeldata_link'; // 개인별 — 내가 지금 어떤 업무에서 변환기를 열었는지
let LABEL_LINK = null; // { taskId } 또는 null

async function loadLabelLink(){
  try{
    const res = await window.storage.get(LABELDATA_LINK_KEY, false);
    if(res && res.value){ const v = JSON.parse(res.value); if(v && v.taskId) LABEL_LINK = { taskId: v.taskId }; }
  }catch(e){ LABEL_LINK = null; }
}
async function persistLabelLink(){
  try{
    if(LABEL_LINK) await window.storage.set(LABELDATA_LINK_KEY, JSON.stringify(LABEL_LINK), false);
    else await window.storage.delete(LABELDATA_LINK_KEY, false);
  }catch(e){}
}
function linkedTask(){
  if(!LABEL_LINK) return null;
  return TASKS.find(t=>t.id===LABEL_LINK.taskId) || null;
}
function labelFrameWindow(){
  const f = document.getElementById('labelDataFrame');
  return f ? f.contentWindow : null;
}
function postToLabelFrame(msg){
  const w = labelFrameWindow();
  if(!w) return;
  try{ w.postMessage(Object.assign({ source:'ppe-board' }, msg), '*'); }catch(e){}
}
function syncLabelLinkToFrame(){
  const t = linkedTask();
  postToLabelFrame({ type:'link', link: t ? {
    taskId: t.id, title: t.title || '', model: t.model || '', docNumber: t.docNumber || ''
  } : null });
}
async function setLabelLink(taskId){
  LABEL_LINK = taskId ? { taskId } : null;
  await persistLabelLink();
  syncLabelLinkToFrame();
}
// 연결된 업무의 체크리스트에서 "구성품 라벨 등록"에 해당하는 항목 찾기
function componentLabelItem(t){
  const items = checklistFor(t.type, t);
  return items.find(a=>a.type==='link') || items.find(a=>a.key==='componentLabel') || null;
}
// 변환기에서 LABEL_DATA.xlsx 다운로드가 끝났을 때 — 연결된 업무가 있을 때만 동작
async function handleLabelDataDownloaded(msg){
  const t = linkedTask();
  if(!t){
    // 연결 없이 그냥 변환기를 쓴 경우 → 자동 체크도, 기록도 남기지 않는다
    if(LABEL_LINK){ await setLabelLink(null); } // 업무가 삭제된 경우 연결만 정리
    return;
  }
  const pnCount = Number(msg.pnCount) || 0;
  const rowCount = Number(msg.rowCount) || 0;
  const item = componentLabelItem(t);
  let checkedNow = false;
  if(item && !t.actionItems[item.key]){
    t.actionItems[item.key] = true;
    checkedNow = true;
    await persist(true);
  }
  await logActivity('label',
    `<b>${escapeHtml(t.title)}</b> 업무 — 파트넘버 ${pnCount}개 / ${rowCount}행 LABEL DATA 생성` +
    (checkedNow && item ? ` · "${escapeHtml(item.label)}" 자동 체크` : ''),
    t.id);
  renderNotifBadge();
  postToLabelFrame({ type:'downloadAck', checked: checkedNow, logged: true, itemLabel: item ? item.label : '' });
}
// iframe(변환기)에서 올라오는 메시지 처리
window.addEventListener('message', async (e)=>{
  const w = labelFrameWindow();
  if(!w || e.source !== w) return;                     // 우리 iframe이 보낸 것만 받음
  const d = e.data;
  if(!d || typeof d !== 'object' || d.source !== 'ppe-labeltool') return;
  try{
    if(d.type === 'ready') syncLabelLinkToFrame();
    else if(d.type === 'unlink') await setLabelLink(null);
    else if(d.type === 'downloaded') await handleLabelDataDownloaded(d);
    else if(d.type === 'openTask' && d.taskId) openDetail(d.taskId);
  }catch(err){ console.error('변환기 메시지 처리 실패', err); }
});

// 어디서든(체크리스트 링크, 기본 설정 탭 등) 라벨데이터 변환기 화면으로 바로 이동시키는 공용 함수
// task를 넘기면 그 업무와 연결된 상태로 열리고, 넘기지 않으면 지금 연결 상태를 그대로 둔다.
async function goToLabelData(task){
  if(task) await setLabelLink(task.id);
  currentView = 'labeldata';
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view==='labeldata'));
  renderCurrent();
  syncLabelLinkToFrame();
}

function renderSapBomCompare(){
  if(document.getElementById('sapBomCompareFrame')) return;
  const frame = document.createElement('iframe');
  frame.id = 'sapBomCompareFrame';
  frame.title = 'EBOM ↔ SAP BOM 비교 도구';
  frame.style.cssText = 'display:block;width:100%;height:calc(100vh - 140px);min-height:640px;border:1px solid var(--border);border-radius:10px;background:var(--surface);';
  frame.srcdoc = b64ToUtf8(SAPBOM_COMPARE_TOOL_B64);
  // 대시보드 "최근 비교내역"에서 클릭해 들어온 경우, 이 iframe이 완전히 로드된 뒤에야
  // postMessage를 받아줄 수 있으므로 load 이벤트로 그 시점을 표시해둔다.
  frame.addEventListener('load', ()=>{
    frame.dataset.loaded = '1';
    if(pendingBomHistoryEntry){ sendBomHistoryEntryToFrame(pendingBomHistoryEntry); pendingBomHistoryEntry = null; }
  });
  document.getElementById('view-sapbomcompare').appendChild(frame);
}
let pendingBomHistoryEntry = null;
function sendBomHistoryEntryToFrame(entry){
  const frame = document.getElementById('sapBomCompareFrame');
  if(frame && frame.contentWindow) frame.contentWindow.postMessage({source:'ppe-board', type:'loadHistoryEntry', entry}, '*');
}
// 대시보드의 "최근 EBOM ↔ SAP BOM 비교 내역" 카드를 클릭하면 호출됨 — 비교 화면으로 이동한 뒤
// 그 비교내역을 곧바로 불러와서 보여준다(다시 파일을 올릴 필요 없음).
// iframe 생성/로드가 눈에 안 보이게 한 박자 걸려서 "처음 눌렀을 땐 아무 반응이 없다가 한 번 더
// 눌러야 넘어가는" 것처럼 보일 수 있어서, 클릭한 그 순간 바로 로딩 표시를 띄워 확실히 반응하게 한다.
function openBomHistoryFromDashboard(entry){
  currentView = 'sapbomcompare';
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view==='sapbomcompare'));
  document.getElementById('sidebar').classList.remove('open');
  renderCurrent();
  showSapBomLoadingOverlay();
  const frame = document.getElementById('sapBomCompareFrame');
  if(frame && frame.dataset.loaded === '1') sendBomHistoryEntryToFrame(entry);
  else pendingBomHistoryEntry = entry; // iframe이 방금 새로 생성됐으면 load 이벤트가 뜬 뒤 보낸다
}
let sapBomLoadingTimer = null;
let sapBomProgressCtl = null;
function showSapBomLoadingOverlay(){
  const container = document.getElementById('view-sapbomcompare');
  if(!container || document.getElementById('sapBomLoadingOverlay')) return;
  container.style.position = 'relative';
  const overlay = document.createElement('div');
  overlay.id = 'sapBomLoadingOverlay';
  overlay.className = 'sapbom-loading-overlay';
  overlay.innerHTML = `<div class="progress-bar" style="width:240px;"><div class="progress-bar-fill" id="sapBomProgressFill"></div></div><div class="comment-empty">비교내역 불러오는 중…</div>`;
  container.appendChild(overlay);
  sapBomProgressCtl = startProgressBar(document.getElementById('sapBomProgressFill'));
  clearTimeout(sapBomLoadingTimer);
  // 도구 쪽에서 "다 그렸다"는 신호(loadHistoryEntryDone)가 오면 곧바로 치우지만, 혹시라도 그 신호가
  // 안 오는 경우를 대비해 8초 뒤에는 방어적으로 치운다.
  sapBomLoadingTimer = setTimeout(hideSapBomLoadingOverlay, 8000);
}
function hideSapBomLoadingOverlay(){
  clearTimeout(sapBomLoadingTimer);
  const overlay = document.getElementById('sapBomLoadingOverlay');
  const ctl = sapBomProgressCtl; sapBomProgressCtl = null;
  const remove = ()=>{ if(overlay) overlay.remove(); };
  if(ctl) ctl.finish(remove); else remove();
}
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(d && typeof d === 'object' && d.source === 'ppe-sapbomtool' && d.type === 'loadHistoryEntryDone') hideSapBomLoadingOverlay();
});
// 대시보드에서 보여줄 "최근 비교내역" 목록 — boardRequest()는 {ok:true,...} 응답을 기대하는데
// bomHistoryList 액션은 배열을 그대로 내려주므로, 여기서만 직접 fetch로 받는다.
async function fetchBomHistoryForDashboard(){
  try{
    const u = new URL(boardSync.url);
    u.searchParams.set('action', 'bomHistoryList');
    if(boardSync.token) u.searchParams.set('token', boardSync.token);
    const res = await fetch(u.href);
    if(!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }catch(e){ console.error('bomHistoryList(dashboard) failed', e); return []; }
}

/* ================= SAP 작지번호 조회 (MES productiontechApi) =================
   MES(mes.intelliantech.com)는 사내망(VPN) 전용이라 이 페이지(브라우저)가 VPN 안에 있을 때만 호출된다.
   구글 서버(Apps Script)는 그 망 밖에 있어서 대신 호출해 줄 수 없다 — 그래서 브라우저가 직접 MES를 호출한다.
   API 키는 index.html에 평문으로 넣지 않고, Apps Script의 Script Properties에서 그때그때 받아온다
   (doGet action=mesApiKey — Code_merged.gs의 setMesApiKey()로 미리 저장해 둬야 함).
   PPOrderAX(SAP 작지번호)는 조회 파라미터로 직접 검색할 수 없어서, 기간으로 목록을 받아와 그 안에서
   찾는 방식이다 — 그래서 기간을 넓게 잡으면 응답이 커지고 느려질 수 있다(최대 180일로 제한). */
const MES_API_BASE = { prod: 'https://mes.intelliantech.com/productiontechApi/productionOrderList.do',
                        dev: 'https://mesdev.intelliantech.com/productiontechApi/productionOrderList.do' };
let mesApiKeyCache = null; // null=아직 안 받아옴, ''=서버에 키 미설정, 그 외=실제 키
async function fetchMesApiKey(){
  if(mesApiKeyCache !== null) return mesApiKeyCache;
  try{
    const res = await boardRequest('mesApiKey');
    mesApiKeyCache = res.key || ''; // 서버가 정상 응답했는데 키가 비어있는 건 실제로 미설정 상태이므로 그대로 캐시
  }catch(e){
    // 네트워크 오류/일시적 배포 전파 지연 등으로 조회 자체가 실패한 경우 — 이걸 그대로 캐시해버리면
    // 새로고침 전까지 "키가 없다"는 잘못된 안내가 계속 남는다. 캐시하지 않고 null로 둬서 다음 호출 때 다시 시도한다.
    console.error('fetchMesApiKey failed', e);
    return '';
  }
  return mesApiKeyCache;
}
function mesDateStr(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
// SAP 작지번호는 순수 숫자에 앞자리 0이 채워진 형태(예: 0001986827)라, 사용자가 앞자리 0을 빼고 입력해도
// (1986827) 매칭되도록 순수 숫자 문자열일 때만 앞자리 0을 제거해 비교한다. MES 작지번호(PP101620906)처럼
// 문자가 섞인 값은 그대로 둔다.
function normMesOrderNo(s){
  s = String(s||'').trim();
  return /^\d+$/.test(s) ? s.replace(/^0+(?=\d)/, '') : s;
}

// 조회 이력은 이 사람만 보는 게 아니라 팀 전체가 공유해야 해서(누가 어떤 작지번호를 찾아봤는지 같이 보기),
// 브라우저 localStorage가 아니라 공유 구글시트(Apps Script)에 저장한다 — 라벨데이터 변환기의 saveRulesets와 같은 방식.
async function fetchMesHistory(){
  try{
    const res = await boardRequest('mesHistoryList');
    return Array.isArray(res.list) ? res.list : [];
  }catch(e){ console.error('mesHistoryList failed', e); return []; }
}
async function addMesHistoryEntry(entry){
  try{ await boardRequest('mesHistoryAdd', { entry: Object.assign({ userName: currentUserLabel() }, entry) }); }
  catch(e){ console.error('mesHistoryAdd failed', e); /* 이력 공유 저장 실패는 조용히 무시 — 조회 자체는 계속 동작해야 함 */ }
}
function mesRelativeTime(ts){
  const mins = Math.round((Date.now() - ts) / 60000);
  if(mins < 1) return '방금 전';
  if(mins < 60) return mins + '분 전';
  const hours = Math.round(mins / 60);
  if(hours < 24) return hours + '시간 전';
  return Math.round(hours / 24) + '일 전';
}

// 정확한 진행률을 알 수 없는 네트워크 요청(구글 Apps Script 왕복 등)에 "그래도 진행되고 있다"는
// 느낌을 주는 로딩바. 90%까지는 남은 거리의 일부만큼씩 다가가서 갈수록 느려지고(실제 로딩처럼 보임),
// 끝나면 finish()로 100%까지 채운 뒤 콜백(사라지게 하기 등)을 실행한다.
function startProgressBar(fillEl){
  let pct = 8;
  fillEl.style.width = pct + '%';
  const timer = setInterval(()=>{
    pct += (90 - pct) * 0.12;
    fillEl.style.width = Math.min(pct, 90) + '%';
  }, 200);
  return {
    finish(onDone){
      clearInterval(timer);
      fillEl.style.width = '100%';
      if(onDone) setTimeout(onDone, 250); // 100%로 차는 전환(.3s)이 보이도록 살짝 기다린 뒤 처리
    }
  };
}
async function renderMesLookup(){

      <div class="form-grid">
        <div class="field"><label>작지번호 (SAP 또는 MES) *</label><input type="text" id="mesOrderInput" placeholder="예: 4100012345 (SAP) 또는 MES 작지번호"></div>
        <div class="field"><label>환경</label>
          <select id="mesEnvSelect"><option value="prod">운영 (mes.intelliantech.com)</option><option value="dev">개발 (mesdev.intelliantech.com)</option></select>
        </div>
        <div class="field"><label>조회 시작일</label><input type="date" id="mesFromDate" value="${mesDateStr(defaultFrom)}"></div>
        <div class="field"><label>조회 종료일</label><input type="date" id="mesToDate" value="${mesDateStr(defaultTo)}"></div>
      </div>
      <div style="margin-top:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
        <span class="muted-cell">더 조회(과거로 넓히기):</span>
        <button type="button" class="btn btn-ghost mesRangeBtn" data-months="3" style="padding:4px 10px; font-size:12px;">과거 3개월</button>
        <button type="button" class="btn btn-ghost mesRangeBtn" data-months="6" style="padding:4px 10px; font-size:12px;">과거 6개월</button>
        <button type="button" class="btn btn-ghost mesRangeBtn" data-months="12" style="padding:4px 10px; font-size:12px;">과거 12개월</button>
        <button type="button" class="btn btn-ghost mesRangeBtn" data-all="1" style="padding:4px 10px; font-size:12px;">전체</button>
      </div>
      <div style="margin-top:12px; display:flex; align-items:center; gap:10px;">
        <button class="btn" id="mesSearchBtn">조회</button>
        <span id="mesStatusLine" class="muted-cell"></span>
      </div>
      <div id="mesResultArea" style="margin-top:16px;"></div>
      <div style="margin-top:18px; border-top:1px solid var(--border); padding-top:10px;">
        <div style="font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px;">최근 조회 이력</div>
        <div id="mesHistoryArea"></div>
      </div>
    </div>
  `;
  const statusEl = document.getElementById('mesStatusLine');
  const resultEl = document.getElementById('mesResultArea');
  const historyEl = document.getElementById('mesHistoryArea');
  const key = await fetchMesApiKey();
  if(!key){
    statusEl.textContent = 'MES API 키가 서버에 설정되어 있지 않습니다.';
    statusEl.style.color = 'var(--danger, #b3423a)';
    resultEl.innerHTML = `<div class="comment-empty">Apps Script 편집기에서 <code>setMesApiKey("발급받은키")</code>를 한 번 실행해 주세요 (Code_merged.gs).</div>`;
    document.getElementById('mesSearchBtn').disabled = true;
    return;
  }

  // 이력은 "찾은 건"만 남긴다(찾지 못한 조회는 남겨봐야 나중에 볼 가치가 없어서 목록만 지저분해짐).
  // 검색마다 서버에서 다시 통째로 받아오면(왕복 1번 더) 느려지므로, 최초 진입 시 한 번만 받아오고
  // 그 뒤로는 새 항목을 이 캐시 배열에 직접 추가해서 화면만 다시 그린다(네트워크 왕복 없음).
  let mesHistoryCache = [];
  // 이력을 클릭해서 "한 번 더" 조회하는 건 이미 이력에 있는 걸 다시 조회하는 것뿐이라, 또 이력에
  // 새 줄로 쌓이면 같은 항목이 중복돼서 지저분해짐 — 이 플래그가 서 있는 동안의 조회는 기록하지 않는다.
  let skipNextHistoryLog = false;
  function renderHistoryList(){
    const list = mesHistoryCache;
    if(!list.length){ historyEl.innerHTML = `<div class="comment-empty">아직 조회 이력이 없습니다.</div>`; return; }
    historyEl.innerHTML = list.map((h,i)=> `
      <div class="mesHistoryItem" data-idx="${i}" style="display:flex; justify-content:space-between; gap:10px; padding:6px 4px; font-size:12.5px; cursor:pointer; border-bottom:1px solid var(--border);">
        <span>${escapeHtml(h.query)} — ${escapeHtml((h.mNumber||'')+' '+(h.mName||''))}${h.userName ? ' <span class="muted-cell">('+escapeHtml(h.userName)+')</span>' : ''}</span>
        <span class="muted-cell" style="white-space:nowrap;">${mesRelativeTime(h.ts)}</span>
      </div>
    `).join('');
    historyEl.querySelectorAll('.mesHistoryItem').forEach(row=>{
      row.addEventListener('click', ()=>{
        const h = mesHistoryCache[Number(row.dataset.idx)];
        if(!h) return;
        skipNextHistoryLog = true;
        document.getElementById('mesOrderInput').value = h.query;
        document.getElementById('mesSearchBtn').click();
      });
    });
  }
  // 그냥 "불러오는 중…" 문구만 있으면 멈춘 것처럼 보이니, 눈에 보이는 로딩바를 띄운다.
  historyEl.innerHTML = `<div class="progress-bar"><div class="progress-bar-fill" id="mesHistoryProgressFill"></div></div><div class="comment-empty" style="margin-top:6px;">이력 불러오는 중…</div>`;
  const mesHistoryProgress = startProgressBar(document.getElementById('mesHistoryProgressFill'));
  fetchMesHistory().then(list=>{
    mesHistoryProgress.finish(()=>{ mesHistoryCache = list; renderHistoryList(); });
  });

  el.querySelectorAll('.mesRangeBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.all){
        // "전체"는 시작일·종료일을 둘 다 비워서 기간 조건 없는 요청이 되게 한다 — API 자체가 조건이 없으면
        // 전체를 반환한다고 안내되어 있음(속도는 느릴 수 있음, "전체" 버튼을 누른 건 사용자의 명시적 선택).
        document.getElementById('mesFromDate').value = '';
        document.getElementById('mesToDate').value = '';
        return;
      }
      const to = new Date(today); to.setMonth(to.getMonth()+2);
      document.getElementById('mesToDate').value = mesDateStr(to);
      const months = Number(btn.dataset.months);
      const from = new Date(today); from.setMonth(from.getMonth()-months);
      document.getElementById('mesFromDate').value = mesDateStr(from);
    });
  });

  // 하나의 SAP 작지번호는 품번 하나만 가지므로, 여러 건이 걸리더라도 목록으로 늘어놓지 않고
  // 품번/품명 하나에 수량 합계·상태별 개수·작업지시일(들)만 모아서 한 번에 보여준다.
  // MES 작지번호는 건마다 다 다를 수 있어서(하나의 SAP 작지번호에 여러 MES 작지번호가 걸릴 수 있음)
  // 그중 하나만 대표로 보여주면 틀린 정보가 될 수 있으므로 표시하지 않는다 — 단, 사용자가 MES 작지번호로
  // "직접" 검색한 경우엔 그 하나는 확실히 맞는 값이라 예외적으로 같이 보여준다.
  function renderResult(group, searchedAs, searchedByMes){
    if(!group.length) return null;
    const first = group[0];
    const totalQty = group.reduce((sum,r)=> sum + (Number(r.Quantity) || 0), 0);
    const statusCounts = {};
    group.forEach(r=>{
      const label = r.PPProgressName || '(상태없음)';
      statusCounts[label] = (statusCounts[label] || 0) + 1;
    });
    const statusText = Object.entries(statusCounts).map(([label,n])=> `${label} ${n}개`).join(', ');
    const rqDates = [...new Set(group.map(r=>r.RQDate).filter(Boolean))].sort();
    const sapOrder = String(first.PPOrderAX ?? '-');
    const sapLine = searchedByMes
      ? `SAP 작지번호 <b>${escapeHtml(sapOrder)}</b> <span class="muted-cell">(MES작지번호 ${escapeHtml(searchedAs)})</span>`
      : `SAP 작지번호 <b>${escapeHtml(sapOrder)}</b>`;
    resultEl.innerHTML = `
      <div class="panel">
        <div style="font-size:16.5px; font-weight:700;">${escapeHtml(String(first.MNumber ?? ''))} <span class="muted-cell" style="font-weight:400; font-size:13px;">— ${escapeHtml(String(first.MName ?? ''))}</span></div>
        <div style="margin-top:8px; font-size:13px; display:flex; flex-direction:column; gap:4px;">
          <div>${sapLine}</div>
          <div>수량 합계 <b>${totalQty}</b> (${group.length}건)</div>
          <div>상태 — ${escapeHtml(statusText)}</div>
          <div>작업지시일 — ${escapeHtml(rqDates.join(', ') || '-')}</div>
        </div>
      </div>
    `;
    return { MNumber: first.MNumber, MName: first.MName };
  }

  document.getElementById('mesSearchBtn').addEventListener('click', async ()=>{
    // 실패해도 입력한 번호는 절대 지우지 않는다(다시 타이핑하지 않게) — 그래서 이 값을 지역변수로만 쓰고
    // input.value를 어디서도 건드리지 않는다.
    const searchedAs = document.getElementById('mesOrderInput').value.trim();
    if(!searchedAs){ alert('작지번호를 입력해 주세요.'); return; }
    const fromDate = document.getElementById('mesFromDate').value; // 비어있으면(전체) 기간 조건 없이 요청
    const toDate = document.getElementById('mesToDate').value;      // 비어있으면(전체) 마찬가지
    if(fromDate && toDate && new Date(toDate) < new Date(fromDate)){ alert('종료일이 시작일보다 앞설 수 없습니다.'); return; }
    const env = document.getElementById('mesEnvSelect').value;
    const base = MES_API_BASE[env];

    const btn = document.getElementById('mesSearchBtn');
    btn.disabled = true;
    statusEl.style.color = '';
    statusEl.textContent = '조회 중…';
    resultEl.innerHTML = '';
    const startedAt = performance.now();
    try{
      const params = { apiKey:key };
      if(fromDate) params.FRomRQDate = fromDate;
      if(toDate) params.ToRQDate = toDate;
      const qs = new URLSearchParams(params);
      const res = await fetch(base + '?' + qs.toString(), { signal: AbortSignal.timeout(30000) });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(data.result !== true){
        statusEl.style.color = 'var(--danger, #b3423a)';
        statusEl.textContent = data.message || 'MES 조회에 실패했습니다.';
        return;
      }
      const list = Array.isArray(data.list) ? data.list : [];
      const elapsedSec = ((performance.now() - startedAt) / 1000).toFixed(1);
      // SAP 작지번호(PPOrderAX)로 먼저 찾아보고, 없으면 MES 작지번호(PPOrder)로 찾는다 — 어느 쪽으로
      // 찾았는지에 따라 결과에 MES 작지번호를 예외적으로 같이 보여줄지가 달라진다(위 renderResult 참고).
      const searchedAsNorm = normMesOrderNo(searchedAs);
      const bySap = list.find(r => normMesOrderNo(r.PPOrderAX) === searchedAsNorm);
      const byMes = !bySap ? list.find(r => normMesOrderNo(r.PPOrder) === searchedAsNorm) : null;
      const anyMatch = bySap || byMes;
      let group = [];
      if(anyMatch){
        const sapOrder = String(anyMatch.PPOrderAX||'').trim();
        group = sapOrder ? list.filter(r => String(r.PPOrderAX||'').trim() === sapOrder) : [anyMatch];
      }
      statusEl.textContent = `${elapsedSec}초 · 기간 내 전체 ${list.length}건 중 관련 ${group.length}건`;
      const resultSummary = renderResult(group, searchedAs, !!byMes);
      if(!group.length){
        resultEl.innerHTML = `<div class="comment-empty">"${escapeHtml(searchedAs)}"에 해당하는 작지를 이 기간 안에서 찾지 못했습니다. 기간을 넓혀서 다시 시도해 보세요.</div>`;
      } else if(!skipNextHistoryLog){
        // 찾았을 때만, 그리고 이력을 클릭해서 재조회한 게 아닐 때만 이력에 남긴다. 서버에 다시 저장
        // 확인을 왕복하지 않고, 화면 캐시에 바로 추가해서 이력 목록이 그 즉시(네트워크 지연 없이)
        // 갱신되게 하고, 서버 저장은 백그라운드로 진행한다.
        const entry = { ts: Date.now(), query: searchedAs, found: true, mNumber: resultSummary.MNumber, mName: resultSummary.MName, userName: currentUserLabel() };
        mesHistoryCache.unshift(entry);
        if(mesHistoryCache.length > 30) mesHistoryCache.length = 30;
        renderHistoryList();
        addMesHistoryEntry(entry);
      }
    }catch(err){
      statusEl.style.color = 'var(--danger, #b3423a)';
      statusEl.textContent = 'MES 호출에 실패했습니다 — 사내망(VPN) 연결 상태를 확인해 주세요. (' + (err.message||err) + ')';
    }finally{
      btn.disabled = false;
      skipNextHistoryLog = false;
    }
  });
}
/* ================= 선적용 업무 (ECR/E00 문서번호로 미리 등록) ================= */
let PREAPPLIED = [];
let preAppliedLoaded = false;
async function fetchPreApplied(force){
  if(preAppliedLoaded && !force) return PREAPPLIED;
  try{
    const r = await boardRequest('preAppliedList');
    PREAPPLIED = r.list || [];
    preAppliedLoaded = true;
  }catch(e){ console.error('선적용 목록 조회 실패', e); }
  return PREAPPLIED;
}
function isValidPreAppliedDocNo(v){ return /^(ECR|E00)/i.test(String(v||'').trim()); }
function findPreAppliedByDocNo(docNo){
  if(!docNo) return null;
  const q = String(docNo).trim().toLowerCase();
  return PREAPPLIED.find(p=> String(p.docNo).trim().toLowerCase() === q) || null;
}

// 업무 상세/편집 화면에서, 입력된 선적용 문서번호에 해당하는 선적용 내용을 토글로 보여준다.
async function renderPreAppliedPanel(modal, t){
  const panel = modal.querySelector('#preAppliedPanel');
  if(!panel) return;
  const docNo = (modal.querySelector('#fPreApplied')?.value || t.preAppliedDocNo || '').trim();
  if(!docNo){ panel.innerHTML=''; return; }
  if(!preAppliedLoaded){
    panel.innerHTML = '<div class="muted" style="margin-top:6px;">선적용 내역 확인 중…</div>';
    await fetchPreApplied();
  }
  const match = findPreAppliedByDocNo(docNo);
  if(!match){
    panel.innerHTML = `<div class="pa-panel-warn">"${escapeHtml(docNo)}" 문서번호로 등록된 선적용 업무를 찾을 수 없습니다. <a href="javascript:void(0)" id="paCreateFromTask">여기서 새로 등록</a></div>`;
    const link = panel.querySelector('#paCreateFromTask');
    if(link) link.addEventListener('click', ()=> openPreAppliedEditor(null, docNo));
    return;
  }
  const thumbs = (match.images||[]).slice(0,4).map(img=>`<img src="${escapeHtml(img.url)}" class="pa-panel-thumb">`).join('');
  panel.innerHTML = `
    <button type="button" class="pa-toggle-btn" id="paToggleBtn">📌 선적용 내용 보기 — ${escapeHtml(match.title||match.docNo)}</button>
    <div class="pa-toggle-body" id="paToggleBody" style="display:none;">
      <div class="pa-toggle-title">${escapeHtml(match.title||'')}</div>
      <div class="pa-toggle-text">${escapeHtml(match.body||'')}</div>
      <div class="pa-toggle-imgs">${thumbs}</div>
    </div>`;
  panel.querySelector('#paToggleBtn').addEventListener('click', ()=>{
    const body = panel.querySelector('#paToggleBody');
    body.style.display = body.style.display==='none' ? '' : 'none';
  });
}

async function renderPreApplied(){
  const el = document.getElementById('view-preapplied');
  el.innerHTML = `
    <div class="panel">
      <div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
        <div class="muted" style="flex:1;min-width:220px;">문서번호(ECR 또는 E00으로 시작)로 선적용 업무를 미리 등록해두면, 나중에 업무에 같은 문서번호를 입력했을 때 함께 표시됩니다.</div>
        <button class="btn" id="paNewBtn">+ 새 선적용 등록</button>

let paEditorImages = [];
let paEditorId = null;

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePaFiles(files){
  for(const file of files){
    if(!file || !file.type || !file.type.startsWith('image/')) continue;
    const entry = {url:'', width:280, height:180, _uploading:true};
    paEditorImages.push(entry);
    renderPaImgGrid();
    try{
      const dataUrl = await fileToDataUrl(file);
      entry.url = dataUrl;
      renderPaImgGrid();
      const res = await boardRequest('preAppliedUploadImage', {dataUrl, filename:file.name});
      entry.url = res.url; entry.fileId = res.fileId; entry._uploading = false;
    }catch(e){
      entry._uploading = false; entry._error = e.message || String(e);
    }
    renderPaImgGrid();
  }
}

function renderPaImgGrid(){
  const grid = document.getElementById('paImgGrid');
  if(!grid) return;
  grid.innerHTML = paEditorImages.map((img,i)=>{
    if(img._uploading){
      return `<div class="pa-img-box pa-img-uploading" style="width:${img.width}px;height:${img.height}px;">
        <img src="${img.url?escapeHtml(img.url):''}" style="width:100%;height:100%;object-fit:contain;opacity:.5;">
        <div class="pa-img-overlay">${img._error? '업로드 실패' : '업로드 중…'}</div>
      </div>`;
    }
    return `<div class="pa-img-box" data-idx="${i}" style="width:${img.width}px;height:${img.height}px;">
      <img src="${escapeHtml(img.url)}" style="width:100%;height:100%;object-fit:contain;">
      <button type="button" class="pa-img-remove" data-idx="${i}" title="삭제">✕</button>
    </div>`;
  }).join('');
  grid.querySelectorAll('.pa-img-box[data-idx]').forEach(box=>{
    const idx = Number(box.dataset.idx);
    if(window.ResizeObserver){
      const ro = new ResizeObserver(entries=>{
        for(const entry of entries){
          if(paEditorImages[idx]){
            paEditorImages[idx].width = Math.round(entry.contentRect.width);
            paEditorImages[idx].height = Math.round(entry.contentRect.height);
          }
        }
      });
      ro.observe(box);
    }
  });
  grid.querySelectorAll('.pa-img-remove').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      paEditorImages.splice(Number(btn.dataset.idx),1);
      renderPaImgGrid();
    });
  });
}

function openPreAppliedEditor(id, prefillDocNo){
  paEditorId = id;
  const existing = id ? PREAPPLIED.find(p=>p.id===id) : null;
  paEditorImages = existing ? JSON.parse(JSON.stringify(existing.images||[])) : [];
  const overlay = document.createElement('div');
  overlay.className = 'pa-modal-overlay';
  overlay.id = 'paModalOverlay';
  overlay.innerHTML = `
    <div class="pa-modal">
      <div class="pa-modal-head">
        <h2>${existing? '선적용 업무 수정' : '새 선적용 업무 등록'}</h2>
        <button type="button" class="pa-modal-close" id="paModalClose">✕</button>
      </div>
      <label>문서번호 <span class="req">*</span> (ECR 또는 E00으로 시작)</label>
      <input type="text" id="paDocNo" value="${escapeHtml(existing?.docNo || prefillDocNo || '')}" placeholder="예: ECR-2026-0912 / E00-2609-003">
      <div id="paDocNoWarn" class="pa-warn" style="display:none;">문서번호는 "ECR" 또는 "E00"으로 시작해야 합니다.</div>

      <div class="pa-dropzone" id="paDropzone">
        <div class="muted">여기로 이미지를 드래그하거나 클릭해서 선택, 또는 이 창 안에서 Ctrl+V로 붙여넣기</div>
        <input type="file" id="paFileInput" accept="image/*" multiple style="display:none;">
      </div>

      <div class="pa-modal-actions">
        ${existing? `<button type="button" class="btn btn-ghost pa-danger" id="paDeleteBtn">삭제</button>` : ''}
        <div style="flex:1"></div>
        <button type="button" class="btn btn-ghost" id="paCancelBtn">취소</button>
        <button type="button" class="btn" id="paSaveBtn">저장</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  renderPaImgGrid();

  const pasteHandler = e=>{
    if(!document.getElementById('paModalOverlay')) return;
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    const files = [];
    for(const it of items){ if(it.type && it.type.startsWith('image/')) files.push(it.getAsFile()); }
    if(files.length) handlePaFiles(files);
  };
  document.addEventListener('paste', pasteHandler);
  const close = ()=>{ document.removeEventListener('paste', pasteHandler); overlay.remove(); };

  document.getElementById('paModalClose').addEventListener('click', close);
  document.getElementById('paCancelBtn').addEventListener('click', close);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });

  const dz = document.getElementById('paDropzone');
  const fileInput = document.getElementById('paFileInput');
  dz.addEventListener('click', ()=> fileInput.click());
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', ()=> dz.classList.remove('drag'));
  dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); handlePaFiles(e.dataTransfer.files); });
  fileInput.addEventListener('change', e=> handlePaFiles(e.target.files));

  document.getElementById('paSaveBtn').addEventListener('click', ()=> savePreApplied(close));
  if(existing) document.getElementById('paDeleteBtn').addEventListener('click', ()=> deletePreApplied(existing.id, close));
}

async function savePreApplied(close){
  const docNo = document.getElementById('paDocNo').value.trim();
  const warnEl = document.getElementById('paDocNoWarn');
  if(!isValidPreAppliedDocNo(docNo)){ warnEl.style.display='block'; return; }
  warnEl.style.display='none';
  const title = document.getElementById('paTitle').value.trim();
  const body = document.getElementById('paBody').value.trim();
  const images = paEditorImages.filter(i=>!i._uploading && i.url).map(i=>({url:i.url, width:i.width, height:i.height}));
  const saveBtn = document.getElementById('paSaveBtn');
  saveBtn.disabled = true; saveBtn.textContent = '저장 중…';
  try{
    if(paEditorId){
      await boardRequest('preAppliedUpdate', {entry:{id:paEditorId, docNo, title, body, images}});
    } else {
      await boardRequest('preAppliedAdd', {entry:{docNo, title, body, images, createdBy:currentUserLabel()}});
    }
    await fetchPreApplied(true);
    renderPreAppliedListOnly();
    // 업무 상세화면에서 "여기서 새로 등록"으로 만든 경우, 그 화면의 토글도 곧바로 갱신한다.
    const openModal = document.getElementById('modal');
    const openTaskId = openModal && openModal.dataset ? openModal.dataset.taskId : null;
    if(openModal && openModal.querySelector('#preAppliedPanel')){
      const openTask = openTaskId ? TASKS.find(x=>x.id===openTaskId) : null;
      if(openTask) renderPreAppliedPanel(openModal, openTask);
    }
    close();
  }catch(e){
    alert('저장 실패: ' + e.message);
    saveBtn.disabled = false; saveBtn.textContent = '저장';
  }
}

async function deletePreApplied(id, close){
  if(!confirm('이 선적용 업무를 삭제하시겠습니까?')) return;
  try{
    await boardRequest('preAppliedDelete', {id});
    await fetchPreApplied(true);
    renderPreAppliedListOnly();
    close();
  }catch(e){ alert('삭제 실패: ' + e.message); }
}

/* ================= DASHBOARD ================= */
let dashboardWeekOffset=0,dashboardAssignee='all',dashboardGanttMonthOffset=0,dashboardTileOpen=null,dashboardStatusChartOpen=false;
function dashDate(value){
  const m=String(value||'').match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:$|[ T])/);
  if(!m)return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3]?d:null;
}
function dashShift(d,n){const v=new Date(d);v.setDate(v.getDate()+n);return v;}
function dashKey(d){return d?`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`:'';}
function dashDates(t){
  const received=dashDate(t.receivedDate),created=dashDate(t.sourceCreatedAt),due=dashDate(t.dueRequest),done=dashDate(t.endDate);
  const start=received||created,end=t.status==='완료'?(done||due):due;
  return {start,end,due,done,created,received};
}
function renderDashboard(){
  const el=document.getElementById('view-dashboard'),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const monday=dashShift(today,-((today.getDay()+6)%7)+dashboardWeekOffset*7),days=Array.from({length:7},(_,i)=>dashShift(monday,i)),sunday=days[6];
  const gMonthStart=new Date(today.getFullYear(),today.getMonth()+dashboardGanttMonthOffset,1);
  const gMonthEnd=new Date(gMonthStart.getFullYear(),gMonthStart.getMonth()+1,0);
  const gDays=Array.from({length:gMonthEnd.getDate()},(_,i)=>new Date(gMonthStart.getFullYear(),gMonthStart.getMonth(),i+1));
  const tasks=TASKS.filter(t=>dashboardAssignee==='all'||(t.assignee||'미배정')===dashboardAssignee);
  const done=tasks.filter(t=>t.status==='완료').length,active=tasks.length-done;
  const overdue=tasks.filter(t=>t.status!=='완료'&&dashDate(t.dueRequest)&&dashDate(t.dueRequest)<today).length;
  const events=Object.fromEntries(days.map(d=>[dashKey(d),[]]));
  const intervals=[],undated=[],conflicts=[];
  tasks.forEach(t=>{
    const d=dashDates(t);
    // Calendar contains dated milestones, not repeated bars on every day.
    const points=[];
    if(d.received)points.push([d.received,'수신']);
    if(d.due)points.push([d.due,'완료요청']);
    if(d.done)points.push([d.done,'종료']);
    points.forEach(([date,label])=>{const key=dashKey(date);if(events[key])events[key].push({task:t,label});});
    if(!d.start&&!d.end){undated.push(t);return;}
    if(d.start&&d.end&&d.end<d.start){conflicts.push(t);return;}
    const start=d.start||d.end,end=d.end||(t.status==='완료'?start:(today>start?today:start));
    if(end<gMonthStart||start>gMonthEnd)return;
    const from=gDays.findIndex(day=>day>=start);let to=gDays.length-1;while(to>0&&gDays[to]>end)to--;
    intervals.push({task:t,start,end,from:Math.max(0,from),to,derived:!d.received&&!!d.created,open:!d.end});
  });
  intervals.sort((a,b)=>a.start-b.start||a.task.title.localeCompare(b.task.title));
  const owners=[...new Set(TASKS.map(t=>t.assignee||'미배정'))].sort();
  const eventHtml=({task:t,label})=>{const sc=statusColor(t.status);return `<button class="dash-event" data-dash-task="${escapeHtml(t.id)}" style="border-left-color:${sc.c}"><b>${label} · ${escapeHtml(t.docNumber||t.type)}</b><span>${escapeHtml(t.title)}</span><span>${escapeHtml(t.assignee||'미배정')} · ${escapeHtml(t.status)}</span></button>`;};

  // ---- 완료율 링 차트 ----
  const donePct = tasks.length ? Math.round(done/tasks.length*100) : 0;
  const ringR = 47, ringC = 2*Math.PI*ringR;
  const ringOffset = ringC * (1 - donePct/100);

  // ---- 담당자별 업무량(미완료) ----
  const workload = owners.map(o=>({
    owner:o,
    count: tasks.filter(t=>(t.assignee||'미배정')===o && t.status!=='완료').length
  })).filter(w=>w.count>0).sort((a,b)=>b.count-a.count);
  const maxWl = Math.max(1, ...workload.map(w=>w.count));

  // ---- 상태 분포 ----
  const statusCounts = STATUS_ORDER.map(s=>({status:s, count: tasks.filter(t=>t.status===s).length}));

  // ---- 최근 등록된 업무 하이라이트 (업무 id에 박힌 생성 시각 기준) ----
  // id는 't'+Date.now()(13자리) 뒤에 엑셀 일괄등록일 때만 임의 문자열(Math.random().toString(36))이 더 붙는다
  // (예: "t178885361897534y26"). 그 임의 문자열이 하필 숫자로 시작하면(...975"34y26") /^t(\d+)/가 그 숫자까지
  // Date.now()의 일부로 잘못 삼켜서, 실제보다 100배 넘게 큰 가짜 미래 시각이 되고 daysAgo가 0으로 clamp되어
  // "오늘 등록"으로 잘못 표시된다. Date.now()는 지금(2286년까지) 항상 13자리이므로 딱 13자리만 취한다.
  function createdAtOf(t){ const m=/^t(\d{13})/.exec(t.id||''); return m? Number(m[1]) : 0; }
  // 등록 시각과 "지금" 사이 흐른 시간(ms)을 24시간으로 그냥 나누면, 어제 23시 59분에 등록된 업무가
  // 오늘 0시 5분에 봤을 때 5분밖에 안 지났다는 이유로 "오늘 등록"으로 잘못 표시된다(달력 날짜가 이미 바뀌었는데도).
  // 그래서 시각은 무시하고 "등록된 날짜"와 "오늘 날짜"의 자정 기준 날짜 차이로 계산한다.
  function startOfDay(ms){ const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
  const recent = tasks.slice().sort((a,b)=> createdAtOf(b)-createdAtOf(a)).slice(0,8)
    .map(t=>{
      const createdAt = createdAtOf(t);
      const daysAgo = createdAt ? Math.max(0, Math.round((startOfDay(now) - startOfDay(createdAt)) / 86400000)) : 0;
      return {t, daysAgo};
    });

  // ---- 타일 상세 (예전 "프로세스 안내"의 "현재 현황"을 여기 토글로 통합) ----
  function tileDetailHtml(){
    if(!dashboardTileOpen) return '';
    if(dashboardTileOpen==='total' || dashboardTileOpen==='active'){
      const statuses = dashboardTileOpen==='total' ? STATUS_ORDER : STATUS_ORDER.filter(s=>s!=='완료');
      const pool = dashboardTileOpen==='total' ? tasks : tasks.filter(t=>t.status!=='완료');
      const byStatus={}; statuses.forEach(s=>byStatus[s]=0); pool.forEach(t=>{ if(byStatus[t.status]!==undefined) byStatus[t.status]++; });
      const byType={}; pool.forEach(t=>{ byType[t.type]=(byType[t.type]||0)+1; });
      return `
        <div class="dash-panel dq-tile-detail">
          <h2>${dashboardTileOpen==='total'? '📋 전체 업무 현황' : '🕗 미완료 업무 현황'} (${pool.length}건)</h2>
          <div class="proc-grid">
            <div class="panel">
              <h3>상태별</h3>
              ${statuses.map(s=>{ const sc=statusColor(s); return `<div class="legend-row"><div class="legend-left"><span class="swatch" style="background:${sc.c}"></span>${s}</div><span class="legend-count">${byStatus[s]||0}건</span></div>`; }).join('')}
            </div>
            <div class="panel">
              <h3>유형별</h3>
              ${Object.keys(TYPE_META).map(ty=>{ const tc=typeColor(ty); return `<div class="legend-row"><div class="legend-left"><span class="swatch" style="background:${tc.c}"></span>${ty}</div><span class="legend-count">${byType[ty]||0}건</span></div>`; }).join('')}
            </div>
          </div>
        </div>`;
    }
    if(dashboardTileOpen==='done'){
      const pool = tasks.filter(t=>t.status==='완료');
      const byType={}; pool.forEach(t=>{ byType[t.type]=(byType[t.type]||0)+1; });
      // 이미 완료된 업무는 담당자를 지정할 필요가 없으므로(시간 낭비), 미배정 상태로 남아있는
      // 완료 업무가 몇 건인지 따로 보여준다 — "배정해야 하나?" 하는 헛수고를 막기 위한 안내.
      const unassignedDone = pool.filter(t=>!t.assignee).length;
      return `
        <div class="dash-panel dq-tile-detail">
          <h2>✅ 완료된 업무 현황 (${pool.length}건)</h2>
          ${unassignedDone ? `<p class="dash-note">이 중 <b>${unassignedDone}건</b>은 담당자가 미배정 상태입니다 — 이미 완료된 업무라 배정할 필요는 없습니다.</p>` : ''}
          ${Object.keys(TYPE_META).map(ty=>{ const tc=typeColor(ty); return `<div class="legend-row"><div class="legend-left"><span class="swatch" style="background:${tc.c}"></span>${ty}</div><span class="legend-count">${byType[ty]||0}건</span></div>`; }).join('')}
        </div>`;
    }
    if(dashboardTileOpen==='overdue'){
      const pool = tasks.filter(t=>t.status!=='완료'&&dashDate(t.dueRequest)&&dashDate(t.dueRequest)<today);
      return `
        <div class="dash-panel dq-tile-detail">
          <h2>⚠️ 완료요청일 경과 업무 (${pool.length}건)</h2>
          <div class="dq-deadline-row">
            ${pool.map(t=>`<button class="dq-deadline-card is-overdue" data-dash-task="${escapeHtml(t.id)}">
              <span class="dq-dl-days">마감 지남</span>
              <span class="dq-dl-title">${escapeHtml(t.title)}</span>
              <span class="dq-dl-meta">${escapeHtml(t.assignee||'미배정')} · ${escapeHtml(t.docNumber||t.type)}</span>
            </button>`).join('') || '<div class="dash-note">해당 업무가 없습니다.</div>'}
          </div>
        </div>`;
    }
    return '';
  }

  // ---- 완료율 링을 누르면 나오는 "더 자세한" 상태별·유형별 분포 (상태 분포 막대그래프는 그대로 항상 보이고, 이건 그 위에 추가로 보여줌) ----
  // "전체 업무" 타일(누르면 상태별·유형별 표)과 내용이 겹친다는 지적이 있어서, 완료율 링은
  // 같은 표를 또 보여주는 대신 다른 관점(최근 4주간 완료 추이)을 보여주도록 바꿈.
  function ringDetailHtml(){
    if(!dashboardStatusChartOpen) return '';
    const thisMonday = dashShift(today, -((today.getDay()+6)%7));
    const weeks = Array.from({length:4}, (_,i)=>{
      const start = dashShift(thisMonday, -7*(3-i));
      const end = dashShift(start, 6);
      const count = tasks.filter(t=>{
        if(t.status!=='완료') return false;
        const d = dashDate(t.endDate);
        return d && d>=start && d<=end;
      }).length;
      return {start, end, count, isThisWeek: i===3};
    });
    const maxCount = Math.max(1, ...weeks.map(w=>w.count));
    return `
      <div class="dash-panel dq-tile-detail">
        <h2>📈 최근 4주 완료 추이 <span class="muted-cell" style="font-weight:400; font-size:11.5px;">(완료율 눌러서 접기)</span></h2>
        <p class="dash-note">완료일(종료일) 기준, 주(월요일~일요일)별로 완료 처리된 업무 건수입니다.</p>
        <div class="dq-workload">
          ${weeks.map(w=>{
            const pct = Math.round(w.count/maxCount*100);
            const label = w.isThisWeek ? '이번 주' : `${dashKey(w.start)} ~ ${dashKey(w.end)}`;
            return `<div class="dq-wl-row" style="cursor:default;">
              <span class="dq-wl-name">${label}</span>
              <div class="dq-wl-bar-track"><div class="dq-wl-bar-fill" style="width:${pct}%; background:var(--primary)"></div></div>
              <span class="dq-wl-count">${w.count}</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  el.innerHTML=`
    <div class="dq-hero">
      <button type="button" class="dq-ring-card ${dashboardStatusChartOpen?'is-open':''}" id="dqRingToggle" title="눌러서 최근 4주 완료 추이 보기">
        <div class="dq-ring-wrap">
          <svg class="dq-ring" viewBox="0 0 104 104">
            <circle class="dq-ring-track" cx="52" cy="52" r="${ringR}"></circle>
            <circle class="dq-ring-fill" cx="52" cy="52" r="${ringR}" style="stroke:var(--primary); stroke-dasharray:${ringC}; stroke-dashoffset:${ringOffset}"></circle>
          </svg>
          <div class="dq-ring-label"><strong>${donePct}%</strong><span>완료율</span></div>
        </div>
      </button>
      <div class="dq-tiles">
        <div class="dq-tile ${dashboardTileOpen==='total'?'is-open':''}" data-dash-tile="total"><span class="dq-tile-ico">📋</span><div><strong>${tasks.length}</strong><span>전체 업무</span></div></div>
        <div class="dq-tile ${dashboardTileOpen==='active'?'is-open':''}" data-dash-tile="active"><span class="dq-tile-ico">🕗</span><div><strong>${active}</strong><span>미완료</span></div></div>
        <div class="dq-tile ${dashboardTileOpen==='done'?'is-open':''}" data-dash-tile="done"><span class="dq-tile-ico">✅</span><div><strong>${done}</strong><span>완료</span></div></div>
        <div class="dq-tile dq-tile-warn ${dashboardTileOpen==='overdue'?'is-open':''}" data-dash-tile="overdue"><span class="dq-tile-ico">⚠️</span><div><strong>${overdue}</strong><span>완료요청일 경과</span></div></div>
      </div>
    </div>
    ${tileDetailHtml()}
    ${ringDetailHtml()}

    <div class="dash-panel dq-deadline-panel">
      <h2>🆕 최근 등록된 업무</h2>
      <p class="dash-note">최근 등록 순입니다. 완료요청일이 지난 건은 빨간색으로 함께 표시됩니다. 클릭하면 상세 정보를 확인할 수 있습니다.</p>
      <div class="dq-deadline-row">
        ${recent.map(({t,daysAgo})=>{
          const urgent = dueUrgency(t)==='overdue';
          return `<button class="dq-deadline-card ${urgent?'is-overdue':''}" data-dash-task="${escapeHtml(t.id)}">
            <span class="dq-dl-days">${daysAgo===0? '오늘 등록' : `${daysAgo}일 전 등록`}${urgent? ' · 마감 지남' : ''}</span>
            <span class="dq-dl-title">${escapeHtml(t.title)}</span>
            <span class="dq-dl-meta">${escapeHtml(t.assignee||'미배정')} · ${escapeHtml(t.docNumber||t.type)}</span>
          </button>`;
        }).join('') || '<div class="dash-note">등록된 업무가 없습니다.</div>'}
      </div>
    </div>

    <div class="dash-panel dq-deadline-panel">
      <h2>🔀 최근 EBOM ↔ SAP BOM 비교 내역</h2>
      <p class="dash-note">클릭하면 그 비교 결과를 바로 볼 수 있습니다.</p>
      <div class="dq-deadline-row" id="dashBomHistoryArea"><div class="dash-note">불러오는 중…</div></div>
    </div>

    <div class="dq-grid">
      <div class="dash-panel">
        <h2>👥 담당자별 업무량 (미완료)</h2>
        <div class="dq-workload">
          ${workload.length? workload.map(w=>{
            const u = USERS.find(x=>x.name===w.owner);
            const color = u? u.color : 'var(--muted-2)';
            const pct = Math.round(w.count/maxWl*100);
            return `<button type="button" class="dq-wl-row" data-dash-owner="${escapeHtml(w.owner)}" title="클릭하면 ${escapeHtml(w.owner)}님의 업무 목록을 확인·수정할 수 있습니다">
              <span class="dq-wl-name">${escapeHtml(w.owner)}</span>
              <div class="dq-wl-bar-track"><div class="dq-wl-bar-fill" style="width:${pct}%; background:${color}"></div></div>
              <span class="dq-wl-count">${w.count}</span>
            </button>`;
          }).join('') : '<div class="dash-note">미완료 업무가 없습니다.</div>'}
        </div>
      </div>
      <div class="dash-panel">
        <h2>📊 상태 분포</h2>
        <div class="dq-stack">
          ${statusCounts.filter(s=>s.count>0).map(s=>{
            const sc = statusColor(s.status);
            const pct = tasks.length? (s.count/tasks.length*100) : 0;
            return `<div class="dq-stack-seg" style="width:${pct}%; background:${sc.c}" title="${escapeHtml(s.status)} ${s.count}건"></div>`;
          }).join('')}
        </div>
        <div class="dq-stack-legend">
          ${statusCounts.map(s=>{const sc=statusColor(s.status); return `<span><i style="background:${sc.c}"></i>${s.status} <b>${s.count}</b></span>`;}).join('')}
        </div>
      </div>
    </div>

    <div class="dash-controls">
      <button class="btn btn-ghost" id="dashPrev" aria-label="이전 주">← 이전 주</button><button class="btn btn-ghost" id="dashToday">이번 주</button><button class="btn btn-ghost" id="dashNext" aria-label="다음 주">다음 주 →</button>
      <h2>${dashKey(monday)} — ${dashKey(sunday)}</h2>
      <select class="filt" id="dashOwner" aria-label="대시보드 담당자"><option value="all">전체 담당자</option>${owners.map(o=>`<option value="${escapeHtml(o)}" ${o===dashboardAssignee?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>
    </div>
    <div class="dash-panel"><h2>주간 업무현황 캘린더</h2><p class="dash-note">수신일·완료요청일·종료일 기준입니다. 업무를 클릭하면 상세 정보를 확인할 수 있습니다.</p>
      <div class="dash-scroll"><div class="dash-week">${days.map((d,i)=>`<div class="dash-day ${dashKey(d)===dashKey(today)?'today':''} ${i>4?'weekend':''}"><h3>${['월','화','수','목','금','토','일'][i]} · ${d.getMonth()+1}/${d.getDate()} <span style="font-weight:400">(${events[dashKey(d)].length})</span></h3>${events[dashKey(d)].length?events[dashKey(d)].map(eventHtml).join(''):'<div class="dash-note">등록된 일정 없음</div>'}</div>`).join('')}</div></div>
    </div>
    <div class="dash-panel"><h2>간트 차트 · ${gMonthStart.getFullYear()}년 ${gMonthStart.getMonth()+1}월 · 겹치는 업무 ${intervals.length}건</h2>
      <div class="dash-controls" style="margin-bottom:10px">
        <button class="btn btn-ghost" id="dashGanttPrev" aria-label="이전 달">← 이전 달</button><button class="btn btn-ghost" id="dashGanttToday">이번 달</button><button class="btn btn-ghost" id="dashGanttNext" aria-label="다음 달">다음 달 →</button>
      </div>
      <p class="dash-note">시작: 수신일, 없으면 생성일시(*) · 종료: 완료 업무는 종료일, 그 외는 완료요청일. 종료일정이 없는 미완료 업무는 오늘까지 표시합니다. 시작일이 없으면 종료일정에 한 점으로 표시합니다.</p>
      <div class="dash-legend">${STATUS_ORDER.map(s=>`<span><i style="background:${statusColor(s).c}"></i>${s}</span>`).join('')}</div>
      <div class="dash-scroll"><div class="dash-gantt" style="--gcols:${gDays.length}">
        <div class="dash-gantt-head"><div style="text-align:left">업무 / 담당자 / 기간</div>${gDays.map(d=>`<div${dashKey(d)===dashKey(today)?' style="font-weight:700;color:var(--primary)"':''}>${d.getDate()}</div>`).join('')}</div>
        ${intervals.map(({task:t,start,end,from,to,derived,open})=>{const sc=statusColor(t.status);return `<div class="dash-gantt-row"><button class="dash-task" data-dash-task="${escapeHtml(t.id)}" title="${escapeHtml(t.title)}"><b>${escapeHtml(t.title)}</b><span>${escapeHtml(t.assignee||'미배정')} · ${dashKey(start)}${derived?'*':''} ~ ${dashKey(end)}${open?' (종료 미입력)':''}</span></button><div class="dash-track"><button class="dash-bar" data-dash-task="${escapeHtml(t.id)}" style="grid-column:${from+1}/${to+2};background:${sc.t};color:${sc.c};border-left:3px solid ${sc.c}" title="${escapeHtml(t.title+' · '+t.status)}">${escapeHtml(t.status)}</button></div></div>`;}).join('')}
        ${intervals.length?'':'<div class="dash-empty">선택한 달에 표시할 업무가 없습니다. 다른 달을 선택해 주세요.</div>'}
      </div></div>
      <details style="margin-top:16px"><summary>일정 미등록 ${undated.length}건 · 날짜 확인 필요 ${conflicts.length}건</summary><p class="dash-note">종료가 시작보다 빠른 업무는 간트에서 제외했습니다. 원본 날짜를 확인해 주세요.</p><div class="dash-undated">${[...conflicts,...undated].map(t=>`<button data-dash-task="${escapeHtml(t.id)}">${escapeHtml(t.docNumber||'문서번호 없음')} · ${escapeHtml(t.title)}</button>`).join('')||'<span class="dash-note">해당 업무가 없습니다.</span>'}</div></details>
    </div>`;
  el.querySelectorAll('[data-dash-tile]').forEach(tile=>{
    tile.onclick=()=>{
      dashboardTileOpen = dashboardTileOpen===tile.dataset.dashTile ? null : tile.dataset.dashTile;
      renderDashboard();
    };
  });
  el.querySelector('#dqRingToggle').onclick=()=>{
    dashboardStatusChartOpen = !dashboardStatusChartOpen;
    renderDashboard();
  };
  // 최근 EBOM ↔ SAP BOM 비교 내역 — 공유 저장소에서 비동기로 받아와서 채운다(대시보드 첫 렌더를 막지 않음)
  const bomHistEl = el.querySelector('#dashBomHistoryArea');
  if(bomHistEl){
    fetchBomHistoryForDashboard().then(list=>{
      if(!document.body.contains(bomHistEl)) return; // 그 사이 다른 화면으로 이동했으면 무시
      const top = list.slice(0,5);
      bomHistEl.innerHTML = top.length ? top.map(h=>{
        const ebomLabel = h.ebomRoot || h.ebomName || '(알 수 없음)';
        const sapLabel = h.sapRoot || h.sapName || '(알 수 없음)';
        const c = h.counts || {};
        return `<button type="button" class="dq-deadline-card" data-dash-bom-id="${escapeHtml(h.id)}">
          <span class="dq-dl-days">${mesRelativeTime(h.ts)}</span>
          <span class="dq-dl-title">${escapeHtml(ebomLabel)} ↔ ${escapeHtml(sapLabel)}</span>
          <span class="dq-dl-meta">일치 ${c.match||0} · 수량불일치 ${c.qty_mismatch||0}</span>
        </button>`;
      }).join('') : '<div class="dash-note">아직 비교내역이 없습니다.</div>';
      bomHistEl.querySelectorAll('[data-dash-bom-id]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const entry = top.find(h=>h.id===btn.dataset.dashBomId);
          if(entry) openBomHistoryFromDashboard(entry);
        });
      });
    });
  }
  el.querySelector('#dashPrev').onclick=()=>{dashboardWeekOffset--;renderDashboard();};
  el.querySelector('#dashNext').onclick=()=>{dashboardWeekOffset++;renderDashboard();};
  el.querySelector('#dashToday').onclick=()=>{dashboardWeekOffset=0;renderDashboard();};
  el.querySelector('#dashOwner').onchange=e=>{dashboardAssignee=e.target.value;renderDashboard();};
  el.querySelector('#dashGanttPrev').onclick=()=>{dashboardGanttMonthOffset--;renderDashboard();};
  el.querySelector('#dashGanttNext').onclick=()=>{dashboardGanttMonthOffset++;renderDashboard();};
  el.querySelector('#dashGanttToday').onclick=()=>{dashboardGanttMonthOffset=0;renderDashboard();};
  el.querySelectorAll('[data-dash-task]').forEach(btn=>btn.onclick=()=>openDetail(btn.dataset.dashTask));
  el.querySelectorAll('[data-dash-owner]').forEach(btn=>btn.onclick=()=>goToOwnerList(btn.dataset.dashOwner));
}

/* ================= FILTER HELPERS ================= */
function uniqueValues(key){
  const set = new Set();
  TASKS.forEach(t=>{ if(t[key]) set.add(t[key]); });
  return Array.from(set).sort();
}
// MODEL 입력칸에 붙이는 자동완성 — 한번 골라도 다음에 열면 항상 전체 목록부터 보여줌
function setupModelCombobox(inputEl){
  if(!inputEl || inputEl.dataset.comboReady) return;
  inputEl.dataset.comboReady = '1';
  const wrapper = document.createElement('div');
  wrapper.className = 'combo-wrap';
  inputEl.parentNode.insertBefore(wrapper, inputEl);
  wrapper.appendChild(inputEl);
  const list = document.createElement('div');
  list.className = 'combo-list';
  wrapper.appendChild(list);

  function renderList(filterText){
    const opts = MODELS.filter(m => !filterText || m.toLowerCase().includes(filterText.toLowerCase()));
    if(!opts.length){ list.style.display = 'none'; return; }
    list.innerHTML = opts.map(m=>`<div class="combo-opt" data-val="${escapeHtml(m)}">${escapeHtml(m)}</div>`).join('');
    list.style.display = 'block';
    list.querySelectorAll('.combo-opt').forEach(opt=>{
      opt.addEventListener('mousedown', (e)=>{
        e.preventDefault();
        inputEl.value = opt.dataset.val;
        inputEl.dispatchEvent(new Event('input', {bubbles:true}));
        inputEl.dispatchEvent(new Event('change', {bubbles:true}));
        list.style.display = 'none'; // 우리 자신의 input 리스너가 재오픈시킨 뒤 최종적으로 닫음
      });
    });
  }
  inputEl.addEventListener('focus', ()=> renderList(''));
  inputEl.addEventListener('click', ()=> renderList(''));
  inputEl.addEventListener('input', ()=> renderList(inputEl.value));
  document.addEventListener('click', (e)=>{ if(!wrapper.contains(e.target)) list.style.display = 'none'; });
}
function filteredTasks(){
  const q = filter.q.trim().toLowerCase();
  return TASKS.filter(t=>{
    if(filter.model!=='all' && t.model!==filter.model) return false;
    if(filter.type!=='all' && t.type!==filter.type) return false;
    if(filter.assignee!=='all' && (t.assignee||'미배정')!==filter.assignee) return false;
    if(filter.status!=='all' && t.status!==filter.status) return false;
    if(filter.myOnly){
      const u = currentUser();
      if(!u || t.assignee !== u.name) return false;
    }
    if(q && !(t.title.toLowerCase().includes(q) || (t.docNumber||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

let delayCollapsed = true;
let boardCardMode = 'detail'; // 'detail' | 'summary' — 상태별 보드 카드를 상세히 보여줄지, 1/3 크기 요약으로 보여줄지
function renderBoard(){
  const el = document.getElementById('view-board');
  // 렌더링할 때마다 컬럼 DOM을 새로 만들기 때문에, 다시 그리기 전에 각 컬럼(및 장기 지연 서브리스트)의
  // 스크롤 위치를 상태값 기준으로 기억해뒀다가 새로 그린 뒤 그대로 복원한다.
  const scrollMemo = {};
  el.querySelectorAll('.col-body, .delay-sublist').forEach(z=>{
    if(z.dataset.status) scrollMemo[z.dataset.status] = z.scrollTop;
  });
  const wrap = document.createElement('div');
  renderToolbar(wrap);
  wrap.insertAdjacentHTML('beforeend', `
    <div class="board-viewmode">
      <button type="button" class="btn-toggle ${boardCardMode==='detail'?'active':''}" data-mode="detail">상세</button>
      <button type="button" class="btn-toggle ${boardCardMode==='summary'?'active':''}" data-mode="summary">요약</button>
    </div>
  `);

  const list = filteredTasks();
  // 컬럼 헤더 아래 진행 바(전체 중 이 컬럼 비중)를 보여주기 위한 기준값
  const totalForBar = Math.max(1, list.length);
  const cols = BOARD_COLUMNS.map(status=>{
    const items = list.filter(t=>t.status===status);
    const sc = statusColor(status);
    const barPct = Math.round(items.length / totalForBar * 100);
    let extra = '';
    if(status === '진행 대기'){
      const delayItems = list.filter(t=>t.status==='장기 지연');
      const dsc = statusColor('장기 지연');
      extra = `
        <div class="delay-subsection ${delayCollapsed?'collapsed':''}">
          <button class="delay-subhead" id="delayToggle">
            <span class="chev">▾</span>
            <span class="dot" style="background:${dsc.c}"></span>
            <span class="name">장기 지연</span>
            <span class="cnt">${delayItems.length}</span>
          </button>
          <div class="delay-sublist" data-status="장기 지연">
            ${delayItems.length? delayItems.map(t=>cardHtml(t)).join('') : `<div class="empty-col">아직 없습니다</div>`}
          </div>
        </div>
      `;
    }
    return `
      <div class="col" style="--col-tint:${sc.t}; --col-accent:${sc.c}">
        <div class="col-head"><span class="dot" style="background:${sc.c}"></span><span class="name">${status}</span><span class="cnt">${items.length}</span></div>
        <div class="col-progress"><div class="col-progress-fill" style="width:${barPct}%; background:${sc.c}"></div></div>
        <div class="col-body" data-status="${status}">
          ${items.length? items.map(t=>cardHtml(t)).join('') : `<div class="empty-col">여기로 카드를 끌어와 놓을 수 있습니다</div>`}
          ${extra}
        </div>
      </div>
    `;
  }).join('');

  wrap.insertAdjacentHTML('beforeend', `<div class="board ${boardCardMode==='summary'?'board-summary':''}">${cols}</div>`);
  el.innerHTML = '';
  el.appendChild(wrap);
  wrap.querySelectorAll('.board-viewmode button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      boardCardMode = btn.dataset.mode;
      renderBoard();
    });
  });
  el.querySelectorAll('.col-body, .delay-sublist').forEach(z=>{
    if(z.dataset.status && scrollMemo[z.dataset.status] != null) z.scrollTop = scrollMemo[z.dataset.status];
  });
  el.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> openDetail(c.dataset.id));
  });
  el.querySelectorAll('.advance-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      advanceStatus(btn.dataset.advanceId);
    });
  });
  const delayToggle = el.querySelector('#delayToggle');
  if(delayToggle) delayToggle.addEventListener('click', ()=>{
    delayCollapsed = !delayCollapsed;
    renderBoard();
  });

  // ---- 드래그 앤 드롭으로 카드를 다른 상태 컬럼에 끌어다 놓기 ----
  let dragId = null;
  el.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('dragstart', (e)=>{
      dragId = c.dataset.id;
      c.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', c.dataset.id); }catch(err){}
    });
    c.addEventListener('dragend', ()=>{
      c.classList.remove('dragging');
      el.querySelectorAll('.drag-over').forEach(z=>z.classList.remove('drag-over'));
      dragId = null;
    });
  });
  // delay-sublist가 col-body 안에 중첩돼 있으므로, 이벤트 버블링으로 두 핸들러가 같이 실행되는 걸 막기 위해 stopPropagation
  el.querySelectorAll('.col-body, .delay-sublist').forEach(zone=>{
    zone.addEventListener('dragover', (e)=>{
      if(!dragId) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      el.querySelectorAll('.drag-over').forEach(z=>{ if(z!==zone) z.classList.remove('drag-over'); });
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      zone.classList.remove('drag-over');
      const id = dragId || e.dataTransfer.getData('text/plain');
      const targetStatus = zone.dataset.status;
      if(id && targetStatus) moveTaskToStatus(id, targetStatus);
      dragId = null;
    });
  });
}
// 업무 id에 박힌 생성 시각(예: "t1788928280512")으로 등록된 지 24시간 안 됐는지 판단한다
// (대시보드의 "오늘 등록" 하이라이트와 같은 방식) — 엑셀로 과거 이력을 불러온 업무처럼 이 형식이
// 아닌 id는 0시로 취급되어 자연히 "새 업무" 대상에서 빠진다.
function taskCreatedAtMs(t){ const m=/^t(\d+)/.exec(t.id||''); return m? Number(m[1]) : 0; }
function isNewTask(t){ return (Date.now() - taskCreatedAtMs(t)) < 86400000; }
function cardHtml(t){
  const tc = typeColor(t.type);
  const author = resolveAuthor(t);
  const urgency = dueUrgency(t);
  const next = nextStatusOf(t.status);
  const assigneeUser = t.assignee ? USERS.find(u=>u.name===t.assignee) : null;
  const checklist = checklistFor(t.type, t);
  const doneCt = checklist.filter(i=>t.actionItems[i.key]).length;
  const ringPct = checklist.length? Math.round(doneCt/checklist.length*100) : 0;
  const isSummary = boardCardMode === 'summary';
  return `
    <div class="card ${urgency? 'card-'+urgency : ''} ${isSummary?'card-summary':''}" data-id="${t.id}" draggable="true" style="--card-accent:${tc.c}">
      <div class="badges">
        ${isNewTask(t)? '<span class="k-new-badge">NEW</span>' : ''}
        <span class="k-tag" style="background:${tc.t}; color:${tc.c}">${t.type}</span>
        ${(!isSummary && t.model)? `<span class="k-tag" style="background:var(--border-soft); color:var(--muted)">${escapeHtml(t.model)}</span>` : ''}
        ${dueBadgeHtml(t)}
        ${!isSummary ? unreadBadgeHtml(t) : ''}
        ${(!isSummary && checklist.length)? `<span class="k-ring" style="--pct:${ringPct}" title="액션 아이템 ${doneCt}/${checklist.length} 완료">${doneCt}/${checklist.length}</span>` : ''}
      </div>
      <div class="title">${escapeHtml(t.title)}</div>
      <div class="meta">
        <span class="doc">${taskLinkHtml(t)}</span>
        <span class="k-assignee">${assigneeUser? avatarHtml(assigneeUser,17) : ''}${t.assignee? escapeHtml(t.assignee): '미배정'}</span>
      </div>
      ${(!isSummary && author) ? `
      <div class="card-author">
        ${avatarHtml(author,16)}<span style="color:${author.color}; font-weight:600;">${escapeHtml(author.name)}</span><span class="muted-cell">작성</span>
      </div>` : ''}
      ${(!isSummary && next) ? `
      <button class="advance-btn" data-advance-id="${t.id}" title="다음 단계로: ${next}">
        다음 단계 → <b>${next}</b>
      </button>` : ''}
    </div>
  `;
}

function renderList(){

  const done = list.filter(t=>t.status==='완료').length;
  const delay = list.filter(t=>t.status==='장기 지연').length;
  stripEl.innerHTML = `
    <div class="stat-strip">
      <div class="stat-chip">표시 중 <b>${list.length}</b>건</div>
      <div class="stat-chip">완료 <b>${done}</b>건</div>
      <div class="stat-chip">장기 지연 <b>${delay}</b>건</div>
    </div>
  `;
  wrap.appendChild(stripEl);

  if(list.length===0){
    wrap.insertAdjacentHTML('beforeend', `<div class="no-result">조건에 맞는 업무를 찾지 못했습니다. 검색어나 필터를 조정해 보세요.</div>`);
    el.innerHTML = ''; el.appendChild(wrap); return;
  }

  const groups = {};
  list.forEach(t=>{ (groups[t.model] = groups[t.model]||[]).push(t); });
  const groupNames = Object.keys(groups).sort((a,b)=> groups[b].length - groups[a].length);

  const sortedItems = sortListItems(list.slice());
  // 그룹(MODEL)별로 나눠 보여주되, 각 그룹 안의 순서는 정렬 결과(sortedItems)의 순서를 그대로 따른다.
  const groupsHtml = groupNames.map(name=>{
    const nameSet = new Set(groups[name].map(t=>t.id));
    const items = sortedItems.filter(t=> nameSet.has(t.id));
    const collapsed = collapsedGroups[name];
    return `
      <div class="group ${collapsed?'collapsed':''}" data-group="${escapeHtml(name)}">
        <div class="group-head">
          <span class="chev">▾</span>
          <span class="gname">${escapeHtml(name)}</span>
          <span class="gcount">${items.length}건</span>
        </div>
        <table>
          <thead><tr>
            ${listSortHeaderHtml('type', '유형', 'width:56px')}
            ${listSortHeaderHtml('title', '프로젝트 이름', '')}
            <th class="mono" style="width:110px">문서번호</th>
            ${listSortHeaderHtml('assignee', '담당자', 'width:120px')}
            <th style="width:44px" title="등록한 사람">작성</th>
            ${listSortHeaderHtml('due', '완료요청일', 'width:96px', 'mono')}
            ${listSortHeaderHtml('status', '상태', 'width:104px')}
          </tr></thead>
          <tbody>
            ${items.map(t=>{
              const tc = typeColor(t.type); const sc = statusColor(t.status);
              const author = resolveAuthor(t);
              const sameAsAssignee = author && t.assignee && t.assignee === author.name;
              const urgency = dueUrgency(t);
              const dueColor = urgency==='overdue' ? 'var(--s-delay)' : (urgency==='soon' ? 'var(--accent)' : null);
              return `
                <tr data-id="${t.id}">
                  <td><span class="tag" style="background:${tc.t}; color:${tc.c}">${t.type}</span></td>
                  <td class="td-title">${escapeHtml(t.title)}</td>
                  <td class="mono muted-cell">${taskLinkHtml(t)} ${unreadBadgeHtml(t)}</td>
                  <td>${t.assignee
                      ? `<span class="assignee-badge"><span class="avatar">${initials(t.assignee)}</span>${escapeHtml(t.assignee)}</span>`
                      : (t.status==='완료'
                          ? `<span class="muted-cell" title="이미 완료된 업무라 담당자를 지정할 필요가 없습니다.">완료됨 · 배정 불필요</span>`
                          : quickAssignSelectHtml(t))}</td>
                  <td>${author
                      ? (sameAsAssignee
                          ? `<span class="same-author-dot" style="background:${author.color}" title="담당자 본인이 작성"></span>`

                  <td><span class="status-pill" style="background:${sc.t}; color:${sc.c}"><span class="d" style="background:${sc.c}"></span>${t.status}</span></td>

  el.querySelectorAll('th.sortable').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.sortKey;
      if(listSort.key === key) listSort.dir = (listSort.dir === 'asc' ? 'desc' : 'asc');
      else listSort = {key, dir:'asc'};

    });
  });
  el.querySelectorAll('tbody tr').forEach(r=>{
    r.addEventListener('click', ()=> openDetail(r.dataset.id));
  });
  el.querySelectorAll('select.quick-assign').forEach(sel=>{
    sel.addEventListener('click', e=> e.stopPropagation());
    sel.addEventListener('change', async ()=>{

// 전체 목록 컬럼 헤더 — 클릭하면 그 컬럼으로 정렬(같은 컬럼 재클릭 시 방향 반전)
function listSortHeaderHtml(key, label, styleExtra, extraClass){
  const active = listSort.key === key;
  const arrow = active ? (listSort.dir==='asc' ? ' ▲' : ' ▼') : '';
  const cls = ['sortable', extraClass, active?'sort-active':''].filter(Boolean).join(' ');
  return `<th class="${cls}" style="${styleExtra||''}" data-sort-key="${key}" title="클릭하여 정렬">${label}${arrow}</th>`;
}
function sortListItems(items){
  const dir = listSort.dir === 'desc' ? -1 : 1;
  const key = listSort.key;
  function val(t){
    switch(key){
      case 'type': return t.type||'';
      case 'title': return t.title||'';
      case 'assignee': return t.assignee||''; // 미배정을 항상 앞쪽에 두기 위해 빈 문자열 유지
      case 'status': return STATUS_ORDER.indexOf(t.status);
      case 'due': default: return t.dueRequest||'';
    }
  }
  items.sort((a,b)=>{
    const va = val(a), vb = val(b);
    if(va < vb) return -1*dir;
    if(va > vb) return 1*dir;
    return (a.title||'').localeCompare(b.title||'');
  });
  return items;
}
// 미배정 업무를 목록에서 바로 지정할 수 있게 하는 인라인 담당자 선택 — 모달을 열지 않아도 됨
function quickAssignSelectHtml(t){
  return `<select class="quick-assign" data-id="${t.id}" aria-label="담당자 빠른 지정">${assigneeOptions('')}</select>`;
}
async function quickAssignTask(id, name){
  const t = TASKS.find(x=>x.id===id);
  if(!t) return;
  t.assignee = name || '';
  await persist();
  if(name) await logActivity('update', `"<b>${escapeHtml(t.title)}</b>" 담당자가 <b>${escapeHtml(name)}</b>(으)로 지정되었습니다.`, t.id);
  renderCurrent();
}

/* ================= 업데이트 알림(활동 로그) ================= */
const ACTIVITY_KEY = 'ppe_activity_log';       // 공유 — 모든 팀원이 같은 알림을 봄
const NOTIF_SEEN_KEY = 'ppe_notif_last_seen';  // 개인별 — 내가 마지막으로 알림함을 연 시각
const ACTIVITY_MAX = 200;
let ACTIVITY_LOG = [];
let notifLastSeen = 0;

async function loadActivity(){
  try{
    const res = await window.storage.get(ACTIVITY_KEY, true);
    if(res && res.value) ACTIVITY_LOG = JSON.parse(res.value);
  }catch(e){ ACTIVITY_LOG = []; }
  try{
    const res2 = await window.storage.get(NOTIF_SEEN_KEY+'_'+currentUserId, false);
    if(res2 && res2.value) notifLastSeen = Number(res2.value) || 0;
  }catch(e){ notifLastSeen = 0; }
}
async function persistActivity(){
  try{ await window.storage.set(ACTIVITY_KEY, JSON.stringify(ACTIVITY_LOG), true); }catch(e){boardSync.error=e.message;boardSyncStatus();}
}
async function logActivity(type, message, taskId){
  ACTIVITY_LOG.unshift({ id:'a'+Date.now()+Math.random().toString(36).slice(2,6), ts:Date.now(), type, message, taskId: taskId||null, by: currentUserLabel() });
  if(ACTIVITY_LOG.length > ACTIVITY_MAX) ACTIVITY_LOG.length = ACTIVITY_MAX;
  await persistActivity();
}
function unreadNotifCount(){
  return ACTIVITY_LOG.filter(a=>a.ts > notifLastSeen).length;
}
function renderNotifBadge(){
  const badge = document.getElementById('notifNavBadge');
  if(!badge) return;

  if(n > 0){ badge.textContent = n > 99 ? '99+' : String(n); badge.style.display = ''; }

}
async function markNotifSeen(){

}

      if(itemType==='link') newItem.linkLabel = '열기';
      CHECKLISTS[type].push(newItem);
      await persistChecklists();
      renderChecklistSettings();
    });
  });
}

function renderNotifications(){

  }
  const types = [...new Set(ACTIVITY_LOG.map(a=>a.type))];
  const byList = [...new Set(ACTIVITY_LOG.map(a=>a.by).filter(Boolean))];
  const filtered = ACTIVITY_LOG.filter(a=>

  );
  const filterBarHtml = `

        <div class="notif-msg">${escapeHtml(a.message||'').replace(/&lt;(\/?b)&gt;/g,'<$1>')}</div>

  `).join('') : `<div class="notif-empty">필터에 해당하는 로그가 없습니다.</div>`;
  el.innerHTML = filterBarHtml + `<div class="notif-list">${listHtml}</div>`;
  const typeSel = document.getElementById('notifFilterType');
  const bySel = document.getElementById('notifFilterBy');
  if(typeSel) typeSel.addEventListener('change', ()=>{ notifFilter.type = typeSel.value; renderNotifications(); });
  if(bySel) bySel.addEventListener('change', ()=>{ notifFilter.by = bySel.value; renderNotifications(); });
  el.querySelectorAll('.notif-item').forEach(item=>{
    const taskId = item.dataset.taskId;
    if(!taskId) { item.style.cursor = 'default'; return; }
    item.addEventListener('click', ()=> goToTask(taskId));

  try{ await window.storage.set(ANNOUNCE_SEEN_KEY+'_'+currentUserId, String(announceLastSeen), false); }catch(e){}
}
function renderAnnouncements(){
  const el = document.getElementById('view-announce');
  markAnnounceSeen().then(renderAnnounceBadge);
  const listHtml = FEATURE_UPDATES.length ? FEATURE_UPDATES.map(a=>`
    <div class="announce-item">
      <div class="announce-head">
        <span class="announce-title">📢 ${escapeHtml(a.title)}</span>
      </div>
      <div class="announce-body">${escapeHtml(a.body||'').replace(/\n/g,'<br>')}</div>
      <div class="announce-meta">${new Date(a.ts).toLocaleDateString('ko-KR')}</div>
    </div>
  `).join('') : `<div class="notif-empty">아직 기록된 업데이트가 없습니다.</div>`;
  el.innerHTML = `
    <p class="dash-note" style="margin-bottom:14px;">이 화면은 새 기능이 추가되거나 버그가 고쳐질 때마다 자동으로 정리되는 읽기 전용 피드입니다.</p>
    <div class="announce-list">${listHtml}</div>
  `;
}
// 대시보드 "담당자별 업무량"에서 이름을 클릭하면, 그 담당자(미배정 포함) 업무만 걸러서
// 전체 목록으로 이동한다 — 목록에서는 이미 클릭 → 상세 모달 → 수정이 전부 되므로 그대로 재사용.
function goToOwnerList(owner){
  currentView = 'list';
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view==='list'));
  filter = {q:'', model:'all', type:'all', assignee:owner, status:'all', myOnly:false};
  try{ window.storage.set(MY_ONLY_KEY, '0', false); }catch(e){}
  renderCurrent();
}
function goToTask(taskId){
  const t = TASKS.find(x=>x.id===taskId);
  if(!t){ alert('해당 업무를 찾을 수 없습니다 (삭제되었을 수 있습니다).'); return; }
  currentView = 'list';
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view==='list'));
  // 담당자/상태/MODEL/"내 담당 건만" 필터가 켜져 있으면 이동해도 그 업무가 목록에서 걸러져 버리므로
  // (모달을 닫는 순간 빈 목록만 남았다) 알림에서 이동할 때는 필터를 함께 해제한다.
  filter = {q: t.docNumber || t.title, model:'all', type:'all', assignee:'all', status:'all', myOnly:false};
  try{ window.storage.set(MY_ONLY_KEY, '0', false); }catch(e){}
  renderCurrent();
  openDetail(t.id);
}

const LAST_VIEWED_KEY = 'ppe_last_viewed';
let LAST_VIEWED = {};
async function loadLastViewed(){
  try{
    const res = await window.storage.get(LAST_VIEWED_KEY, false);
    if(res && res.value) LAST_VIEWED = JSON.parse(res.value);
  }catch(e){ LAST_VIEWED = {}; }
}
async function markViewed(taskId){
  LAST_VIEWED[taskId] = Date.now();
  try{ await window.storage.set(LAST_VIEWED_KEY, JSON.stringify(LAST_VIEWED), false); }catch(e){}
}
function unreadCommentCount(t){
  if(!t.comments || !t.comments.length) return 0;
  const last = LAST_VIEWED[t.id] || 0;
  return t.comments.filter(c => c.ts > last).length;
}
function unreadBadgeHtml(t){
  const n = unreadCommentCount(t);
  if(!n) return '';
  return `<span class="unread-badge">💬 안읽음 ${n}</span>`;
}

      <h2><textarea id="fTitle" class="modal-title-input" rows="1" aria-label="업무 제목 (클릭해서 수정, Enter로 저장)" title="클릭해서 제목을 수정할 수 있습니다 (Enter로 저장)">${escapeHtml(t.title)}</textarea></h2>
      ${(()=>{ const a = resolveAuthor(t); return a ? `<div style="display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11.5px; color:var(--muted);">작성자: ${avatarHtml(a,16)} <span style="color:${a.color}; font-weight:600;">${escapeHtml(a.name)}</span></div>` : ''; })()}

    <div class="modal-body">
      <div class="field-row">

        <div class="field">

        </div>
        <div class="field">

          <div class="date-picker-field">

        <div class="field">
          <label>완료일 ${t.status==='완료' && !t.endDate? '<span class="muted-cell" style="font-weight:400;">(완료 처리 시 자동 입력)</span>' : ''}</label>
          <div class="date-picker-field">

          </div>
        </div>
      </div>

      <div class="field">
        <label>비고</label>
        <div class="note" id="fNote" contenteditable="true" data-placeholder="배경, 진행 메모 등을 남겨보세요. 링크나 이미지를 붙여넣을 수 있습니다.">${noteToHtml(t.note)}</div>
      </div>

      ${t.sourcePageId ? `
      <div class="field-row">
        <div class="field"><label>생성일시</label><div class="val">${escapeHtml(t.sourceCreatedAt || '—')}</div></div>
        <div class="field"><label>최종수정일시</label><div class="val">${escapeHtml(t.sourceUpdatedAt || '—')}</div></div>

      </details>` : ''}
      <div class="field-row">
        <div class="field"><label>품번 (요청 메일에 사용)</label><input type="text" id="fPartNumber" value="${escapeHtml(t.partNumber||'')}" placeholder="여러 품번은 쉼표로 구분"></div>
        <div class="field"><label>업무 링크</label><input type="url" id="fLink" value="${escapeHtml(t.link||'')}" placeholder="https://..."><div id="taskLinkPreview">${taskLinkHtml(t)}</div></div>
      </div>
      <div class="field">
        <label>관련 선적용 문서번호 (ECR/E00, 선택)</label>
        <input type="text" id="fPreApplied" value="${escapeHtml(t.preAppliedDocNo||'')}" placeholder="예: ECR-2026-0912 / E00-2609-003">
        <div id="preAppliedPanel"></div>
      </div>
      <div class="section-title">ECN STEP 1</div>
      <div class="radio-row">
        <label class="radio-opt"><input type="radio" name="ecn" value="assigned" ${t.ecnStep==='assigned'?'checked':''}> 업무 할당</label>
        <label class="radio-opt"><input type="radio" name="ecn" value="na" ${t.ecnStep==='na'?'checked':''}> 해당 없음</label>

      <div class="section-title">액션 아이템 <span class="muted-cell" style="font-weight:400;">(${escapeHtml(t.type)} 업무유형 기준)</span></div>

      <div class="section-title">코멘트</div>
      <div class="comments-list" id="commentsList">
        ${(t.comments && t.comments.length) ? t.comments.map(c=>{

          const key = t.id + ':' + c.ts;
          const isMine = c.authorId === currentUserId;
          const canDelete = isMine || !!(currentUser() && currentUser().isAdmin);
          if(editingCommentKey === key){
            return `

              <div class="c-head"><div class="c-time-wrap">${a? avatarHtml(a,16):''}<span class="c-author" style="${a? `color:${a.color}`:''}">${a? escapeHtml(a.name): '알 수 없음'}</span><span class="c-time">${new Date(c.ts).toLocaleString('ko-KR')}</span></div></div>
