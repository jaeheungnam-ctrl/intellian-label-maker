const FB_SUPERADMINS = ['jaeheung.nam@intelliantech.com']; // 데이터 이전 등 관리 작업을 할 수 있는 계정(보안 규칙과 같게 유지)
const FB_BOARD_ACTIONS = new Set(['boardPing','boardRevision','boardPresence','boardGetTasks','boardGetConfig','boardGetActivity','boardUpsertTask','boardDeleteTask','boardAppendActivity','boardSaveConfig']);
const FB = (()=>{
  const q = new URLSearchParams(location.search);
  const devRun = (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && q.get('fbdev')) || '';
  const wanted = q.get('fb')==='1' ? true : q.get('fb')==='0' ? false : (devRun ? true : FB_DEFAULT_ON);
  return { wanted, on:false, dev:!!devRun, base: devRun ? 'devtest/'+devRun : 'boards/main', devEmail:(q.get('as')||'').toLowerCase(),
    mirrorSheets: FB_DEFAULT_ON && !devRun, db:null, rtdb:null, user:null, mirror:null, rev:0, presence:[],
    config:{users:[], models:[], checklists:{}}, tasksSynced:false, configSynced:0, fsOnline:false, listenErr:null, attached:false, unsub:[] };
})();
function fbLoadScript_(src){ return new Promise((res, rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(Error('load '+src)); document.head.appendChild(s); }); }
async function fbInit_(){
  if(!FB.wanted) return;
  try{
    const base = `https://www.gstatic.com/firebasejs/${FB_SDK_VER}/`;
    await fbLoadScript_(base+'firebase-app-compat.js');
    await Promise.all(['firebase-auth-compat.js','firebase-firestore-compat.js','firebase-database-compat.js'].map(f=>fbLoadScript_(base+f)));
    firebase.initializeApp(FB_CONFIG);
    FB.db = firebase.firestore();
    // 회사 VPN·프록시가 실시간 연결 방식을 막는 경우를 대비해, 막히면 일반 요청 방식으로 자동 전환
    FB.db.settings({ignoreUndefinedProperties:true, experimentalAutoDetectLongPolling:true, merge:true});
    FB.rtdb = firebase.database();
    FB.on = true;
  }catch(e){
    console.error('[Firebase 불러오기 실패 — 예전 방식으로 동작]', e);
    FB.on = false; return;
  }
  FB.rtdb.ref('.info/connected').on('value', s=>{
    if(s.val()){ fbPresenceLast = ''; if(typeof sendPresenceNow_==='function') sendPresenceNow_(); } // 다시 연결되면 내 접속 표시를 다시 올림
  });
  if(FB.dev){ FB.user = {email: FB.devEmail || 'dev@'+FB_ALLOWED_DOMAIN}; return; }
  await new Promise(res=>{
    let first = true;
    firebase.auth().onAuthStateChanged(u=>{
      if(u && !(u.email||'').toLowerCase().endsWith('@'+FB_ALLOWED_DOMAIN)){
        firebase.auth().signOut(); u = null;
        alert(`회사 구글 계정(@${FB_ALLOWED_DOMAIN})으로만 로그인할 수 있습니다.`);
      }
      FB.user = u;
      if(first){ first = false; res(); }
    });
  });
}
async function fbSignIn_(){
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({hd:FB_ALLOWED_DOMAIN, prompt:'select_account'});
  try{ await firebase.auth().signInWithPopup(p); location.reload(); }
  catch(e){ if(!/popup-closed|cancelled-popup/.test(e.code||'')) alert('로그인하지 못했습니다: '+(e.message||e)); }
}
async function fbSignOut_(){ try{ await firebase.auth().signOut(); }catch(e){} location.reload(); }
const fbCol_ = name => FB.db.collection(FB.base+'/'+name);
const fbTs_ = ()=>firebase.firestore.FieldValue.serverTimestamp();
const fbNewRev_ = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function fbStripMeta_(d){ const t = {...d}; ['_rev','updatedAt','updatedBy','deleted','seq','createdAt'].forEach(k=>delete t[k]); return t; }

// ---- 이 PC에 두는 서버 사본(바뀐 것만 받아오기 위한 기준) ----
function fbMirrorKey_(){ return 'fb_mirror_v1:'+FB.base; }
function fbLoadMirror_(){
  try{ FB.mirror = JSON.parse(localStorage.getItem(fbMirrorKey_())||'null'); }catch(e){ FB.mirror = null; }
  if(!FB.mirror || FB.mirror.v!==1) FB.mirror = {v:1, tasks:{}, seq:{}, taskSync:0, acts:[], actSync:0};
}
let fbSaveTimer = null;
function fbSaveMirror_(){ clearTimeout(fbSaveTimer); fbSaveTimer = setTimeout(()=>{ try{ localStorage.setItem(fbMirrorKey_(), JSON.stringify(FB.mirror)); }catch(e){} }, 400); }
function fbTaskList_(){ return Object.values(FB.mirror.tasks).sort((a,b)=>(FB.mirror.seq[a.id]||0)-(FB.mirror.seq[b.id]||0)); }

// 실시간 구독: 업무는 "마지막으로 받은 시점 이후 바뀐 것"만, 팀원·설정은 전부(작음), 활동 로그는 처음에 최근 500건 후 새것만.
function fbAttach_(){
  if(FB.attached) return;
  FB.attached = true; FB.listenErr = null; FB.tasksSynced = false; FB.configSynced = 0;
  fbLoadMirror_();
  const onErr = what => err=>{ console.error('[Firebase 구독 오류]', what, err); FB.listenErr = err; FB.fsOnline = false; fbDetach_(); };
  const since = firebase.firestore.Timestamp.fromMillis(Math.max(0, FB.mirror.taskSync - 2000));
  FB.unsub.push(fbCol_('tasks').where('updatedAt','>=',since).onSnapshot({includeMetadataChanges:true}, snap=>{
    FB.fsOnline = !snap.metadata.fromCache;
    let changed = false;
    snap.docChanges({includeMetadataChanges:true}).forEach(ch=>{
      if(ch.doc.metadata.hasPendingWrites) return;
      const d = ch.doc.data(), id = ch.doc.id;
      const ms = d.updatedAt && d.updatedAt.toMillis ? d.updatedAt.toMillis() : 0;
      if(ms > FB.mirror.taskSync) FB.mirror.taskSync = ms;
      if(ch.type==='removed' && !d.deleted) return; // 조회 범위를 벗어난 것일 뿐(삭제 아님)
      if(d.deleted){ delete FB.mirror.tasks[id]; delete FB.mirror.seq[id]; }
      else { const t = fbStripMeta_(d); t.id = id; t._updatedAt = d._rev||''; t._updatedBy = d.updatedBy||''; FB.mirror.tasks[id] = t; FB.mirror.seq[id] = d.seq||0; }
      changed = true;
    });
    if(!snap.metadata.fromCache) FB.tasksSynced = true;
    if(changed){ FB.rev++; fbSaveMirror_(); fbKick_(); }
  }, onErr('tasks')));
  const cfgDone = bit=>{ FB.configSynced |= bit; };
  FB.unsub.push(fbCol_('users').onSnapshot(snap=>{
    FB.config.users = snap.docs.map(d=>({...d.data(), id:d.id})).sort((a,b)=>(a.order||0)-(b.order||0)).map(u=>{ const x={...u}; delete x.order; return x; });
    cfgDone(1); fbConfigChanged_();
  }, onErr('users')));
  FB.unsub.push(fbCol_('config').onSnapshot(snap=>{
    snap.docs.forEach(d=>{ if(d.id==='models') FB.config.models = d.data().list||[]; if(d.id==='checklists') FB.config.checklists = d.data().map||{}; });
    cfgDone(2); fbConfigChanged_();
  }, onErr('config')));
  fbAttachActivity_(onErr('activity'));
  FB.rtdb.ref(FB.base+'/presence').on('value', s=>{
    FB.presence = Object.values(s.val()||{});
    if(typeof handlePresenceResponse_==='function' && typeof PRESENCE!=='undefined') handlePresenceResponse_({presence:FB.presence});
  }, err=>console.error('[접속 표시 구독 오류]', err));
}
async function fbAttachActivity_(onErr){
  try{
    if(!FB.mirror.actSync){
      const snap = await fbCol_('activity').orderBy('createdAt','desc').limit(500).get();
      FB.mirror.acts = snap.docs.map(d=>fbActFromDoc_(d));
      FB.mirror.actSync = snap.docs.reduce((m,d)=>Math.max(m, d.data().createdAt ? d.data().createdAt.toMillis() : 0), 0);
      fbSaveMirror_();
    }
    const since = firebase.firestore.Timestamp.fromMillis(Math.max(0, FB.mirror.actSync - 2000));
    // includeMetadataChanges: 이 PC가 쓴 로그는 "서버 확인 전"으로 먼저 오고, 확인 후 알림은 이 옵션이 있어야 온다.
    FB.unsub.push(fbCol_('activity').where('createdAt','>=',since).onSnapshot({includeMetadataChanges:true}, snap=>{
      let changed = false;
      snap.docChanges({includeMetadataChanges:true}).forEach(ch=>{
        if(ch.type==='removed' || ch.doc.metadata.hasPendingWrites) return;
        const e = fbActFromDoc_(ch.doc), ms = ch.doc.data().createdAt ? ch.doc.data().createdAt.toMillis() : 0;
        if(ms > FB.mirror.actSync) FB.mirror.actSync = ms;
        if(!FB.mirror.acts.some(a=>a.id===e.id)){ FB.mirror.acts.push(e); changed = true; }
      });
      if(changed){ FB.mirror.acts.sort((a,b)=>(b.ts||0)-(a.ts||0)); FB.mirror.acts = FB.mirror.acts.slice(0,500); fbSaveMirror_(); fbActivityChanged_(); }
    }, onErr));
  }catch(e){ onErr(e); }
}
function fbActFromDoc_(d){ const e = {...d.data()}; delete e.createdAt; if(!e.id) e.id = d.id; return e; }
function fbDetach_(){ FB.unsub.forEach(u=>{ try{ u(); }catch(e){} }); FB.unsub = []; try{ FB.rtdb.ref(FB.base+'/presence').off(); }catch(e){} FB.attached = false; }
let fbKickT = null;
function fbKick_(){ clearTimeout(fbKickT); fbKickT = setTimeout(()=>{ if(boardSync.fetching || boardSync.sending) return fbKick_(); refreshBoardShared(); }, 250); }
// 연결된 뒤 팀원·설정이 바뀌면(다른 사람이 계정 연결·이름 변경 등) 바로 반영
function fbConfigChanged_(){
  if(!boardSync.everConnected || FB.configSynced!==3) return;
  const cfg = boardSync.outboxConfig || {};
  if(!cfg.users) USERS = JSON.parse(JSON.stringify(FB.config.users));
  if(!cfg.models) MODELS = FB.config.models.slice();
  if(!cfg.checklists) CHECKLISTS = JSON.parse(JSON.stringify(FB.config.checklists));
  resolveIdentity_();
  if(!isEditingTaskData_()) renderCurrent();
}
function fbActivityChanged_(){
  if(!boardSync.everConnected) return;
  const unsent = boardSync.outboxActivity.filter(a=>!FB.mirror.acts.some(s=>s.ts===a.ts)).slice().reverse();
  ACTIVITY_LOG = [...unsent, ...FB.mirror.acts];
  try{ localStorage.setItem(boardLocalKey(ACTIVITY_KEY,true), JSON.stringify(ACTIVITY_LOG)); }catch(e){}
  if(typeof renderNotifBadge==='function') renderNotifBadge();
  if(currentView==='notif' && !isEditingTaskData_()) renderCurrent();
}
// 서버에서 처음 한 번 받아올 때까지 기다린다(이미 받았으면 즉시). 구독이 오류로 끊겼으면 다시 붙인다.
function fbWaitReady_(ms=20000){
  if(FB.listenErr){ const e = FB.listenErr; FB.listenErr = null; fbAttach_(); if(/permission-denied|unauthenticated/.test(e.code||'')) return Promise.reject(e); }
  fbAttach_();
  return new Promise((res, rej)=>{
    const t0 = Date.now();
    const tick = ()=>{
      if(FB.tasksSynced && FB.configSynced===3) return res();
      if(FB.listenErr) return rej(FB.listenErr);
      if(Date.now()-t0 > ms){ const e = Error('Firebase에서 응답이 없습니다(네트워크 확인).'); e.network = true; return rej(e); }
      setTimeout(tick, 100);
    };
    tick();
  });
}

// ---- 보드 요청을 Firebase로 처리 ----
async function fbRequest_(action, b){
  try{
    let out;
    switch(action){
      case 'boardPing': out = {ok:true, boardApi:3}; break;
      case 'boardRevision': out = {ok:true, revision:String(FB.rev)}; break;
      case 'boardPresence': fbSetPresence_(b); out = {ok:true, revision:String(FB.rev), presence:FB.presence}; break;
      case 'boardGetTasks': await fbWaitReady_(); out = {ok:true, revision:String(FB.rev), tasks:JSON.parse(JSON.stringify(fbTaskList_()))}; break;
      case 'boardGetConfig': await fbWaitReady_(); out = {ok:true, revision:String(FB.rev), ...JSON.parse(JSON.stringify(FB.config))}; break;
      case 'boardGetActivity': await fbWaitReady_(); out = {ok:true, activity:FB.mirror.acts.slice()}; break;
      case 'boardUpsertTask': out = await fbUpsertTask_(b); break;
      case 'boardDeleteTask': out = await fbDeleteTask_(b); break;
      case 'boardAppendActivity': out = await fbAppendActivity_(b.entry); break;
      case 'boardSaveConfig': out = await fbSaveConfig_(b); break;
    }
    if(boardSync.authBannerOn) setBoardAuthBanner(false);
    return out;
  }catch(e){ throw fbError_(action, e); }
}
function fbError_(action, e){
  if(e && (e.network || e.auth)) return e;
  const code = (e && e.code) || '';
  const err = Error('Firebase: '+((e && e.message) || e));
  err.network = /unavailable|deadline-exceeded|network|offline/i.test(code+' '+err.message);
  err.auth = code==='unauthenticated' || (code==='permission-denied' && !FB.user);
  if(code==='permission-denied' && FB.user) err.message = '권한이 없습니다(GUEST는 조회만 가능): '+err.message;
  if(err.auth) setBoardAuthBanner(true);
  logSyncFailure_(action, err, 0);
  return err;
}
async function fbUpsertTask_(b){
  const task = JSON.parse(JSON.stringify(b.task)); const id = task.id;
  delete task.id; delete task._updatedAt; delete task._updatedBy;
  const ref = fbCol_('tasks').doc(id), rev = fbNewRev_();
  const out = await FB.db.runTransaction(async tx=>{
    const snap = await tx.get(ref);
    const cur = snap.exists ? snap.data() : null;
    // 충돌 감지: 이 수정을 시작할 때 본 서버 판(base)과 지금 서버 판이 다르면 → 병합 절차(Apps Script 방식과 동일)
    if(cur && !cur.deleted && !b.force && b.baseUpdatedAt && String(cur._rev||'')!==String(b.baseUpdatedAt)){
      const st = fbStripMeta_(cur); st.id = id; st._updatedAt = cur._rev||''; st._updatedBy = cur.updatedBy||'';
      return {conflict:st};
    }
    tx.set(ref, Object.assign(task, {_rev:rev, updatedAt:fbTs_(), updatedBy:b.userName||'', deleted:false, seq:(cur && cur.seq!=null) ? cur.seq : Date.now()}));
    return {rev};
  });
  if(out.conflict) return {ok:false, code:'CONFLICT', serverTask:out.conflict};
  fbMirrorToSheets_('boardUpsertTask', {task:b.task, userName:b.userName, force:true});
  return {ok:true, updatedAt:out.rev};
}
async function fbDeleteTask_(b){
  await fbCol_('tasks').doc(b.id).set({deleted:true, _rev:fbNewRev_(), updatedAt:fbTs_(), updatedBy:b.userName||''}, {merge:true}); // 내용은 남겨 둠(복구 가능)
  fbMirrorToSheets_('boardDeleteTask', b);
  return {ok:true};
}
async function fbAppendActivity_(entry){
  const e = JSON.parse(JSON.stringify(entry));
  const id = String(e.id || ('a'+(e.ts||Date.now())+Math.random().toString(36).slice(2,6)));
  e.id = id;
  await fbCol_('activity').doc(id).set({...e, createdAt:fbTs_()}); // 같은 id로 다시 보내도 한 건(재시도 안전)
  fbMirrorToSheets_('boardAppendActivity', {entry});
  return {ok:true};
}
// 팀원은 사람마다 문서 하나 — 바뀐 사람 문서만 쓴다(보안 규칙이 "자기 문서만 수정"을 확인할 수 있도록).
// 구글 계정 연결은 links/{이메일} 문서로 따로 둬서, 규칙이 "연결된 사람인지"를 빠르게 확인한다.
async function fbSaveConfig_(b){
  const batch = FB.db.batch(); let n = 0;
  if(b.models!==undefined){ batch.set(fbCol_('config').doc('models'), {list:b.models}); n++; }
  if(b.checklists!==undefined){ batch.set(fbCol_('config').doc('checklists'), {map:b.checklists}); n++; }
  if(b.users!==undefined){
    const cur = new Map(FB.config.users.map((u,i)=>[u.id, {...u, order:i}]));
    b.users.forEach((u0,i)=>{
      const u = {...JSON.parse(JSON.stringify(u0)), order:i}, c = cur.get(u.id);
      if(!c || JSON.stringify(Object.keys(u).sort().map(k=>[k,u[k]])) !== JSON.stringify(Object.keys(c).sort().map(k=>[k,c[k]]))){ batch.set(fbCol_('users').doc(u.id), u); n++; }
      const oldE = ((c && c.googleEmail)||'').toLowerCase(), newE = (u.googleEmail||'').toLowerCase();
      if(newE && newE!==oldE){ batch.set(fbCol_('links').doc(newE), {userId:u.id}); n++; }
      if(oldE && oldE!==newE){ batch.delete(fbCol_('links').doc(oldE)); n++; }
    });
    cur.forEach((c,id)=>{ if(!b.users.some(u=>u.id===id)){ batch.delete(fbCol_('users').doc(id)); n++; if(c.googleEmail){ batch.delete(fbCol_('links').doc(c.googleEmail.toLowerCase())); n++; } } });
  }
  if(n) await batch.commit();
  fbMirrorToSheets_('boardSaveConfig', b);
  return {ok:true};
}
// 접속 표시: 바뀔 때만 올리고, 창을 닫거나 연결이 끊기면 서버가 자동으로 지운다(onDisconnect).
let fbPresenceLast = '';
function fbSetPresence_(p){
  const key = JSON.stringify([p.taskId, p.mode, p.userId, p.name]);
  if(key===fbPresenceLast) return;
  fbPresenceLast = key;
  const ref = FB.rtdb.ref(`${FB.base}/presence/${p.session}`);
  if(p.taskId){
    ref.onDisconnect().remove();
    ref.set({s:p.session, u:p.userId||'', n:p.name||'', c:p.color||'', t:String(p.taskId), m:['edit','hover'].includes(p.mode)?p.mode:'view', at:firebase.database.ServerValue.TIMESTAMP});
  } else ref.remove();
}
// 전환 후 한동안은 구글 시트에도 같이 저장해 둔다(문제가 생기면 예전 방식으로 바로 되돌릴 수 있도록). 실패해도 무시.
function fbMirrorToSheets_(action, body){
  if(!FB.mirrorSheets || !boardSync.token) return;
  appsScriptRequest_(action, body).catch(e=>console.warn('[시트 사본 저장 실패]', action, e.message));
}
// 관리자: 구글 시트(Apps Script)의 데이터를 Firebase로 복사. 여러 번 눌러도 결과는 같다(시트 기준으로 맞춤).
async function fbMigrateFromSheets_(report){
  report('구글 시트에서 읽는 중…');
  const [t, c, a] = await Promise.all([appsScriptRequest_('boardGetTasks'), appsScriptRequest_('boardGetConfig'), appsScriptRequest_('boardGetActivity')]);
  const ops = [];
  const sheetIds = new Set();
  (t.tasks||[]).forEach((task,i)=>{
    const x = JSON.parse(JSON.stringify(task)), id = String(x.id), by = x._updatedBy || 'migration';
    sheetIds.add(id); delete x.id; delete x._updatedAt; delete x._updatedBy;
    ops.push(['set', fbCol_('tasks').doc(id), {...x, _rev:fbNewRev_(), updatedAt:fbTs_(), updatedBy:String(by), deleted:false, seq:i}]);
  });
  await fbWaitReady_(60000).catch(()=>{});
  Object.keys((FB.mirror && FB.mirror.tasks) || {}).forEach(id=>{ if(!sheetIds.has(id)) ops.push(['set', fbCol_('tasks').doc(id), {deleted:true, _rev:fbNewRev_(), updatedAt:fbTs_(), updatedBy:'migration'}, {merge:true}]); });
  (c.users||[]).forEach((u,i)=>{
    ops.push(['set', fbCol_('users').doc(String(u.id)), {...JSON.parse(JSON.stringify(u)), order:i}]);
    if(u.googleEmail) ops.push(['set', fbCol_('links').doc(u.googleEmail.toLowerCase()), {userId:String(u.id)}]);
  });
  ops.push(['set', fbCol_('config').doc('models'), {list:c.models||[]}]);
  ops.push(['set', fbCol_('config').doc('checklists'), {map:c.checklists||{}}]);
  (a.activity||[]).slice(0,500).forEach(e=>{
    const x = JSON.parse(JSON.stringify(e)), id = String(x.id || ('a'+x.ts)); x.id = id;
    ops.push(['set', fbCol_('activity').doc(id), {...x, createdAt:firebase.firestore.Timestamp.fromMillis(Number(x.ts)||Date.now())}]);
  });
  for(let i=0; i<ops.length; i+=400){
    const batch = FB.db.batch();
    ops.slice(i, i+400).forEach(([op, ref, data, opt])=>batch.set(ref, data, opt||{}));
    await batch.commit();
    report(`Firebase에 쓰는 중… ${Math.min(i+400, ops.length)}/${ops.length}`);
  }
  return {tasks:(t.tasks||[]).length, users:(c.users||[]).length, activity:Math.min(500,(a.activity||[]).length)};
}
function fbIsSuperAdmin_(){ return FB.dev || FB_SUPERADMINS.includes(loginEmail_()); }

// 토큰 자동 등록 링크: 주소 뒤에 #token=값 을 붙여 연 경우(예: .../index.html#token=abc) 그 값을 이 브라우저에
// 저장하고, 주소창에서는 바로 지운다. "#" 뒤의 값은 서버·GitHub로 전송되지 않고 이 브라우저에만 남으므로,
// 토큰을 코드(공개 저장소)에 넣지 않고도 팀원이 링크만 열면 설정 화면에 직접 입력하지 않아도 된다.
(function adoptTokenFromLink(){
  try{
    const m = /[#&]token=([^&]+)/.exec(location.hash);
    if(!m) return;
    localStorage.setItem('ppe_board_api_token', decodeURIComponent(m[1]));
    // 회사 계정 확인 페이지가 함께 넘겨준 로그인 이메일 — 이걸로 어느 보드 계정인지 정한다.
    const em = /[#&]email=([^&]+)/.exec(location.hash);
    if(em) localStorage.setItem('ppe_board_login_email', decodeURIComponent(em[1]).toLowerCase());
    history.replaceState(null, '', location.pathname + location.search);
  }catch(e){}
})();

// boardSync: 예전에는 tasks 배열 전체를 outbox에 넣어 통째로 저장했지만,
// 이제는 "바뀐 카드 id" 단위로만 서버에 반영합니다. 그래서 서로 다른 카드를
// 여러 명이 동시에 고쳐도 서버 쪽 잠금 시간이 아주 짧게 끝납니다.
const boardSync={
  url:localStorage.getItem('ppe_board_api_url')||BOARD_DEFAULT_API,
  token:localStorage.getItem('ppe_board_api_token')||'',
  error:'', pending:0, lastSavedAt:null,
  triedOnce:false, booting:true, sending:false, fetching:false,
  timer:null, version:1, revision:null, editVersion:0,
  // 카드별 서버 상태 추적: id -> updatedAt (충돌 감지용 baseUpdatedAt으로 사용)
  taskUpdatedAt:new Map(),
  // 카드별로 "이 세션이 마지막으로 서버와 같은 값이었다고 확인한" 전체 내용. 충돌이 났을 때,
  // 이 값과 비교해서 "이 세션이 실제로 건드린 항목"만 가려내 병합하는 기준으로 쓴다.
  taskServerSnapshot:new Map(),
  // 이번 세션에서 마지막으로 로컬에 반영된 TASKS의 id->JSON 스냅샷 (변경분 diff용)
  lastKnownTasksJson:new Map(),
  // "보낼 목록" — 서버가 저장 완료라고 답하기 전까지 절대 지우지 않고 이 PC(localStorage)에 계속 보관한다.
  // 연결이 끊겨 있어도, 브라우저를 껐다 켜도 남아 있다가 연결되는 즉시 올라간다.
  // id -> {base: 이 수정을 시작할 때의 서버 값(없으면 null), baseUpdatedAt}
  pendingTasks:new Map(),
  pendingDeletes:new Set(),
  outboxActivity:[],            // 저장 대기 중인 활동 로그 항목(순서 보장을 위해 배열)
  outboxConfig:null,            // {users, models, checklists} 중 바뀐 것만 채워짐, 없으면 null
  taskRetry:new Map(),          // id -> {msg, nextAt, delay} 서버가 거절한 카드는 그 카드만 따로 재시도
  conflicts:new Map(),          // id -> 비교 화면에서 사용자가 고르기를 기다리는 동시 수정
  connected:false, everConnected:false, connecting:false,
  reconnectTimer:null, reconnectDelay:2000, pushEpoch:0,
};
const BOARD_PENDING_KEY = 'ppe_board_pending_v2';
const BOARD_BASELINES_KEY = 'ppe_board_task_baselines_v2';
const BOARD_FAILLOG_KEY = 'ppe_board_sync_failures';
function pendingCount_(){
  return boardSync.pendingTasks.size + boardSync.pendingDeletes.size + boardSync.outboxActivity.length + (boardSync.outboxConfig?1:0);
}
function savePendingStore_(){
  try{
    localStorage.setItem(BOARD_PENDING_KEY, JSON.stringify({
      tasks:Object.fromEntries(boardSync.pendingTasks), deletes:[...boardSync.pendingDeletes],
      activity:boardSync.outboxActivity, config:boardSync.outboxConfig,
    }));
  }catch(e){ console.error('보낼 목록 저장 실패', e); }
  boardSync.pending = pendingCount_();
}
function loadPendingStore_(){
  try{
    const raw = localStorage.getItem(BOARD_PENDING_KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    boardSync.pendingTasks = new Map(Object.entries(p.tasks||{}));
    boardSync.pendingDeletes = new Set(p.deletes||[]);
    boardSync.outboxActivity = Array.isArray(p.activity) ? p.activity : [];
    boardSync.outboxConfig = p.config || null;
  }catch(e){ console.error('보낼 목록 읽기 실패', e); }
  boardSync.pending = pendingCount_();
}
function saveBaselines_(){
  try{
    const out = {};
    boardSync.taskServerSnapshot.forEach((s,id)=>{ out[id] = {s, at: boardSync.taskUpdatedAt.get(id) ?? null}; });
    localStorage.setItem(BOARD_BASELINES_KEY, JSON.stringify(out));
  }catch(e){}
}
function loadBaselines_(){
  try{
    Object.entries(JSON.parse(localStorage.getItem(BOARD_BASELINES_KEY)||'{}')).forEach(([id,v])=>{
      boardSync.taskServerSnapshot.set(id, v.s);
      if(v.at!=null) boardSync.taskUpdatedAt.set(id, v.at);
    });
  }catch(e){}
}
// 왜 끊겼는지 나중에 확인할 수 있도록 실패 기록을 최근 100건까지 남긴다(설정 > 🩺 연결 진단에서 보임).
function logSyncFailure_(action, err, ms){
  try{
    const arr = JSON.parse(localStorage.getItem(BOARD_FAILLOG_KEY)||'[]');
    arr.unshift({t:Date.now(), action, ms:Math.round(ms||0), msg:String((err&&err.message)||err).slice(0,200)});
    localStorage.setItem(BOARD_FAILLOG_KEY, JSON.stringify(arr.slice(0,100)));
  }catch(e){}
}

function boardLocalKey(key,shared){ return 'ppe_board_'+(shared?'data:':'device:')+key; }

// 업무 보드 요청은 Firebase가 켜져 있으면 Firebase로, 그 외(도구들)는 Apps Script로.
function boardRequest(action, body, query){ return (FB.on && FB_BOARD_ACTIONS.has(action)) ? fbRequest_(action, body||{}) : appsScriptRequest_(action, body, query); }
async function appsScriptRequest_(action, body, query={}){
  const u=new URL(boardSync.url);
  if(u.hostname!=='script.google.com'||!/^\/macros\/s\/.+\/exec$/.test(u.pathname)) throw Error('Apps Script /exec 배포 URL이 아닙니다.');
  const options={redirect:'follow'};
  if(body){
    options.method='POST'; options.headers={'Content-Type':'text/plain;charset=utf-8'};
    options.body=JSON.stringify({action, token:boardSync.token, ...body});
  } else {
    u.searchParams.set('action', action);
    if(boardSync.token) u.searchParams.set('token', boardSync.token);
    Object.entries(query).forEach(([k,v])=>u.searchParams.set(k,v));
  }
  // 느린 망에서도 견디도록 대기 60초. 조회(GET)는 멱등이라 시간 초과·통신 실패 시 한 번 더 시도한다(저장 POST는 중복 방지를 위해 재시도 안 함).
  // 실패 종류를 구분해 던진다: network(응답 자체를 못 받음 → 연결 끊김으로 보고 재연결), auth(토큰), 그 외(서버가 요청을 거절 — 해당 건만 재시도).
  const t0=performance.now();
  const fail=(msg, kind)=>{ const e=Error(msg); e.network=kind==='network'; e.auth=kind==='auth'; logSyncFailure_(action, e, performance.now()-t0); return e; };
  let res, data;
  for(let attempt=0; ; attempt++){
    try{ res=await fetch(u.href, {...options, signal:AbortSignal.timeout(60000)}); break; }
    catch(netErr){
      if(!body && attempt===0) continue;
      throw fail('공유 서버에서 응답이 없습니다. 이 PC의 네트워크(VPN·프록시·보안 프로그램)가 구글 스크립트 주소(script.google.com, script.googleusercontent.com)를 막거나 매우 느릴 수 있습니다. ('+netErr.message+')', 'network');
    }
  }
  if(!res.ok) throw fail('공유 서버 응답 오류 '+res.status, 'network');
  try{ data=await res.json(); }
  catch(e){ throw fail('공유 서버가 올바르지 않은 응답을 보냈습니다(구글 서버 일시 오류 가능). ('+e.message+')', 'network'); }
  if(data.ok!==true){
    // 진짜 토큰 불일치("AUTH:"로 시작)일 때만 로그인을 요구한다. 서버가 토큰을 확인하는 단계에서 난 다른 오류
    // (구글 사용량 한도 초과·일시 오류 — 예전 서버는 이것도 AUTH로 답했음, 새 서버는 RETRY)는 로그인과 무관하므로
    // 로그인 화면을 띄우지 않고 연결 끊김처럼 자동 재시도한다. (예전엔 이 때문에 "로그인이 풀린" 것처럼 보였다.)
    if(data.code==='RETRY' || (data.code==='AUTH' && !/^AUTH:/.test(data.error||''))){
      throw fail('공유 서버 일시 오류(잠시 뒤 자동 재시도): '+(data.error||''), 'network');
    }
    if(data.code==='AUTH'){
      // Firebase 모드에서는 보드 로그인이 Firebase라, 도구(Apps Script) 쪽 토큰 문제로 보드 로그인 안내를 띄우지 않는다.
      if(!FB.on) setBoardAuthBanner(true);
      throw fail(data.error, 'auth');
    }
    // CONFLICT는 오류가 아니라 "다른 사람이 먼저 저장했다"는 정상 응답이라 호출한 쪽(pushOneTask)이
    // serverTask를 받아 병합 처리해야 한다 — 여기서 그냥 던져버리면 그 병합 로직이 실행되지 않고
    // "업무 공유 API가 없습니다"라는 엉뚱한 오류만 반복돼 저장이 계속 실패한 것처럼 보인다.
    if(data.code==='CONFLICT') return data;
    throw fail(data.error||'업무 공유 API가 없습니다. Code.gs를 교체하고 새 버전으로 배포해 주세요.', 'server');
  }
  if(boardSync.authBannerOn) setBoardAuthBanner(false); // 요청이 성공하면 연결된 것 — 안내 숨김
  return data;
}

// TASKS 배열 전체가 갱신될 때마다(예전과 동일하게 persist()가 호출하는 지점) 호출됩니다.
// 여기서 마지막 스냅샷과 비교해 "실제로 바뀐 카드"만 골라 서버로 보낼 대기열에 넣습니다.
function diffAndQueueTasks(newTasksArray){
  const seen = new Set();
  for(const task of newTasksArray){
    if(!task || !task.id) continue;
    seen.add(task.id);
    const text = JSON.stringify(task);
    if(boardSync.lastKnownTasksJson.get(task.id)===text) continue; // 변화 없음
    boardSync.lastKnownTasksJson.set(task.id, text);
    boardSync.pendingDeletes.delete(task.id);
    if(!boardSync.pendingTasks.has(task.id)){
      // 이 수정이 "어느 서버 값 위에서" 시작됐는지 함께 기록한다 — 나중에 올릴 때 그 사이 다른 사람이
      // 바꾼 항목과 내가 바꾼 항목을 구분해 합치는 기준이 된다. 서버 값을 모르면 'unknown'을 보내
      // 서버가 항상 충돌 확인 절차를 거치게 한다(모르는 채로 통째로 덮어쓰지 않도록).
      const base = boardSync.taskServerSnapshot.get(task.id);
      boardSync.pendingTasks.set(task.id, {
        base: base ? JSON.parse(JSON.stringify(base)) : null,
        baseUpdatedAt: boardSync.taskUpdatedAt.get(task.id) ?? 'unknown',
      });
    }
  }
  // 이전엔 있었는데 이번엔 없는 id = 삭제된 카드
  const missingIds = [...boardSync.lastKnownTasksJson.keys()].filter(id=>!seen.has(id));
  // 방어: 사람이 화면에서 카드를 지우는 건 저장(persist) 때마다 1건씩이다. 한 번에 5건 이상이 목록에서
  // 사라졌다면 삭제가 아니라 "불완전한 서버 응답을 반영했다" 같은 비정상 상황일 가능성이 높다 — 그대로
  // 서버에 삭제 요청을 보내면 실제 업무가 시트에서 지워지므로 막는다. (비율 조건은 두지 않는다: 전체의
  // 15%만 사라져도 수십 건이 삭제되므로 절대 건수로 판단.) 막은 뒤에는 revision을 비워 다음 폴링에서
  // 서버 최신본을 다시 받아 화면을 복구한다.
  if(missingIds.length >= 5){
    boardSync.error = `한 번에 ${missingIds.length}건이 목록에서 사라져 서버 삭제를 막았습니다. 새로고침하면 서버 데이터로 복구됩니다.`;
    console.error('[대량 삭제 차단]', missingIds.length, '건', missingIds.slice(0,10));
    boardSync.revision = null;
    if(!boardSync.massDeleteWarned){
      boardSync.massDeleteWarned = true;
      setTimeout(()=>alert(`업무 ${missingIds.length}건이 한 번에 사라진 것으로 감지되어, 실수로 서버(구글시트)에서 지워지지 않도록 삭제를 막았습니다.\n\n페이지를 새로고침하면 서버의 데이터로 복구됩니다. (정말 여러 건을 지우려는 것이었다면 1건씩 삭제해 주세요.)`), 0);
    }
    return;
  }
  for(const id of missingIds){
    boardSync.lastKnownTasksJson.delete(id);
    const wasNew = boardSync.pendingTasks.has(id) && !boardSync.taskServerSnapshot.has(id);
    boardSync.pendingTasks.delete(id);
    if(!wasNew) boardSync.pendingDeletes.add(id); // 서버에 올라간 적 없는 새 카드는 지울 것도 없음
  }
}

function queueBoardSave(name, text){
  boardSync.editVersion++;
  if(name==='tasks'){
    diffAndQueueTasks(JSON.parse(text));
  } else if(name==='activity'){
    // 활동 로그는 항상 앞쪽에 새 항목이 추가되는 구조이므로, 가장 최신 1건만 새로 보내면 충분합니다.
    const arr = JSON.parse(text);
    if(arr.length) boardSync.outboxActivity.push(arr[0]);
  } else if(name==='users' || name==='models' || name==='checklists'){
    boardSync.outboxConfig = boardSync.outboxConfig || {};
    boardSync.outboxConfig[name] = JSON.parse(text);
  }
  savePendingStore_();
  clearTimeout(boardSync.timer);
  boardSync.timer=setTimeout(flushBoardSaves, 300);
  boardSyncStatus();
}

window.storage={
  async get(key,shared){ const value=localStorage.getItem(boardLocalKey(key,shared)); return value===null?null:{key,value}; },
  async set(key,value,shared){
    const text=String(value);
    if(shared && IS_GUEST && !boardSync.booting){
      // GUEST는 조회만: 공유 데이터 저장을 막고(이 PC 사본도 그대로 둠) 화면을 저장된 상태로 되돌린다.
      showGuestNotice_();
      setTimeout(()=>revertGuestChange_(key), 0);
      return {key, value:text};
    }
    localStorage.setItem(boardLocalKey(key,shared), text);
    const name = shared && (/^ppe_tasks_/.test(key)?'tasks':{ppe_activity_log:'activity',ppe_models_v1:'models',ppe_users_v1:'users',ppe_checklists_v1:'checklists'}[key]);
    // 연결 상태와 관계없이 모든 수정은 "보낼 목록"에 들어간다(끊겨 있을 때 쓴 내용도 연결되면 올라가도록).
    if(name && !boardSync.booting) queueBoardSave(name, text);

  async delete(key,shared){ if(shared) throw Error('공유 저장소 전체 삭제는 지원하지 않습니다.'); localStorage.removeItem(boardLocalKey(key,shared)); }
};

// 두 값을 비교해, a와 다른 b의 항목 키만 골라 돌려준다(얕은 비교, id 제외).
function diffTaskFields_(a, b){
  const keys = new Set([...Object.keys(a||{}), ...Object.keys(b||{})]);
  const out = [];
  keys.forEach(k=>{ if(k==='id') return; if(JSON.stringify(a?a[k]:undefined) !== JSON.stringify(b?b[k]:undefined)) out.push(k); });
  return out;
}
const CONFLICT_FIELD_LABELS_ = {title:'제목',type:'유형',model:'MODEL',status:'상태',assignee:'담당자',dueRequest:'완료요청일',receivedDate:'수신일',endDate:'완료일',note:'비고',ecnStep:'ECN STEP 1',actionItems:'체크 항목',materialLists:'신규자재 목록'};

// 카드 하나를 서버에 반영. 충돌(CONFLICT = 그사이 다른 사람이 이 카드를 저장함)이면 "이 수정을 시작할 때의
// 서버 값(base)" 기준으로 3-way 병합한다 — 서로 다른 항목은 물론, 같은 항목이라도 비고의 다른 줄·다른 체크
// 항목·서로 다른 댓글처럼 겹치지 않으면 묻지 않고 합친다. 정말 같은 부분을 서로 다르게 고친 경우에만 좌우
// 비교 화면을 띄우고, 사용자가 고를 때까지 이 카드는 보내지 않는다(다른 카드 저장은 계속).
// 합친 뒤 다시 보낼 때도 그사이 또 누가 저장했으면 같은 절차를 반복한다(덮어쓰지 않음).
async function pushOneTask(id){
  const entry = boardSync.pendingTasks.get(id);
  const task = TASKS.find(t=>t.id===id);
  if(!entry || boardSync.conflicts.has(id)) return;
  if(!task){ boardSync.pendingTasks.delete(id); return; }
  let base = entry.base || {}, baseAt = entry.baseUpdatedAt ?? 'unknown';
  let sentText, r;
  for(let attempt=0; attempt<4; attempt++){
    const live = TASKS.find(t=>t.id===id) || task;
    sentText = JSON.stringify(live); // 실제로 서버에 보낸 내용(보내는 도중 또 고쳐도 구분할 수 있게)
    r = await boardRequest('boardUpsertTask', {task:JSON.parse(sentText), userName:currentUserLabel(), baseUpdatedAt:baseAt, force:attempt===3});
    if(r.code!=='CONFLICT') break;
    const server = {...r.serverTask}; delete server._updatedAt; delete server._updatedBy;
    const mine = JSON.parse(JSON.stringify(live));
    const {merged, conflicts} = mergeTask3_(base, mine, server);
    if(conflicts.length){
      boardSync.conflicts.set(id, {base, mine, server, merged, keys:conflicts, serverUpdatedAt:r.serverTask._updatedAt, serverBy:r.serverTask._updatedBy});
      openConflictDialog_();
      return; // 보낼 목록에는 그대로 남아 있음
    }
    Object.keys(live).forEach(k=>{ if(!(k in merged)) delete live[k]; }); // 병합 결과에 없는 옛 항목 정리
    Object.assign(live, merged); // 참조를 유지한 채(상세 화면이 열려 있어도 안전) 내용만 갱신
    boardSync.lastKnownTasksJson.set(id, JSON.stringify(live));
    try{ localStorage.setItem(boardLocalKey(STORAGE_KEY,true), JSON.stringify(TASKS)); }catch(e){}
    if(document.getElementById('overlay').classList.contains('open')) boardViewDirty = true; else renderCurrent();
    base = server; baseAt = r.serverTask._updatedAt;
  }
  const saved = JSON.parse(sentText);
  boardSync.taskUpdatedAt.set(id, r.updatedAt);
  boardSync.taskServerSnapshot.set(id, saved);
  boardSync.pushEpoch++;
  boardSync.taskRetry.delete(id);
  const current = TASKS.find(t=>t.id===id);
  if(current && JSON.stringify(current)!==sentText){
    // 올리는 도중에 또 고쳤다 — 방금 저장된 값을 새 기준으로 삼아 목록에 남겨두고 다음 차례에 올린다.
    boardSync.pendingTasks.set(id, {base:saved, baseUpdatedAt:r.updatedAt});
  } else {
    boardSync.pendingTasks.delete(id);
  }
}

// 서버가 특정 카드만 거절한 경우(예: 카드가 너무 큼, 서버 잠금 대기 초과) 그 카드만 점점 간격을 늘려
// 재시도한다 — 예전엔 카드 한 장 실패로 전체가 "저장 실패" 상태에 빠져 다른 사람 수정도 받아오지 못했다.
function markTaskRetry_(id, e){
  const prev = boardSync.taskRetry.get(id);
  const delay = Math.min(prev ? prev.delay*2 : 2000, 60000);
  boardSync.taskRetry.set(id, {msg:e.message, delay, nextAt:Date.now()+delay});
}

async function flushBoardSaves(){
  if(boardSync.sending || !boardSync.connected) return;
  const now = Date.now();
  const taskIds=[...boardSync.pendingTasks.keys()].filter(id=>{ const r=boardSync.taskRetry.get(id); return !boardSync.conflicts.has(id) && (!r || r.nextAt<=now); });
  const deleteIds=[...boardSync.pendingDeletes];
  const hasActivity = boardSync.outboxActivity.length>0;
  const configBatch = boardSync.outboxConfig;
  if(!taskIds.length && !deleteIds.length && !hasActivity && !configBatch){ scheduleFlushForRetries_(); return; }
  boardSync.sending=true;
  let networkError=null;

  // 서버는 시트가 꼬이지 않게 한 번에 한 요청씩만 쓰므로(잠금), 한꺼번에 많이 보내면 뒤 요청들이 잠금을
  // 기다리다 시간 초과로 실패한다 — 동시에 2건씩만 보낸다.
  const CONCURRENCY = 2;
  async function runLimited(items, worker){
    let i = 0;
    async function runNext(){
      if(i >= items.length || networkError) return;
      const item = items[i++];
      await worker(item);
      await runNext();
    }
    await Promise.all(Array.from({length: Math.min(CONCURRENCY, items.length)}, runNext));
  }
  const handle = (id, e)=>{
    if(e.network || e.auth) networkError = networkError || e;
    else if(id) markTaskRetry_(id, e);
    else boardSync.error = e.message;
  };

  await runLimited(taskIds, async id=>{
    try{ await pushOneTask(id); } catch(e){ handle(id, e); }
    savePendingStore_();
  });
  await runLimited(deleteIds, async id=>{
    try{
      await boardRequest('boardDeleteTask', {id, userName:currentUserLabel()});
      boardSync.pendingDeletes.delete(id);
      boardSync.taskServerSnapshot.delete(id); boardSync.taskUpdatedAt.delete(id);
      boardSync.pushEpoch++;
    } catch(e){ handle(null, e); }
    savePendingStore_();
  });
  while(!networkError && boardSync.outboxActivity.length){
    try{ await boardRequest('boardAppendActivity', {entry:boardSync.outboxActivity[0]}); boardSync.outboxActivity.shift(); }
    catch(e){ handle(null, e); break; }
    savePendingStore_();
  }
  if(!networkError && boardSync.outboxConfig){
    const batch = boardSync.outboxConfig;
    try{
      await boardRequest('boardSaveConfig', batch);
      if(boardSync.outboxConfig===batch) boardSync.outboxConfig=null; // 보내는 사이 또 바뀌었으면 남겨둠
    } catch(e){ handle(null, e); }
    savePendingStore_();
  }

  boardSync.sending=false;
  saveBaselines_();
  savePendingStore_();
  if(!boardSync.pending) boardSync.lastSavedAt = Date.now();
  if(networkError) markDisconnected_(networkError);
  else if(!boardSync.taskRetry.size) boardSync.error='';
  boardSyncStatus();
  if(boardSync.connected){
    const ready = [...boardSync.pendingTasks.keys()].some(id=>!boardSync.taskRetry.has(id) && !boardSync.conflicts.has(id))
      || boardSync.pendingDeletes.size || boardSync.outboxActivity.length || boardSync.outboxConfig;
    if(ready){ clearTimeout(boardSync.timer); boardSync.timer=setTimeout(flushBoardSaves, 300); }
    else scheduleFlushForRetries_();
  }
}
function scheduleFlushForRetries_(){
  if(!boardSync.taskRetry.size || !boardSync.connected) return;
  const next = Math.min(...[...boardSync.taskRetry.values()].map(r=>r.nextAt));
  clearTimeout(boardSync.timer);
  boardSync.timer = setTimeout(flushBoardSaves, Math.max(300, next-Date.now()));
}

// ---- 연결 유지 ----
// 요청 한 번 실패는 흔한 일(구글 서버 일시 지연 등)이므로 절대 포기하지 않고 다시 연결한다. 다만 서버(Apps Script)는
// 동시에 처리하는 요청 수에 한도가 있어, 서버가 밀릴 때 모든 창이 1~5초마다 재시도하면 더 밀리는 악순환이 생긴다 —
// 그래서 2→4→8→16→최대 30초로 간격을 늘리고, 창마다 시점을 ±30% 흩어 같은 순간에 몰리지 않게 한다.
// 토큰 문제(AUTH)는 재시도로 해결되지 않으므로 30초 간격으로 확인만 계속한다.
function markDisconnected_(err){
  boardSync.connected = false;
  boardSync.error = err ? err.message : boardSync.error;
  if(err && err.auth) notifyBoardAuthError(err.message);
  scheduleReconnect_(err && err.auth ? 30000 : null);
  boardSyncStatus();
}
function scheduleReconnect_(forceDelay){
  if(boardSync.reconnectTimer || boardSync.connecting || boardSync.connected) return;
  const d = (forceDelay || boardSync.reconnectDelay) * (0.7 + Math.random()*0.6);
  boardSync.reconnectTimer = setTimeout(()=>{ boardSync.reconnectTimer=null; connectBoardShared(); }, d);
  if(!forceDelay) boardSync.reconnectDelay = Math.min(boardSync.reconnectDelay*2, 30000);
}
function reconnectNow_(){
  if(boardSync.connected || boardSync.connecting || boardSync.booting) return;
  clearTimeout(boardSync.reconnectTimer); boardSync.reconnectTimer=null;
  connectBoardShared();
}

// 연결·저장 상태를 한 번만 판정해서 설정 화면·사이드바·상단(항상 보이는 저장 상태) 세 곳이 같은 문구로 보여 준다.
function syncState_(){
  const n = boardSync.pending, keep = n ? ` · 보낼 목록 ${n}건 이 PC에 보관 중` : '';
  const title = id=>{ const t=TASKS.find(x=>x.id===id); return t ? (t.title||id) : id; };
  const names = ()=>[...boardSync.pendingTasks.keys()].map(title);
  if(boardSync.authBannerOn) return {cls:'error', text:'로그인이 필요합니다'+keep, tip:'회사 구글 계정으로 로그인하면 자동으로 연결됩니다.'};
  if(!boardSync.connected && boardSync.triedOnce) return {cls:'error', text:'공유 연결 끊김 · 자동 재연결 중'+keep, tip:[boardSync.error, ...names()].filter(Boolean).join('\n')};
  if(!boardSync.connected) return {cls:'', text:'연결 확인 중…', tip:''};
  if(boardSync.taskRetry.size) return {cls:'error', text:`카드 ${boardSync.taskRetry.size}건 저장 재시도 중 · 이 PC엔 보존됨`, tip:[...boardSync.taskRetry].map(([id,r])=>title(id)+' — '+r.msg).join('\n')};
  if(n){ const list = names(); return {cls:'pending', text:`저장 중… (${n}건 대기${list.length?' — '+list.slice(0,3).join(', ')+(list.length>3?' 외':''):''})`, tip:list.join('\n')}; }
  return {cls:'', text: boardSync.lastSavedAt ? `최근 저장됨 (${formatSavedAt(boardSync.lastSavedAt)})` : (FB.on ? '실시간 연결됨' : 'Google Sheets 공유 연결됨'), tip:''};
}
function boardSyncStatus(){
  boardSync.pending = pendingCount_();
  const s = syncState_();
  const settings = document.getElementById('syncSettingsState');
  if(settings) settings.innerHTML = `<b>${escapeHtml(s.text)}</b>` + (s.cls==='error' && boardSync.error && !boardSync.authBannerOn ? `<br><span style="color:var(--s-delay);overflow-wrap:anywhere">${escapeHtml(boardSync.error)}</span>` : '');
  const side = document.getElementById('syncText');

  const loginBtn = document.getElementById('loginTopBtn');
  if(loginBtn) loginBtn.hidden = !(boardSync.authBannerOn && TOKEN_PORTAL_URL);
}

// ---- 동시 수정 자동 병합 ----
// base = 내가 고치기 시작할 때의 서버값, mine = 내 값, theirs = 지금 서버값. 한쪽만 바꿨으면 그쪽을 택하고,
// 둘 다 바꿨어도 서로 다른 부분(비고의 다른 줄, 다른 체크 항목, 서로 다른 댓글 등)이면 합친다.
// 정말로 같은 부분을 서로 다르게 고친 경우만 conflict로 돌려 비교 화면을 띄운다.
function eq_(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
function isPlainObj_(v){ return v!==null && typeof v==='object' && !Array.isArray(v); }
function splitNoteBlocks_(html){ return String(html||'').split(/(?<=<br\s*\/?>|<\/div>|<\/p>|<\/li>|\n)/i); }
function lcsTable_(x, y){
  const n=x.length, m=y.length, dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = x[i]===y[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  return dp;
}
// 줄 단위 3-way 병합(diff3). 양쪽이 같은 자리를 서로 다르게 바꿨으면 null.
function diff3Lines_(base, a, b){
  if((base.length+1)*(a.length+1) > 4e6 || (base.length+1)*(b.length+1) > 4e6) return null;
  const match = (x, y)=>{
    const n=x.length, m=y.length, dp=lcsTable_(x, y);
    const map = new Array(n).fill(-1); let i=0, j=0;
    while(i<n && j<m){ if(x[i]===y[j]){ map[i]=j; i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
    return map;
  };
  const ma = match(base, a), mb = match(base, b);
  const out = []; let i=0, ia=0, ib=0;
  const same = (p,q)=>p.length===q.length && p.every((v,k)=>v===q[k]);
  const emit = (bc, ac, bcB)=>{
    if(same(ac, bc) && same(bcB, bc)) out.push(...bc);
    else if(same(ac, bc)) out.push(...bcB);
    else if(same(bcB, bc)) out.push(...ac);
    else if(same(ac, bcB)) out.push(...ac);
    else return false;
    return true;
  };
  for(let j=0; j<=base.length; j++){
    const stable = j===base.length || (ma[j]>=ia && mb[j]>=ib && ma[j]!==-1 && mb[j]!==-1);
    if(!stable) continue;
    const ea = j===base.length ? a.length : ma[j], eb = j===base.length ? b.length : mb[j];
    if(!emit(base.slice(i,j), a.slice(ia,ea), b.slice(ib,eb))) return null;
    if(j<base.length) out.push(base[j]);
    i=j+1; ia=ea+1; ib=eb+1;
  }
  return out;
}
function mergeComments_(base, mine, theirs){
  const k = c=>c ? (c.ts+'|'+(c.authorId||c.author||'')) : '';
  const B=new Map((base||[]).map(c=>[k(c),c])), M=new Map(mine.map(c=>[k(c),c])), T=new Map(theirs.map(c=>[k(c),c]));
  const out = [];
  for(const key of new Set([...B.keys(), ...M.keys(), ...T.keys()])){
    const b=B.get(key), m=M.get(key), t=T.get(key);
    if(b && (!m || !t)) continue; // 어느 한쪽이 지운 댓글
    const r = merge3_(b, m, t, null);
    if(r.conflict) return null;
    if(r.value) out.push(r.value);
  }
  return out.sort((x,y)=>(x.ts||0)-(y.ts||0));
}
function merge3_(base, mine, theirs, key){
  if(eq_(mine, theirs)) return {value:mine};
  if(eq_(base, mine)) return {value:theirs};
  if(eq_(base, theirs)) return {value:mine};
  if(key==='comments' && Array.isArray(mine) && Array.isArray(theirs)){
    const v = mergeComments_(Array.isArray(base)?base:[], mine, theirs);
    return v ? {value:v} : {conflict:true};
  }
  if(isPlainObj_(mine) && isPlainObj_(theirs) && (base==null || isPlainObj_(base))){
    const out = {};
    for(const k of new Set([...Object.keys(base||{}), ...Object.keys(mine), ...Object.keys(theirs)])){
      const r = merge3_((base||{})[k], mine[k], theirs[k], null);
      if(r.conflict) return {conflict:true};
      if(r.value!==undefined) out[k] = r.value;
    }
    return {value:out};
  }
  if(Array.isArray(mine) && Array.isArray(theirs) && Array.isArray(base) && [...base,...mine,...theirs].every(x=>typeof x==='string')){
    const v = diff3Lines_(base, mine, theirs);
    return v ? {value:v} : {conflict:true};
  }
  if(typeof mine==='string' && typeof theirs==='string' && typeof base==='string'){
    const split = key==='note' ? splitNoteBlocks_ : (s=>s.split(/(?<=\n)/));
    const v = diff3Lines_(split(base), split(mine), split(theirs));
    if(v) return {value:v.join('')};
  }
  return {conflict:true};
}
// 카드 전체를 항목별로 병합. conflicts = 정말로 같은 부분을 서로 다르게 고친 항목들.
function mergeTask3_(base, mine, theirs){
  const merged = {}, conflicts = [];
  for(const k of new Set([...Object.keys(base||{}), ...Object.keys(mine||{}), ...Object.keys(theirs||{})])){
    if(k==='id' || k==='_updatedAt' || k==='_updatedBy') continue;
    const r = merge3_((base||{})[k], (mine||{})[k], (theirs||{})[k], k);
    if(r.conflict){ conflicts.push(k); merged[k] = (theirs||{})[k]; }
    else if(r.value!==undefined) merged[k] = r.value;
  }
  merged.id = (mine&&mine.id) || (theirs&&theirs.id);
  return {merged, conflicts};
}

// ---- 동시 수정 비교 화면 ----
// 자동으로 못 합친 항목만 좌(내 것)/우(상대 것)로 나란히 보여주고, 다른 부분을 음영으로 표시한다.
// 항목마다 남길 쪽을 골라야 저장된다. 그동안 이 카드는 서버로 보내지 않고(다른 카드 저장은 계속) 기다린다.
function fieldTextForCompare_(key, v, task){
  if(v===undefined || v===null || v==='') return '(비어 있음)';
  if(key==='note'){
    const tmp = document.createElement('div');
    tmp.innerHTML = String(v).replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li)>/gi,'\n').replace(/<img[^>]*>/gi,'[이미지]');
    return (tmp.textContent||'').replace(/\n{3,}/g,'\n\n').trim() || '(비어 있음)';
  }
  if(key==='actionItems' && isPlainObj_(v)){
    const items = (typeof checklistFor==='function' && task) ? checklistFor(task.type, task) : [];
    const label = k=>{ const it=items.find(i=>i.key===k); return it ? it.label : k; };
    return Object.keys(v).map(k=>(v[k]?'✓ ':'☐ ')+label(k)).join('\n') || '(없음)';
  }
  if(key==='materialLists' && isPlainObj_(v)) return Object.keys(v).map(k=>k+'\n'+(v[k]||[]).map(x=>'  · '+x).join('\n')).join('\n') || '(없음)';
  if(key==='comments' && Array.isArray(v)) return v.map(c=>(c.author||'')+': '+(c.text||'')).join('\n') || '(없음)';
  if(key==='ecnStep') return {assigned:'업무 할당', na:'해당 없음'}[v] || String(v);
  if(typeof v==='object') return JSON.stringify(v, null, 1);
  return String(v);
}
// 두 글의 다른 부분을 표시한 HTML 두 개를 만든다(짧으면 글자 단위, 길면 단어 단위 비교).
function diffHighlight_(a, b){
  const tok = s=> (a.length+b.length) < 800 ? Array.from(s) : (s.match(/\s+|[^\s]+/g)||[]);
  const x = tok(a), y = tok(b);
  if((x.length+1)*(y.length+1) > 3e6){
    const all = s=>`<mark class="cf-diff">${escapeHtml(s)}</mark>`;
    return [all(a), all(b)];
  }
  const n=x.length, m=y.length, dp=lcsTable_(x, y);
  let i=0, j=0; const ra=[], rb=[];
  const push=(arr, s, diff)=>{ const last=arr[arr.length-1]; if(last && last.d===diff) last.s+=s; else arr.push({s, d:diff}); };
  while(i<n || j<m){
    if(i<n && j<m && x[i]===y[j]){ push(ra,x[i],false); push(rb,y[j],false); i++; j++; }
    else if(j>=m || (i<n && dp[i+1][j]>=dp[i][j+1])){ push(ra,x[i],true); i++; }
    else { push(rb,y[j],true); j++; }
  }
  const html = arr=>arr.map(p=>p.d ? `<mark class="cf-diff">${escapeHtml(p.s)}</mark>` : escapeHtml(p.s)).join('');
  return [html(ra), html(rb)];
}
function openConflictDialog_(){
  if(document.getElementById('conflictDialog') || !boardSync.conflicts.size) return;
  const [id, c] = boardSync.conflicts.entries().next().value; // Map은 들어온 순서를 지키므로 먼저 생긴 충돌부터
  const who = c.serverBy || '다른 사람';
  const autoCount = Object.keys(c.merged).filter(k=>k!=='id' && !c.keys.includes(k) && !eq_(c.merged[k], c.mine[k])).length;
  const choice = {};
  const wrap = document.createElement('div');
  wrap.id = 'conflictDialog'; wrap.className = 'cf-backdrop';
  const fields = c.keys.map(k=>{
    const label = CONFLICT_FIELD_LABELS_[k] || k;
    const [hm, hs] = diffHighlight_(fieldTextForCompare_(k, c.mine[k], c.mine), fieldTextForCompare_(k, c.server[k], c.server));
    return `<div class="cf-field" data-key="${escapeHtml(k)}">
        <div class="cf-label">${escapeHtml(label)}</div>
        <div class="cf-cols">
          <button type="button" class="cf-opt" data-side="mine" aria-pressed="false"><span class="cf-head">내가 고친 내용</span><span class="cf-body">${hm}</span></button>
          <button type="button" class="cf-opt" data-side="server" aria-pressed="false"><span class="cf-head">${escapeHtml(who)} 님이 저장한 내용</span><span class="cf-body">${hs}</span></button>
        </div></div>`;
  }).join('');
  wrap.innerHTML = `<div class="cf-dialog" role="dialog" aria-modal="true" aria-labelledby="cfTitle">
      <h3 id="cfTitle">같은 카드를 동시에 수정했어요</h3>
      <p class="cf-sub"><b>"${escapeHtml(c.mine.title||c.server.title||id)}"</b> — ${escapeHtml(who)} 님과 내가 같은 부분을 서로 다르게 고쳤어요. 음영 부분이 서로 다른 곳입니다. 항목마다 남길 쪽을 눌러 고른 뒤 저장하세요.${autoCount?` <span class="cf-auto">(겹치지 않은 나머지 ${autoCount}개 항목은 이미 자동으로 합쳤어요)</span>`:''}</p>
      ${c.keys.length>1?`<div class="cf-bulk"><button type="button" class="btn btn-ghost" data-all="mine">모두 내 것으로</button><button type="button" class="btn btn-ghost" data-all="server">모두 ${escapeHtml(who)} 님 것으로</button></div>`:''}
      <div class="cf-fields">${fields}</div>
      <div class="cf-actions"><span class="cf-hint" id="cfHint">모든 항목에서 한쪽을 골라 주세요</span><button type="button" class="btn" id="cfSave" disabled>선택한 내용으로 저장</button></div>
    </div>`;
  document.body.appendChild(wrap);
  const save = wrap.querySelector('#cfSave'), hint = wrap.querySelector('#cfHint');
  const refresh = ()=>{
    wrap.querySelectorAll('.cf-field').forEach(f=>{
      const k=f.dataset.key;
      f.querySelectorAll('.cf-opt').forEach(o=>o.setAttribute('aria-pressed', String(choice[k]===o.dataset.side)));
    });
    const left = c.keys.filter(k=>!choice[k]).length;
    save.disabled = left>0;
    hint.textContent = left ? `아직 고르지 않은 항목 ${left}개` : '저장하면 이 내용이 모두에게 반영됩니다';
  };
  wrap.querySelectorAll('.cf-opt').forEach(o=>o.addEventListener('click', ()=>{ choice[o.closest('.cf-field').dataset.key]=o.dataset.side; refresh(); }));
  wrap.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click', ()=>{ c.keys.forEach(k=>choice[k]=b.dataset.all); refresh(); }));
  save.addEventListener('click', ()=>{ resolveConflict_(id, choice); wrap.remove(); openConflictDialog_(); });
  refresh();
  setTimeout(()=>{ const first=wrap.querySelector('.cf-opt'); if(first) first.focus(); }, 0);
}
function resolveConflict_(id, choice){
  const c = boardSync.conflicts.get(id);
  if(!c) return;
  const chosen = {...c.merged};
  c.keys.forEach(k=>{
    const v = choice[k]==='mine' ? c.mine[k] : c.server[k];
    if(v===undefined) delete chosen[k]; else chosen[k] = v;
  });
  const live = TASKS.find(t=>t.id===id);
  if(live){
    // 비교 화면이 떠 있는 동안 이 카드를 또 고쳤다면 그 수정도 살린다(골라서 저장한 항목은 고른 값 우선).
    const {merged:finalTask} = mergeTask3_(c.mine, live, chosen);
    c.keys.forEach(k=>{ if(k in chosen) finalTask[k]=chosen[k]; else delete finalTask[k]; });
    Object.keys(live).forEach(k=>{ if(!(k in finalTask)) delete live[k]; });
    Object.assign(live, finalTask);
    boardSync.lastKnownTasksJson.set(id, JSON.stringify(live));
    try{ localStorage.setItem(boardLocalKey(STORAGE_KEY,true), JSON.stringify(TASKS)); }catch(e){}
  }
  boardSync.pendingTasks.set(id, {base:JSON.parse(JSON.stringify(c.server)), baseUpdatedAt:c.serverUpdatedAt});
  boardSync.conflicts.delete(id);
  savePendingStore_();
  const modal = document.getElementById('modal');
  if(document.getElementById('overlay').classList.contains('open') && modal && modal.dataset.taskId===id) openDetail(id);
  else if(document.getElementById('overlay').classList.contains('open')) boardViewDirty = true;
  else renderCurrent();
  boardSyncStatus();
  clearTimeout(boardSync.timer); boardSync.timer=setTimeout(flushBoardSaves, 100);
}

// ---- 접속 표시: 누가 어떤 카드를 보고/편집 중인지 ----
// 10초마다 하는 서버 확인에 "나는 지금 이 카드를 보고/편집 중"을 함께 실어 보내고, 다른 사람들의 상태를 받아
// 카드 위에 사용자 아이콘으로 표시한다. 카드를 열고 닫을 때는 곧바로 한 번 더 보낸다.
// 서버(Apps Script)가 아직 이 기능을 모르는 버전이면 조용히 꺼지고 기존 동작 그대로.
const PRESENCE = {session: Math.random().toString(36).slice(2)+Date.now().toString(36), taskId:null, mode:'view', list:[], supported:null, sending:false, again:false};
function presencePayload_(){
  const u = (typeof currentUser==='function') ? currentUser() : null;
  return {session:PRESENCE.session, taskId:PRESENCE.taskId, mode:PRESENCE.mode, userId:currentUserId||'', name:u?u.name:(IS_GUEST?'GUEST':''), color:u?u.color:'#8b948f'};
}
function setPresence_(taskId, mode){
  if(PRESENCE.taskId===taskId && PRESENCE.mode===mode) return;
  PRESENCE.taskId = taskId; PRESENCE.mode = mode;
  sendPresenceNow_();
}
async function sendPresenceNow_(){
  if(PRESENCE.supported===false || !boardSync.connected) return;
  if(PRESENCE.sending){ PRESENCE.again = true; return; }
  PRESENCE.sending = true;
  try{ handlePresenceResponse_(await boardRequest('boardPresence', presencePayload_())); }
  catch(e){ if(/unknown action/i.test(e.message||'')) PRESENCE.supported = false; }
  finally{ PRESENCE.sending = false; if(PRESENCE.again){ PRESENCE.again = false; sendPresenceNow_(); } }
}
function handlePresenceResponse_(r){
  PRESENCE.supported = true;
  PRESENCE.list = Array.isArray(r && r.presence) ? r.presence : [];
  renderPresenceBadges_();
}
// 이 카드를 보고 있는 "다른" 사용자들(같은 사람이 여러 창에서 열었으면 한 번만, 편집 중이 우선).
function presenceOthersOn_(taskId){
  // 오래된 접속은 서버가 30초 뒤 지운다. 여기서 시각으로 다시 거르지 않는다(PC 시계가 틀리면 멀쩡한 표시가 사라지므로).
  const byUser = new Map();
  PRESENCE.list.forEach(p=>{
    if(p.t!==taskId || p.s===PRESENCE.session || (p.u && p.u===currentUserId)) return;
    const key = p.u || p.s; // GUEST(계정 없음)끼리는 한 사람으로 합치지 않는다
    const prev = byUser.get(key);
    if(!prev || presenceRank_(p.m) < presenceRank_(prev.m)) byUser.set(key, p);
  });
  return [...byUser.values()].sort((a,b)=>presenceRank_(a.m)-presenceRank_(b.m));
}
const presenceRank_ = m => m==='edit' ? 0 : m==='hover' ? 2 : 1; // 편집 중 > 열어서 보는 중 > 마우스로 가리키는 중
function presenceColor_(p){ const u = (USERS||[]).find(x=>x.id===p.u); return (u && u.color) || p.c || '#8b948f'; }
function presenceIconHtml_(p, size){
  const user = (USERS||[]).find(u=>u.id===p.u) || {name:p.n||'?', color:p.c||'#8b948f'};
  const what = p.m==='edit' ? '편집 중' : p.m==='hover' ? '살펴보는 중' : '보는 중';
  return `<span class="pres-icon ${p.m==='edit'?'pres-edit':''}" title="${escapeHtml(user.name)} — ${what}" aria-label="${escapeHtml(user.name)} ${what}">${avatarHtml({name:user.name, color:user.color||p.c||'#8b948f'}, size)}${p.m==='edit'?'<span class="pres-pencil" aria-hidden="true">✎</span>':''}</span>`;
}
function renderPresenceBadges_(){
  document.querySelectorAll('.card[data-id], tr[data-id]').forEach(el=>{
    const others = presenceOthersOn_(el.dataset.id);
    let stack = el.querySelector(':scope .pres-stack');
    if(!others.length){ if(stack) stack.remove(); el.style.removeProperty('--pres-count'); el.style.removeProperty('--pres-ring'); el.style.removeProperty('--pres-color'); el.classList.remove('pres-on'); return; }
    if(el.tagName!=='TR') el.style.setProperty('--pres-count', others.length);
    // 테두리를 그 사람 색으로 — 여러 명이면 사람마다 한 겹씩 바깥으로 링을 겹친다.
    el.style.setProperty('--pres-ring', others.map((p,i)=>`0 0 0 ${3+i*3}px ${presenceColor_(p)}`).join(', '));
    el.style.setProperty('--pres-color', presenceColor_(others[0]));
    el.classList.add('pres-on');
    if(!stack){
      stack = document.createElement('span'); stack.className = 'pres-stack';
      if(el.tagName==='TR'){ const td = el.querySelector('.td-title') || el.cells[1]; if(td) td.appendChild(stack); }
      else el.appendChild(stack);
    }
    const html = others.map(p=>presenceIconHtml_(p, 20)).join('');
    if(stack.innerHTML!==html) stack.innerHTML = html;
  });
  renderPresenceInModal_();
}
function renderPresenceInModal_(){
  const modal = document.getElementById('modal');
  const open = document.getElementById('overlay').classList.contains('open') && modal && modal.dataset.taskId && PRESENCE.taskId===modal.dataset.taskId;
  let bar = modal ? modal.querySelector('#presenceBar') : null;
  const others = open ? presenceOthersOn_(modal.dataset.taskId) : [];
  if(!others.length){ if(bar) bar.remove(); return; }
  if(!bar){ bar = document.createElement('div'); bar.id = 'presenceBar'; bar.className = 'pres-bar'; bar.setAttribute('role','status'); modal.prepend(bar); }
  const editing = others.filter(p=>p.m==='edit');
  const names = list=>list.map(p=>{ const u=(USERS||[]).find(x=>x.id===p.u); return (u?u.name:p.n)+' 님'; }).join(', ');
  const text = (editing.length ? names(editing)+'이 지금 이 카드를 편집 중' : '')
    + (editing.length && others.length>editing.length ? ' · ' : '')
    + (others.length>editing.length ? names(others.filter(p=>p.m!=='edit'))+'이 보는 중' : '');
  bar.innerHTML = `<span class="pres-bar-icons">${others.map(p=>presenceIconHtml_(p, 22)).join('')}</span><span>${escapeHtml(text)}${editing.length?' — 같은 부분을 동시에 고치면 저장할 때 비교 화면이 떠요':''}</span>`;
}
// 카드를 클릭하기 전, 마우스로 잠시(0.35초) 가리키고 있으면 "살펴보는 중"으로 알린다. 카드를 연 상태에서는
// 열어서 보는 중/편집 중이 우선. 실시간(Firebase)일 때만 — 예전 방식은 요청이 늘어 서버 부담이 커서 제외.
(function wireHoverPresence_(){
  let hoverT = null, leaveT = null, cur = null;
  const overlayOpen = ()=>document.getElementById('overlay').classList.contains('open');
  const idOf = el=>{ const c = el && el.closest ? el.closest('.card[data-id], tr[data-id]') : null; return c ? c.dataset.id : null; };
  const clearHover = ()=>{ cur = null; if(PRESENCE.mode==='hover' && !overlayOpen()) setPresence_(null, 'view'); };
  document.addEventListener('mouseover', e=>{
    if(!FB.on || overlayOpen()) return;
    const id = idOf(e.target);
    if(id && id===cur){ clearTimeout(leaveT); return; }
    clearTimeout(hoverT); clearTimeout(leaveT);
    if(!id){ leaveT = setTimeout(clearHover, 300); return; }
    hoverT = setTimeout(()=>{ if(overlayOpen()) return; cur = id; setPresence_(id, 'hover'); }, 350);
  });
  document.documentElement.addEventListener('mouseleave', ()=>{ clearTimeout(hoverT); clearTimeout(leaveT); if(FB.on) clearHover(); });
  window.addEventListener('blur', ()=>{ clearTimeout(hoverT); if(FB.on) clearHover(); });
})();
(function wirePresence_(){
  const modal = document.getElementById('modal');
  const markEdit = ()=>{ if(PRESENCE.taskId && modal.dataset.taskId===PRESENCE.taskId && document.getElementById('overlay').classList.contains('open')) setPresence_(PRESENCE.taskId, 'edit'); };
  if(modal){ modal.addEventListener('input', markEdit); modal.addEventListener('change', markEdit); }
  // 창을 닫으면 곧바로 "안 보고 있음"을 알린다(못 알려도 서버에서 30초 뒤 자동으로 사라짐).
  window.addEventListener('pagehide', ()=>{
    if(FB.on || !PRESENCE.taskId || PRESENCE.supported!==true) return; // Firebase는 서버가 자동으로 지움(onDisconnect)
    try{ navigator.sendBeacon(boardSync.url, new Blob([JSON.stringify({action:'boardPresence', token:boardSync.token, ...presencePayload_(), taskId:null})], {type:'text/plain;charset=utf-8'})); }catch(e){}
  });
})();

function formatSavedAt(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// 서버 목록이 지금 화면의 업무 수에 비해 비정상적으로 적은지(20건 이상 보유 중인데 30% 넘게, 10건 이상 감소).
function serverTaskDropLooksSuspicious(serverTasks){
  const before = TASKS.length;
  return before >= 20 && serverTasks.length < before*0.7 && (before - serverTasks.length) >= 10;
}

// 지금 사람이 카드 내용을 입력하고 있는지 — 이때 화면 데이터를 갈아끼우면 입력 중인 내용이 날아가므로 반영을 미룬다.
// 검색창·필터(.toolbar)는 업무 내용을 고치는 칸이 아니므로 제외한다(예전엔 검색창에 커서만 있어도 동료 수정이 안 들어왔다).
function isEditingTaskData_(){
  if(document.getElementById('overlay').classList.contains('open')) return true;
  const a = document.activeElement;
  if(!a || !(/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.isContentEditable)) return false;
  return !a.closest('.toolbar');
}
function toolbarFocused_(){
  const a = document.activeElement;
  return !!(a && a.closest && a.closest('.toolbar') && /INPUT|TEXTAREA|SELECT/.test(a.tagName));
}

// 서버 목록을 화면에 반영. 아직 서버에 못 올린 내 수정(보낼 목록)이 있는 카드는, 서버 최신값 위에 내가
// 실제로 바꾼 항목만 얹어서 보여준다 — 그래서 저장 대기 중이어도 다른 사람 수정은 계속 받아온다.
function applyServerTasks(serverTasks){
  if(typeof checkNotifyDiff === 'function') checkNotifyDiff(serverTasks); // 편집 중이라 화면 반영을 건너뛰어도 알림 감지는 항상 한다
  if(isEditingTaskData_() || boardSync.sending) return false;
  const localById = new Map(TASKS.map(t=>[t.id,t]));
  const serverIds = new Set();
  const next = [];
  const known = new Map();
  for(const st of serverTasks){
    const id = st.id; serverIds.add(id);
    const clean = {...st}; delete clean._updatedAt; delete clean._updatedBy;
    boardSync.taskUpdatedAt.set(id, st._updatedAt);
    boardSync.taskServerSnapshot.set(id, JSON.parse(JSON.stringify(clean)));
    if(boardSync.pendingDeletes.has(id)) continue; // 내가 지웠는데 아직 서버에 못 보낸 카드
    let t = clean;
    const p = boardSync.pendingTasks.get(id);
    const local = localById.get(id);
    if(p && local){
      if(boardSync.conflicts.has(id)){
        t = local; // 비교 화면에서 고르는 중 — 고를 때까지 화면은 내 값 그대로
      } else {
        const {merged, conflicts} = mergeTask3_(p.base || {}, local, clean);
        t = merged;
        conflicts.forEach(k=>{ if(k in local) t[k]=local[k]; else delete t[k]; }); // 못 합친 항목은 내 값으로 보여두고 올릴 때 비교 화면
        if(!conflicts.length){
          // 겹치지 않으면 기준을 지금 서버값으로 옮긴다(올릴 때 불필요한 충돌 확인 방지). 겹치면 기준을 그대로 둬서
          // 올릴 때 비교 화면이 뜨게 한다.
          if(!diffTaskFields_(clean, t).length) boardSync.pendingTasks.delete(id); // 서버에 이미 같은 값이 있음
          else boardSync.pendingTasks.set(id, {base:JSON.parse(JSON.stringify(clean)), baseUpdatedAt:st._updatedAt});
        }
      }
    }
    next.push(t);
    known.set(id, JSON.stringify(t));
  }
  // 서버에 없는 카드인데 보낼 목록에 있다 = 이 PC에서 새로 만들었거나, 다른 사람이 지운 카드를 내가 고치던 중.
  // 어느 쪽이든 내가 쓴 내용을 잃지 않도록 남겨 두고 다시 올린다.
  for(const [id] of boardSync.pendingTasks){
    if(serverIds.has(id)) continue;
    const local = localById.get(id);
    if(local){ next.push(local); known.set(id, JSON.stringify(local)); }
  }
  [...boardSync.pendingDeletes].forEach(id=>{ if(!serverIds.has(id)) boardSync.pendingDeletes.delete(id); }); // 이미 지워짐
  [...boardSync.taskServerSnapshot.keys()].forEach(id=>{ if(!serverIds.has(id)){ boardSync.taskServerSnapshot.delete(id); boardSync.taskUpdatedAt.delete(id); } });
  TASKS = next;
  boardSync.lastKnownTasksJson = known;
  localStorage.setItem(boardLocalKey(STORAGE_KEY,true), JSON.stringify(TASKS));
  saveBaselines_();
  savePendingStore_();
  return true;
}


async function startBoardShared(){
  loadBaselines_();
  loadPendingStore_();
  // 이 PC에 있던 화면 데이터를 "마지막으로 알던 상태"로 삼아, 이후 실제로 고친 카드만 보낼 목록에 넣는다.
  // (예전엔 이 기준이 비어 있어서, 서버 연결 전에 카드 하나만 고쳐도 모든 카드를 이 PC의 예전 값으로
  // 서버에 덮어써 그사이 다른 사람이 고친 내용이 되돌아갔다.)
  boardSync.lastKnownTasksJson = new Map(TASKS.map(t=>[t.id, JSON.stringify(t)]));
  boardSync.booting=false;
  boardSyncStatus();
  window.addEventListener('online', reconnectNow_);
  // 로그인(회사 계정 확인)이 안 된 상태로 열면 곧바로 로그인 페이지로 보낸다(5분에 한 번만 — 반복 방지).
  if(!FB.on && needsLoginGate_() && !recentlyRedirected_()){ goToLoginPortal_(); return; }
  await connectBoardShared();
}

async function connectBoardShared(){
  if(boardSync.connecting || boardSync.connected) return;
  boardSync.connecting = true;
  boardSyncStatus();
  let err = null;
  try{
    const [taskState, configState, activityState] = await Promise.all([
      boardRequest('boardGetTasks'),
      boardRequest('boardGetConfig'),
      boardRequest('boardGetActivity'),
    ]);
    if(!Array.isArray(taskState.tasks)){ const e = Error('서버 업무 응답 형식이 올바르지 않습니다.'); e.network = true; throw e; }
    boardSync.connected = true; boardSync.everConnected = true;
    boardSync.reconnectDelay = 2000;
    boardSync.error = '';
    if(boardSync.authBannerOn) setBoardAuthBanner(false);
    // revision은 서버 목록을 "실제로 반영했을 때만" 기록한다(반영을 미뤘으면 다음 확인 때 다시 받아 반영).
    boardSync.revision = applyServerTasks(taskState.tasks) ? taskState.revision : null;
    // 설정·활동 로그: 이 PC에서 바꾸고 아직 못 보낸 것은 내 값을 유지하고, 나머지는 서버 최신값으로.
    const cfg = boardSync.outboxConfig || {};
    if(!cfg.users) USERS = configState.users;
    if(!cfg.models) MODELS = configState.models;
    if(!cfg.checklists) CHECKLISTS = configState.checklists;
    const serverActs = Array.isArray(activityState.activity) ? activityState.activity : [];
    const unsentActs = boardSync.outboxActivity.filter(a=>!serverActs.some(s=>s.ts===a.ts)).slice().reverse();
    ACTIVITY_LOG = [...unsentActs, ...serverActs];
    localStorage.setItem(boardLocalKey(USERS_KEY,true), JSON.stringify(USERS));
    localStorage.setItem(boardLocalKey(MODELS_KEY,true), JSON.stringify(MODELS));
    localStorage.setItem(boardLocalKey(CHECKLISTS_KEY,true), JSON.stringify(CHECKLISTS));
    localStorage.setItem(boardLocalKey(ACTIVITY_KEY,true), JSON.stringify(ACTIVITY_LOG));
    resolveIdentity_(); renderCurrent();
  }catch(e){
    err = e;
  } finally {
    boardSync.connecting = false;
    boardSync.triedOnce = true;
  }
  if(err){ markDisconnected_(err); return; }
  boardSyncStatus();
  flushBoardSaves();
}

// 서버가 토큰 인증(AUTH_TOKEN)을 요구하는데 이 브라우저에 토큰이 없거나 틀린 경우 — 화면엔 "연결 확인 필요"만
// 떠서 원인을 알기 어려우므로, 어디에 입력하면 되는지 한 번만 안내한다.
function notifyBoardAuthError(message){
  if(/^AUTH:/.test(message||'')) setBoardAuthBanner(true);
}

// ---- 공유 서버 연결 안내 (토큰) ----
// 서버가 토큰을 요구하는데 이 브라우저에 토큰이 없거나 틀리면 화면 아래에 안내와 [토큰 연결하기] 버튼을 띄우고,
// 연결이 확인될 때까지(요청이 성공할 때까지) 계속 보여준다. 폴링·저장 등 모든 요청이 인증 상태를 검사하므로
// 나중에 토큰이 바뀌어 연결이 끊겨도 자동으로 다시 나타난다.
// 토큰은 공개 코드에 넣을 수 없으므로(누구나 볼 수 있음) 관리자에게 받은 링크/토큰을 붙여넣는 방식이다.
// 회사 구글 계정 자동 연결 페이지 주소(Apps Script 웹 앱 — 접근 권한이 "조직 내 사용자"로 제한되어 회사 계정으로
// 로그인한 사람만 열 수 있고, 거기서 토큰이 담긴 이 사이트 주소로 되돌려 보낸다). 토큰 자체는 이 코드에 없다.
// 비어 있으면 자동 연결 버튼은 나타나지 않고 붙여넣기 방식만 쓴다.
var TOKEN_PORTAL_URL = 'https://script.google.com/a/macros/intelliantech.com/s/AKfycbwIWpJYw92UCs1tkUMX2Ajf2f-tP5bODDavykwp43nCUN-y-fAIGIZxp85f_WvtAuNXZA/exec';
// 로그인(토큰)이 필요한 상태를 오른쪽 위 저장 상태 자리에 [회사 계정으로 로그인] 버튼으로 표시한다.

  boardSync.authBannerOn = !!on;
  boardSyncStatus();
  if(on) maybeAutoLogin_();

document.getElementById('loginTopBtn')?.addEventListener('click', ()=>goToLoginPortal_());
function goToLoginPortal_(){
  if(FB.on){ fbSignIn_(); return; } // Firebase: 구글 로그인 창(버튼을 눌렀을 때만 열 수 있음)
  if(!TOKEN_PORTAL_URL) return;
  try{ localStorage.setItem('ppe_login_redirect_at', String(Date.now())); }catch(e){}
  location.href = TOKEN_PORTAL_URL;
}
// 페이지를 막 열었는데 로그인이 안 돼 있으면(새 PC·브라우저 초기화·토큰 교체) 다른 사이트처럼 곧바로 로그인
// 페이지로 보낸다. 단, 이미 무언가 고치기 시작했거나 창이 열려 있으면 작업 중인 화면을 떠나지 않도록 버튼만
// 보여 준다. 로그인 페이지에서 돌아왔는데도 실패하면 무한 반복하지 않도록 5분에 한 번만 자동 이동한다.
function maybeAutoLogin_(){
  if(FB.on || !TOKEN_PORTAL_URL || boardSync.everConnected || boardSync.editVersion>0) return;
  if(document.getElementById('overlay').classList.contains('open') || recentlyRedirected_()) return;
  goToLoginPortal_();
}
function recentlyRedirected_(){
  let last = 0; try{ last = Number(localStorage.getItem('ppe_login_redirect_at')||0); }catch(e){}
  return Date.now()-last < 5*60*1000;
}
function isBoardAdmin_(){ const u = currentUser(); return !!(u && u.isAdmin); }

async function refreshBoardShared(){
  // 탭이 안 보이는 상태(document.hidden)에서도 폴링은 계속한다 — 그래야 담당자 지정/@멘션 알림이
  // 백그라운드에 있을 때도 뜬다. 화면을 다시 그리는 무거운 작업만 보일 때로 미룬다.
  // 저장 대기 중이어도 받아온다(내 미전송 수정은 applyServerTasks가 서버값 위에 얹어서 보존). 끊긴 상태의 재연결은 별도 루프 담당.
  if(!boardSync.connected) return;
  if(boardSync.fetching||boardSync.sending) return;
  // 화면에 안 보이는 창(다른 탭·최소화)은 60초에 한 번만 확인한다 — 창마다 10초씩 확인하면 서버 사용량 한도를
  // 금방 넘긴다. 다시 보이면 visibilitychange에서 곧바로 확인한다.
  if(!FB.on && document.hidden && boardSync.lastPollAt && Date.now()-boardSync.lastPollAt < 60000) return; // Firebase는 실시간 구독이라 확인 비용이 없음
  boardSync.lastPollAt = Date.now();
  boardSync.fetching=true;
  const requestedAtEditVersion=boardSync.editVersion, requestedAtPushEpoch=boardSync.pushEpoch;
  try{
    let rev = null;
    if(PRESENCE.supported!==false && !PRESENCE.sending){
      // 접속 표시를 같은 요청에 실어 보낸다(요청 수가 늘지 않게). 서버가 아직 모르는 기능이면 기존 방식으로.
      try{ rev = await boardRequest('boardPresence', presencePayload_()); handlePresenceResponse_(rev); }
      catch(e){ if(e.network || e.auth) throw e; if(/unknown action/i.test(e.message||'')) PRESENCE.supported=false; rev = null; }
    }
    if(!rev) rev = await boardRequest('boardRevision');
    if(rev.revision===boardSync.revision){ if(!boardSync.taskRetry.size) boardSync.error=''; return; }
    const taskState = await boardRequest('boardGetTasks');
    // 받아오는 사이 내가 새로 저장했거나 수정했다면 이 응답은 이미 낡았을 수 있다(반영하면 방금 저장한 값이
    // 잠깐 옛값으로 보인다) — 버리고 잠시 뒤 다시 받는다.
    if(boardSync.sending || requestedAtPushEpoch!==boardSync.pushEpoch || requestedAtEditVersion!==boardSync.editVersion){
      setTimeout(refreshBoardShared, 1500); return;
    }
    // 방어: 서버 응답이 목록이 아니거나, 지금 화면의 업무 수에 비해 갑자기 크게 줄었으면(불완전 응답·일시
    // 오류 의심) 반영하지 않는다. 그대로 반영하면 사라진 것처럼 보이는 업무들이 다음 저장 때 서버에서
    // 삭제될 수 있다. revision도 갱신하지 않아 다음 폴링에서 다시 확인한다.
    if(!Array.isArray(taskState.tasks)) throw Error('서버 업무 응답 형식이 올바르지 않습니다.');
    if(serverTaskDropLooksSuspicious(taskState.tasks)){
      boardSync.error = `서버 업무 수가 갑자기 줄어(${TASKS.length}→${taskState.tasks.length}건) 반영하지 않았습니다. 일시 오류일 수 있어 다음 확인 때 다시 봅니다.`;
      console.error('[서버 응답 급감 — 반영 보류]', TASKS.length, '→', taskState.tasks.length);
      return;
    }
    // revision은 서버 목록을 "실제로 반영했을 때만" 기록한다(입력 중·저장 대기 중이라 반영이 스킵됐는데
    // revision만 갱신하면 이후 폴링이 "바뀐 게 없다"고 판단해 화면이 예전 데이터로 계속 남는다).
    const applied = applyServerTasks(taskState.tasks);
    if(applied){
      boardSync.revision=taskState.revision;
      if(!document.hidden) renderAfterServerApply_();
    }
    if(!boardSync.taskRetry.size) boardSync.error='';
  }catch(e){
    if(e.network || e.auth) markDisconnected_(e);
    else boardSync.error=e.message;
  } finally {
    boardSync.fetching=false; boardSyncStatus();
  }
}
// 검색창·필터에 입력 중이면(한글 조합 중일 수 있음) 지금 다시 그리면 글자가 깨지므로, 데이터만 반영해 두고

  boardSync.needsRender=false;

}

    }catch(e){
      boardSync.url=oldUrl; boardSync.token=oldToken; result.textContent=e.message;

    const result=document.getElementById('boardConnectResult');
    const lines=[]; const show=()=>{ result.innerHTML=lines.map(l=>'<div>'+escapeHtml(l)+'</div>').join(''); };
    const probe=async(label, url, ms)=>{
      const t0=performance.now();
      try{ await fetch(url,{mode:'no-cors', cache:'no-store', signal:AbortSignal.timeout(ms)}); lines.push('✅ '+label+' — 도달 ('+Math.round(performance.now()-t0)+'ms)'); }
      catch(e){ lines.push('❌ '+label+' — 실패: '+e.name+' ('+Math.round(performance.now()-t0)+'ms)'); }
      show();
    };
    lines.push('진단 중… (최대 1~2분)'); show();
    const urlEl=document.getElementById('boardApiUrl'), tokenEl=document.getElementById('boardApiToken');
    const url=(urlEl?urlEl.value:boardSync.url).trim(), token=(tokenEl?tokenEl.value:boardSync.token).trim();
    lines.push('브라우저 온라인: '+(navigator.onLine?'예':'아니오')+' / 저장된 주소: '+(url?url.slice(0,48)+'…'+url.slice(-12):'(없음)')+' / 로그인(토큰): '+(token?'있음':'없음'));
    await probe('1) script.google.com 접속', 'https://script.google.com/favicon.ico', 15000);
    await probe('2) script.googleusercontent.com 접속(응답 전달 주소)', 'https://script.googleusercontent.com/favicon.ico', 15000);
    await probe('3) www.google.com 접속(일반 구글 통신 비교용)', 'https://www.google.com/favicon.ico', 15000);
    try{
      const u=new URL(url); u.searchParams.set('action','boardRevision'); if(token) u.searchParams.set('token',token);
      const t0=performance.now();
      const res=await fetch(u.href,{redirect:'follow', signal:AbortSignal.timeout(60000)});
      const data=await res.json(); const ms=Math.round(performance.now()-t0);
      lines.push((data.ok===true?'✅':'⚠️')+' 4) 실제 서버 호출 — HTTP '+res.status+', '+(data.ok===true?'정상':(data.code==='AUTH'?'토큰 불일치(AUTH)':'오류: '+(data.error||'?')))+' ('+ms+'ms)');
    }catch(e){ lines.push('❌ 4) 실제 서버 호출 — 실패: '+e.name+' / '+e.message); }
    lines.push('※ 1~3이 ❌이면 이 PC 네트워크가 막는 것, 1~3은 ✅인데 4가 ❌이면 저장된 주소가 잘못됐거나 서버 문제입니다. 이 화면을 캡처해서 알려 주세요.');
    let fails=[]; try{ fails=JSON.parse(localStorage.getItem(BOARD_FAILLOG_KEY)||'[]'); }catch(e){}
    lines.push('— 이 PC의 최근 통신 실패 기록 '+fails.length+'건 (최신순, 최대 20건 표시) —');
    fails.slice(0,20).forEach(f=>lines.push(formatSavedAt(f.t)+' · '+f.action+' · '+f.ms+'ms · '+f.msg));
    show();
  };
  document.getElementById('boardExportLocal').onclick=()=>{
    const blob=new Blob([JSON.stringify({tasks:TASKS, activity:ACTIVITY_LOG, users:USERS, models:MODELS, checklists:CHECKLISTS}, null, 2)], {type:'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download='업무보드_PC백업.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  };
}

const STATUS_ORDER = ['업무할당 완료','시작 전','진행 대기','진행 중','장기 지연','완료'];
const BOARD_COLUMNS = ['업무할당 완료','시작 전','진행 대기','진행 중','완료']; // 장기 지연은 진행 대기 칼럼 안에 접이식으로 표시
const STATUS_PROGRESSION = ['업무할당 완료','시작 전','진행 대기','진행 중','완료'];
function nextStatusOf(current){
  const idx = STATUS_PROGRESSION.indexOf(current);
  if(idx === -1 || idx === STATUS_PROGRESSION.length - 1) return null; // 장기 지연·완료는 자동 다음 단계 없음(수동 지정만)
  return STATUS_PROGRESSION[idx + 1];
}
const SIX_MONTHS_MS = 1000*60*60*24*182;
const TWO_WEEKS_MS = 1000*60*60*24*14;

// 상태를 바꿀 때는 항상 이 함수를 통해서 바꿔서, 자동 장기지연 관련 추적 필드를 일관되게 관리한다.
function setTaskStatus(t, newStatus){
  if(t.status === newStatus) return;
  const wasAutoDelay = t.status === '장기 지연' && t.delayReason === 'auto';
  const wasManualDelay = t.status === '장기 지연' && t.delayReason === 'manual';
  if(newStatus === '장기 지연'){
    // 사용자가 직접 장기 지연으로 옮기는 경우 (수동 지정)
    t.delayReason = 'manual';
    t.delayOverrideAt = null;
  } else if(wasAutoDelay){
    // 자동으로 들어갔던 장기 지연에서 다른 단계로 옮기는 경우: 2주 유예 타이머 시작
    t.delayOverrideAt = Date.now();
  } else if(wasManualDelay){
    // 수동으로 지정했던 장기 지연을 벗어나면 추적 플래그를 리셋 (이후엔 자동 규칙이 새로 판단)
    t.delayReason = null;
    t.delayOverrideAt = null;
  } else if(newStatus === '완료'){
    t.delayReason = null;
    t.delayOverrideAt = null;
    t.endDate = todayDateStr();
  }
  t.status = newStatus;
}

let lastAction = null;
let toastTimer = null;
function recordUndo(t, prevStatus, prevDelayReason, prevDelayOverrideAt){
  lastAction = { type:'status', taskId: t.id, prevStatus, prevDelayReason, prevDelayOverrideAt, newStatus: t.status, title: t.title };
  showUndoToast(`"${escapeHtml(t.title)}" → <b>${escapeHtml(t.status)}</b>(으)로 변경됨`);
}
function recordDeleteUndo(removedTask, index){
  lastAction = { type:'delete', task: removedTask, index, title: removedTask.title };
  showUndoToast(`"${escapeHtml(removedTask.title)}" 업무가 삭제됨`);
}
function showUndoToast(message){
  const el = document.getElementById('undoToast');
  if(!el || !lastAction) return;
  el.innerHTML = `<span>${message}</span><button id="undoBtn">실행 취소 (Ctrl+Z)</button>`;
  el.classList.add('show');
  document.getElementById('undoBtn').addEventListener('click', undoLastAction);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideUndoToast, 7000);
}
function hideUndoToast(){
  const el = document.getElementById('undoToast');
  if(el) el.classList.remove('show');
  lastAction = null;
}
async function undoLastAction(){
  if(!lastAction) return;
  if(lastAction.type === 'delete'){
    const task = lastAction.task;
    const idx = Math.min(lastAction.index, TASKS.length);
    if(!TASKS.some(x=>x.id===task.id)) TASKS.splice(idx, 0, task);
    await persist();
    await logActivity('create', `<b>${escapeHtml(currentUserLabel())}</b>님이 "<b>${escapeHtml(task.title)}</b>" 업무 삭제를 취소(복원)했습니다.`, task.id);
    renderCurrent();
  } else {
    const t = TASKS.find(x=>x.id===lastAction.taskId);
    if(t){
      t.status = lastAction.prevStatus;
      t.delayReason = lastAction.prevDelayReason;
      t.delayOverrideAt = lastAction.prevDelayOverrideAt;
      await persist();
      renderCurrent();
    }
  }
  hideUndoToast();
}

async function moveTaskToStatus(id, newStatus){
  const t = TASKS.find(x=>x.id===id);
  if(!t || t.status===newStatus || !STATUS_ORDER.includes(newStatus)) return;
  const prevStatus = t.status, prevDelayReason = t.delayReason, prevDelayOverrideAt = t.delayOverrideAt;
  setTaskStatus(t, newStatus);
  await persist();
  await logActivity('status', `"<b>${escapeHtml(t.title)}</b>" 상태가 <b>${escapeHtml(prevStatus)}</b> → <b>${escapeHtml(newStatus)}</b>(으)로 변경되었습니다.`, t.id);
  renderCurrent();
  recordUndo(t, prevStatus, prevDelayReason, prevDelayOverrideAt);
}
async function advanceStatus(id){
  const t = TASKS.find(x=>x.id===id);
  if(!t) return;
  const next = nextStatusOf(t.status);
  if(!next) return;
  const prevStatus = t.status, prevDelayReason = t.delayReason, prevDelayOverrideAt = t.delayOverrideAt;
  setTaskStatus(t, next);
  await persist();
  await logActivity('status', `"<b>${escapeHtml(t.title)}</b>" 상태가 <b>${escapeHtml(prevStatus)}</b> → <b>${escapeHtml(next)}</b>(으)로 변경되었습니다.`, t.id);
  renderCurrent();
  recordUndo(t, prevStatus, prevDelayReason, prevDelayOverrideAt);
}

// 수신일 기준 6개월 경과 시 자동 장기지연, 자동지연→수동이동 후 2주 경과 시 재자동복귀
function applyAutomationRules(){
  const now = Date.now();
  let changed = false;
  TASKS.forEach(t=>{
    if(t.status === '완료') return;
    const received = parseDueDate(t.receivedDate);
    if(received && t.status !== '장기 지연' && (now - received.getTime()) >= SIX_MONTHS_MS && t.delayReason !== 'manual'){
      setTaskStatus(t, '장기 지연');
      t.delayReason = 'auto';
      changed = true;
      return;
    }
    if(t.delayReason === 'auto' && t.status !== '장기 지연' && t.delayOverrideAt && (now - t.delayOverrideAt) >= TWO_WEEKS_MS){
      setTaskStatus(t, '장기 지연');
      t.delayReason = 'auto';
      changed = true;
    }
  });
  return changed;
}
function parseDueDate(str){
  if(!str) return null;
  const m = String(str).match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(!m) return null;
  const d = new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  return isNaN(d.getTime()) ? null : d;
}
function dueUrgency(t){
  if(t.status === '완료') return null;
  const d = parseDueDate(t.dueRequest);
  if(!d) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((d - today) / 86400000);
  if(diffDays < 0) return 'overdue';
  if(diffDays <= 3) return 'soon';
  return null;
}
function dueBadgeHtml(t){
  const u = dueUrgency(t);
  if(!u) return '';
  const d = parseDueDate(t.dueRequest);
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((d - today) / 86400000);
  const color = u === 'overdue' ? 'var(--s-delay)' : 'var(--accent)';
  let label;
  if(u === 'overdue'){
    const absDays = Math.abs(diffDays);
    label = absDays >= 30 ? `${Math.floor(absDays/30)}달 지남` : `${absDays}일 지남`;
  } else {
    label = diffDays===0 ? '오늘 마감' : `${diffDays}일 남음`;
  }
  return `<span class="due-badge" style="color:${color}; border-color:${color}33; background:${color}14;">⏱ ${label}</span>`;
}

  }
  if(window.ResizeObserver){
    let lastH = textarea.offsetHeight;
    const ro = new ResizeObserver(()=>{
      if(textarea.offsetHeight !== lastH){ lastH = textarea.offsetHeight; saveHeight(); }
    });
    ro.observe(textarea);
  }
  // 리사이즈 핸들을 드래그해서 놓는 순간(mouseup)에도 저장 — ResizeObserver가 안 잡히는 환경 대비 보강
  textarea.addEventListener('mouseup', saveHeight);
  async function persistCurrent(){
    task.mailOverrides = task.mailOverrides || {};

  });
  document.getElementById('mailPopupCopy').addEventListener('click', async ()=>{
