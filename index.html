                <button class="btn btn-ghost comment-cancel-btn">취소</button>
              </div>
            </div>`;
          }
          return `
          <div class="comment-item" data-ckey="${escapeHtml(key)}">
            <div class="c-head">
              <div class="c-time-wrap">${a? avatarHtml(a,16):''}<span class="c-author" style="${a? `color:${a.color}`:''}">${a? escapeHtml(a.name): '알 수 없음'}</span><span class="c-time">${new Date(c.ts).toLocaleString('ko-KR')}</span></div>
              <div class="c-actions">
                ${isMine? `<button class="comment-edit-btn" data-key="${escapeHtml(key)}" title="수정">✎</button>`:''}
                ${canDelete? `<button class="comment-delete-btn" data-key="${escapeHtml(key)}" title="삭제">✕</button>`:''}
              </div>

      <div class="comment-input-row">
        <input type="text" id="newComment" placeholder="코멘트를 입력하세요… (@handle로 특정 팀원을 언급할 수 있습니다)" autocomplete="off">

        <button class="btn" id="addCommentBtn">등록</button>
      </div>
      <div class="comment-as">현재 작업자: <b>${escapeHtml(currentUserLabel())}</b> 이름으로 등록됩니다</div>
    </div>
    <div class="modal-foot">
      <span class="save-hint" id="saveHint">변경 사항은 자동으로 저장되어 팀원 전체에게 반영됩니다.</span>

  overlay.classList.add('open');

  const commit = async (mutate) => {
    const before=JSON.parse(JSON.stringify(t));
    mutate(t);
    await persist();
    const labels={title:'제목',type:'유형',model:'MODEL',assignee:'담당자',dueRequest:'완료요청일',receivedDate:'수신일',endDate:'완료일',note:'비고',ecnStep:'ECN STEP 1',actionItems:'체크 항목',materialLists:'신규자재 목록',partNumber:'품번',link:'업무 링크',preAppliedDocNo:'선적용 문서번호'};
    const changes=Object.keys(labels).filter(key=>JSON.stringify(before[key])!==JSON.stringify(t[key])).map(key=>labels[key]);
    if(changes.length)await logActivity('update', '<b>'+escapeHtml(currentUserLabel())+'</b>님이 "<b>'+escapeHtml(t.title)+'</b>"의 '+changes.map(escapeHtml).join(', ')+'을(를) 변경했습니다.',t.id);
    if(document.getElementById('overlay').classList.contains('open'))boardViewDirty=true;else renderCurrent();
  };

  {
    // 제목 수정: 긴 제목도 잘리지 않게 내용에 맞춰 높이를 늘리고, Enter로 저장(줄바꿈은 넣지 않음).
    // 비워두면 저장하지 않고 원래 제목으로 되돌린다.
    const fTitle = modal.querySelector('#fTitle');
    const fit = ()=>{ fTitle.style.height='auto'; fTitle.style.height = fTitle.scrollHeight + 'px'; };
    requestAnimationFrame(fit);
    fTitle.addEventListener('input', fit);
    fTitle.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); fTitle.blur(); } });
    fTitle.addEventListener('change', ()=>{
      const v = fTitle.value.replace(/\s*\n\s*/g,' ').trim();
      if(!v){ fTitle.value = t.title; fit(); return; }
      fTitle.value = v; fit();
      if(v !== t.title) commit(task=>{ task.title = v; });
    });
  }
  setupModelCombobox(modal.querySelector('#fModel'));
  modal.querySelector('#fType').addEventListener('change', e=> commit(task=>{ task.type = e.target.value; }));
  modal.querySelector('#fModel').addEventListener('change', e=> commit(task=>{ task.model = e.target.value.trim() || '미분류'; ensureModelKnown(task.model); }));
  modal.querySelector('#fStatus').addEventListener('change', e=> commit(task=>{
    const prevStatus = task.status, prevDelayReason = task.delayReason, prevDelayOverrideAt = task.delayOverrideAt;
    setTaskStatus(task, e.target.value);
    recordUndo(task, prevStatus, prevDelayReason, prevDelayOverrideAt);
    logActivity('status', `"<b>${escapeHtml(task.title)}</b>" 상태가 <b>${escapeHtml(prevStatus)}</b> → <b>${escapeHtml(task.status)}</b>(으)로 변경되었습니다.`, task.id);
    const fEndDate = modal.querySelector('#fEndDate');
    if(fEndDate) fEndDate.value = task.endDate || '';
  }));
  modal.querySelector('#fAssignee').addEventListener('change', e=> commit(task=>{ task.assignee = e.target.value.trim(); }));
  modal.querySelector('#fDue').addEventListener('change', e=> commit(task=>{ task.dueRequest = e.target.value.trim(); }));
  modal.querySelector('#fReceived').addEventListener('change', e=> commit(task=>{ task.receivedDate = e.target.value.trim(); }));
  modal.querySelector('#fEndDate').addEventListener('change', e=> commit(task=>{ task.endDate = e.target.value.trim(); }));
  ['fDue','fReceived','fEndDate'].forEach(id=> attachDatePicker(modal.querySelector('#'+id).closest('.date-picker-field')));
  {
    const noteEl = modal.querySelector('#fNote');
    let noteBeforeEdit = noteEl.innerHTML;
    noteEl.addEventListener('blur', ()=>{
      if(noteEl.innerHTML === noteBeforeEdit) return; // 안 바뀌었으면 저장/로그 남기지 않음
      // 구글 시트는 셀 하나에 약 5만자 제한이 있다 — 이미지(썸네일)를 여러 장 넣으면 그 한도를 넘어
      // 저장이 통째로 실패할 수 있어서, 넘기기 전에 미리 걸러서 알려준다.
      if(noteEl.innerHTML.length > 45000){
        alert('비고 내용이 너무 커서 저장할 수 없습니다 (구글시트 한 칸당 약 5만자 제한). 이미지를 줄이거나 개수를 줄여주세요.');
        noteEl.innerHTML = noteBeforeEdit;
        return;
      }
      noteBeforeEdit = noteEl.innerHTML;
      commit(task=>{ task.note = noteEl.innerHTML; });
    });
    noteEl.addEventListener('paste', async (e)=>{
      const items = (e.clipboardData || {}).items || [];
      for(const item of items){
        if(item.type && item.type.startsWith('image/')){
          e.preventDefault();
          const file = item.getAsFile();
          if(file){
            try{
              const dataUrl = await compressImageToDataUrl(file, 480, 0.6);
              insertHtmlAtCaret(noteEl, '<img src="'+dataUrl+'">');
            }catch(err){ alert('이미지를 처리하지 못했습니다: ' + err.message); }
          }
          return;
        }
      }
      const text = e.clipboardData.getData('text/plain');
      if(!text) return;
      e.preventDefault();
      const trimmed = text.trim();
      const url = safeTaskUrl(trimmed);
      if(url && trimmed === text){
        insertHtmlAtCaret(noteEl, '<a href="'+escapeHtml(url)+'" target="_blank" rel="noopener">'+escapeHtml(trimmed)+'</a>');
      } else {
        insertHtmlAtCaret(noteEl, escapeHtml(text).replace(/\n/g,'<br>'));
      }
    });
  }
  modal.querySelectorAll('input[name=ecn]').forEach(r=>{
    r.addEventListener('change', e=> commit(task=>{ task.ecnStep = e.target.value; }));
  });
  modal.querySelectorAll('.check-list input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const key = e.target.dataset.key;
      commit(task=>{ task.actionItems[key] = e.target.checked; });
      e.target.closest('.check-opt').classList.toggle('done', e.target.checked);
    });

        task.materialLists = task.materialLists || {};
        task.materialLists[key] = task.materialLists[key] || [];

      });

    });
  });

  const submitComment = async () => {
    const input = modal.querySelector('#newComment');

    if(!text) return;

    openDetail(t.id);
    renderCurrent();
  };
  modal.querySelector('#addCommentBtn').addEventListener('click', submitComment);

  // ---------- 코멘트 수정/삭제 ----------
  modal.querySelectorAll('.comment-edit-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ editingCommentKey = btn.dataset.key; openDetail(t.id); });
  });
  modal.querySelectorAll('.comment-cancel-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ editingCommentKey = null; openDetail(t.id); });
  });
  modal.querySelectorAll('.comment-save-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.key;
      const ts = Number(key.slice(key.lastIndexOf(':')+1));
      const c = (t.comments||[]).find(x=>x.ts===ts);
      const input = btn.closest('.comment-edit-row').querySelector('.comment-edit-input');
      const newText = input.value.trim();
      if(!newText || !c) return;
      c.text = newText;
      c.editedAt = Date.now();
      await persist();
      editingCommentKey = null;
      openDetail(t.id);
      renderCurrent();
    });
  });
  modal.querySelectorAll('.comment-delete-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.key;
      const ts = Number(key.slice(key.lastIndexOf(':')+1));
      if(!confirm('이 코멘트를 삭제할까요?')) return;
      t.comments = (t.comments||[]).filter(x=>x.ts!==ts);
      await persist();
      if(editingCommentKey === key) editingCommentKey = null;
      openDetail(t.id);
      renderCurrent();
    });
  });

  // ---------- @멘션 자동완성 ----------
  // "@"를 치면 커서 바로 앞 토큰(@ 다음 글자들)으로 팀원을 찾아 목록을 보여주고, 골라서 넣을 수 있게 한다.
  const newCommentInput = modal.querySelector('#newComment');
  const mentionDropdown = modal.querySelector('#mentionDropdown');
  let mentionMatches = [];
  let mentionActiveIndex = -1;
  function mentionQueryAt(input){
    const m = input.value.slice(0, input.selectionStart).match(/@([a-z0-9_.\-가-힣]*)$/i);
    return m ? m[1] : null;
  }
  function paintMentionDropdown(){
    mentionDropdown.innerHTML = mentionMatches.map((u,i)=>`
      <div class="mention-item${i===mentionActiveIndex?' active':''}" data-idx="${i}">
        ${avatarHtml(u,16)}<span>${escapeHtml(u.name)}</span><span class="muted-cell">@${escapeHtml(u.handle||'')}</span>
      </div>`).join('');
    mentionDropdown.querySelectorAll('.mention-item').forEach(el=>{
      el.addEventListener('mousedown', e=>{ e.preventDefault(); pickMention(Number(el.dataset.idx)); });
    });
  }
  function renderMentionDropdown(){
    const q = mentionQueryAt(newCommentInput);
    if(q === null){ mentionDropdown.style.display='none'; mentionMatches=[]; mentionActiveIndex=-1; return; }
    const ql = q.toLowerCase();
    mentionMatches = USERS.filter(u => (u.handle||'').toLowerCase().includes(ql) || u.name.toLowerCase().includes(ql));
    if(!mentionMatches.length){ mentionDropdown.style.display='none'; mentionActiveIndex=-1; return; }
    mentionActiveIndex = 0;
    paintMentionDropdown();
    mentionDropdown.style.display = 'block';
  }
  function pickMention(idx){
    const u = mentionMatches[idx];
    if(!u) return;
    const pos = newCommentInput.selectionStart;
    const before = newCommentInput.value.slice(0, pos).replace(/@([a-z0-9_.\-가-힣]*)$/i, '@'+u.handle+' ');
    const after = newCommentInput.value.slice(pos);
    newCommentInput.value = before + after;
    newCommentInput.focus();
    newCommentInput.setSelectionRange(before.length, before.length);
    mentionDropdown.style.display = 'none';
    mentionMatches = []; mentionActiveIndex = -1;
  }
  newCommentInput.addEventListener('input', renderMentionDropdown);
  newCommentInput.addEventListener('blur', ()=> setTimeout(()=>{ mentionDropdown.style.display='none'; }, 120));
  newCommentInput.addEventListener('keydown', e=>{
    if(mentionDropdown.style.display==='block' && mentionMatches.length){
      if(e.key==='ArrowDown'){ e.preventDefault(); mentionActiveIndex=(mentionActiveIndex+1)%mentionMatches.length; paintMentionDropdown(); return; }
      if(e.key==='ArrowUp'){ e.preventDefault(); mentionActiveIndex=(mentionActiveIndex-1+mentionMatches.length)%mentionMatches.length; paintMentionDropdown(); return; }
      if(e.key==='Enter' || e.key==='Tab'){ e.preventDefault(); pickMention(mentionActiveIndex); return; }
      if(e.key==='Escape'){ mentionDropdown.style.display='none'; mentionMatches=[]; return; }
    }
    if(e.key==='Enter'){ e.preventDefault(); submitComment(); }
  });
}

function excelDateToStr(v){
  if(v === null || v === undefined || v === '') return '';
  if(typeof v === 'string'){
    const m = v.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if(m) return `${m[1]}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')}`;
    return v.trim();
  }
  if(v instanceof Date && !isNaN(v.getTime())){
    return `${v.getFullYear()}/${String(v.getMonth()+1).padStart(2,'0')}/${String(v.getDate()).padStart(2,'0')}`;
  }
  if(typeof v === 'number'){
    // 엑셀 시리얼 날짜 값 보정 (1900 날짜계 기준)
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}/${String(d.m).padStart(2,'0')}/${String(d.d).padStart(2,'0')}`;
  }
  return String(v).trim();
}
function inferTypeFromDoc(doc){
  const d = (doc||'').toUpperCase();
  if(d.startsWith('NPO')) return 'MDM';
  if(d.startsWith('E00')) return 'ECO';
  return '기타업무';
}
// 일괄등록용 엑셀 양식 다운로드 — handleExcelImport()가 읽는 컬럼명과 정확히 일치시켜서,
// 이 양식을 채워 그대로 업로드하면(과거에 이미 끝난 업무 포함) 바로 반영되도록 한다.
function downloadExcelImportTemplate(){
  const header = ['번호','문서 제목','MODEL','유형','담당자','상태','요청일','수신일','완료일','비고'];
  const sample1 = ['NPO-2509-001','예시) 신규자재 SAP 등록 요청','GMDSS','MDM','User 1','완료','2026/09/01','2026/09/01','2026/09/05','과거에 이미 끝난 업무도 이렇게 상태를 "완료"로 적으면 이력으로 등록됩니다'];
  const sample2 = ['E00-2509-002','예시) 진행 중인 ECO 건','VSAT C1','ECO','User 2','진행 중','2026/09/10','2026/09/08','',''];
  const noteRow = ['※ 상태는 다음 중 하나: '+STATUS_ORDER.join(' / '),'','유형: '+Object.keys(TYPE_META).join(' / '),'','','','날짜는 YYYY/MM/DD','','',''];
  const aoa = [header, sample1, sample2, [], noteRow];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:14},{wch:32},{wch:10},{wch:8},{wch:10},{wch:10},{wch:11},{wch:11},{wch:11},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '업무일괄등록');
  XLSX.writeFile(wb, '업무_일괄등록_양식.xlsx');
}
function bindExcelDrop(zone){
  zone.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();zone.classList.add('drag');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
  zone.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();zone.classList.remove('drag');const file=e.dataTransfer.files[0];if(file)handleExcelImport(file);});
}
async function handleExcelImport(file){
  if(!/\.xlsx?$/i.test(file.name)){alert('엑셀 파일(.xlsx 또는 .xls)을 선택해 주세요.');return;}
  if(typeof XLSX==='undefined'){alert('엑셀 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.');return;}
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(!rows.length){ alert('엑셀에서 데이터를 찾지 못했습니다.'); return; }

    // '번호'(문서번호=ECO/문서 키) 기준으로 그룹핑 — 활동명이 달라도 같은 번호면 하나의 업무로 합침
    const groups = {};
    rows.forEach(r=>{
      const doc = String(r['번호'] ?? r['문서번호'] ?? r['문서 번호'] ?? '').trim();
      if(!doc) return;
      if(!groups[doc]) groups[doc] = r; // 첫 행 기준 대표값 사용 (제목/담당자 등은 보통 동일)
    });
    if(!Object.keys(groups).length){ alert('엑셀에서 문서번호("번호") 컬럼을 찾지 못했습니다.'); return; }

    const toCreate = [];
    const toUpdate = [];
    Object.keys(groups).forEach(doc=>{
      const r = groups[doc];
      const title = String(r['문서 제목'] ?? r['제목'] ?? r['프로젝트 이름'] ?? '').trim();
      const assigneeRaw = String(r['담당자'] ?? '').trim();
      // 외부(Notion 등) 내보내기가 "USER1"처럼 공백/대소문자가 다르게 적는 경우, 실제 팀원 이름으로 정규화
      const normKey = s => s.toLowerCase().replace(/\s+/g,'');
      const matchedUser = assigneeRaw ? USERS.find(u => normKey(u.name) === normKey(assigneeRaw)) : null;
      const assignee = matchedUser ? matchedUser.name : assigneeRaw;
      const dueRequest = excelDateToStr(r['요청일'] ?? r['완료요청일'] ?? '');
      const receivedDate = excelDateToStr(r['수신일'] ?? '');
      const endDate = excelDateToStr(r['완료일'] ?? r['종료일'] ?? '');
      const model = String(r['MODEL'] ?? r['모델'] ?? '').trim();
      const note = String(r['비고'] ?? '').trim();
      // 상태/유형은 양식에 정해진 값과 정확히 일치할 때만 반영하고, 아니면 기존 방식(신규=시작 전, 문서번호로 유형 추정)대로 둔다.
      const statusRaw = String(r['상태'] ?? '').trim();
      const status = STATUS_ORDER.includes(statusRaw) ? statusRaw : '';
      const typeRaw = String(r['유형'] ?? '').trim();
      const type = Object.keys(TYPE_META).includes(typeRaw) ? typeRaw : inferTypeFromDoc(doc);

      const existing = TASKS.find(t => t.docNumber === doc);
      if(existing){
        toUpdate.push({ existing, patch:{title, assignee, dueRequest, receivedDate, endDate, status, note} });
      } else {
        toCreate.push({ doc, title: title || doc, assignee, dueRequest, receivedDate, endDate, type, model, status, note });
      }
    });

    openExcelReview(toCreate, toUpdate);
  }catch(err){
    console.error('엑셀 업로드 오류:', err);
    alert('엑셀 파일을 읽는 중 오류가 발생했습니다. 파일 형식을 확인해 주세요.');
  }
}

        <span style="display:flex; gap:8px; flex:0 0 auto;">

  });

  document.getElementById('closeModal').addEventListener('click', ()=>{ closeModal(); renderCurrent(); });
  document.getElementById('excelCancelBtn').addEventListener('click', ()=>{

    toUpdate.forEach(({existing, patch})=>{

    }
    pendingExcelReview = null;
    closeModal();
    renderCurrent();
  });
}

let pasteListenerRef = null;

let ocrWorkerPromise = null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = Tesseract.createWorker('kor+eng');
  }
  return ocrWorkerPromise;
}

// Tesseract는 스크린샷 속 작은 글자(특히 영문+숫자 혼합 모델명)를 자주 오독한다(예: S↔5, O↔0).
// 단순 canvas 확대보다 Lanczos 리샘플링이 작은 획을 더 또렷하게 보존한다(별도 라이브러리 없이 구현).
function resizeOcrCanvas(source, width, height){
  const sw = source.width, sh = source.height;
  const src = source.getContext('2d').getImageData(0, 0, sw, sh).data;
  const weights = (from, to) => Array.from({length: to}, (_, i) => {
    const center = (i + .5) * from / to - .5, result = []; let sum = 0;
    const stretch = Math.max(1, from / to), radius = 3 * stretch;
    for(let j = Math.ceil(center - radius); j <= Math.floor(center + radius); j++){
      const d = (center - j) / stretch;
      const v = Math.abs(d) < 1e-8 ? 1 : Math.abs(d) >= 3 ? 0 : Math.sin(Math.PI*d) * Math.sin(Math.PI*d/3) / (Math.PI*Math.PI*d*d/3);
      result.push({index: Math.max(0, Math.min(from-1, j)), weight: v}); sum += v;
    }
    result.forEach(r => r.weight /= sum); return result;
  });
  const wx = weights(sw, width), wy = weights(sh, height), temp = new Float32Array(width*sh*3);
  for(let y=0; y<sh; y++) for(let x=0; x<width; x++){
    const out=(y*width+x)*3;
    for(const t of wx[x]){ const pos=(y*sw+t.index)*4; for(let c=0;c<3;c++) temp[out+c]+=src[pos+c]*t.weight; }
  }
  const canvas = document.createElement('canvas'); canvas.width=width; canvas.height=height;
  const ctx = canvas.getContext('2d'), data = ctx.createImageData(width, height);
  for(let y=0; y<height; y++) for(let x=0; x<width; x++){
    const out=(y*width+x)*4; const values=[0,0,0];
    for(const t of wy[y]){ const pos=(t.index*width+x)*3; for(let c=0;c<3;c++) values[c]+=temp[pos+c]*t.weight; }
    for(let c=0;c<3;c++) data.data[out+c]=Math.round(values[c]); data.data[out+3]=255;
  }
  ctx.putImageData(data, 0, 0); return canvas;
}
async function loadImageAsOcrCanvas(file){
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width; canvas.height = bitmap.height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); // 투명 배경 PNG 대비
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0);
  return canvas;
}
// 목표 폭(3600px)에 맞춰 필요한 만큼만 확대한다 — 너무 작은 스크린샷은 키우고, 이미 큰 스크린샷은
// 과도하게(느려지기만 하고) 키우지 않는다.
async function upscaleImageForOcr(file){
  try{
    const base = await loadImageAsOcrCanvas(file);
    const pixels = base.width * base.height;
    const scale = Math.min(3, Math.max(1, 3600/base.width), Math.sqrt(12000000/Math.max(1,pixels)));
    if(scale <= 1.01) return base;
    return resizeOcrCanvas(base, Math.round(base.width*scale), Math.round(base.height*scale));
  }catch(e){
    return null; // 실패 시 null — 호출부가 폴백 처리
  }
}
// 확대본과 별도로, 대비를 높인 버전을 하나 더 만든다(하드 이진화 대신 부드러운 대비 강화 —
// 글자 획 경계의 안티에일리어싱을 살려두는 쪽이 Tesseract 인식에 더 유리하다).
// 배경색이 있거나 흐릿한 스크린샷에서 확대본과는 다른 오독 패턴이 나오는 경우가 많아, 두 버전을
// 함께 인식시켜 서로 비교하는 용도로 쓴다(아래 analyzeScreenshot 참고).
function contrastOcrImage(canvas){
  const copy = document.createElement('canvas'); copy.width=canvas.width; copy.height=canvas.height;
  const ctx = copy.getContext('2d'); ctx.drawImage(canvas, 0, 0);
  const data = ctx.getImageData(0, 0, copy.width, copy.height);
  for(let i=0; i<data.data.length; i+=4){
    const v = Math.max(0, Math.min(255, (data.data[i]*.299 + data.data[i+1]*.587 + data.data[i+2]*.114 - 45) * 1.5));
    data.data[i]=data.data[i+1]=data.data[i+2]=v;
  }
  ctx.putImageData(data, 0, 0); return copy;
}
// Tesseract가 내놓는 단순 텍스트(data.text)는 여러 열로 된 표를 읽을 때 줄 순서가 뒤섞이기 쉽다
// (Windchill 상세화면 같은 2~3열 표에서 특히 심함). 대신 단어별 좌표(TSV)를 y좌표로 묶어 행을
// 재구성하면 원래 표 순서에 훨씬 가까운 텍스트를 얻을 수 있다.
function ocrRowsFromTsv(tsv){
  const words = String(tsv||'').split('\n').slice(1).map(line=>{
    const c = line.replace(/\r$/,'').split('\t');
    return {level:+c[0], x:+c[6], y:+c[7], w:+c[8], h:+c[9], confidence:+c[10], text:c.slice(11).join('\t').trim()};
  }).filter(w=>w.level===5 && w.text && w.h>0);
  const rows = [];
  for(const word of words.sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2) || a.x-b.x)){
    const cy = word.y + word.h/2;
    let row = rows.find(r=>Math.abs(r.cy-cy) <= Math.max(6, Math.min(r.h,word.h)*0.6));
    if(!row){ row={cy, h:word.h, words:[]}; rows.push(row); }
    row.words.push(word);
    row.cy = row.words.reduce((sum,w)=>sum+w.y+w.h/2,0)/row.words.length;
  }
  return rows.sort((a,b)=>a.cy-b.cy).map(row=>{
    const ws = row.words.sort((a,b)=>a.x-b.x);
    return ws.map((w,i)=>{
      const previous = ws[i-1];
      const gap = previous ? w.x-previous.x-previous.w : 0;
      const connected = previous && gap<Math.min(previous.h,w.h)*.2 && (/[가-힣]$/.test(previous.text)||/^[가-힣]/.test(w.text));
      return (i ? (gap>Math.max(18,row.h*1.1) ? '\t' : connected ? '' : ' ') : '') + w.text;
    }).join('');
  }).join('\n');
}
// NPO-xxxx-xxx / E00-xxxx-xxx 형식의 문서번호는 자주 오독되는 문자(O↔0, I/L↔1)가 있는 자리가
// 정해져 있어서, 정규식으로 패턴을 확인한 뒤 그 자리의 문자만 보정한다. Windchill에서 "E00-..."은
// 파란 하이퍼링크로 렌더링되는데, 이 스타일에서 "E"가 "6"으로 오독되는 사례가 실사용 중 확인되어
// (예: "E00-2605-006" → "600-2605-006") 앞자리에 6도 E의 오독으로 인정한다.
function normalizeOcrDocNumber(value){
  const m = String(value||'').toUpperCase().match(/\b(NP[O0]|[E6][O0]{2})\s*[-–—_]\s*([\dOIl]{4})\s*[-–—_]\s*([\dOIl]{3})\b/);
  if(!m) return '';
  const digits = s => s.toUpperCase().replace(/O/g,'0').replace(/[IL]/g,'1');
  return (m[1].startsWith('NP') ? 'NPO' : 'E00') + '-' + digits(m[2]) + '-' + digits(m[3]);
}

// Windchill ECO/MDM 상세 화면 등에는 우리 스키마와 무관한 시스템 메타데이터 라벨이 많다.
// 아래 LABEL_MAP에서 이런 라벨도 "인식은 하되 버리는" 필드(dropOnly:true)로 등록해두면 —
// (1) 표의 칸 경계로 인정되어 옆/아래 칸 값이 서로 섞이지 않고, (2) 그러면서도 화면(비고 등)에는
// 절대 노출되지 않는다. 완전히 무시하면 라벨이 안 잘려서 오히려 다른 필드 값에 섞여 들어간다.
const OCR_DROP_LABELS = [
  '등록자','등록일','ECR 요청자','ECO 유형','Priority','Grade','호환 여부',
  'Hierarchy1','Hierarchy2','Hierarchy3','Hierarchy4','자재유형','분류','등록 구분','최종 수정일','관련 요청자 이메일',
];
// 표 끝 경계 표시용(값을 갖지 않는 섹션 제목) — 바로 위 다단락 필드(비고/사유/설명 등)가 여기까지 잘못
// 이어붙는 것을 막는 용도로만 쓰고, 그 자체는 어떤 필드에도 매핑하지 않는다.
const OCR_STOP_LABELS = ['첨부 파일','관련 객체','적용시점 관리','이력','세부 내용','상세 정보','기본 정보'];
// 라벨을 하나도 못 찾아 원문을 통째로 비고에 넣는 최후의 폴백 경로 전용 — 최소한 뻔히 불필요한
// 시스템 메타데이터 줄만이라도 거른다(정상 매칭 시엔 LABEL_MAP의 dropOnly로 이미 걸러지므로 안 쓰임).
function stripOcrDropLines(text){
  const drop = [...OCR_DROP_LABELS, ...OCR_STOP_LABELS];
  return text.split('\n').filter(line=>{
    const t = line.trim();
    if(!t) return true;
    return !drop.some(label => t.startsWith(label));
  }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

// 화면에서 흔히 쓰이는 라벨 → 우리 스키마 필드 매핑 (라벨:값이 같은 줄에 있는 표/양식 캡처를 전제로 함).
// ECO/MDM 상세화면(Windchill)은 라벨이 우리 자체 등록폼과 다르게 표기되므로(ECO 명/요청 제목 등)
// 같은 필드를 가리키는 여러 표기를 함께 등록해둔다. multiline:true인 항목은 다음 라벨이 나오기
// 전까지 여러 줄을 그대로 유지한다(비고성 서술 내용이라 첫 줄만 자르면 내용이 잘려나가기 때문).
const LABEL_MAP = [
  {key:'docNumber',  labels:['문서번호','문서 번호','ECO 번호','요청 번호','번호']},
  {key:'title',      labels:['프로젝트 이름','프로젝트명','ECO 명','요청 제목','제목']},
  {key:'dueRequest', labels:['완료요청일','완료 요청일']},
  {key:'type',       labels:['유형']},
  {key:'model',      labels:['MODEL','모델']},
  // 담당자는 항상 프로세스 보드에 등록된 User 중에서 사람이 직접 고른다 — 스크린샷 속 이름이 같은
  // 사람이라는 보장이 없으므로 절대 자동 반영하지 않는다. 그래도 라벨 자체는 표의 칸 경계로는
  // 인정해야 옆/아래 칸 값이 섞이지 않으므로 dropOnly로 등록(인식은 하되 값은 버림).
  {key:'assignee',   labels:['담당자','ECO 담당자','MDM 담당자'], dropOnly:true},
  {key:'status',     labels:['상태','문서 상태']},
  {key:'ecrNumber',  labels:['ECR 번호']},
  // 요청자/작업자/도착일은 사용자가 실제 화면에서 표시해준 "가져와야 할 항목" 범위에 없어서
  // (등록자·작업자 모두 대개 "생산기술팀(공용)" 같은 공용 계정으로 찍혀 실제 의미가 없고, 도착일도
  // Windchill 내부 결재/위임 타임스탬프라 우리 팀이 실제로 접수한 날짜와는 다름) 값은 버리고
  // 칸 경계로만 쓴다. 수신일은 대신 등록 시점(오늘)을 기본값으로 채운다(analyzeScreenshot 참고).
  {key:'requester',  labels:['요청자'], dropOnly:true},
  {key:'worker',     labels:['작업자'], dropOnly:true},
  // "활동"은 Windchill 상세화면 상단 탭 이름(세부 내용/적용시점 관리/관련 객체/활동/이력) 중 하나라서,
  // 실제 필드로 인식하면 탭바의 다음 칸("이력" 등)이 값으로 잘못 붙는 사고가 난다(탭 사이 간격이
  // 좁아 옆 탭 이름이 별도 라벨로 인식되지 않고 그대로 값에 흡수됨). 그래서 값은 버리고 칸 경계로만 쓴다.
  {key:'activity',   labels:['활동'], dropOnly:true},
  {key:'arrival',    labels:['도착일'], dropOnly:true},
  {key:'ecoReason',  labels:['ECO 사유'], multiline:true},
  {key:'changeDetails', labels:['변경 내용'], multiline:true},
  {key:'description', labels:['설명'], multiline:true},
  {key:'note',       labels:['비고'], multiline:true},
  ...OCR_DROP_LABELS.map(label=>({key:'_drop_'+label, labels:[label], dropOnly:true})),
  ...OCR_STOP_LABELS.map(label=>({key:'_stop_'+label, labels:[label], dropOnly:true})),
];

// 라벨 문자 사이에 OCR이 공백을 잘못 넣거나 빼는 경우(예: "MO DEL")를 흡수하기 위해,
// 라벨의 각 글자 사이에 임의 개수의 공백/탭을 허용하는 패턴으로 바꾼다.
function ocrLabelPattern(label){
  return [...label.replace(/\s/g,'')].map(c => c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('[ \\t]*');
}
function extractLabeledFields(rawText){
  const text = rawText.replace(/\r/g, '').replace(/\u00a0/g, ' ').replace(/[│┃]/g, '|');
  const allLabels = LABEL_MAP.flatMap(l => l.labels).sort((a,b) => b.replace(/\s/g,'').length - a.replace(/\s/g,'').length);
  // 라벨은 줄 시작이거나 공백 1칸 이상/탭/세로줄(표 칸 경계, OCR이 테두리를 '|'로 읽는 경우 포함) 뒤에
  // 오는 경우만 인정. 원래는 오탐 방지를 위해 공백 2칸 이상만 인정했는데, 실제 Windchill 화면은
  // OCR이 옆 칸과의 간격을 공백 1칸으로만 읽어내는 경우가 흔해서(줄 재구성 시 탭으로 분리되지 않음)
  // 그 경우 라벨이 아예 인식되지 않아 문서번호·완료요청일 등이 통째로 앞 칸 값에 묻혀 유실되는
  // 문제가 반복됐다. 공백 1칸까지 인정하도록 낮춤 — 라벨 목록이 충분히 특이해서 일반 문장 속
  // 우연한 오탐 위험은 낮다고 판단.
  const labelRegex = new RegExp('(^[ \\t|]*|\\t+|[ ]+|[ ]*\\|[ ]*)(' + allLabels.map(ocrLabelPattern).join('|') + ')(?=[ \\t:：|]|$)[ \\t]*[:：]?[ \\t]*', 'gm');

  const hits = [];
  let m;
  while((m = labelRegex.exec(text))){
    // ocrLabelPattern은 라벨 글자 "사이"에만 공백을 허용하므로, 매치된 문자열에서 공백을 지우면
    // 항상 라벨 원문(공백 제거)과 정확히 같다 — 그 값으로 어느 라벨이 매치됐는지 되찾는다.
    const collapsed = m[2].replace(/[ \t]/g, '');
    const matchedEntry = LABEL_MAP.find(l => l.labels.some(lab => lab.replace(/\s/g,'') === collapsed));
    if(!matchedEntry) continue;
    hits.push({ key: matchedEntry.key, start: m.index, valueStart: labelRegex.lastIndex });
    if(m.index === labelRegex.lastIndex) labelRegex.lastIndex++;
  }

  const entryByKey = Object.fromEntries(LABEL_MAP.map(e => [e.key, e]));
  const results = {};
  for(let i = 0; i < hits.length; i++){
    const entry = entryByKey[hits[i].key];
    if(entry && entry.dropOnly) continue; // 표 칸 경계로만 쓰고 값은 버림(옆/아래 칸이 섞이는 것 방지)
    const end = (i + 1 < hits.length) ? hits[i+1].start : text.length;
    let raw = text.slice(hits[i].valueStart, end);
    if(!(entry && entry.multiline)){
      const nl = raw.indexOf('\n');
      if(nl !== -1) raw = raw.slice(0, nl);
    }
    const value = (entry && entry.multiline)
      ? raw.split('\n').map(s=>s.replace(/^[ \t|]+|[ \t|]+$/g,'')).join('\n').replace(/\n{3,}/g,'\n\n').trim()
      : raw.replace(/[ \t]+/g, ' ').replace(/^\|+|\|+$/g, '').trim();
    if(value && !results[hits[i].key]) results[hits[i].key] = value;
  }
  if(results.docNumber){
    results.docNumber = normalizeOcrDocNumber(results.docNumber) || results.docNumber;
  } else {
    // 표 안의 "ECO 번호"/"요청 번호" 칸은 옆 칸과의 간격이 좁아 경계로 인식되지 않아 값을 놓치는
    // 경우가 있다. Windchill 상세화면은 거의 항상 맨 위 제목표시줄에도 같은 문서번호가
    // "E00-2607-015, [V5-8300] ..." 처럼 그대로 나오므로, 표에서 못 찾았으면 첫 줄에서 한 번 더 찾는다.
    const firstLine = text.split('\n').find(s => s.trim()) || '';
    const headerDoc = normalizeOcrDocNumber(firstLine);
    if(headerDoc) results.docNumber = headerDoc;
  }
  return results;
}

function todayDateStr(){
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

/* ================= 커스텀 날짜 선택기 (달력 팝업) ================= */
function formatSlashDate(y,m,d){ return `${y}/${String(m+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`; }
function parseSlashDateParts(s){
  const m = String(s||'').match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(!m) return null;
  return {y:+m[1], m:+m[2]-1, d:+m[3]};
}
let closeOpenDatePicker = null;
function attachDatePicker(fieldEl){
  if(!fieldEl) return;
  const input = fieldEl.querySelector('.date-picker-input');
  const iconBtn = fieldEl.querySelector('.date-picker-icon-btn');
  const openPicker = ()=>{
    if(closeOpenDatePicker) closeOpenDatePicker();
    const popup = document.createElement('div');
    popup.className = 'date-picker-popup open';
    fieldEl.appendChild(popup);
    const parsed = parseSlashDateParts(input.value);
    const today = new Date();
    let viewY = parsed ? parsed.y : today.getFullYear();
    let viewM = parsed ? parsed.m : today.getMonth();
    function draw(){
      const first = new Date(viewY, viewM, 1);
      const startOffset = (first.getDay()+6)%7; // 월요일 시작
      const daysInMonth = new Date(viewY, viewM+1, 0).getDate();
      const daysInPrevMonth = new Date(viewY, viewM, 0).getDate();
      let cells = '';
      for(let i=0;i<startOffset;i++){
        const dd = daysInPrevMonth - startOffset + 1 + i;
        const py = viewM===0? viewY-1 : viewY, pm = viewM===0? 11 : viewM-1;
        cells += `<button type="button" class="dp-cell dp-muted" data-y="${py}" data-m="${pm}" data-d="${dd}">${dd}</button>`;
      }
      for(let d=1; d<=daysInMonth; d++){
        const isToday = viewY===today.getFullYear() && viewM===today.getMonth() && d===today.getDate();
        const isSelected = parsed && viewY===parsed.y && viewM===parsed.m && d===parsed.d;
        cells += `<button type="button" class="dp-cell ${isToday?'dp-today':''} ${isSelected?'dp-selected':''}" data-y="${viewY}" data-m="${viewM}" data-d="${d}">${d}</button>`;
      }
      const trailing = (7 - ((startOffset + daysInMonth) % 7)) % 7;
      for(let i=1;i<=trailing;i++){
        const ny = viewM===11? viewY+1 : viewY, nm = viewM===11? 0 : viewM+1;
        cells += `<button type="button" class="dp-cell dp-muted" data-y="${ny}" data-m="${nm}" data-d="${i}">${i}</button>`;
      }
      popup.innerHTML = `
        <div class="dp-head">
          <button type="button" class="dp-nav-btn" data-nav="-1" aria-label="이전 달">‹</button>
          <span class="dp-title">${viewY}년 ${viewM+1}월</span>
          <button type="button" class="dp-nav-btn" data-nav="1" aria-label="다음 달">›</button>
        </div>
        <div class="dp-weekdays">${['월','화','수','목','금','토','일'].map(w=>`<span>${w}</span>`).join('')}</div>
        <div class="dp-grid">${cells}</div>
        <div class="dp-foot">
          <button type="button" data-today="1">오늘</button>
          <button type="button" data-clear="1">지우기</button>
        </div>
      `;
      popup.querySelector('[data-nav="-1"]').onclick = ()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} draw(); };
      popup.querySelector('[data-nav="1"]').onclick = ()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} draw(); };
      popup.querySelectorAll('.dp-cell').forEach(cell=>{
        cell.onclick = ()=>{
          input.value = formatSlashDate(+cell.dataset.y, +cell.dataset.m, +cell.dataset.d);
          input.dispatchEvent(new Event('change', {bubbles:true}));
          closePicker();
        };
      });
      popup.querySelector('[data-today="1"]').onclick = ()=>{
        const n = new Date();
        input.value = formatSlashDate(n.getFullYear(), n.getMonth(), n.getDate());
        input.dispatchEvent(new Event('change', {bubbles:true}));
        closePicker();
      };
      popup.querySelector('[data-clear="1"]').onclick = ()=>{
        input.value = '';
        input.dispatchEvent(new Event('change', {bubbles:true}));
        closePicker();
      };
    }
    draw();
    function onOutside(e){ if(!fieldEl.contains(e.target)) closePicker(); }
    function onEsc(e){ if(e.key==='Escape'){ e.stopPropagation(); closePicker(); } }
    function closePicker(){
      popup.remove();
      document.removeEventListener('mousedown', onOutside, true);
      document.removeEventListener('keydown', onEsc, true);
      closeOpenDatePicker = null;
    }
    closeOpenDatePicker = closePicker;
    setTimeout(()=>{
      document.addEventListener('mousedown', onOutside, true);
      document.addEventListener('keydown', onEsc, true);
    }, 0);
  };
  iconBtn.addEventListener('click', openPicker);
  input.addEventListener('click', openPicker);
}

function normalizeDate(s){
  if(!s) return '';
  const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  // 예전엔 매칭에 실패하면 원본 문자열(OCR이 잘못 읽은 깨진 값, 예: "2026709-")을 그대로 반환해서
  // 날짜칸에 그대로 들어가버렸다 — 매칭 실패나 말이 안 되는 월/일이면 빈 값으로 돌려서, 호출하는 쪽이
  // "인식 실패"로 취급하고 직접 입력하도록 유도한다(깨진 값을 그냥 넣어주는 것보다 안전함).
  if(!m) return '';
  const y=+m[1], mo=+m[2], d=+m[3];
  if(mo<1||mo>12||d<1||d>31) return '';
  return `${y}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
}

// 스크린샷 OCR로 자동 채워진 값은 글자색을 다르게 표시해서 "내가 입력한 게 아니라 자동으로
// 채워졌다"는 걸 한눈에 알 수 있게 한다. 값이 비어 있으면 표시를 지운다.
function applyAutoFilledValue(el, value){
  if(!el) return;
  el.value = value || '';
  if(value){ el.classList.add('auto-filled'); el.dataset.autoFilled = value; }
  else { el.classList.remove('auto-filled'); delete el.dataset.autoFilled; }
}
// 사람이 그 칸을 직접 고치면(타이핑/선택/달력에서 날짜 선택) 자동채움 표시를 벗긴다 — 새 값이
// 자동으로 채워진 값과 같아도(예: 달력에서 같은 날짜를 다시 선택) "직접 확인했다"는 뜻이므로 지운다.
function clearAutoFilledOnEdit(el){
  if(!el) return;
  const clear = ()=>{ el.classList.remove('auto-filled'); delete el.dataset.autoFilled; };
  el.addEventListener('input', clear);
  el.addEventListener('change', clear);
}

// 서로 다른 전처리(확대본/이진화본)로 두 번 인식한 결과를 필드 단위로 비교한다.
// 값이 둘 다 있는데 서로 다르면 "확신할 수 없는" 필드로 보고, 1번 결과를 기본값으로 채우되
// 두 값을 나란히 비고에 남겨서 사용자가 스스로 판단하게 한다 — 임의로 하나를 정답으로 우기지 않는다.
function reconcileOcrFields(r1, r2){
  const merged = {};
  const disagreements = [];
  const allKeys = new Set([...Object.keys(r1), ...Object.keys(r2)]);
  allKeys.forEach(k=>{
    const v1 = (r1[k]||'').trim(), v2 = (r2[k]||'').trim();
    if(v1 && v2 && v1 !== v2){
      merged[k] = v1;
      disagreements.push({key:k, v1, v2});
    } else {
      merged[k] = v1 || v2;
    }
  });
  return { merged, disagreements };
}
const OCR_FIELD_LABEL = Object.fromEntries(LABEL_MAP.map(l=>[l.key, l.labels[0]]));

// 스크린샷 OCR과 표 텍스트 붙여넣기 둘 다, "라벨:값 텍스트를 해석해서 폼에 채우는" 마지막 단계는
// 완전히 동일하다 — 차이는 그 텍스트를 어떻게 얻었는지(OCR 두 번 vs 클립보드 그대로)뿐이다.
// source: 상태 메시지에 쓸 말("OCR"|"텍스트"), rawText: 라벨을 하나도 못 찾았을 때 폴백으로 보여줄 원문,
// rawTextVerb: 그 폴백 메시지에 쓸 동사("인식된"|"붙여넣은").
function applyExtractedFields(r, disagreements, {source, rawText, rawTextVerb}){
  const statusEl = document.getElementById('shotStatus');
  let inferredType = (r.type && TYPE_META[r.type]) ? r.type : '';
  const doc = (r.docNumber || '').toUpperCase();
  if(!inferredType){
    if(doc.startsWith('NPO')) inferredType = 'MDM';
    else if(doc.startsWith('E00')) inferredType = 'ECO';
  }

  const noteParts = [];
  if(r.ecrNumber) noteParts.push('ECR 번호: ' + r.ecrNumber);
  if(r.ecoReason) noteParts.push('ECO 사유:\n' + r.ecoReason);
  if(r.changeDetails) noteParts.push('변경 내용:\n' + r.changeDetails);
  if(r.description) noteParts.push('설명:\n' + r.description);
  if(r.note) noteParts.push(r.note);
  // 사유/변경내용/설명처럼 여러 줄인 필드는 위에서 이미 전체 내용을 보여줬으므로, 불일치 경고에서
  // 문단 전체를 또 통째로 반복하면 비고가 지저분해진다 — 짧은 단일값 필드만 나란히 비교해서 보여준다.
  const shortDisagreements = disagreements.filter(d => !['ecoReason','changeDetails','description','note'].includes(d.key));
  if(shortDisagreements.length){
    noteParts.push('⚠ 인식 결과가 두 방식에서 다르게 나왔습니다 — 직접 확인해주세요: ' +
      shortDisagreements.map(d => `${OCR_FIELD_LABEL[d.key]||d.key} "${d.v1}" vs "${d.v2}"`).join(', '));
  }
  if(disagreements.length > shortDisagreements.length){
    noteParts.push('⚠ 사유/변경 내용/설명 중 일부는 인식 방식에 따라 글자가 다르게 나왔습니다 — 위 내용을 한 번 더 확인해주세요.');
  }

  const dueNormalized = normalizeDate(r.dueRequest);
  // "도착일"은 우리 스키마의 "수신일"에 대응한다. 화면에 그 정보가 없으면(=인식 실패가 아니라
  // 애초에 그 항목이 없는 화면이면) 업무를 등록하는 지금 이 순간을 수신일로 보는 게 합리적이므로
  // 오늘 날짜를 기본값으로 넣는다 — 단, 라벨을 아예 하나도 못 찾은 경우(엉뚱한 내용일 수 있음)는
  // 추측성 기본값을 넣지 않는다.
  const foundAnyField = Object.keys(r).length > 0;
  const receivedNormalized = normalizeDate(r.arrival) || (foundAnyField ? todayDateStr() : '');

  applyAutoFilledValue(document.getElementById('nTitle'), r.title || '');
  if(inferredType) applyAutoFilledValue(document.getElementById('nType'), inferredType);
  applyAutoFilledValue(document.getElementById('nModel'), r.model || '');
  // 담당자는 스크린샷/붙여넣은 텍스트(Windchill 등록자/ECO 담당자/MDM 담당자 등)에서 절대 자동으로
  // 채우지 않는다 — 그 이름이 프로세스 보드에 등록된 우리 팀원과 같은 사람이라는 보장이 없으므로,
  // 항상 사람이 직접 보드에 등록된 User 중에서 고르게 한다. (r.assignee는 표 칸 경계 인식용으로만 쓰고 버림)
  applyAutoFilledValue(document.getElementById('nDoc'), r.docNumber || '');
  applyAutoFilledValue(document.getElementById('nDue'), dueNormalized);
  applyAutoFilledValue(document.getElementById('nReceived'), receivedNormalized);
  if(r.status && STATUS_ORDER.includes(r.status)) applyAutoFilledValue(document.getElementById('nStatus'), r.status);

  // 라벨을 하나도 못 찾았으면(표 레이아웃이 달라서 등) 아무 필드도 안 채워져서 "아무것도 안 들어간"
  // 것처럼 보인다 — 이 경우엔 원문 텍스트를 비고에 넣어서 최소한 뭐라도 보이게 한다.
  // 단, Windchill ECO/MDM 상세화면처럼 우리 스키마와 무관한 시스템 메타데이터(Hierarchy·Grade 등)가
  // 섞여 들어오는 경우가 많아 stripOcrDropLines로 그 줄들은 먼저 걸러낸다(정상적으로 라벨이
  // 매칭된 경우엔 이미 LABEL_MAP의 dropOnly 항목이 값 단계에서 걸러지므로 여기까지 오지 않는다).
  if(!foundAnyField){
    const cleaned = stripOcrDropLines((rawText||'').trim());
    applyAutoFilledValue(document.getElementById('nNote'), cleaned
      ? `(라벨을 자동으로 찾지 못해 ${rawTextVerb} 원문을 그대로 넣었습니다)\n` + cleaned
      : '');
  } else {
    applyAutoFilledValue(document.getElementById('nNote'), noteParts.join('\n\n'));
  }

  const missing = [];
  if(!r.title) missing.push('프로젝트 이름');
  if(!r.model) missing.push('MODEL');
  if(!r.status) missing.push('상태');
  if(r.dueRequest && !dueNormalized) missing.push('완료요청일(날짜 인식 실패)');
  const disagreeNote = disagreements.length ? ` 2가지 인식 방식 결과가 ${disagreements.length}개 항목에서 달라 비고에 남겨뒀습니다 — 꼭 확인해주세요.` : '';
  // 담당자는 항상 직접 선택해야 하므로(자동으로 채우지 않음) 매번 안내한다.
  statusEl.textContent = !foundAnyField
    ? `${source}은(는) 읽었지만 항목 라벨을 찾지 못했습니다 — 비고에 원문을 넣어뒀으니 직접 옮겨주세요. 담당자도 직접 선택해주세요.`
    : missing.length
      ? `${source} 인식 완료 — 못 찾은 항목(${missing.join(', ')})은 직접 입력해주세요. 담당자도 직접 선택해주세요. 오탈자도 함께 확인해주세요.${disagreeNote}`
      : `${source} 인식 완료 — 담당자를 직접 선택해주세요. 오탈자가 있을 수 있으니 내용을 확인한 뒤 추가를 눌러주세요.${disagreeNote}`;
  statusEl.className = disagreements.length ? 'shot-status busy' : 'shot-status done';
}

async function analyzeScreenshot(file){
  const statusEl = document.getElementById('shotStatus');
  statusEl.textContent = 'OCR 엔진을 불러오는 중… (최초 1회는 다소 시간이 걸릴 수 있어요)';
  statusEl.className = 'shot-status busy';
  try{
    const worker = await getOcrWorker();
    statusEl.textContent = '이미지에서 텍스트를 인식하는 중… (정확도 확인을 위해 2가지 방식으로 읽습니다)';
    const baseCanvas = await upscaleImageForOcr(file); // 실패 시 null → 아래에서 원본 파일로 폴백
    const { data: data1 } = await worker.recognize(baseCanvas || file, {}, {text:true, tsv:true});
    // 표 형태 캡처는 단어 좌표(TSV) 기준으로 줄을 다시 조립해야 열이 섞이지 않는다.
    const text = (data1.tsv ? ocrRowsFromTsv(data1.tsv) : '') || data1.text || '';
    if(!text.trim()) throw new Error('인식된 텍스트가 없습니다.');

    let text2 = '';
    if(baseCanvas){
      const contrasted = contrastOcrImage(baseCanvas);
      const { data: data2 } = await worker.recognize(contrasted, {}, {text:true, tsv:true});
      text2 = (data2.tsv ? ocrRowsFromTsv(data2.tsv) : '') || data2.text || '';
    }

    const r1 = extractLabeledFields(text);
    const r2 = text2 ? extractLabeledFields(text2) : {};
    const { merged: r, disagreements } = reconcileOcrFields(r1, r2);
    applyExtractedFields(r, disagreements, {source:'OCR', rawText:text, rawTextVerb:'인식된'});
  }catch(e){
    statusEl.textContent = '텍스트 인식에 실패했습니다. 더 선명한 이미지로 다시 시도하거나 직접 입력해 주세요.';
    statusEl.className = 'shot-status error';
  }
}

// Windchill 화면에서 표를 직접 드래그로 선택해 복사(Ctrl+C)한 텍스트를 그대로 붙여넣는 경로 —
// OCR과 똑같은 라벨:값 해석 로직을 타지만, 글자를 그대로 복사한 것이라 오독이 전혀 없어 OCR보다
// 훨씬 정확하다. 두 번 읽어 비교할 필요도 없으므로 disagreements는 항상 빈 배열.
function applyPastedText(text){
  const statusEl = document.getElementById('shotStatus');
  try{
    if(!text || !text.trim()) return;
    const r = extractLabeledFields(text);
    applyExtractedFields(r, [], {source:'텍스트', rawText:text, rawTextVerb:'붙여넣은'});
  }catch(e){
    statusEl.textContent = '붙여넣은 텍스트를 처리하는 중 오류가 발생했습니다. 직접 입력해 주세요.';
    statusEl.className = 'shot-status error';
  }
}

  `;
  overlay.classList.add('open');

  const excelZone=document.getElementById('addExcelDrop'),excelInput=document.getElementById('addExcelInput');
  bindExcelDrop(excelZone);

  dropzone.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', ()=>{ if(fileInput.files[0]) analyzeScreenshot(fileInput.files[0]); });
  dropzone.addEventListener('dragover', e=>{ e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e=>{
    e.preventDefault(); dropzone.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if(f && /\.xlsx?$/i.test(f.name)) handleExcelImport(f);
    else if(f && f.type.startsWith('image/')) analyzeScreenshot(f);
  });

  if(pasteListenerRef) document.removeEventListener('paste', pasteListenerRef);
  pasteListenerRef = (e)=>{
    const items = (e.clipboardData || {}).items || [];
    for(const item of items){
      if(item.type && item.type.startsWith('image/')){
        const file = item.getAsFile();
        if(file) analyzeScreenshot(file);
        return;
      }
    }
    const text = e.clipboardData && e.clipboardData.getData ? e.clipboardData.getData('text/plain') : '';
    // Windchill 표를 드래그로 선택해 그대로 복사·붙여넣은 경우를 감지한다. 탭으로 구분된 여러 줄
    // 구조가 표 복사의 특징이라, 단일 입력칸에 짧은 값 하나를 붙여넣는 평소 동작과 안전하게 구분된다
    // — 이 조건이 아니면 가로채지 않고 원래 포커스된 칸에 그대로 붙여넣어지게 둔다.
    if(text && text.includes('\t') && text.trim().split('\n').length >= 2){
      e.preventDefault();
      applyPastedText(text);
    }
  };

    const dup = TASKS.find(t => t.docNumber && t.docNumber.trim().toLowerCase() === docNumber.toLowerCase());
    if(dup){ showDuplicateConfirm(dup); return; }

async function createTaskFromForm(){
  const title = document.getElementById('nTitle').value.trim();
  const type = document.getElementById('nType').value;
  const status = document.getElementById('nStatus').value;
  const model = document.getElementById('nModel').value.trim() || '미분류';
  const blankActionItems = {};
  checklistFor(type).forEach(i=>{ blankActionItems[i.key] = false; });
  const newTask = {
    id: 't' + Date.now(),
    title,
    model,
    assignee: document.getElementById('nAssignee').value.trim(),
    docNumber: document.getElementById('nDoc').value.trim(),
    link: document.getElementById('nLink').value.trim(),
    partNumber: document.getElementById('nPartNumber').value.trim(),
    note: document.getElementById('nNote').value.trim(),
    status,
    dueRequest: document.getElementById('nDue').value.trim(),
    receivedDate: document.getElementById('nReceived').value.trim(),
    type,
    endDate: '',
    ecnStep: type==='ECO' ? 'assigned' : 'na',

    author: currentUserLabel(),
    authorId: currentUserId,
    comments: [],
    delayReason: status==='장기 지연' ? 'manual' : null,
    delayOverrideAt: null
  };

  closeModal();
  renderCurrent();
}

/* ================= THEME ================= */
// 저장된 선택이 없으면 OS(시스템) 다크모드 설정을 따르고, 버튼으로 직접 켜고 끌 수 있다.
// BOM 비교 도구(iframe)도 같은 origin이라 localStorage를 공유하므로, 그쪽에서 로드 시 이 값을 그대로 읽어 적용한다.
function isDarkActive(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t === 'dark') return true;
  if(t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(theme){
  if(theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = isDarkActive() ? '☀️ 라이트 모드' : '🌙 다크 모드';
  // BOM 비교 도구 / 라벨데이터 변환기(둘 다 iframe)는 한 번 만들어지면 재사용되므로,
  // 테마를 바꿀 때 그쪽 문서에도 바로 반영한다.
  try{
    ['sapBomCompareFrame','labelDataFrame'].forEach(id=>{
      const frameDoc = document.getElementById(id)?.contentDocument;
      if(frameDoc && frameDoc.documentElement){
        if(theme === 'dark' || theme === 'light') frameDoc.documentElement.setAttribute('data-theme', theme);
        else frameDoc.documentElement.removeAttribute('data-theme');
      }
    });
  }catch(e){}
  // 업무유형/상태 색상은 렌더링 시점에 getComputedStyle로 읽어 인라인 style로 굳혀두므로,
  // 테마를 바꾼 뒤에는 현재 화면을 다시 그려야 새 팔레트 색이 반영된다.
  if(typeof renderCurrent === 'function' && typeof TASKS !== 'undefined' && TASKS.length) renderCurrent();
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('ppe_theme'); }catch(e){}
  applyTheme(saved);
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.addEventListener('click', ()=>{
    const next = isDarkActive() ? 'light' : 'dark';
    try{ localStorage.setItem('ppe_theme', next); }catch(e){}
    applyTheme(next);
  });
}
initTheme();

/* ================= NOTIFICATIONS (담당자 지정 / @멘션) =================
   같은 브라우저 탭이 열려 있는 동안에만 동작한다(탭을 완전히 닫으면 알림이 오지 않음) —
   서버 푸시(Web Push/VAPID) 없이, 15초 폴링 중 "나에게 온" 변화를 감지해서 그 자리에서
   브라우저 Notification(윈도우 알림센터에 뜸)을 띄우고, 탭이 안 보이는 동안은 제목도 반짝인다. */
const NOTIFY_TITLE_ORIG = document.title;
let notifyTitleBlinkTimer = null;
let notifyAssigneeSnapshot = null; // taskId -> assignee, 폴링 때마다 갱신되는 기준선(최초 로드 시점엔 알림을 울리지 않기 위함)
let notifyCommentCountSnapshot = null; // taskId -> comments.length

// 브라우저 권한(Notification.permission)은 한 번 허용하면 스크립트로 다시 끌 수 없다(브라우저 설정에서만
// 가능) — 그래서 "끄기"는 권한을 되돌리는 게 아니라, 별도의 앱 차원 선호값(notifyPref)으로 실제 알림
// 발송 여부만 가로막는다. 권한 요청은 최초 1회만 필요하고, 그 뒤로는 이 선호값만 토글하면 된다.
const NOTIFY_PREF_KEY = 'ppe_notify_pref';
let notifyPref = true;
try{ const saved = localStorage.getItem(NOTIFY_PREF_KEY); if(saved !== null) notifyPref = saved === '1'; }catch(e){}
function notifySupported(){ return typeof Notification !== 'undefined'; }
function notifyEnabled(){ return notifySupported() && Notification.permission === 'granted' && notifyPref; }
function renderNotifyToggleBtn(){
  const btn = document.getElementById('notifyToggleBtn');
  if(!btn) return;
  if(!notifySupported()){ btn.style.display = 'none'; return; }
  if(Notification.permission === 'denied'){ btn.textContent = '🔕 알림 차단됨 (브라우저 설정에서 허용 필요)'; btn.disabled = true; return; }
  btn.disabled = false;
  if(Notification.permission !== 'granted'){ btn.textContent = '🔔 알림 켜기'; return; }
  btn.textContent = notifyPref ? '🔔 알림 켜짐 (끄려면 클릭)' : '🔕 알림 꺼짐 (켜려면 클릭)';
}
document.getElementById('notifyToggleBtn')?.addEventListener('click', async ()=>{
  if(!notifySupported()) return;
  if(Notification.permission !== 'granted'){
    try{ await Notification.requestPermission(); }catch(e){}
    if(Notification.permission === 'granted'){ notifyPref = true; try{ localStorage.setItem(NOTIFY_PREF_KEY,'1'); }catch(e){} }
  } else {
    notifyPref = !notifyPref;
    try{ localStorage.setItem(NOTIFY_PREF_KEY, notifyPref ? '1' : '0'); }catch(e){}
  }
  renderNotifyToggleBtn();
});
function startTitleBlink(){
  if(notifyTitleBlinkTimer) return;
  let on = false;
  notifyTitleBlinkTimer = setInterval(()=>{
    on = !on;
    document.title = on ? '🔔 새 알림 — ' + NOTIFY_TITLE_ORIG : NOTIFY_TITLE_ORIG;
  }, 1000);
}
function stopTitleBlink(){
  if(notifyTitleBlinkTimer){ clearInterval(notifyTitleBlinkTimer); notifyTitleBlinkTimer = null; }
  document.title = NOTIFY_TITLE_ORIG;
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) stopTitleBlink(); });
window.addEventListener('focus', stopTitleBlink);

function notifyUser(title, body, taskId){
  if(notifyEnabled()){
    try{
      const n = new Notification(title, { body, tag: 'ppe-' + (taskId || Date.now()) });
      n.onclick = ()=>{ window.focus(); if(taskId) openDetail(taskId); n.close(); };
    }catch(e){}
  }
  if(document.hidden) startTitleBlink();
}

// "@handle" 언급을 찾아서 지금 로그인한 사용자와 일치하면 알림을 준다. 대소문자 구분 없음, 단어 경계 기준.
function findMentionedUser(text){
  if(!text) return null;
  const matches = String(text).match(/@([a-z0-9_.\-가-힣]+)/gi) || [];
  for(const m of matches){
    const h = m.slice(1).toLowerCase();
    const u = USERS.find(u => u.handle && u.handle.toLowerCase() === h);
    if(u) return u;
  }
  return null;
}
// 코멘트 표시용 — 등록된 팀원의 handle과 일치하는 "@handle"만 강조 표시(그 외 "@"는 그냥 텍스트로 둠)
function highlightMentions(text){
  const esc = escapeHtml(text);
  return esc.replace(/@([a-z0-9_.\-가-힣]+)/gi, (whole, h) => {
    const u = USERS.find(u => u.handle && u.handle.toLowerCase() === h.toLowerCase());
    return u ? `<mark class="mention-tag">@${escapeHtml(u.handle)}</mark>` : whole;
  });
}
// 서버에서 새로 받아온 tasks와, 그 직전 스냅샷을 비교해서 "나에게 온" 변화(담당자 지정/코멘트 멘션)를 찾아 알린다.
// 최초 로드(스냅샷이 아직 없음)에서는 기존에 이미 있던 배정/댓글까지 전부 알림이 뜨면 안 되므로 건너뛴다.
function checkNotifyDiff(newTasks){
  const me = currentUser();
  const hadSnapshot = !!notifyAssigneeSnapshot;
  const nextAssignee = new Map();
  const nextCommentCount = new Map();
  newTasks.forEach(t=>{
    nextAssignee.set(t.id, t.assignee || '');
    nextCommentCount.set(t.id, (t.comments||[]).length);
    if(hadSnapshot && me){
      const prevAssignee = notifyAssigneeSnapshot.get(t.id);
      if(prevAssignee !== undefined && prevAssignee !== t.assignee && t.assignee && t.assignee === me.name){
        notifyUser('담당자로 지정되었습니다', `"${t.title}" 업무의 담당자로 지정되었습니다.`, t.id);
      }
      const prevCount = notifyCommentCountSnapshot.get(t.id) || 0;
      const comments = t.comments || [];
      if(comments.length > prevCount){
        comments.slice(prevCount).forEach(c=>{
          if(c.authorId === currentUserId) return; // 내가 남긴 댓글은 알림 대상에서 제외
          const mentioned = findMentionedUser(c.text);
          if(mentioned && mentioned.id === currentUserId){
            notifyUser(`${c.author||'누군가'}님이 언급했습니다`, `"${t.title}": ${c.text}`, t.id);
          }
        });
      }
    }
  });
  notifyAssigneeSnapshot = nextAssignee;
  notifyCommentCountSnapshot = nextCommentCount;
}
renderNotifyToggleBtn();

    // (그 사이 revision이 그대로면 refreshBoardShared 자체는 아무 것도 다시 그리지 않고 끝나기 때문).
    renderCurrent();
    refreshBoardShared();
  });
})();
