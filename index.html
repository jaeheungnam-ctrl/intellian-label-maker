<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생산기술팀 업무 프로세스 보드</title>
<script>
// 화면이 그려지기 전에 저장된 테마를 먼저 적용해서, 밝은 화면이 잠깐 번쩍이는 걸 방지한다.
(function(){ try{ var t=localStorage.getItem('ppe_theme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme', t); }catch(e){} })();
</script>
<style>
  :root{
    --ink:#1c2321;
    --paper:#f7f8f6;
    --surface:#ffffff;
    --border:#d8dcd8;
    --border-soft:#e5e8e3;
    --muted:#4a5450;
    --muted-2:#8b948f;
    --primary:#2f6f4f;
    --primary-ink:#234f39;
    --primary-tint:#e7f0ea;
    --accent:#b8860b;
    --accent-tint:#fff6df;

    --s-start:#8b948f;       --s-start-tint:#eef0ed;
    --s-assigned:#5b6eae;    --s-assigned-tint:#e9ecf7;
    --s-progress:#3a6b78;    --s-progress-tint:#e7eef0;
    --s-waiting:#7b5ea7;     --s-waiting-tint:#efe9f6;
    --s-delay:#b3423a;       --s-delay-tint:#faeae9;
    --s-done:#2f6f4f;        --s-done-tint:#e7f0ea;

    --t-mdm:#3a6b78;   --t-mdm-tint:#e7eef0;
    --t-eco:#b8860b;   --t-eco-tint:#fff6df;
    --t-auto:#a6337a;  --t-auto-tint:#f6e8f1;
    --t-etc:#78807c;   --t-etc-tint:#eef0ed;

    /* 대시보드/칸반보드 재설계용 토큰 — 노션풍의 둥글고 부드러운 표면 + 은은한 그림자 */
    --radius-lg:18px; --radius-md:12px;
    --shadow-1:0 1px 2px rgba(28,35,33,.04), 0 8px 20px -8px rgba(28,35,33,.10);
    --shadow-2:0 2px 6px rgba(28,35,33,.06), 0 14px 32px -10px rgba(28,35,33,.16);

    color-scheme: light;
  }
  /* 다크 모드 — 저장된 선택이 없으면 OS 설정을 따르고, "테마" 버튼으로 직접 켜고 끌 수 있다 */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8ebe9; --paper:#14181a; --surface:#1c2224; --border:#33393b; --border-soft:#282e30;
      --muted:#9aa4a0; --muted-2:#6b7470;
      --primary:#4a9c6f; --primary-ink:#7ecba0; --primary-tint:#1c3226;
      --accent:#d4a017; --accent-tint:#3a2f10;
      --s-start:#9aa4a0;    --s-start-tint:#262b29;
      --s-assigned:#8592cf; --s-assigned-tint:#1f2436;
      --s-progress:#5c98a6; --s-progress-tint:#1a2c30;
      --s-waiting:#a58bd0;  --s-waiting-tint:#2a2036;
      --s-delay:#e0736a;    --s-delay-tint:#3a201e;
      --s-done:#4a9c6f;     --s-done-tint:#1c3226;
      --t-mdm:#5c98a6;  --t-mdm-tint:#1a2c30;
      --t-eco:#d4a017;  --t-eco-tint:#3a2f10;
      --t-auto:#cf6bab; --t-auto-tint:#331f2c;
      --t-etc:#9aa19c;  --t-etc-tint:#262b29;
      --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -8px rgba(0,0,0,.5);
      --shadow-2:0 2px 8px rgba(0,0,0,.35), 0 16px 36px -10px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e8ebe9; --paper:#14181a; --surface:#1c2224; --border:#33393b; --border-soft:#282e30;
    --muted:#9aa4a0; --muted-2:#6b7470;
    --primary:#4a9c6f; --primary-ink:#7ecba0; --primary-tint:#1c3226;
    --accent:#d4a017; --accent-tint:#3a2f10;
    --s-start:#9aa4a0;    --s-start-tint:#262b29;
    --s-assigned:#8592cf; --s-assigned-tint:#1f2436;
    --s-progress:#5c98a6; --s-progress-tint:#1a2c30;
    --s-waiting:#a58bd0;  --s-waiting-tint:#2a2036;
    --s-delay:#e0736a;    --s-delay-tint:#3a201e;
    --s-done:#4a9c6f;     --s-done-tint:#1c3226;
    --t-mdm:#5c98a6;  --t-mdm-tint:#1a2c30;
    --t-eco:#d4a017;  --t-eco-tint:#3a2f10;
    --t-auto:#cf6bab; --t-auto-tint:#331f2c;
    --t-etc:#9aa19c;  --t-etc-tint:#262b29;
    --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -8px rgba(0,0,0,.5);
    --shadow-2:0 2px 8px rgba(0,0,0,.35), 0 16px 36px -10px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;}
  button{font-family:inherit;}
  ::selection{background:color-mix(in srgb, #ff8a3d 40%, transparent);}

  /* ---------- layout ---------- */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:212px; flex:0 0 212px;
    background:var(--surface); color:var(--ink);
    border-right:1px solid var(--border);
    padding:20px 14px; display:flex; flex-direction:column; gap:2px;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    color:var(--ink); font-weight:700; font-size:14px; letter-spacing:.2px;
    padding:0 10px 18px; border-bottom:1px solid var(--border-soft); margin-bottom:14px;
  }
  .brand small{display:block; font-weight:400; color:var(--muted-2); font-size:11.5px; margin-top:4px;}
  .navbtn{
    display:flex; align-items:center; gap:9px;
    padding:9px 10px; border-radius:7px; border:none; background:transparent;
    color:var(--muted); text-align:left; font-size:13.5px; font-weight:500; cursor:pointer;
    transition:background .12s, color .12s;
  }
  .navbtn:hover{background:var(--paper); color:var(--ink);}
  .navbtn.active{background:var(--primary); color:#fff;}
  .navbtn .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex:0 0 auto;}
  .nav-badge{
    margin-left:auto; background:var(--accent); color:#fff; font-size:10px; font-weight:700;
    border-radius:20px; padding:1px 6px; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--border-soft);}
  .user-box{margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border-soft);}
  .user-box-label{font-size:10.5px; color:var(--muted-2); font-weight:600; margin-bottom:7px;}
  .user-row{display:flex; align-items:center; gap:8px;}
  .user-avatar{
    width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff;
    font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .user-select{
    flex:1; min-width:0; background:var(--paper); color:var(--ink); border:1px solid var(--border); border-radius:7px;
    padding:6px 6px; font-size:11.5px; font-family:inherit; cursor:pointer; text-overflow:ellipsis;
  }
  .user-select:focus{outline:none; border-color:var(--primary);}
  .sync{font-size:11px; color:var(--muted-2); display:flex; align-items:center; gap:6px; padding:6px 10px;}
  .sync .led{width:6px; height:6px; border-radius:50%; background:var(--primary);}
  .sync.saving .led{background:var(--accent);}
  .resetbtn{
    width:100%; margin-top:6px; background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:7px 10px; border-radius:7px; font-size:11.5px; cursor:pointer;
  }
  .resetbtn:hover{color:var(--ink); border-color:var(--muted-2);}

  .main{flex:1; min-width:0; padding:26px 32px 60px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .topbar h1{font-size:19px; margin:0; font-weight:700;}
  .topbar .sub{color:var(--muted); font-size:12.5px; margin-top:3px;}

  /* ---------- process tab ---------- */
  .proc-intro{max-width:640px; color:var(--muted); margin-bottom:26px; font-size:13.5px;}
  /* 그리드 기반 레이아웃: 폭이 줄어도 칸 수가 고정 배율로만 바뀌어 상자 비율이 흐트러지지 않음
     (예전 flex-wrap 방식은 임의 폭에서 어중간하게 줄바꿈되며 화살표가 허공을 가리키는 문제가 있었음) */
  .flow{display:grid; grid-template-columns:repeat(4, 1fr); gap:28px; margin-bottom:34px;}
  .flow-step{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; position:relative;
  }
  .flow-step::after{
    content:"→"; position:absolute; right:-22px; top:50%; transform:translateY(-50%);
    color:var(--muted-2); font-size:16px;
  }
  .flow-step:last-child::after{content:none;}
  @media (max-width:1150px){
    .flow{grid-template-columns:repeat(2, 1fr); gap:24px 28px;}
    .flow-step::after{content:none;} /* 2열로 접히면 화살표 방향이 애매해지므로 번호만으로 순서 표시 */
  }
  @media (max-width:640px){
    .flow{grid-template-columns:1fr;}
  }
  .flow-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; background:var(--primary-tint); color:var(--primary-ink);
    font-size:11.5px; font-weight:700; margin-bottom:10px;
  }
  .flow-step h3{font-size:13.5px; margin:0 0 6px;}
  .flow-step p{margin:0; font-size:12px; color:var(--muted); line-height:1.55;}

  .proc-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:20px; align-items:start;}
  @media (max-width:980px){.proc-grid{grid-template-columns:1fr;}}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px 20px;}
  .panel h3{font-size:13.5px; margin:0 0 12px;}
  .checklist-demo{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .checklist-demo li{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink);}
  .checklist-demo .box{width:15px; height:15px; border-radius:4px; border:1.5px solid var(--border); flex:0 0 auto;}
  .legend-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--border-soft); font-size:12.8px;}
  .legend-row:last-child{border-bottom:none;}
  .legend-left{display:flex; align-items:center; gap:9px;}
  .swatch{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .legend-count{color:var(--muted-2); font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:11.5px;}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center;}
  .search{
    flex:1 1 220px; min-width:180px;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; font-size:13px; color:var(--ink);
  }
  .search:focus{outline:none; border-color:var(--primary);}
  select.filt{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:7px 10px; font-size:12.5px; color:var(--ink); cursor:pointer;
  }
  .btn{
    background:var(--primary); color:#fff; border:none; border-radius:8px;
    padding:8px 14px; font-size:12.8px; font-weight:600; cursor:pointer;
  }
  .btn:hover{background:var(--primary-ink);}
  .btn-ghost{background:var(--surface); color:var(--ink); border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--muted-2);}
  .mytoggle{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 12px;
    font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap;
  }
  .mytoggle:hover{border-color:var(--muted-2);}
  .mytoggle.on{background:var(--primary); border-color:var(--primary); color:#fff;}
  .filter-active-badge{
    display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--primary-ink);
    background:var(--primary-tint); border-radius:7px; padding:6px 12px; margin:-6px 0 14px; width:fit-content;
  }
  .filter-active-badge button{
    background:transparent; border:none; color:var(--primary-ink); text-decoration:underline; font-size:11.5px; cursor:pointer; padding:0;
  }
  .stat-strip{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .notif-filter-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .stat-chip{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; font-size:11.8px; color:var(--muted); display:flex; align-items:center; gap:7px;
  }
  .stat-chip b{color:var(--ink); font-size:14px; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;}

  /* ---------- board (kanban, redesigned) ---------- */
  .board{display:flex; gap:16px; overflow-x:auto; padding-bottom:10px; align-items:flex-start;}
  .col{
    background:color-mix(in srgb, var(--col-tint, var(--paper)) 55%, var(--paper)); border-radius:var(--radius-lg); padding:14px; flex:1 1 264px; min-width:264px;
    border:1px solid color-mix(in srgb, var(--col-accent, var(--border-soft)) 30%, var(--border-soft));
  }
  .col-head{display:flex; align-items:center; gap:8px; padding:2px 4px 10px;}
  .col-head .dot{width:9px; height:9px; border-radius:50%; box-shadow:0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);}
  .col-head span.name{font-weight:800; font-size:13.5px;}
  .col-head span.cnt{margin-left:auto; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:11.5px; color:var(--muted); background:var(--surface); border-radius:999px; padding:1px 8px;}
  .col-progress{height:5px; border-radius:999px; background:rgba(120,120,120,.18); overflow:hidden; margin:0 2px 12px;}
  .col-progress-fill{height:100%; border-radius:999px; transition:width .4s ease;}
  .col-body{display:flex; flex-direction:column; gap:10px; max-height:calc(100vh - 260px); overflow-y:auto; padding:4px; border-radius:var(--radius-md); transition:background .12s, outline-color .12s;}
  .col-body.drag-over, .delay-sublist.drag-over{background:color-mix(in srgb, var(--primary) 12%, transparent); outline:2px dashed var(--primary); outline-offset:-2px;}
  /* 다크모드: 흰 배경 기준으로 만든 색 톤이 어두운 배경에서는 채도가 죽어 보이므로,
     컬럼 배경/테두리를 --surface 기준으로 더 진하게 섞고, 드래그 상태 표시도 더 또렷하게 보정한다. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .col{
      background:color-mix(in srgb, var(--col-tint, var(--surface)) 78%, var(--surface));
      border-color:color-mix(in srgb, var(--col-accent, var(--border)) 55%, var(--border));
    }
    :root:not([data-theme="light"]) .col-body.drag-over, :root:not([data-theme="light"]) .delay-sublist.drag-over{
      background:color-mix(in srgb, #ff8a3d 28%, transparent); outline-color:#ff8a3d;
    }
    :root:not([data-theme="light"]) .card.dragging{opacity:.55; outline:2px dashed #ff8a3d; outline-offset:2px;}
  }
  :root[data-theme="dark"] .col{
    background:color-mix(in srgb, var(--col-tint, var(--surface)) 78%, var(--surface));
    border-color:color-mix(in srgb, var(--col-accent, var(--border)) 55%, var(--border));
  }
  :root[data-theme="dark"] .col-body.drag-over, :root[data-theme="dark"] .delay-sublist.drag-over{
    background:color-mix(in srgb, #ff8a3d 28%, transparent); outline-color:#ff8a3d;
  }
  :root[data-theme="dark"] .card.dragging{opacity:.55; outline:2px dashed #ff8a3d; outline-offset:2px;}
  .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md);
    padding:12px 13px; cursor:grab; box-shadow:var(--shadow-1); position:relative;
    transition:box-shadow .14s ease, transform .14s ease, opacity .14s ease;
  }
  .card::before{
    content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:999px;
    background:var(--card-accent, var(--muted-2));
  }
  .card{padding-left:16px;}
  .card:hover{box-shadow:var(--shadow-2);}
  .card.dragging{opacity:.4; cursor:grabbing;}
  .card .badges{display:flex; gap:5px; margin-bottom:8px; flex-wrap:wrap; align-items:center;}
  .k-ring{
    margin-left:auto; width:28px; height:28px; border-radius:50%; flex:0 0 auto; position:relative;
    background:conic-gradient(var(--primary) calc(var(--pct)*1%), var(--border-soft) 0);
    display:flex; align-items:center; justify-content:center;
    font-size:7.5px; font-weight:800; color:var(--ink);
  }
  .k-ring::before{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--surface); z-index:-1;}
  .card-author{display:flex; align-items:center; gap:6px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border-soft); font-size:10.5px;}
  .card.card-overdue{box-shadow:var(--shadow-1), 0 0 0 1.5px var(--s-delay) inset;}
  .card.card-soon{box-shadow:var(--shadow-1), 0 0 0 1.5px var(--accent) inset;}
  .due-badge{font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; border:1px solid; white-space:nowrap;}
  .unread-badge{
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; white-space:nowrap;
    background:var(--accent-tint); color:var(--accent);
  }
  .same-author-dot{display:inline-block; width:9px; height:9px; border-radius:50%;}
  .undo-toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#232b28; color:#fff; padding:10px 12px 10px 16px; border-radius:9px;
    display:flex; align-items:center; gap:14px; font-size:12.8px; box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:80; max-width:90vw;
  }
  .undo-toast.show{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0);}
  .undo-toast b{color:#fff;}
  .undo-toast button{
    background:#fff; color:var(--ink); border:none; border-radius:6px; padding:6px 10px;
    font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .undo-toast button:hover{background:#e7eef8;}
  .excel-review-list{display:flex; flex-direction:column; gap:8px; margin-bottom:6px;}
  .excel-review-row{
    display:flex; align-items:center; gap:12px; padding:9px 12px; background:var(--paper); border-radius:8px; flex-wrap:wrap;
  }
  .excel-review-main{display:flex; align-items:center; gap:9px; flex:1; min-width:220px; flex-wrap:wrap;}
  .excel-review-title{font-size:12.6px; font-weight:500;}
  .excel-model-input{
    border:1px solid var(--border); border-radius:7px; padding:6px 9px; font-size:12.5px; font-family:inherit;
    width:180px; flex:0 0 auto;
  }
  .excel-model-input:focus{outline:none; border-color:var(--primary);}
  .combo-wrap{position:relative;}
  .combo-list{
    position:absolute; top:100%; left:0; right:0; margin-top:3px; background:var(--surface);
    border:1px solid var(--border); border-radius:8px; max-height:170px; overflow-y:auto;
    box-shadow:0 6px 18px rgba(28,35,33,.12); z-index:30; display:none;
  }
  .combo-opt{padding:7px 11px; font-size:12.5px; cursor:pointer;}
  .combo-opt:hover{background:var(--primary-tint);}
  .notif-list{display:flex; flex-direction:column; gap:8px;}
  .notif-item{
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    cursor:pointer; display:flex; gap:12px; align-items:flex-start; transition:box-shadow .12s;
  }
  .notif-item:hover{box-shadow:0 2px 10px rgba(28,35,33,.08); border-color:var(--muted-2);}
  .notif-icon{
    width:28px; height:28px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-size:13px; background:var(--primary-tint); color:var(--primary-ink);
  }
  .notif-body{flex:1; min-width:0;}
  .notif-msg{font-size:13px; color:var(--ink); line-height:1.5;}
  .notif-msg b{font-weight:600;}
  .notif-time{font-size:11px; color:var(--muted-2); margin-top:3px;}
  .notif-empty{color:var(--muted-2); font-size:13px; text-align:center; padding:60px 20px;}
  .announce-list{display:flex; flex-direction:column; gap:10px; max-width:640px;}
  .announce-item{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px;}
  .announce-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .announce-title{font-size:14px; font-weight:700; color:var(--ink);}
  .announce-body{font-size:13px; color:var(--ink); line-height:1.6; margin-top:8px; white-space:pre-wrap;}
  .announce-meta{font-size:11px; color:var(--muted-2); margin-top:8px;}
  .settings-tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border-soft); padding-bottom:0;}
  .settings-tab{
    background:transparent; border:none; padding:9px 16px; font-size:13px; font-weight:600; color:var(--muted);
    cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .settings-tab.active{color:var(--primary); border-bottom-color:var(--primary);}
  .settings-desc{font-size:12.5px; color:var(--muted); margin:0 0 14px;}
  .settings-item-list{display:flex; flex-direction:column; gap:7px; margin-bottom:4px;}
  .settings-item-row{
    display:flex; align-items:center; justify-content:space-between; padding:8px 12px;
    background:var(--paper); border-radius:8px; font-size:13px;
  }
  .checklist-item-wrap{border-radius:8px; padding:0 4px; transition:background .12s, outline-color .12s;}
  .checklist-item-wrap.dragging{opacity:.4;}
  .checklist-item-wrap.drag-over{outline:2px dashed var(--primary); outline-offset:-2px; background:color-mix(in srgb, var(--primary) 10%, transparent);}
  .ci-drag-handle{cursor:grab; color:var(--muted); font-size:15px; padding:0 2px; user-select:none;}
  .checklist-edit-row{display:flex; align-items:center; gap:8px; padding:6px 0;}
  .checklist-edit-row input.ci-label{
    border:1px solid var(--border); border-radius:7px; padding:6px 9px; font-size:12.8px; font-family:inherit;
  }
  .ci-email-template{
    width:100%; border:1px solid var(--border); border-radius:7px; padding:8px 10px; font-size:12px; font-family:inherit;
    min-height:70px; margin:2px 0 8px; resize:vertical; color:var(--muted);
  }
  .checklist-add-row{display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border-soft);}
  .checklist-add-row input{flex:1; border:1px solid var(--border); border-radius:7px; padding:7px 10px; font-size:12.5px;}
  .checklist-add-row select{border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:12.5px;}
  .advance-btn{
    width:100%; margin-top:10px; background:var(--primary-tint); color:var(--primary-ink); border:none;
    border-radius:999px; padding:7px 10px; font-size:11px; font-weight:700; cursor:pointer; text-align:center;
    transition:background .12s, color .12s;
  }
  .advance-btn:hover{background:var(--primary); color:#fff;}
  .tag{
    font-size:10px; font-weight:600; padding:2px 6px; border-radius:4px; letter-spacing:.2px;
  }
  .k-tag{
    font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.2px;
  }
  .card .title{font-size:13.8px; font-weight:700; line-height:1.4; margin-bottom:8px; letter-spacing:-.01em;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .card .meta{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--muted-2); gap:8px;}
  .card .doc{font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .k-assignee{display:flex; align-items:center; gap:5px; flex:0 0 auto; font-weight:600; color:var(--ink);}
  .empty-col{color:var(--muted-2); font-size:11.5px; text-align:center; padding:22px 4px; border:1.5px dashed var(--border); border-radius:var(--radius-md);}
  .delay-subsection{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}
  .delay-subhead{
    width:100%; display:flex; align-items:center; gap:7px; background:transparent; border:none; cursor:pointer;
    padding:4px 2px 8px; font-size:12px; font-weight:700; color:var(--ink); text-align:left;
  }
  .delay-subhead .chev{font-size:9px; color:var(--muted-2); transition:transform .15s;}
  .delay-subsection.collapsed .chev{transform:rotate(-90deg);}
  .delay-subhead .cnt{margin-left:auto; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:11px; color:var(--muted); background:var(--surface); border-radius:999px; padding:1px 8px;}
  .delay-sublist{display:flex; flex-direction:column; gap:10px;}
  .delay-subsection.collapsed .delay-sublist{display:none;}

  /* ---------- list (table) ---------- */
  .group{margin-bottom:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .group-head{
    display:flex; align-items:center; gap:10px; padding:11px 16px; cursor:pointer;
    background:var(--paper); user-select:none;
  }
  .group-head:hover{background:var(--border-soft);}
  .group-head .chev{font-size:10px; color:var(--muted-2); transition:transform .15s; width:10px;}
  .group.collapsed .chev{transform:rotate(-90deg);}
  .group-head .gname{font-weight:600; font-size:13px;}
  .group-head .gcount{font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:11.5px; color:var(--muted-2); background:var(--paper); padding:1px 8px; border-radius:20px;}
  table{width:100%; border-collapse:collapse; font-size:12.6px;}
  .group.collapsed table{display:none;}
  thead th{
    text-align:left; font-weight:600; color:var(--muted); font-size:11px;
    padding:8px 14px; border-bottom:1px solid var(--border-soft); background:var(--paper);
  }
  tbody td{padding:9px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--paper);}
  tbody tr:last-child td{border-bottom:none;}
  .td-title{max-width:340px;}
  .status-pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .status-pill .d{width:6px; height:6px; border-radius:50%;}
  .assignee-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink);
  }
  .avatar{
    width:17px; height:17px; border-radius:50%; background:var(--primary-tint); color:var(--primary-ink);
    font-size:9px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .muted-cell{color:var(--muted-2);}
  .no-result{padding:40px 20px; text-align:center; color:var(--muted-2); font-size:13px;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,20,26,.42); display:none;
    align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface); border-radius:12px; width:100%; max-width:640px;
    box-shadow:0 20px 60px rgba(10,15,25,.25); margin-bottom:5vh;
  }
  .modal-head{padding:22px 26px 16px; border-bottom:1px solid var(--border-soft);}
  .modal-head .badges{display:flex; gap:6px; margin-bottom:10px;}
  .modal-head h2{font-size:16.5px; margin:0; line-height:1.4;}
  .modal-body{padding:20px 26px;}
  .field-row{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:16px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11px; color:var(--muted); font-weight:600;}
  .field .val{font-size:13px;}
  .field select, .field input[type=text], .field input[type=url]{
    border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:12.8px; font-family:inherit; color:var(--ink);
  }
  .field select:focus, .field input:focus{outline:none; border-color:var(--primary);}
  /* ---------- 커스텀 날짜 선택기 ---------- */
  .date-picker-field{position:relative; display:flex; align-items:stretch; gap:6px;}
  .date-picker-input{flex:1; border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:12.8px; font-family:inherit; color:var(--ink); background:var(--surface); cursor:pointer;}
  .date-picker-input:focus{outline:none; border-color:var(--primary);}
  .date-picker-icon-btn{
    display:flex; align-items:center; justify-content:center; width:38px; height:auto; flex:0 0 auto;
    border:1px solid var(--border); border-radius:7px; background:var(--surface); cursor:pointer; font-size:20px; line-height:1;
  }
  .date-picker-icon-btn:hover{background:var(--paper); border-color:var(--primary);}
  .date-picker-popup{
    position:absolute; top:calc(100% + 6px); left:0; z-index:80; width:280px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg,14px); box-shadow:var(--shadow-2, 0 12px 32px rgba(10,15,25,.22));
    padding:12px;
  }
  .dp-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .dp-head .dp-title{font-weight:700; font-size:13.5px;}
  .dp-nav-btn{border:none; background:transparent; cursor:pointer; font-size:17px; padding:4px 9px; border-radius:7px; color:var(--muted);}
  .dp-nav-btn:hover{background:var(--paper); color:var(--ink);}
  .dp-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10.5px; color:var(--muted); margin-bottom:4px;}
  .dp-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .dp-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border:none; background:transparent; border-radius:9px; font-size:12.5px; cursor:pointer; color:var(--ink); font-family:inherit;}
  .dp-cell:hover{background:var(--paper);}
  .dp-cell.dp-muted{color:var(--muted); opacity:.4;}
  .dp-cell.dp-today{box-shadow:inset 0 0 0 1.5px var(--primary);}
  .dp-cell.dp-selected{background:var(--primary); color:#fff; font-weight:700;}
  .dp-foot{display:flex; justify-content:space-between; margin-top:10px; padding-top:8px; border-top:1px dashed var(--border-soft);}
  .dp-foot button{border:none; background:transparent; color:var(--primary); font-size:12px; cursor:pointer; font-weight:600; padding:4px 6px; border-radius:6px;}
  .dp-foot button:hover{background:var(--primary-tint);}
  .doclink{color:var(--primary); text-decoration:none; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:12.6px;}
  .doclink:hover{text-decoration:underline;}
  .section-title{font-size:12px; font-weight:700; color:var(--muted); margin:20px 0 10px; text-transform:none;}
  .radio-row{display:flex; gap:16px; margin-bottom:4px;}
  .radio-opt{display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer;}
  .radio-opt input{accent-color:var(--primary); width:15px; height:15px;}
  .check-list{display:flex; flex-direction:column; gap:9px; margin-top:2px;}
  .check-opt{display:flex; align-items:center; gap:9px; font-size:13px; cursor:pointer;}
  .check-opt input{accent-color:var(--primary); width:15px; height:15px;}
  .check-opt.done span{color:var(--muted-2); text-decoration:line-through;}
  .check-opt-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .mini-action-btn{
    background:var(--primary-tint); color:var(--primary-ink); border:none; border-radius:6px;
    padding:5px 10px; font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap; flex:0 0 auto;
  }
  .mini-action-btn:hover{background:var(--primary); color:#fff;}
  .mail-preview{margin-top:8px; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .mail-preview-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 11px;
    background:var(--paper); font-size:11.5px; color:var(--muted);
  }
  .mail-preview-text{
    display:block; width:100%; min-height:150px; border:none; padding:12px; font-size:12.6px;
    font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; color:var(--ink); resize:vertical; background:var(--surface);
  }
  .mail-preview-text:focus{outline:none;}
  .material-list-block{display:flex; flex-direction:column; gap:8px;}
  .material-rows{display:flex; flex-direction:column; gap:6px;}
  .material-row{display:flex; align-items:center; gap:8px;}
  .material-input{flex:1; border:1px solid var(--border); border-radius:7px; padding:7px 10px; font-size:12.8px;}
  .material-row-del{background:none; border:none; color:var(--muted-2); cursor:pointer; font-size:13px; padding:2px 6px; flex:0 0 auto;}
  .material-row-del:hover{color:var(--danger, #b3423a);}
  .material-add-btn{align-self:flex-start;}
  .material-empty{font-size:12px; color:var(--muted-2); padding:2px 0;}
  .comments-list{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
  .comment-item{background:var(--paper); border-radius:8px; padding:8px 11px;}
  .comment-item .c-head{display:flex; align-items:baseline; gap:7px; margin-bottom:3px;}
  .comment-item .c-author{font-size:12px; font-weight:700; color:var(--ink);}
  .comment-item .c-time{font-size:10.5px; color:var(--muted-2);}
  .comment-item .c-text{font-size:12.6px; color:var(--ink); line-height:1.5; white-space:pre-wrap;}
  .comment-empty{font-size:12px; color:var(--muted-2); padding:4px 0 10px;}
  .comment-input-row{display:flex; gap:8px;}
  .comment-input-row input{
    flex:1; border:1px solid var(--border); border-radius:7px; padding:8px 10px; font-size:12.8px; font-family:inherit;
  }
  .comment-input-row input:focus{outline:none; border-color:var(--primary);}
  .comment-as{font-size:11px; color:var(--muted-2); margin-top:6px;}
  textarea.note{
    width:100%; border:1px solid var(--border); border-radius:7px; padding:9px 10px; font-family:inherit;
    font-size:12.8px; resize:vertical; min-height:56px; color:var(--ink);
  }
  textarea.note:focus{outline:none; border-color:var(--primary);}
  .modal-foot{padding:14px 26px 20px; display:flex; justify-content:space-between; align-items:center;}
  .save-hint{font-size:11px; color:var(--muted-2);}
  .closebtn{background:transparent; border:none; font-size:20px; color:var(--muted-2); cursor:pointer; line-height:1; padding:4px;}
  .modal-x{display:flex; justify-content:flex-end; padding:14px 18px 0;}

  /* add form — screenshot dropzone */
  .dropzone{
    border:1.5px dashed var(--border); border-radius:10px; padding:22px 16px; text-align:center;
    cursor:pointer; background:var(--paper); transition:border-color .12s, background .12s;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--primary); background:var(--primary-tint);}
  .dz-icon{font-size:22px; margin-bottom:6px;}
  .dz-text{font-size:12.5px; color:var(--muted); line-height:1.6;}
  .dz-text b{color:var(--ink);}
  .shot-status{font-size:11.5px; margin-top:8px; min-height:14px;}
  .shot-status.busy{color:var(--accent);}
  .shot-status.done{color:var(--s-done);}
  .shot-status.error{color:var(--s-delay);}

  /* add form */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .form-grid label{display:block; font-size:11px; color:var(--muted); font-weight:600; margin-bottom:5px;}
  .form-grid input, .form-grid select{
    width:100%; border:1px solid var(--border); border-radius:7px; padding:8px 10px; font-size:12.8px; font-family:inherit;
  }

  .menubtn{display:none; background:var(--primary); color:#fff; border:none; border-radius:7px; padding:7px 10px; font-size:16px; margin-bottom:10px;}
  @media (max-width:760px){
    .sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
    .sidebar.open{transform:translateX(0); box-shadow:0 0 0 100vmax rgba(0,0,0,.35);}
    .main{padding:18px 14px 50px;}
    .menubtn{display:inline-flex;}
    .field-row{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
  }
/* ---------- dashboard (redesigned) ---------- */
.dq-hero{display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.dq-ring-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1); padding:20px; display:flex; align-items:center; gap:16px; flex:0 0 auto;
}
.dq-ring-wrap{position:relative; width:104px; height:104px; flex:0 0 auto;}
.dq-ring{width:104px; height:104px; transform:rotate(-90deg);}
.dq-ring-track{fill:none; stroke:var(--border-soft); stroke-width:10;}
.dq-ring-fill{fill:none; stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .5s ease;}
.dq-ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.dq-ring-label strong{font-size:26px; line-height:1.1; font-weight:800;}
.dq-ring-label span{font-size:11px; color:var(--muted); margin-top:2px;}
.dq-tiles{display:flex; gap:12px; flex:1; flex-wrap:wrap;}
.dq-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  box-shadow:var(--shadow-1); padding:14px 18px; display:flex; align-items:center; gap:14px; flex:1; min-width:140px;
}
.dq-tile-ico{font-size:24px; flex:0 0 auto;}
.dq-tile strong{display:block; font-size:34px; line-height:1.15; font-weight:800; letter-spacing:-.02em;}
.dq-tile span{font-size:12px; color:var(--muted); white-space:nowrap;}
.dq-tile-warn{border-color:var(--s-delay); background:var(--s-delay-tint);}
.dq-tile-warn strong{color:var(--s-delay);}

.dq-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media(max-width:960px){.dq-grid{grid-template-columns:1fr;}}

.dash-panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1); padding:20px; margin-bottom:20px;
}
.dash-panel h2{font-size:15px; margin:0 0 6px; display:flex; align-items:center; gap:8px;}
.dash-note{color:var(--muted); font-size:12px; margin:6px 0 14px;}

.dq-workload{display:flex; flex-direction:column; gap:10px;}
.dq-wl-row{
  display:grid; grid-template-columns:88px 1fr 30px; align-items:center; gap:10px; width:100%;
  background:none; border:none; padding:5px 6px; margin:0 -6px; border-radius:8px; cursor:pointer; font:inherit; text-align:left;
  transition:background .12s;
}
.dq-wl-row:hover{background:var(--paper);}
.dq-wl-name{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dq-wl-bar-track{background:var(--paper); border-radius:999px; height:10px; overflow:hidden;}
.dq-wl-bar-fill{height:100%; border-radius:999px; transition:width .4s ease;}
.dq-wl-count{font-size:12px; font-weight:700; text-align:right; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;}

.dq-stack{display:flex; height:16px; border-radius:999px; overflow:hidden; background:var(--paper); margin-bottom:12px;}
.dq-stack-seg{transition:width .4s ease;}
.dq-stack-legend{display:flex; flex-wrap:wrap; gap:10px 14px; font-size:11.5px; color:var(--muted);}
.dq-stack-legend i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}
.dq-stack-legend b{color:var(--ink);}

.dq-deadline-row{display:flex; gap:10px; overflow-x:auto; overflow-y:visible; padding:6px 4px 8px;}
.dq-deadline-card{
  flex:0 0 auto; min-width:180px; max-width:220px; text-align:left; background:var(--paper);
  border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; cursor:pointer;
  transition:box-shadow .12s, transform .12s;
}
.dq-deadline-card:hover{box-shadow:var(--shadow-2); transform:translateY(-2px);}
.dq-deadline-card.is-overdue{background:var(--s-delay-tint); border-color:var(--s-delay);}
.dq-dl-days{display:block; font-size:11px; font-weight:700; color:var(--accent); margin-bottom:6px;}
.dq-deadline-card.is-overdue .dq-dl-days{color:var(--s-delay);}
.dq-dl-title{display:-webkit-box; font-size:12.5px; font-weight:600; line-height:1.4; margin-bottom:6px; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.dq-dl-meta{display:block; font-size:11px; color:var(--muted);}

.dash-controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:18px;}
.dash-controls h2{font-size:16px; margin:0 auto 0 6px;}

.dash-scroll{overflow:auto;}
.dash-week{display:grid; grid-template-columns:repeat(7,minmax(140px,1fr)); min-width:980px; gap:8px;}
.dash-day{
  background:var(--surface); border-radius:var(--radius-md); min-height:185px; padding:11px;
  max-height:330px; overflow:auto; border:1px solid var(--border-soft);

<script>

const BOARD_DEFAULT_API='https://script.google.com/macros/s/AKfycbwxBnE9j7VfeX-vwd8W-mn2tgYx5QqjD5DHVB2pp1U25WtOjOQa7MMZJmhZ0t-_H-09/exec';

// boardSync: 예전에는 tasks 배열 전체를 outbox에 넣어 통째로 저장했지만,
// 이제는 "바뀐 카드 id" 단위로만 서버에 반영합니다. 그래서 서로 다른 카드를
// 여러 명이 동시에 고쳐도 서버 쪽 잠금 시간이 아주 짧게 끝납니다.
const boardSync={
  url:localStorage.getItem('ppe_board_api_url')||BOARD_DEFAULT_API,
  token:localStorage.getItem('ppe_board_api_token')||'',
  error:'', pending:0, dirty:false,
  loading:true, booting:true, sending:false, fetching:false,
  timer:null, version:1, revision:null, editVersion:0,
  // 카드별 서버 상태 추적: id -> updatedAt (충돌 감지용 baseUpdatedAt으로 사용)
  taskUpdatedAt:new Map(),
  // 이번 세션에서 마지막으로 로컬에 반영된 TASKS의 id->JSON 스냅샷 (변경분 diff용)
  lastKnownTasksJson:new Map(),
  outboxTaskIds:new Set(),      // 저장 대기 중인 카드 id
  outboxDeleteIds:new Set(),    // 삭제 대기 중인 카드 id
  outboxActivity:[],            // 저장 대기 중인 활동 로그 항목(순서 보장을 위해 배열)
  outboxConfig:null,            // {users, models, checklists} 중 바뀐 것만 채워짐, 없으면 null
};

function boardLocalKey(key,shared){ return 'ppe_board_'+(shared?'data:':'device:')+key; }

async function boardRequest(action, body, query={}){
  const u=new URL(boardSync.url);
  if(u.hostname!=='script.google.com'||!/^\/macros\/s\/.+\/exec$/.test(u.pathname)) throw Error('Apps Script /exec 배포 URL이 아닙니다.');
  const options={redirect:'follow', signal:AbortSignal.timeout(25000)};
  if(body){
    options.method='POST'; options.headers={'Content-Type':'text/plain;charset=utf-8'};
    options.body=JSON.stringify({action, token:boardSync.token, ...body});
  } else {
    u.searchParams.set('action', action);
    if(boardSync.token) u.searchParams.set('token', boardSync.token);
    Object.entries(query).forEach(([k,v])=>u.searchParams.set(k,v));
  }
  const res=await fetch(u.href, options);
  if(!res.ok) throw Error('공유 서버 응답 오류 '+res.status);
  const data=await res.json();
  if(data.ok!==true){
    if(data.code==='AUTH') throw Error('AUTH:'+(data.error||'토큰이 올바르지 않습니다.'));
    throw Error(data.error||'업무 공유 API가 없습니다. Code.gs를 교체하고 새 버전으로 배포해 주세요.');
  }
  return data;
}

// TASKS 배열 전체가 갱신될 때마다(예전과 동일하게 persist()가 호출하는 지점) 호출됩니다.
// 여기서 마지막 스냅샷과 비교해 "실제로 바뀐 카드"만 골라 서버로 보낼 대기열에 넣습니다.
function diffAndQueueTasks(newTasksArray){
  const seen = new Set();
  for(const task of newTasksArray){
    if(!task || !task.id) continue;
    seen.add(task.id);
    const text = JSON.stringify(task);
    if(boardSync.lastKnownTasksJson.get(task.id)===text) continue; // 변화 없음
    boardSync.lastKnownTasksJson.set(task.id, text);
    boardSync.outboxDeleteIds.delete(task.id);
    boardSync.outboxTaskIds.add(task.id);
  }
  // 이전엔 있었는데 이번엔 없는 id = 삭제된 카드
  for(const id of boardSync.lastKnownTasksJson.keys()){
    if(!seen.has(id)){
      boardSync.lastKnownTasksJson.delete(id);
      boardSync.outboxTaskIds.delete(id);
      boardSync.outboxDeleteIds.add(id);
    }
  }
}

function queueBoardSave(name, text){
  boardSync.editVersion++;
  localStorage.setItem('ppe_board_unsent:'+name, text);
  if(name==='tasks'){
    diffAndQueueTasks(JSON.parse(text));
  } else if(name==='activity'){
    // 활동 로그는 항상 앞쪽에 새 항목이 추가되는 구조이므로, 가장 최신 1건만 새로 보내면 충분합니다.
    const arr = JSON.parse(text);
    if(arr.length) boardSync.outboxActivity.push(arr[0]);
  } else if(name==='users' || name==='models' || name==='checklists'){
    boardSync.outboxConfig = boardSync.outboxConfig || {};
    boardSync.outboxConfig[name] = JSON.parse(text);
  }
  boardSync.pending = boardSync.outboxTaskIds.size + boardSync.outboxDeleteIds.size
    + boardSync.outboxActivity.length + (boardSync.outboxConfig?1:0) + (boardSync.sending?1:0);
  clearTimeout(boardSync.timer);
  boardSync.timer=setTimeout(flushBoardSaves, 300);
  boardSyncStatus();
}

window.storage={mode:'local',
  async get(key,shared){ const value=localStorage.getItem(boardLocalKey(key,shared)); return value===null?null:{key,value}; },
  async set(key,value,shared){
    const text=String(value);
    localStorage.setItem(boardLocalKey(key,shared), text);
    const name = shared && (/^ppe_tasks_/.test(key)?'tasks':{ppe_activity_log:'activity',ppe_models_v1:'models',ppe_users_v1:'users',ppe_checklists_v1:'checklists'}[key]);
    if(name && !boardSync.booting && (this.mode==='google'||boardSync.loading)) queueBoardSave(name, text);
    return {key, value:text};
  },
  async delete(key,shared){ if(shared) throw Error('공유 저장소 전체 삭제는 지원하지 않습니다.'); localStorage.removeItem(boardLocalKey(key,shared)); }
};

// 카드 하나를 서버에 반영. 충돌(CONFLICT)이면 서버의 최신 카드를 화면에 표시하고
// 사용자가 "덮어쓰기" 또는 "서버 값 받기" 중 하나를 고르게 합니다.
async function pushOneTask(id){
  const task = TASKS.find(t=>t.id===id);
  if(!task){ boardSync.outboxTaskIds.delete(id); return; }
  const baseUpdatedAt = boardSync.taskUpdatedAt.get(id) || null;
  try{
    const r = await boardRequest('boardUpsertTask', {task, userName:currentUserLabel(), baseUpdatedAt});
    if(r.code==='CONFLICT'){
      const server = r.serverTask;
      const overwrite = confirm(
        `"${task.title||id}" 카드를 다른 사람이 먼저 수정했습니다.\n\n`+
        `[확인] = 내가 지금 고친 내용으로 덮어쓰기\n[취소] = 서버의 최신 내용을 받아오기(내 변경은 버림)`
      );
      if(overwrite){
        const r2 = await boardRequest('boardUpsertTask', {task, userName:currentUserLabel(), force:true});
        boardSync.taskUpdatedAt.set(id, r2.updatedAt);
      } else {
        const idx = TASKS.findIndex(t=>t.id===id);
        if(idx>=0) TASKS[idx]=server; else TASKS.push(server);
        boardSync.taskUpdatedAt.set(id, server._updatedAt);
        boardSync.lastKnownTasksJson.set(id, JSON.stringify(server));
        renderCurrent();
      }
    } else {
      boardSync.taskUpdatedAt.set(id, r.updatedAt);
    }
    boardSync.outboxTaskIds.delete(id);
  }catch(e){
    // 실패한 카드는 큐에 남겨두고 다음 flush에서 재시도. localStorage에는 이미 저장되어 있으므로 데이터 유실은 없음.
    throw e;
  }
}

async function flushBoardSaves(){
  if(boardSync.sending || boardSync.loading || window.storage.mode!=='google') return;
  if(!boardSync.outboxTaskIds.size && !boardSync.outboxDeleteIds.size && !boardSync.outboxActivity.length && !boardSync.outboxConfig) return;
  boardSync.sending=true;
  let hadError=false;

  const taskIds=[...boardSync.outboxTaskIds];
  const deleteIds=[...boardSync.outboxDeleteIds];
  const activityBatch=boardSync.outboxActivity.splice(0, boardSync.outboxActivity.length);
  const configBatch=boardSync.outboxConfig; boardSync.outboxConfig=null;

  await Promise.all(taskIds.map(async id=>{
    try{ await pushOneTask(id); }
    catch(e){ hadError=true; boardSync.error=e.message; }
  }));
  await Promise.all(deleteIds.map(async id=>{
    try{ await boardRequest('boardDeleteTask', {id, userName:currentUserLabel()}); boardSync.outboxDeleteIds.delete(id); }
    catch(e){ hadError=true; boardSync.error=e.message; }
  }));
  for(const entry of activityBatch){
    try{ await boardRequest('boardAppendActivity', {entry}); }
    catch(e){ hadError=true; boardSync.error=e.message; boardSync.outboxActivity.push(entry); }
  }
  if(configBatch){
    try{ await boardRequest('boardSaveConfig', configBatch); }
    catch(e){ hadError=true; boardSync.error=e.message; boardSync.outboxConfig={...(boardSync.outboxConfig||{}), ...configBatch}; }
  }

  boardSync.sending=false;
  boardSync.pending = boardSync.outboxTaskIds.size + boardSync.outboxDeleteIds.size + boardSync.outboxActivity.length + (boardSync.outboxConfig?1:0);
  boardSync.dirty = hadError;
  if(!hadError) boardSync.error='';
  boardSyncStatus();
  if(boardSync.pending) boardSync.timer=setTimeout(flushBoardSaves, hadError?4000:300);
}

function boardSyncStatus(){
  const el=document.getElementById('syncText'); if(!el) return;
  el.textContent = boardSync.dirty ? '공유 저장 실패 · PC 백업 보존'
    : boardSync.loading ? 'PC 데이터 표시 중 · 공유 연결 확인 중'
    : boardSync.pending ? '이 PC에 저장됨 · 공유 저장 중'
    : window.storage.mode==='google' ? (boardSync.error?'공유 서버 연결 확인 필요':'Google Sheets 공유 연결됨')
    : '이 PC에 저장됨 · 공유 미연결';
  el.title=boardSync.error||'';
}

// 서버의 최신 tasks 배열을 로컬 상태에 반영. 편집 중이면(입력 포커스 등) 건드리지 않습니다.
function applyServerTasks(serverTasks){
  const editing=document.getElementById('overlay').classList.contains('open')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(editing) return false;
  TASKS = serverTasks.map(t=>{
    boardSync.taskUpdatedAt.set(t.id, t._updatedAt);
    const clean={...t}; delete clean._updatedAt; delete clean._updatedBy;
    boardSync.lastKnownTasksJson.set(t.id, JSON.stringify(clean));
    return clean;
  });
  localStorage.setItem(boardLocalKey(STORAGE_KEY,true), JSON.stringify(TASKS));
  return true;
}

async function startBoardShared(){
  boardSync.booting=false;
  boardSyncStatus();
  try{
    const [taskState, configState, activityState] = await Promise.all([
      boardRequest('boardGetTasks'),
      boardRequest('boardGetConfig'),
      boardRequest('boardGetActivity'),
    ]);
    window.storage.mode='google';
    boardSync.revision=taskState.revision;
    applyServerTasks(taskState.tasks);
    USERS=configState.users; MODELS=configState.models; CHECKLISTS=configState.checklists;
    ACTIVITY_LOG=activityState.activity;
    localStorage.setItem(boardLocalKey(USERS_KEY,true), JSON.stringify(USERS));
    localStorage.setItem(boardLocalKey(MODELS_KEY,true), JSON.stringify(MODELS));
    localStorage.setItem(boardLocalKey(CHECKLISTS_KEY,true), JSON.stringify(CHECKLISTS));
    localStorage.setItem(boardLocalKey(ACTIVITY_KEY,true), JSON.stringify(ACTIVITY_LOG));
    boardSync.error='';
    renderUserSwitcher(); renderCurrent();
  }catch(e){
    window.storage.mode='local'; boardSync.error=e.message;
  } finally {
    boardSync.loading=false; boardSyncStatus(); flushBoardSaves();
  }
}

async function refreshBoardShared(){
  if(window.storage.mode!=='google'||boardSync.loading||boardSync.fetching||boardSync.pending||boardSync.dirty||document.hidden) return;
  boardSync.fetching=true;
  const requestedAtEditVersion=boardSync.editVersion;
  try{
    const rev = await boardRequest('boardRevision');
    if(rev.revision===boardSync.revision){ boardSync.error=''; return; }
    const taskState = await boardRequest('boardGetTasks');
    if(boardSync.pending||boardSync.dirty||requestedAtEditVersion!==boardSync.editVersion) return;
    boardSync.revision=taskState.revision;
    if(applyServerTasks(taskState.tasks)){ renderUserSwitcher(); renderCurrent(); }
    boardSync.error='';
  }catch(e){
    boardSync.error=e.message;
  } finally {
    boardSync.fetching=false; boardSyncStatus();
  }
}
window.addEventListener('beforeunload', e=>{
  if(window.storage.mode==='google' && boardSync.pending){ e.preventDefault(); e.returnValue=''; }
});

function renderSyncSettings(){
  const body=document.getElementById('settingsBody');
  body.innerHTML=`<div class="panel"><h3>Google Sheets 업무 공유</h3>
    <p>모든 PC에서 같은 Apps Script 배포 주소와 같은 공유 토큰을 사용하세요.</p>
    <p><b>${window.storage.mode==='google'?'공유 서버 연결됨':'공유 미연결 — 현재 이 PC에만 저장 중'}</b></p>
    <p style="color:var(--s-delay);overflow-wrap:anywhere">${escapeHtml(boardSync.error)}</p>
    <label for="boardApiUrl">Apps Script 웹 앱 URL (/exec)</label>
    <input id="boardApiUrl" type="url" style="width:100%;padding:9px;margin:8px 0" value="${escapeHtml(boardSync.url)}">
    <label for="boardApiToken">공유 토큰 (관리자가 setAuthToken()으로 설정한 값)</label>
    <input id="boardApiToken" type="text" style="width:100%;padding:9px;margin:8px 0" value="${escapeHtml(boardSync.token)}" placeholder="토큰을 설정하지 않았다면 비워두세요">
    <button class="btn" id="boardConnect">주소·토큰 저장 및 연결 확인</button>
    <button class="btn btn-ghost" id="boardExportLocal" style="margin-left:8px">현재 PC 업무 백업</button>
    <p class="dash-note">Code.gs를 교체한 뒤 새 버전으로 배포하고, 편집기에서 migrateToRowStorage()를 한 번 실행해 기존 데이터를 이전하세요. 연결 성공 후 페이지를 새로고침하면 공유 데이터를 불러옵니다.</p>
    <div id="boardConnectResult" style="margin-top:10px"></div></div>`;
  document.getElementById('boardConnect').onclick=async()=>{
    const value=document.getElementById('boardApiUrl').value.trim();
    const tokenValue=document.getElementById('boardApiToken').value.trim();
    const oldUrl=boardSync.url, oldToken=boardSync.token;
    boardSync.url=value; boardSync.token=tokenValue;
    const result=document.getElementById('boardConnectResult'); result.textContent='연결 확인 중…';
    try{
      const r=await boardRequest('boardPing');
      if(r.boardApi!==3) throw Error('업무 공유 API 버전이 다릅니다. Code.gs를 최신 버전으로 배포해 주세요.');
      localStorage.setItem('ppe_board_api_url', value);
      localStorage.setItem('ppe_board_api_token', tokenValue);
      result.textContent='연결 확인 완료. 페이지를 새로고침해 주세요.';
    }catch(e){
      boardSync.url=oldUrl; boardSync.token=oldToken; result.textContent=e.message;

    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  };

M 생성","type":"check"},{"key":"routing","label":"라우팅","type":"check"},{"key":"prodVersion","label":"생산버전","type":"check"},{"key":"packingList","label":"패킹리스트","type":"check"},{"key":"componentLabel","label":"구성품 라벨","type":"check"},{"key":"serial","label":"시리얼 채번","type":"check"},{"key":"inspection","label":"검사필드","type":"check"}],"sourceBody":"### 문서번호\n[NPO-2606-014](http://plm.intelliantech.com/Windchill/intellian/mdm/viewMDM?oid=com.e3ps.mdm.MasterDataManagement:431890090)\nGWSE-R41-2A7SA22 / GWSE-R41-2A7SA22-U\n- \u003cspan color=\"red\">기존 단상 품번 GWSE-R41-2A7AA22는 현재 단종 상태임\u003c/span>\n- \u003cspan color=\"red\">단종된 기존 단상 BOM을 다시 살리려는 목적이 아님 \u003c/span>\u003cspan color=\"red\">***(이 부분이 이해 안가지만 어쩔수 없음)***\u003c/span>\n- \u003cspan color=\"red\">현재 생산 중인 GWSE-R41-3A7AA22는 이름상 3상이지만, 실제로는 Installation Kit에 따라 단상/3상 모두 대응 가능한 공용 본체에 가까움\u003c/span>\n- \u003cspan color=\"red\">따라서 신규 단상 품번 GWSE-R41-2A7SA22는 기존 단상 BOM 기준이 아니라, 현재 계속 생산 중인 GWSE-R41-3A7AA22 BOM 기준으로 구성하는 것이 맞음\u003c/span>\n- \u003cspan color=\"red\">단상/3상 구분은 본체 BOM이 아니라 별도 구매 품목인 Installation Kit에서 관리됨\u003c/span>\n- \u003cspan color=\"red\">결국 고객 주문 편의를 위해 “단상용 명칭/판매 Code”를 새로 만들어, 그 이름에 맞는 Installation Kit를 함께 구매할 수 있도록 하려는 목적임\u003c/span>\n> SAP BOM 생성 후에 보내야할 EMAIL - to NPI team\n\u003ccallout icon=\"💡\" color=\"gray_bg\">\n\t안녕하십니까. 생산기술팀 USER1입니다.\n\t품번명만 보면 생산팀에서 기존 단상 제품 또는 별도 단상 BOM으로 오해할 수 있는 부분이 있어, MDM 완료 후 양산이관시 위 내용을 생산팀에 공유 부탁드립니다.\n\t1. 이번 신규 품번은 고객 주문 편의를 위해 단상용 명칭 또는 판매 Code를 새로 등록하고, 해당 명칭에 맞는 Installation Kit를 함께 구매할 수 있도록 하기 위한 목적입니다.\n\t2. 단상/3상 구분은 본체 BOM이 아니라, 별도 구매 품목인 Installation Kit에서 결정됩니다.\n\t3. 따라서 신규 단상 품번 GWSE-R41-2A7SA22는 기존 단상 BOM이 아닌, 현재 계속 생산 중인 GWSE-R41-3A7AA22 BOM으로 구성하는 것이 맞는 것으로 확인됩니다.\n\t4. 현재 생산 중인 GWSE-R41-3A7AA22는 품명상 3상으로 보일 수 있으나, 실제로는 Installation Kit에 따라 단상/3상 모두 대응 가능한 공용 본체 성격으로 이해됩니다.\n\t5. 이번 신규 품번 등록은 단종된 기존 단상 BOM을 다시 사용하는 목적이 아닙니다.\n\t6. 기존 단상 품번 GWSE-R41-2A7AA22는 현재 단종 상태입니다.\n\t현재 확인된 내용은 아래와 같습니다.\n\tGWSE-R41-2A7SA22 신규 MDM 진행 관련하여, MDM 완료 후 const STATUS_PROGRESSION = ['업무할당 완료','시작 전','진행 대기','진행 중','완료'];
function nextStatusOf(current){
  const idx = STATUS_PROGRESSION.indexOf(current);
  if(idx === -1 || idx === STATUS_PROGRESSION.length - 1) return null; // 장기 지연·완료는 자동 다음 단계 없음(수동 지정만)
  return STATUS_PROGRESSION[idx + 1];
}
const SIX_MONTHS_MS = 1000*60*60*24*182;
const TWO_WEEKS_MS = 1000*60*60*24*14;

// 상태를 바꿀 때는 항상 이 함수를 통해서 바꿔서, 자동 장기지연 관련 추적 필드를 일관되게 관리한다.
function setTaskStatus(t, newStatus){
  if(t.status === newStatus) return;
  const wasAutoDelay = t.status === '장기 지연' && t.delayReason === 'auto';
  const wasManualDelay = t.status === '장기 지연' && t.delayReason === 'manual';
  if(newStatus === '장기 지연'){
    // 사용자가 직접 장기 지연으로 옮기는 경우 (수동 지정)
    t.delayReason = 'manual';
    t.delayOverrideAt = null;
  } else if(wasAutoDelay){
    // 자동으로 들어갔던 장기 지연에서 다른 단계로 옮기는 경우: 2주 유예 타이머 시작
    t.delayOverrideAt = Date.now();
  } else if(wasManualDelay){
    // 수동으로 지정했던 장기 지연을 벗어나면 추적 플래그를 리셋 (이후엔 자동 규칙이 새로 판단)
    t.delayReason = null;
    t.delayOverrideAt = null;
  } else if(newStatus === '완료'){
    t.delayReason = null;
    t.delayOverrideAt = null;
    t.endDate = todayDateStr();
  }
  t.status = newStatus;
}

let lastAction = null;
let toastTimer = null;
function recordUndo(t, prevStatus, prevDelayReason, prevDelayOverrideAt){
  lastAction = { type:'status', taskId: t.id, prevStatus, prevDelayReason, prevDelayOverrideAt, newStatus: t.status, title: t.title };
  showUndoToast(`"${escapeHtml(t.title)}" → <b>${escapeHtml(t.status)}</b>(으)로 변경됨`);
}
function recordDeleteUndo(removedTask, index){
  lastAction = { type:'delete', task: removedTask, index, title: removedTask.title };
  showUndoToast(`"${escapeHtml(removedTask.title)}" 업무가 삭제됨`);
}
function showUndoToast(message){
  const el = document.getElementById('undoToast');
  if(!el || !lastAction) return;
  el.innerHTML = `<span>${message}</span><button id="undoBtn">실행 취소 (Ctrl+Z)</button>`;
  el.classList.add('show');
  document.getElementById('undoBtn').addEventListener('click', undoLastAction);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideUndoToast, 7000);
}
function hideUndoToast(){
  const el = document.getElementById('undoToast');
  if(el) el.classList.remove('show');
  lastAction = null;
}
async function undoLastAction(){
  if(!lastAction) return;
  if(lastAction.type === 'delete'){
    const task = lastAction.task;
    const idx = Math.min(lastAction.index, TASKS.length);
    if(!TASKS.some(x=>x.id===task.id)) TASKS.splice(idx, 0, task);
    await persist();
    await logActivity('create', `<b>${escapeHtml(currentUserLabel())}</b>님이 "<b>${escapeHtml(task.title)}</b>" 업무 삭제를 취소(복원)했습니다.`, task.id);
    renderCurrent();
  } else {
    const t = TASKS.find(x=>x.id===lastAction.taskId);
    if(t){
      t.status = lastAction.prevStatus;
      t.delayReason = lastAction.prevDelayReason;
      t.delayOverrideAt = lastAction.prevDelayOverrideAt;
      await persist();
      renderCurrent();
    }
  }
  hideUndoToast();
}

async function moveTaskToStatus(id, newStatus){
  const t = TASKS.find(x=>x.id===id);
  if(!t || t.status===newStatus || !STATUS_ORDER.includes(newStatus)) return;
  const prevStatus = t.status, prevDelayReason = t.delayReason, prevDelayOverrideAt = t.delayOverrideAt;
  setTaskStatus(t, newStatus);
  await persist();
  await logActivity('status', `"<b>${escapeHtml(t.title)}</b>" 상태가 <b>${escapeHtml(prevStatus)}</b> → <b>${escapeHtml(newStatus)}</b>(으)로 변경되었습니다.`, t.id);
  renderCurrent();

}
async function advanceStatus(id){
  const t = TASKS.find(x=>x.id===id);
  if(!t) return;
  const next = nextStatusOf(t.status);
  if(!next) return;
  const prevStatus = t.status, prevDelayReason = t.delayReason, prevDelayOverrideAt = t.delayOverrideAt;
  setTaskStatus(t, next);
  await persist();
  await logActivity('status', `"<b>${escapeHtml(t.title)}</b>" 상태가 <b>${escapeHtml(prevStatus)}</b> → <b>${escapeHtml(next)}</b>(으)로 변경되었습니다.`, t.id);
  renderCurrent();
  recordUndo(t, prevStatus, prevDelayReason, prevDelayOverrideAt);
}

// 수신일 기준 6개월 경과 시 자동 장기지연, 자동지연→수동이동 후 2주 경과 시 재자동복귀
function applyAutomationRules(){
  const now = Date.now();
  let changed = false;
  TASKS.forEach(t=>{
    if(t.status === '완료') return;
    const received = parseDueDate(t.receivedDate);
    if(received && t.status !== '장기 지연' && (now - received.getTime()) >= SIX_MONTHS_MS && t.delayReason !== 'manual'){
      setTaskStatus(t, '장기 지연');
      t.delayReason = 'auto';
      changed = true;
      return;
    }
    if(t.delayReason === 'auto' && t.status !== '장기 지연' && t.delayOverrideAt && (now - t.delayOverrideAt) >= TWO_WEEKS_MS){
      setTaskStatus(t, '장기 지연');
      t.delayReason = 'auto';
      changed = true;
    }
  });
  return changed;
}
function parseDueDate(str){
  if(!str) return null;
  const m = String(str).match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(!m) return null;
  const d = new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  return isNaN(d.getTime()) ? null : d;
}
function dueUrgency(t){
  if(t.status === '완료') return null;
  const d = parseDueDate(t.dueRequest);
  if(!d) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((d - today) / 86400000);
  if(diffDays < 0) return 'overdue';
  if(diffDays <= 3) return 'soon';
  return null;
}
function dueBadgeHtml(t){
  const u = dueUrgency(t);
  if(!u) return '';
  const d = parseDueDate(t.dueRequest);
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((d - today) / 86400000);
  const color = u === 'overdue' ? 'var(--s-delay)' : 'var(--accent)';
  let label;
  if(u === 'overdue'){
    const absDays = Math.abs(diffDays);
    label = absDays >= 30 ? `${Math.floor(absDays/30)}달 지남` : `${absDays}일 지남`;
  } else {
    label = diffDays===0 ? '오늘 마감' : `${diffDays}일 남음`;
  }
  return `<span class="due-badge" style="color:${color}; border-color:${color}33; background:${color}14;">⏱ ${label}</span>`;
}

  }

    let lastH = textarea.offsetHeight;
    const ro = new ResizeObserver(()=>{

    });
    ro.observe(textarea);
  }
  // 리사이즈 핸들을 드래그해서 놓는 순간(mouseup)에도 저장 — ResizeObserver가 안 잡히는 환경 대비 보강
  textarea.addEventListener('mouseup', saveHeight);
  async function persistCurrent(){
    task.mailOverrides = task.mailOverrides || {};

    setTimeout(()=>{ if(document.getElementById('mailPopupRegen')) btn.textContent = '↻ 템플릿으로 재생성'; }, 1500);
  });
  document.getElementById('mailPopupCopy').addEventListener('click', async ()=>{
    const btn = document.getElementById('mailPopupCopy');
    try{ await navigator.clipboard.writeText(textarea.value); }
    catch(e){
      textarea.focus(); textarea.select();
      try{ document.execCommand('copy'); }catch(e2){}
    }
    btn.textContent = '✅ 복사됨';
    setTimeout(()=>{ if(document.getElementById('mailPopupCopy')) btn.textContent = '📋 복사'; }, 1500);

  function closeMailPopup(){ overlay.classList.remove('open'); }

function fillTemplate(tpl, t){
  tpl=(tpl||'').replace(/{{(mdmNumber|mdmTitle|partNumber|link)}}/g,(_,key)=>({mdmNumber:t.docNumber||'(미입력)',mdmTitle:t.title||'(미입력)',partNumber:t.partNumber||'(품번을 입력해 주세요)',link:t.link||''})[key]);
  const materials = formatMaterialList(allMaterialsForTask(t));
  return (tpl||'')
    .replace(/\{\{docNumber\}\}/g, t.docNumber||'')
    .replace(/\{\{title\}\}/g, t.title||'')
    .replace(/\{\{materials\}\}/g, materials);
}
// 업무의 actionItems를 현재 업무유형의 체크리스트 키에 맞게 정리 (겹치는 키는 값 유지, 없는 키는 완료상태 기준으로 채움)
function migrateActionItemsForType(t){
  const items = checklistFor(t.type, t);
  const newItems = t.sourceChecklist ? {...t.actionItems} : {};
  let changed = false;
  items.forEach(i=>{
    if(t.actionItems && Object.prototype.hasOwnProperty.call(t.actionItems, i.key)){
      newItems[i.key] = t.actionItems[i.key];
    } else {
      newItems[i.key] = t.sourceChecklist ? false : t.status === '완료';
      changed = true;
    }
  });
  changed = JSON.stringify(t.actionItems||{}) !== JSON.stringify(newItems);
  if(changed) t.actionItems = newItems;
  return changed;
}

function labelFor(name, role){ return role ? `${name} (${role})` : name; }

async function updateUser(id, {name, role, color}){
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  const oldName = u.name;
  const oldLabel = labelFor(u.name, u.role);
  const newLabel = labelFor(name, role);

  u.name = name;
  u.role = role;
  u.color = color;
  await persistUsers();

  let touched = false;
  TASKS.forEach(t=>{
    if(t.authorId === id){ if(t.author !== newLabel){ t.author = newLabel; touched = true; } }
    else if(t.author === oldLabel){ t.author = newLabel; touched = true; }
    if(t.assignee === oldName && oldName !== name){ t.assignee = name; touched = true; }
    (t.comments||[]).forEach(c=>{
      if(c.authorId === id){ if(c.author !== newLabel){ c.author = newLabel; touched = true; } }
      else if(c.author === oldLabel){ c.author = newLabel; touched = true; }
    });
  });
  if(touched) await persist();
}

async function loadTasks(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      TASKS = JSON.parse(res.value);
      const changed = migrateTasks();
      if(changed) await persist(true);
      return;
    }
  }catch(e){ /* not found or error -> fall through to seed */ }
  TASKS = JSON.parse(JSON.stringify(SEED_TASKS));
  migrateTasks();
  await persist(true);
}
function migrateTasks(){
  let changed = false;
  TASKS.forEach(t=>{
    if(t.link === undefined){ const source=SEED_TASKS.find(s=>s.id===t.id || (t.docNumber && s.docNumber===t.docNumber)); t.link=source?source.link:''; changed=true; }
    if(t.partNumber === undefined){t.partNumber='';changed=true;}
    if(!Array.isArray(t.comments)){ t.comments = []; changed = true; }
    if(typeof t.author !== 'string'){ t.author = ''; changed = true; }
    if(typeof t.receivedDate !== 'string'){ t.receivedDate = ''; changed = true; }
    if(t.delayReason === undefined){ t.delayReason = (t.status==='장기 지연' ? 'manual' : null); changed = true; }
    if(t.delayOverrideAt === undefined){ t.delayOverrideAt = null; changed = true; }
    // 작성자 정보가 없는 기존 항목은, 담당자 이름이 등록된 팀원과 일치하면 그 사람을 작성자로 매핑
    if(!t.authorId && t.assignee){
      const match = USERS.find(u => u.name === t.assignee);
      if(match){ t.authorId = match.id; t.author = labelFor(match.name, match.role); changed = true; }
    }
  });
  if(applyAutomationRules()) changed = true;
  return changed;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  if(parts.length >= 2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}

/* ================= 라벨데이터 변환기 (iframe 임베드) ================= */
// 별도로 관리되는 패킹리스트→LABEL DATA 변환 도구를 그대로 담아온다.
// base64로 인코딩해 문자열 충돌(따옴표, 백틱, 스크립트 종료 태그 등) 걱정 없이 안전하게 내장한다.
// 주의: 브라우저는 iframe을 다른 부모로 옮기면(appendChild로 재배치) 내용을 다시 로드한다.
// 그래서 이 iframe은 항상 view-labeldata 안에만 유지하고, 다른 화면(기본 설정 등)에서는
// "옮겨서 보여주기"가 아니라 이 화면으로 바로 이동시키는 방식으로 접근한다 (goToLabelData 참고).
function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function renderLabelData(){

  el.innerHTML = '<iframe id="labelDataFrame" style="width:100%; height:calc(100vh - 140px); min-height:640px; border:1px solid var(--border); border-radius:10px; background:var(--surface);"></iframe>';

/* ---------- 업무 카드 ↔ 변환기 연결 ----------

   화면 이동으로는 연결이 끊기지 않고, 변환기 위쪽 표시의 "연결 해제"를 눌러야만 해제된다. */
const LABELDATA_LINK_KEY = 'ppe_labeldata_link'; // 개인별 — 내가 지금 어떤 업무에서 변환기를 열었는지

// 연결된 업무의 체크리스트에서 "구성품 라벨 등록"에 해당하는 항목 찾기
function componentLabelItem(t){
  const items = checklistFor(t.type, t);
  return items.find(a=>a.type==='link') || items.find(a=>a.key==='componentLabel') || null;
}
// 변환기에서 LABEL_DATA.xlsx 다운로드가 끝났을 때 — 연결된 업무가 있을 때만 동작
async function handleLabelDataDownloaded(msg){
  const t = linkedTask();
  if(!t){
    // 연결 없이 그냥 변환기를 쓴 경우 → 자동 체크도, 기록도 남기지 않는다
    if(LABEL_LINK){ await setLabelLink(null); } // 업무가 삭제된 경우 연결만 정리
    return;
  }
  const pnCount = Number(msg.pnCount) || 0;
  const rowCount = Number(msg.rowCount) || 0;
  const item = componentLabelItem(t);
  let checkedNow = false;
  if(item && !t.actionItems[item.key]){
    t.actionItems[item.key] = true;
    checkedNow = true;
    await persist(true);
  }
  await logActivity('label',
    `<b>${escapeHtml(t.title)}</b> 업무 — 파트넘버 ${pnCount}개 / ${rowCount}행 LABEL DATA 생성` +
    (checkedNow && item ? ` · "${escapeHtml(item.label)}" 자동 체크` : ''),
    t.id);
  renderNotifBadge();
  postToLabelFrame({ type:'downloadAck', checked: checkedNow, logged: true, itemLabel: item ? item.label : '' });
}
// iframe(변환기)에서 올라오는 메시지 처리
window.addEventListener('message', async (e)=>{
  const w = labelFrameWindow();
  if(!w || e.source !== w) return;                     // 우리 iframe이 보낸 것만 받음
  const d = e.data;
  if(!d || typeof d !== 'object' || d.source !== 'ppe-labeltool') return;
  try{
    if(d.type === 'ready') syncLabelLinkToFrame();
    else if(d.type === 'unlink') await setLabelLink(null);
    else if(d.type === 'downloaded') await handleLabelDataDownloaded(d);
    else if(d.type === 'openTask' && d.taskId) openDetail(d.taskId);
  }catch(err){ console.error('변환기 메시지 처리 실패', err); }
});

// 어디서든(체크리스트 링크, 기본 설정 탭 등) 라벨데이터 변환기 화면으로 바로 이동시키는 공용 함수
// task를 넘기면 그 업무와 연결된 상태로 열리고, 넘기지 않으면 지금 연결 상태를 그대로 둔다.
async function goToLabelData(task){
  if(task) await setLabelLink(task.id);
  currentView = 'labeldata';
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view==='labeldata'));
  renderCurrent();
  syncLabelLinkToFrame();
}

function renderSapBomCompare(){
  if(document.getElementById('sapBomCompareFrame')) return;
  const frame = document.createElement('iframe');
  frame.id = 'sapBomCompareFrame';
  frame.title = 'EBOM ↔ SAP BOM 비교 도구';
  frame.style.cssText = 'display:block;width:100%;height:calc(100vh - 140px);min-height:640px;border:1px solid var(--border);border-radius:10px;background:var(--surface);';
  frame.srcdoc = b64ToUtf8(SAPBOM_COMPARE_TOOL_B64);
  document.getElementById('view-sapbomcompare').appendChild(frame);
}

document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    document.getElementById('sidebar').classList.remove('open');
    renderCurrent();
  });
});
document.getElementById('menuBtn').addEventListener('click', ()=>{

});

  document.getElementById('view-labeldata').style.display = currentView==='labeldata' ? '' : 'none';
  document.getElementById('view-sapbomcompare').style.display = currentView==='sapbomcompare' ? '' : 'none';
  document.getElementById('pageTitle').textContent = TITLES[currentView][0];
  document.getElementById('pageSub').textContent = TITLES[currentView][1];
  // 비활성 화면의 이전 내용은 비워서, id가 겹치는 요소(검색창/필터/버튼 등)가 문서에 동시에 존재하지 않게 함
  const sections = ['view-dashboard','view-process','view-board','view-list','view-announce','view-notif','view-settings'];
  // view-labeldata는 iframe으로 별도 앱을 담고 있어 비울 때마다 초기화되면 안 되므로 sections 목록에 포함하지 않음
  const activeSection = 'view-' + currentView;
  sections.forEach(s=>{ if(s !== activeSection) document.getElementById(s).innerHTML = ''; });
  if(currentView==='dashboard') renderDashboard();
  if(currentView==='process') renderProcess();
  if(currentView==='board') renderBoard();
  if(currentView==='list') renderList();
  if(currentView==='announce') renderAnnouncements();
  if(currentView==='notif') renderNotifications();
  if(currentView==='settings') renderSettings();
  if(currentView==='labeldata') renderLabelData();
  if(currentView==='sapbomcompare') renderSapBomCompare();
  renderNotifBadge();
  renderAnnounceBadge();
}

/* ================= DASHBOARD ================= */
let dashboardWeekOffset=0,dashboardAssignee='all',dashboardGanttMonthOffset=0;
function dashDate(value){
  const m=String(value||'').match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:$|[ T])/);
  if(!m)return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3]?d:null;
}
function dashShift(d,n){const v=new Date(d);v.setDate(v.getDate()+n);return v;}
function dashKey(d){return d?`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`:'';}
function dashDates(t){
  const received=dashDate(t.receivedDate),created=dashDate(t.sourceCreatedAt),due=dashDate(t.dueRequest),done=dashDate(t.endDate);
  const start=received||created,end=t.status==='완료'?(done||due):due;
  return {start,end,due,done,created,received};
}
function renderDashboard(){
  const el=document.getElementById('view-dashboard'),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const monday=dashShift(today,-((today.getDay()+6)%7)+dashboardWeekOffset*7),days=Array.from({length:7},(_,i)=>dashShift(monday,i)),sunday=days[6];
  const gMonthStart=new Date(today.getFullYear(),today.getMonth()+dashboardGanttMonthOffset,1);
  const gMonthEnd=new Date(gMonthStart.getFullYear(),gMonthStart.getMonth()+1,0);
  const gDays=Array.from({length:gMonthEnd.getDate()},(_,i)=>new Date(gMonthStart.getFullYear(),gMonthStart.getMonth(),i+1));
  const tasks=TASKS.filter(t=>dashboardAssignee==='all'||(t.assignee||'미배정')===dashboardAssignee);
  const done=tasks.filter(t=>t.status==='완료').length,active=tasks.length-done;
  const overdue=tasks.filter(t=>t.status!=='완료'&&dashDate(t.dueRequest)&&dashDate(t.dueRequest)<today).length;
  const events=Object.fromEntries(days.map(d=>[dashKey(d),[]]));
  const intervals=[],undated=[],conflicts=[];
  tasks.forEach(t=>{
    const d=dashDates(t);
    // Calendar contains dated milestones, not repeated bars on every day.
    const points=[];
    if(d.received)points.push([d.received,'수신']);
    if(d.due)points.push([d.due,'완료요청']);
    if(d.done)points.push([d.done,'종료']);
    points.forEach(([date,label])=>{const key=dashKey(date);if(events[key])events[key].push({task:t,label});});
    if(!d.start&&!d.end){undated.push(t);return;}
    if(d.start&&d.end&&d.end<d.start){conflicts.push(t);return;}
    const start=d.start||d.end,end=d.end||(t.status==='완료'?start:(today>start?today:start));
    if(end<gMonthStart||start>gMonthEnd)return;
    const from=gDays.findIndex(day=>day>=start);let to=gDays.length-1;while(to>0&&gDays[to]>end)to--;
    intervals.push({task:t,start,end,from:Math.max(0,from),to,derived:!d.received&&!!d.created,open:!d.end});
  });
  intervals.sort((a,b)=>a.start-b.start||a.task.title.localeCompare(b.task.title));
  const owners=[...new Set(TASKS.map(t=>t.assignee||'미배정'))].sort();
  const eventHtml=({task:t,label})=>{const sc=statusColor(t.status);return `<button class="dash-event" data-dash-task="${escapeHtml(t.id)}" style="border-left-color:${sc.c}"><b>${label} · ${escapeHtml(t.docNumber||t.type)}</b><span>${escapeHtml(t.title)}</span><span>${escapeHtml(t.assignee||'미배정')} · ${escapeHtml(t.status)}</span></button>`;};

  // ---- 완료율 링 차트 ----
  const donePct = tasks.length ? Math.round(done/tasks.length*100) : 0;
  const ringR = 47, ringC = 2*Math.PI*ringR;
  const ringOffset = ringC * (1 - donePct/100);

  // ---- 담당자별 업무량(미완료) ----
  const workload = owners.map(o=>({
    owner:o,
    count: tasks.filter(t=>(t.assignee||'미배정')===o && t.status!=='완료').length
  })).filter(w=>w.count>0).sort((a,b)=>b.count-a.count);
  const maxWl = Math.max(1, ...workload.map(w=>w.count));

  // ---- 상태 분포 ----
  const statusCounts = STATUS_ORDER.map(s=>({status:s, count: tasks.filter(t=>t.status===s).length}));

  // ---- 최근 등록된 업무 하이라이트 (업무 id에 박힌 생성 시각 기준) ----
  function createdAtOf(t){ const m=/^t(\d+)/.exec(t.id||''); return m? Number(m[1]) : 0; }
  const recent = tasks.slice().sort((a,b)=> createdAtOf(b)-createdAtOf(a)).slice(0,8)
    .map(t=>({t, daysAgo: Math.max(0, Math.floor((now - createdAtOf(t)) / 86400000))}));

  el.innerHTML=`
    <div class="dq-hero">
      <div class="dq-ring-card">
        <div class="dq-ring-wrap">
          <svg class="dq-ring" viewBox="0 0 104 104">
            <circle class="dq-ring-track" cx="52" cy="52" r="${ringR}"></circle>
            <circle class="dq-ring-fill" cx="52" cy="52" r="${ringR}" style="stroke:var(--primary); stroke-dasharray:${ringC}; stroke-dashoffset:${ringOffset}"></circle>
          </svg>
          <div class="dq-ring-label"><strong>${donePct}%</strong><span>완료율</span></div>
        </div>
      </div>
      <div class="dq-tiles">
        <div class="dq-tile"><span class="dq-tile-ico">📋</span><div><strong>${tasks.length}</strong><span>전체 업무</span></div></div>
        <div class="dq-tile"><span class="dq-tile-ico">🕗</span><div><strong>${active}</strong><span>미완료</span></div></div>
        <div class="dq-tile"><span class="dq-tile-ico">✅</span><div><strong>${done}</strong><span>완료</span></div></div>
        <div class="dq-tile dq-tile-warn"><span class="dq-tile-ico">⚠️</span><div><strong>${overdue}</strong><span>완료요청일 경과</span></div></div>
      </div>
    </div>

    <div class="dash-panel dq-deadline-panel">
      <h2>🆕 최근 등록된 업무</h2>
      <p class="dash-note">최근 등록 순입니다. 완료요청일이 지난 건은 빨간색으로 함께 표시됩니다. 클릭하면 상세 정보를 확인할 수 있습니다.</p>
      <div class="dq-deadline-row">
        ${recent.map(({t,daysAgo})=>{
          const urgent = dueUrgency(t)==='overdue';
          return `<button class="dq-deadline-card ${urgent?'is-overdue':''}" data-dash-task="${escapeHtml(t.id)}">
            <span class="dq-dl-days">${daysAgo===0? '오늘 등록' : `${daysAgo}일 전 등록`}${urgent? ' · 마감 지남' : ''}</span>
            <span class="dq-dl-title">${escapeHtml(t.title)}</span>
            <span class="dq-dl-meta">${escapeHtml(t.assignee||'미배정')} · ${escapeHtml(t.docNumber||t.type)}</span>
          </button>`;
        }).join('') || '<div class="dash-note">등록된 업무가 없습니다.</div>'}
      </div>
    </div>

    <div class="dq-grid">
      <div class="dash-panel">
        <h2>👥 담당자별 업무량 (미완료)</h2>
        <div class="dq-workload">
          ${workload.length? workload.map(w=>{
            const u = USERS.find(x=>x.name===w.owner);
            const color = u? u.color : 'var(--muted-2)';
            const pct = Math.round(w.count/maxWl*100);
            return `<button type="button" class="dq-wl-row" data-dash-owner="${escapeHtml(w.owner)}" title="클릭하면 ${escapeHtml(w.owner)}님의 업무 목록을 확인·수정할 수 있습니다">
              <span class="dq-wl-name">${escapeHtml(w.owner)}</span>
              <div class="dq-wl-bar-track"><div class="dq-wl-bar-fill" style="width:${pct}%; background:${color}"></div></div>
              <span class="dq-wl-count">${w.count}</span>
            </button>`;
          }).join('') : '<div class="dash-note">미완료 업무가 없습니다.</div>'}
        </div>
      </div>
      <div class="dash-panel">
        <h2>📊 상태 분포</h2>
        <div class="dq-stack">
          ${statusCounts.filter(s=>s.count>0).map(s=>{
            const sc = statusColor(s.status);
            const pct = tasks.length? (s.count/tasks.length*100) : 0;
            return `<div class="dq-stack-seg" style="width:${pct}%; background:${sc.c}" title="${escapeHtml(s.status)} ${s.count}건"></div>`;
          }).join('')}
        </div>
        <div class="dq-stack-legend">
          ${statusCounts.map(s=>{const sc=statusColor(s.status); return `<span><i style="background:${sc.c}"></i>${s.status} <b>${s.count}</b></span>`;}).join('')}

      <h2>${dashKey(monday)} — ${dashKey(sunday)}</h2>

        ${intervals.length?'':'<div class="dash-empty">선택한 달에 표시할 업무가 없습니다. 다른 달을 선택해 주세요.</div>'}
      </div></div>
      <details style="margin-top:16px"><summary>일정 미등록 ${undated.length}건 · 날짜 확인 필요 ${conflicts.length}건</summary><p class="dash-note">종료가 시작보다 빠른 업무는 간트에서 제외했습니다. 원본 날짜를 확인해 주세요.</p><div class="dash-undated">${[...conflicts,...undated].map(t=>`<button data-dash-task="${escapeHtml(t.id)}">${escapeHtml(t.docNumber||'문서번호 없음')} · ${escapeHtml(t.title)}</button>`).join('')||'<span class="dash-note">해당 업무가 없습니다.</span>'}</div></details>
    </div>`;
  el.querySelector('#dashPrev').onclick=()=>{dashboardWeekOffset--;renderDashboard();};
  el.querySelector('#dashNext').onclick=()=>{dashboardWeekOffset++;renderDashboard();};
  el.querySelector('#dashToday').onclick=()=>{dashboardWeekOffset=0;renderDashboard();};
  el.querySelector('#dashOwner').onchange=e=>{dashboardAssignee=e.target.value;renderDashboard();};
  el.querySelector('#dashGanttPrev').onclick=()=>{dashboardGanttMonthOffset--;renderDashboard();};
  el.querySelector('#dashGanttNext').onclick=()=>{dashboardGanttMonthOffset++;renderDashboard();};
  el.querySelector('#dashGanttToday').onclick=()=>{dashboardGanttMonthOffset=0;renderDashboard();};
  el.querySelectorAll('[data-dash-task]').forEach(btn=>btn.onclick=()=>openDetail(btn.dataset.dashTask));
  el.querySelectorAll('[data-dash-owner]').forEach(btn=>btn.onclick=()=>goToOwnerList(btn.dataset.dashOwner));
}

/* ================= PROCESS VIEW ================= */
function renderProcess(){

  const total = TASKS.length;
  const byStatus = {};
  STATUS_ORDER.forEach(s=>byStatus[s]=0);

  TASKS.forEach(t=>{ byType[t.type] = (byType[t.type]||0)+1; });

  el.innerHTML = `
    <p class="proc-intro">품번 신규 등록, BOM/MDM 변경, 설계 변경(ECO) 등 팀에 접수되는 모든 요청은 아래 4단계를 거쳐 처리됩니다. 각 업무는 <b>유형(MDM/ECO/자동화)</b>에 따라 ECN Step 1 처리 방식이 달라집니다.</p>

      </div>
      <div class="flow-step">
        <div class="flow-num">3</div>
        <h3>액션 아이템 진행</h3>
        <p>SAP BOM 생성 → 라우팅 → 생산버전 → 패킹리스트 → 구성품 라벨 → 시리얼 채번 → 검사필드 순으로 항목을 체크합니다.</p>

        <div class="flow-num">4</div>
