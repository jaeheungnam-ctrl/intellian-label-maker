function renderBoard(){
  const el = document.getElementById('view-board');
  // 렌더링할 때마다 컬럼 DOM을 새로 만들기 때문에, 다시 그리기 전에 각 컬럼(및 장기 지연 서브리스트)의
  // 스크롤 위치를 상태값 기준으로 기억해뒀다가 새로 그린 뒤 그대로 복원한다.
  const scrollMemo = {};
  el.querySelectorAll('.col-body, .delay-sublist').forEach(z=>{
    if(z.dataset.status) scrollMemo[z.dataset.status] = z.scrollTop;
  });
  // 상태가 바뀐 카드 찾기(다음 단계 버튼·끌어놓기·상세 창·다른 사람의 변경 모두) → 다시 그린 뒤 예전 자리에서 새 자리로 날려 보낸다
  const motion = typeof gsap !== 'undefined' && typeof Flip !== 'undefined' && !document.hidden && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(motion) gsap.registerPlugin(Flip); // body가 생긴 뒤에 등록해야 함(head에서 등록하면 Flip 초기화가 깨짐) — 여러 번 불러도 무해
  const prevStatus = boardLastStatus_;
  boardLastStatus_ = new Map(TASKS.map(t=>[t.id, t.status]));
  const moved = prevStatus ? TASKS.filter(t=>prevStatus.has(t.id) && prevStatus.get(t.id)!==t.status).map(t=>t.id) : [];
  let flipState = null; const flying = [];
  if(motion && moved.length && moved.length <= 10){ // 한꺼번에 많이 바뀌면(데이터 이전 등) 그냥 다시 그림
    try{
      flipState = Flip.getState(el.querySelectorAll('.card[data-id]'));
      moved.forEach(id=>{ const old = el.querySelector(`.card[data-id="${CSS.escape(id)}"]`); if(old) flying.push({id, node:old, rect:old.getBoundingClientRect()}); });
    }catch(err){ console.warn('보드 애니메이션 준비 실패(무시하고 그냥 그림)', err); flipState = null; flying.length = 0; }
  }
  const wrap = document.createElement('div');
  renderToolbar(wrap);
  wrap.insertAdjacentHTML('beforeend', `
    <div class="board-viewmode">
      <button type="button" class="btn-toggle ${boardCardMode==='detail'?'active':''}" data-mode="detail">상세</button>
      <button type="button" class="btn-toggle ${boardCardMode==='summary'?'active':''}" data-mode="summary">요약</button>
    </div>
  `);

  const list = filteredTasks();
  // 컬럼 헤더 아래 진행 바(전체 중 이 컬럼 비중)를 보여주기 위한 기준값
  const totalForBar = Math.max(1, list.length);
  const cols = BOARD_COLUMNS.map(status=>{
    const items = list.filter(t=>t.status===status);
    const sc = statusColor(status);
    const barPct = Math.round(items.length / totalForBar * 100);
    let extra = '';
    if(status === '진행 대기'){
      const delayItems = list.filter(t=>t.status==='장기 지연');
      const dsc = statusColor('장기 지연');
      extra = `
        <div class="delay-subsection ${delayCollapsed?'collapsed':''}">
          <button class="delay-subhead" id="delayToggle">
            <span class="chev">▾</span>
            <span class="dot" style="background:${dsc.c}"></span>
            <span class="name">장기 지연</span>
            <span class="cnt">${delayItems.length}</span>
          </button>
          <div class="delay-sublist" data-status="장기 지연">
            ${delayItems.length? delayItems.map(t=>cardHtml(t)).join('') : `<div class="empty-col">아직 없습니다</div>`}
          </div>
        </div>
      `;
    }
    return `
      <div class="col" style="--col-tint:${sc.t}; --col-accent:${sc.c}">
        <div class="col-head"><span class="dot" style="background:${sc.c}"></span><span class="name">${status}</span><span class="cnt">${items.length}</span></div>
        <div class="col-progress"><div class="col-progress-fill" style="width:${barPct}%; background:${sc.c}"></div></div>
        <div class="col-body" data-status="${status}">
          ${items.length? items.map(t=>cardHtml(t)).join('') : `<div class="empty-col">여기로 카드를 끌어와 놓을 수 있습니다</div>`}
          ${extra}
        </div>
      </div>
    `;
  }).join('');

  wrap.insertAdjacentHTML('beforeend', `<div class="board ${boardCardMode==='summary'?'board-summary':''}">${cols}</div>`);
  el.innerHTML = '';
  el.appendChild(wrap);
  wrap.querySelectorAll('.board-viewmode button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      boardCardMode = btn.dataset.mode;
      renderBoard();
    });
  });
  el.querySelectorAll('.col-body, .delay-sublist').forEach(z=>{
    if(z.dataset.status && scrollMemo[z.dataset.status] != null) z.scrollTop = scrollMemo[z.dataset.status];
  });
  if(flipState) try{
    const movedSet = new Set(moved);
    // 그대로 있는 카드들은 빈자리를 메우며 부드럽게 미끄러짐
    Flip.from(flipState, {targets:[...el.querySelectorAll('.card[data-id]')].filter(c=>!movedSet.has(c.dataset.id)), duration:.45, ease:'power2.inOut'});
    // 옮겨진 카드는 예전 카드를 화면 위에 띄워 새 자리까지 날려 보낸 뒤, 진짜 카드를 보여줌
    flying.forEach(f=>{
      const dest = el.querySelector(`.card[data-id="${CSS.escape(f.id)}"]`);
      if(!dest) return;
      const to = dest.getBoundingClientRect(), g = f.node;
      dest.style.visibility = 'hidden';
      g.classList.remove('dragging');
      Object.assign(g.style, {position:'fixed', left:f.rect.left+'px', top:f.rect.top+'px', width:f.rect.width+'px', height:f.rect.height+'px', margin:'0', zIndex:'9000', pointerEvents:'none', transition:'none'});
      document.body.appendChild(g);
      gsap.timeline({onComplete:()=>{
        g.remove(); dest.style.visibility = '';
        gsap.fromTo(dest, {scale:1.06}, {scale:1, duration:.4, ease:'back.out(3)', clearProps:'transform'});
        if(boardLastStatus_.get(f.id) === '완료') boardConfetti_(to.left + to.width/2, to.top + to.height/2);
      }})
        .to(g, {scale:1.05, rotation:-3, boxShadow:'0 26px 50px -14px rgba(0,0,0,.4)', duration:.18, ease:'power2.out'})
        .to(g, {left:to.left, top:to.top, width:to.width, height:to.height, duration:.65, ease:'power3.inOut'})
        .to(g, {scale:1, rotation:0, duration:.18}, '-=.18');
    });
  }catch(err){
    console.warn('보드 애니메이션 실패(카드는 정상 표시)', err);
    flying.forEach(f=>{ f.node.remove(); const d = el.querySelector(`.card[data-id="${CSS.escape(f.id)}"]`); if(d) d.style.visibility = ''; });
  }
  el.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> openDetail(c.dataset.id));
  });
  el.querySelectorAll('.advance-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      advanceStatus(btn.dataset.advanceId);
    });
  });
  const delayToggle = el.querySelector('#delayToggle');
  if(delayToggle) delayToggle.addEventListener('click', ()=>{
    delayCollapsed = !delayCollapsed;
    renderBoard();
  });

  // ---- 드래그 앤 드롭으로 카드를 다른 상태 컬럼에 끌어다 놓기 ----
  let dragId = null;
  el.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('dragstart', (e)=>{
      dragId = c.dataset.id;
      c.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', c.dataset.id); }catch(err){}
    });
    c.addEventListener('dragend', ()=>{
      c.classList.remove('dragging');
      el.querySelectorAll('.drag-over').forEach(z=>z.classList.remove('drag-over'));
      dragId = null;
    });
  });
  // delay-sublist가 col-body 안에 중첩돼 있으므로, 이벤트 버블링으로 두 핸들러가 같이 실행되는 걸 막기 위해 stopPropagation
  el.querySelectorAll('.col-body, .delay-sublist').forEach(zone=>{
    zone.addEventListener('dragover', (e)=>{
      if(!dragId) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      el.querySelectorAll('.drag-over').forEach(z=>{ if(z!==zone) z.classList.remove('drag-over'); });
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      zone.classList.remove('drag-over');
      const id = dragId || e.dataTransfer.getData('text/plain');
      const targetStatus = zone.dataset.status;
      if(id && targetStatus) moveTaskToStatus(id, targetStatus);
      dragId = null;
    });
  });
}
// 업무 id에 박힌 생성 시각(예: "t1788928280512")으로 등록된 지 24시간 안 됐는지 판단한다
// (대시보드의 "오늘 등록" 하이라이트와 같은 방식) — 엑셀로 과거 이력을 불러온 업무처럼 이 형식이
// 아닌 id는 0시로 취급되어 자연히 "새 업무" 대상에서 빠진다.
function taskCreatedAtMs(t){ const m=/^t(\d+)/.exec(t.id||''); return m? Number(m[1]) : 0; }
function isNewTask(t){ return (Date.now() - taskCreatedAtMs(t)) < 86400000; }
function cardHtml(t){
  const tc = typeColor(t.type);
  const author = resolveAuthor(t);
  const urgency = dueUrgency(t);
  const next = nextStatusOf(t.status);
  const assigneeUser = t.assignee ? USERS.find(u=>u.name===t.assignee) : null;
  const isSummary = boardCardMode === 'summary';
  return `
    <div class="card ${urgency? 'card-'+urgency : ''} ${isSummary?'card-summary':''}" data-id="${t.id}" data-flip-id="${t.id}" draggable="true" style="--card-accent:${tc.c}">
      <div class="badges">
        ${isNewTask(t)? '<span class="k-new-badge">NEW</span>' : ''}
        <span class="k-tag" style="background:${tc.t}; color:${tc.c}">${t.type}</span>
        ${(!isSummary && t.model)? `<span class="k-tag" style="background:var(--border-soft); color:var(--muted)">${escapeHtml(t.model)}</span>` : ''}
        ${dueBadgeHtml(t)}
        ${!isSummary ? unreadBadgeHtml(t) : ''}
      </div>
      <div class="title">${escapeHtml(t.title)}</div>
      <div class="meta">
        <span class="doc">${taskLinkHtml(t)}</span>
        <span class="k-assignee">${assigneeUser? avatarHtml(assigneeUser,17) : ''}${t.assignee? escapeHtml(t.assignee): '미배정'}</span>
      </div>
      ${(!isSummary && author) ? `
      <div class="card-author">
        ${avatarHtml(author,16)}<span style="color:${author.color}; font-weight:600;">${escapeHtml(author.name)}</span><span class="muted-cell">작성</span>
      </div>` : ''}
      ${(!isSummary && next) ? `
      <button class="advance-btn" data-advance-id="${t.id}" title="다음 단계로: ${next}">
        다음 단계 → <b>${next}</b>
      </button>` : ''}
    </div>
  `;
}

/* ================= LIST (TABLE) ================= */
function renderList(){
  const el = document.getElementById('view-list');
  const wrap = document.createElement('div');
  renderToolbar(wrap);

  const stripEl = document.createElement('div');
  const list = filteredTasks();
  const done = list.filter(t=>t.status==='완료').length;
  const delay = list.filter(t=>t.status==='장기 지연').length;
  stripEl.innerHTML = `
    <div class="stat-strip">
      <div class="stat-chip">표시 중 <b>${list.length}</b>건</div>
      <div class="stat-chip">완료 <b>${done}</b>건</div>
      <div class="stat-chip">장기 지연 <b>${delay}</b>건</div>
    </div>
  `;
  wrap.appendChild(stripEl);

  if(list.length===0){
    wrap.insertAdjacentHTML('beforeend', `<div class="no-result">조건에 맞는 업무를 찾지 못했습니다. 검색어나 필터를 조정해 보세요.</div>`);
    el.innerHTML = ''; el.appendChild(wrap); return;
  }

  const groups = {};
  list.forEach(t=>{ (groups[t.model] = groups[t.model]||[]).push(t); });
  const groupNames = Object.keys(groups).sort((a,b)=> groups[b].length - groups[a].length);

  const sortedItems = sortListItems(list.slice());
  // 그룹(MODEL)별로 나눠 보여주되, 각 그룹 안의 순서는 정렬 결과(sortedItems)의 순서를 그대로 따른다.
  const groupsHtml = groupNames.map(name=>{
    const nameSet = new Set(groups[name].map(t=>t.id));
    const items = sortedItems.filter(t=> nameSet.has(t.id));
    const collapsed = collapsedGroups[name];
    return `
      <div class="group ${collapsed?'collapsed':''}" data-group="${escapeHtml(name)}">
        <div class="group-head">
          <span class="chev">▾</span>
          <span class="gname">${escapeHtml(name)}</span>
          <span class="gcount">${items.length}건</span>
        </div>
        <table>
          <thead><tr>
            ${listSortHeaderHtml('type', '유형', 'width:56px')}
            ${listSortHeaderHtml('title', '프로젝트 이름', '')}
            <th class="mono" style="width:110px">문서번호</th>
            ${listSortHeaderHtml('assignee', '담당자', 'width:120px')}
            <th style="width:44px" title="등록한 사람">작성</th>
            ${listSortHeaderHtml('due', '완료요청일', 'width:96px', 'mono')}
            ${listSortHeaderHtml('status', '상태', 'width:104px')}
          </tr></thead>
          <tbody>
            ${items.map(t=>{
              const tc = typeColor(t.type); const sc = statusColor(t.status);
              const author = resolveAuthor(t);
              const sameAsAssignee = author && t.assignee && t.assignee === author.name;
              const urgency = dueUrgency(t);
              const dueColor = urgency==='overdue' ? 'var(--s-delay)' : (urgency==='soon' ? 'var(--accent)' : null);
              return `
                <tr data-id="${t.id}">
                  <td><span class="tag" style="background:${tc.t}; color:${tc.c}">${t.type}</span></td>
                  <td class="td-title">${escapeHtml(t.title)}</td>
                  <td class="mono muted-cell">${taskLinkHtml(t)} ${unreadBadgeHtml(t)}</td>
                  <td>${t.assignee
                      ? `<span class="assignee-badge"><span class="avatar">${initials(t.assignee)}</span>${escapeHtml(t.assignee)}</span>`
                      : (t.status==='완료'
                          ? `<span class="muted-cell" title="이미 완료된 업무라 담당자를 지정할 필요가 없습니다.">완료됨 · 배정 불필요</span>`
                          : quickAssignSelectHtml(t))}</td>
                  <td>${author
                      ? (sameAsAssignee
                          ? `<span class="same-author-dot" style="background:${author.color}" title="담당자 본인이 작성"></span>`
                          : `<span title="${escapeHtml(author.name)}">${avatarHtml(author,20)}</span>`)
                      : `<span class="muted-cell">—</span>`}</td>
                  <td class="mono" style="${dueColor? `color:${dueColor}; font-weight:700;` : 'color:var(--muted-2)'}">${escapeHtml(t.dueRequest||'—')}${urgency==='overdue'?' ⚠':''}</td>
                  <td><span class="status-pill" style="background:${sc.t}; color:${sc.c}"><span class="d" style="background:${sc.c}"></span>${t.status}</span></td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  }).join('');

  wrap.insertAdjacentHTML('beforeend', groupsHtml);
  el.innerHTML = '';
  el.appendChild(wrap);

  el.querySelectorAll('.group-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      const g = h.closest('.group');
      const name = g.dataset.group;
      collapsedGroups[name] = !collapsedGroups[name];
      g.classList.toggle('collapsed');
    });
  });
  el.querySelectorAll('th.sortable').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.sortKey;
      if(listSort.key === key) listSort.dir = (listSort.dir === 'asc' ? 'desc' : 'asc');
      else listSort = {key, dir:'asc'};
      renderList();
    });
  });
  el.querySelectorAll('tbody tr').forEach(r=>{
    r.addEventListener('click', ()=> openDetail(r.dataset.id));
  });
  el.querySelectorAll('select.quick-assign').forEach(sel=>{
    sel.addEventListener('click', e=> e.stopPropagation());
    sel.addEventListener('change', async ()=>{
      await quickAssignTask(sel.dataset.id, sel.value);
    });
  });
}
// 전체 목록 컬럼 헤더 — 클릭하면 그 컬럼으로 정렬(같은 컬럼 재클릭 시 방향 반전)
function listSortHeaderHtml(key, label, styleExtra, extraClass){
  const active = listSort.key === key;
  const arrow = active ? (listSort.dir==='asc' ? ' ▲' : ' ▼') : '';
  const cls = ['sortable', extraClass, active?'sort-active':''].filter(Boolean).join(' ');
  return `<th class="${cls}" style="${styleExtra||''}" data-sort-key="${key}" title="클릭하여 정렬">${label}${arrow}</th>`;
}
function sortListItems(items){
  const dir = listSort.dir === 'desc' ? -1 : 1;
  const key = listSort.key;
  function val(t){
    switch(key){
      case 'type': return t.type||'';
      case 'title': return t.title||'';
      case 'assignee': return t.assignee||''; // 미배정을 항상 앞쪽에 두기 위해 빈 문자열 유지
      case 'status': return STATUS_ORDER.indexOf(t.status);
      case 'due': default: return t.dueRequest||'';
    }
  }
  items.sort((a,b)=>{
    const va = val(a), vb = val(b);
    if(va < vb) return -1*dir;
    if(va > vb) return 1*dir;
    return (a.title||'').localeCompare(b.title||'');
  });
  return items;
}
// 미배정 업무를 목록에서 바로 지정할 수 있게 하는 인라인 담당자 선택 — 모달을 열지 않아도 됨
function quickAssignSelectHtml(t){
  return `<select class="quick-assign" data-id="${t.id}" aria-label="담당자 빠른 지정">${assigneeOptions('')}</select>`;
}
async function quickAssignTask(id, name){
  const t = TASKS.find(x=>x.id===id);
  if(!t) return;
  t.assignee = name || '';
  await persist();
  if(name) await logActivity('update', `"<b>${escapeHtml(t.title)}</b>" 담당자가 <b>${escapeHtml(name)}</b>(으)로 지정되었습니다.`, t.id);
  renderCurrent();
}

/* ================= 업데이트 알림(활동 로그) ================= */
const ACTIVITY_KEY = 'ppe_activity_log';       // 공유 — 모든 팀원이 같은 알림을 봄
const NOTIF_SEEN_KEY = 'ppe_notif_last_seen';  // 개인별 — 내가 마지막으로 알림함을 연 시각
const ACTIVITY_MAX = 200;
let ACTIVITY_LOG = [];
let notifLastSeen = 0;

async function loadActivity(){
  try{
    const res = await window.storage.get(ACTIVITY_KEY, true);
    if(res && res.value) ACTIVITY_LOG = JSON.parse(res.value);
  }catch(e){ ACTIVITY_LOG = []; }
  try{
    const res2 = await window.storage.get(NOTIF_SEEN_KEY+'_'+currentUserId, false);
    if(res2 && res2.value) notifLastSeen = Number(res2.value) || 0;
  }catch(e){ notifLastSeen = 0; }
}
async function persistActivity(){
  try{ await window.storage.set(ACTIVITY_KEY, JSON.stringify(ACTIVITY_LOG), true); }catch(e){boardSync.error=e.message;boardSyncStatus();}
}
async function logActivity(type, message, taskId){
  ACTIVITY_LOG.unshift({ id:'a'+Date.now()+Math.random().toString(36).slice(2,6), ts:Date.now(), type, message, taskId: taskId||null, by: currentUserLabel() });
  if(ACTIVITY_LOG.length > ACTIVITY_MAX) ACTIVITY_LOG.length = ACTIVITY_MAX;
  await persistActivity();
}
function unreadNotifCount(){
  return ACTIVITY_LOG.filter(a=>a.ts > notifLastSeen).length;
}
function renderNotifBadge(){
  const badge = document.getElementById('notifNavBadge');
  if(!badge) return;
  const n = currentView==='notif' ? 0 : unreadNotifCount();
  if(n > 0){ badge.textContent = n > 99 ? '99+' : String(n); badge.style.display = ''; }
  else badge.style.display = 'none';
}
async function markNotifSeen(){
  notifLastSeen = Date.now();
  try{ await window.storage.set(NOTIF_SEEN_KEY+'_'+currentUserId, String(notifLastSeen), false); }catch(e){}
}
const NOTIF_ICON = { update:'✏️', create:'🆕', status:'🔄', comment:'💬', excel:'📋', label:'🏷️', bom:'📊', delete:'🗑️', user:'👤' };
const NOTIF_TYPE_LABEL = { update:'수정', create:'등록', status:'상태 변경', comment:'댓글', excel:'엑셀 업로드', label:'라벨 생성', bom:'BOM 비교', delete:'삭제', user:'팀원 변경' };
let notifFilter = {type:'all', by:'all'}; // 시스템 로그 화면의 유형/작성자 필터 상태
/* ================= 기본 설정 ================= */
let settingsTab = 'models';
function renderSettings(){
  ensureRequestMailItems();
  const el = document.getElementById('view-settings');

// 라벨 프린터 목록: 표에서 바로 고치면 저장(팀원 누구나). 엑셀 표를 붙여 넣어 한 번에 바꿀 수도 있음.
// 마스터 프린터는 BCD TYPE과 상관없이 라벨 미리보기의 프린터 목록에 항상 나온다.
const PRINTER_COLS = [['campus','Campus',70],['process','사용 공정',90],['id','Print ID',60],['ip','IP Address',110],['location','LOCATION',150],['types','BCD TYPE',170],['size','Label Size',70],['maker','제조사',80],['model','모델',70],['regDate','자산등록일',80],['note','비고',100]];
const printerTypesText = t=> (t||[]).join(', ');
const parsePrinterTypes = v=> String(v||'').split(/[,\s]+/).map(x=>parseInt(x,10)).filter(n=>n>0);
function renderPrinterSettings(){
  const body = document.getElementById('settingsBody');
  const cell = (p,i,[k,,w])=>{ const v = k==='types' ? printerTypesText(p.types) : (p[k]==null?'':p[k]); return `<td><input type="text" class="prn-in" data-i="${i}" data-k="${k}" value="${escapeHtml(String(v))}" style="width:${w}px"></td>`; };
  body.innerHTML = `
    <div class="panel">
      <h3>라벨 프린터</h3>
      <p class="settings-desc">라벨 미리보기에서 라벨 타입에 맞는 프린터를 추천할 때 씁니다. <b>BCD TYPE</b>은 그 프린터로 찍는 라벨 타입 번호(쉼표로 구분), <b>마스터</b>에 체크하면 어떤 라벨이든 고를 수 있게 항상 목록에 나옵니다. 칸을 고치면 바로 저장됩니다.</p>
      <div class="table-wrap" style="overflow:auto; max-height:calc(100vh - 330px);">
        <table class="prn-table"><thead><tr><th>마스터</th>${PRINTER_COLS.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead>
        <tbody>${PRINTERS.map((p,i)=>`<tr><td style="text-align:center"><input type="checkbox" class="prn-master" data-i="${i}" ${p.master?'checked':''}></td>${PRINTER_COLS.map(c=>cell(p,i,c)).join('')}<td><button class="closebtn prn-del" data-i="${i}" title="삭제">✕</button></td></tr>`).join('') || `<tr><td colspan="13" class="comment-empty">등록된 프린터가 없습니다. 아래 "엑셀에서 붙여넣기"로 한 번에 넣을 수 있습니다.</td></tr>`}</tbody></table>
      </div>
      <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
        <button class="btn" id="prnAdd">+ 프린터 추가</button>
        <button class="btn btn-ghost" id="prnPasteToggle">엑셀에서 붙여넣기</button>
        <span class="muted-cell" style="align-self:center;">${PRINTERS.length}대 · 마스터 ${PRINTERS.filter(p=>p.master).length}대</span>
      </div>
      <div id="prnPasteBox" hidden style="margin-top:10px;">
        <p class="settings-desc">엑셀 표(No. · Campus · 사용 공정 · Print ID · IP Address · LOCATION · BCD TYPE · Label Size · 제조사 · 모델 · 자산등록일 · 비고)를 제목 줄과 함께 복사해 붙여 넣으세요. <b>목록 전체가 바뀝니다.</b> 맨 끝에 "마스터" 열(Y/O/1)이 있으면 함께 반영하고, 없으면 기존 마스터 표시를 같은 Print ID·IP에 유지합니다.</p>
        <textarea id="prnPasteText" rows="8" style="width:100%; font-family:var(--mono, monospace); font-size:12px; border:1px solid var(--border); border-radius:10px; padding:8px;"></textarea>
        <div style="margin-top:8px; display:flex; gap:8px;"><button class="btn" id="prnPasteApply">표 전체 바꾸기</button><span class="muted-cell" id="prnPasteMsg" style="align-self:center;"></span></div>
      </div>
    </div>`;
  const save = async ()=>{ await persistPrinters(); };
  body.querySelectorAll('.prn-in').forEach(inp=> inp.addEventListener('change', async ()=>{
    const p = PRINTERS[+inp.dataset.i]; if(!p) return; const k = inp.dataset.k;
    p[k] = k==='types' ? parsePrinterTypes(inp.value) : inp.value.trim(); await save(); }));
  body.querySelectorAll('.prn-master').forEach(cb=> cb.addEventListener('change', async ()=>{ const p = PRINTERS[+cb.dataset.i]; if(!p) return; p.master = cb.checked; await save(); renderPrinterSettings(); }));
  body.querySelectorAll('.prn-del').forEach(b=> b.addEventListener('click', async ()=>{ const p = PRINTERS[+b.dataset.i]; if(!p || !confirm(`프린터 #${p.id||'?'} (${p.ip||'IP 없음'})를 삭제할까요?`)) return; PRINTERS.splice(+b.dataset.i, 1); await save(); renderPrinterSettings(); }));
  document.getElementById('prnAdd').addEventListener('click', async ()=>{ PRINTERS.push({campus:'', process:'', id:'', ip:'', location:'', types:[], size:'', maker:'', model:'', regDate:'', note:'', master:false}); await save(); renderPrinterSettings(); });
  document.getElementById('prnPasteToggle').addEventListener('click', ()=>{ const b = document.getElementById('prnPasteBox'); b.hidden = !b.hidden; });
  document.getElementById('prnPasteApply').addEventListener('click', async ()=>{
    const list = parsePrinterTable_(document.getElementById('prnPasteText').value);
    const msg = document.getElementById('prnPasteMsg');
    if(!list.length){ msg.textContent = '읽을 수 있는 줄이 없습니다 — 엑셀에서 표를 그대로 복사해 주세요.'; return; }
    if(!confirm(`프린터 목록 전체를 붙여 넣은 ${list.length}대로 바꿀까요?`)) return;
    PRINTERS = list; await save(); renderPrinterSettings();
  });
}
function parsePrinterTable_(text){
  const keepMaster = new Set(PRINTERS.filter(p=>p.master).map(p=>p.id+'|'+p.ip));
  const out = [];
  String(text||'').split(/\r?\n/).forEach(line=>{
    const c = line.split('\t').map(x=>x.trim()); if(c.length < 8 || !/^\d+$/.test(c[0])) return; // 제목 줄·빈 줄 건너뜀
    const p = {campus:c[1]||'', process:c[2]||'', id:c[3]||'', ip:c[4]||'', location:c[5]||'', types:parsePrinterTypes(c[6]==='-'?'':c[6]), size:c[7]||'', maker:c[8]||'', model:c[9]||'', regDate:(c[10]&&c[10]!=='-')?c[10]:'', note:c[11]||''};
    p.master = c.length > 12 ? /^(y|yes|o|1|true|v|✓|마스터)$/i.test(c[12]) : keepMaster.has(p.id+'|'+p.ip);
    out.push(p);
  });
  return out;
}

function renderChecklistSettings(){
  const body = document.getElementById('settingsBody');
  const types = Object.keys(CHECKLISTS);
  body.innerHTML = `
    <p class="settings-desc" style="max-width:640px;">업무유형(유형)별로 액션 아이템 체크리스트가 다르게 적용됩니다. 이미 진행 중인 업무는 겹치는 항목의 체크 상태를 유지합니다.</p>
    ${types.map(type=>`
      <div class="panel" style="max-width:640px; margin-bottom:16px;">
        <h3>${escapeHtml(type)}</h3>
        <div class="settings-item-list" data-type="${escapeHtml(type)}">
          ${CHECKLISTS[type].map((item,idx)=>`
            <div class="checklist-item-wrap" data-type="${escapeHtml(type)}" data-idx="${idx}" draggable="true">
              <div class="checklist-edit-row">
                <span class="ci-drag-handle" title="드래그해서 순서 변경">⠿</span>
                <input type="text" class="ci-label" value="${escapeHtml(item.label)}" style="flex:1;">
                <span class="tag" style="background:var(--border-soft); color:var(--muted);">${item.type==='email'?'메일':item.type==='link'?'링크':item.type==='materialList'?'신규자재목록':'체크'}</span>
                <button type="button" class="btn btn-ghost ci-save-label" style="font-size:12px; padding:5px 10px;">저장</button>
                <button class="closebtn ci-remove" title="삭제">✕</button>
              </div>
              ${item.type==='email' ? `
                <textarea class="ci-email-template" data-type="${escapeHtml(type)}" data-idx="${idx}" placeholder="메일 템플릿 ({{docNumber}}, {{title}}, {{mdmNumber}}, {{mdmTitle}}, {{partNumber}}, {{link}} 사용 가능)">${escapeHtml(item.emailTemplate||'')}</textarea>
                <div style="display:flex; justify-content:flex-end; margin:-6px 0 10px;">
                  <button type="button" class="btn btn-ghost ci-save-template" data-type="${escapeHtml(type)}" data-idx="${idx}" style="font-size:12px; padding:5px 10px;">저장</button>
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
        <div class="checklist-add-row">
          <input type="text" class="ci-new-label" data-type="${escapeHtml(type)}" placeholder="새 항목 이름">
          <select class="ci-new-type" data-type="${escapeHtml(type)}">
            <option value="check">일반 체크</option>
            <option value="email">메일 발송형</option>
            <option value="link">외부 링크형</option>
            <option value="materialList">신규자재 목록형</option>
          </select>
          <button class="btn btn-ghost ci-add" data-type="${escapeHtml(type)}">항목 추가</button>
        </div>
      </div>
    `).join('')}
  `;

  body.querySelectorAll('.ci-label').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const row = inp.closest('.checklist-edit-row');
      CHECKLISTS[row.dataset.type][Number(row.dataset.idx)].label = inp.value.trim();
      await persistChecklists();
    });
  });
  body.querySelectorAll('.ci-email-template').forEach(ta=>{
    ta.addEventListener('change', async ()=>{
      CHECKLISTS[ta.dataset.type][Number(ta.dataset.idx)].emailTemplate = ta.value;
      await persistChecklists();
    });
  });
  body.querySelectorAll('.ci-save-template').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const ta = body.querySelector(`.ci-email-template[data-type="${btn.dataset.type}"][data-idx="${btn.dataset.idx}"]`);
      if(!ta) return;
      CHECKLISTS[btn.dataset.type][Number(btn.dataset.idx)].emailTemplate = ta.value;
      await persistChecklists();
      const original = btn.textContent;
      btn.textContent = '✅ 저장됨';
      setTimeout(()=>{ btn.textContent = original; }, 1500);
    });
  });
  body.querySelectorAll('.ci-save-label').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const wrap = btn.closest('.checklist-item-wrap');
      const inp = wrap.querySelector('.ci-label');
      CHECKLISTS[wrap.dataset.type][Number(wrap.dataset.idx)].label = inp.value.trim();
      await persistChecklists();
      const original = btn.textContent;
      btn.textContent = '✅ 저장됨';
      setTimeout(()=>{ if(btn.isConnected) btn.textContent = original; }, 1500);
    });
  });
  // 체크리스트 항목 순서를 드래그 앤 드롭으로 바꿀 수 있게
  let ciDragType = null, ciDragIdx = null;
  body.querySelectorAll('.checklist-item-wrap').forEach(w=>{
    w.addEventListener('dragstart', e=>{
      ciDragType = w.dataset.type; ciDragIdx = Number(w.dataset.idx);
      w.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', w.dataset.idx); }catch(err){}
    });
    w.addEventListener('dragend', ()=>{
      w.classList.remove('dragging');
      body.querySelectorAll('.drag-over').forEach(z=>z.classList.remove('drag-over'));
      ciDragType = null; ciDragIdx = null;
    });
    w.addEventListener('dragover', e=>{
      if(ciDragType===null || ciDragType!==w.dataset.type) return;
      e.preventDefault();
      body.querySelectorAll('.drag-over').forEach(z=>{ if(z!==w) z.classList.remove('drag-over'); });
      w.classList.add('drag-over');
    });
    w.addEventListener('dragleave', ()=> w.classList.remove('drag-over'));
    w.addEventListener('drop', async e=>{
      e.preventDefault();
      w.classList.remove('drag-over');
      const type = w.dataset.type, targetIdx = Number(w.dataset.idx);
      if(ciDragType!==type || ciDragIdx===null || ciDragIdx===targetIdx) return;
      const arr = CHECKLISTS[type];
      const [moved] = arr.splice(ciDragIdx, 1);
      arr.splice(targetIdx, 0, moved);
      await persistChecklists();
      renderChecklistSettings();
    });
  });
  body.querySelectorAll('.ci-remove').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const row = btn.closest('.checklist-item-wrap');
      const type = row.dataset.type, idx = Number(row.dataset.idx);
      if(CHECKLISTS[type].length <= 1){ alert('최소 한 개 항목은 남아 있어야 합니다.'); return; }
      if(!confirm('이 항목을 삭제할까요? 이미 체크된 업무의 해당 기록도 함께 사라집니다.')) return;
      CHECKLISTS[type].splice(idx, 1);
      await persistChecklists();
      renderChecklistSettings();
    });
  });
  body.querySelectorAll('.ci-add').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const type = btn.dataset.type;
      const labelInput = body.querySelector(`.ci-new-label[data-type="${type}"]`);
      const typeSelect = body.querySelector(`.ci-new-type[data-type="${type}"]`);
      const label = labelInput.value.trim();
      if(!label){ alert('항목 이름을 입력해 주십시오.'); return; }
      const itemType = typeSelect.value;
      const key = 'c' + Date.now();
      const newItem = { key, label, type: itemType };
      if(itemType==='email') newItem.emailTemplate = '제목: {{docNumber}} - {{title}}\n\n내용을 입력하세요.';
      if(itemType==='link') newItem.linkLabel = '열기';
      CHECKLISTS[type].push(newItem);
      await persistChecklists();
      renderChecklistSettings();
    });
  });
}

  function mentionQueryAt(input){

    const ql = q.toLowerCase();
    mentionMatches = USERS.filter(u => (u.handle||'').toLowerCase().includes(ql) || u.name.toLowerCase().includes(ql));
    if(!mentionMatches.length){ mentionDropdown.style.display='none'; mentionActiveIndex=-1; return; }
    mentionActiveIndex = 0;

    const u = mentionMatches[idx];

    const pos = newCommentInput.selectionStart;
    const before = newCommentInput.value.slice(0, pos).replace(/@([a-z0-9_.\-가-힣]*)$/i, '@'+u.handle+' ');
    const after = newCommentInput.value.slice(pos);
    newCommentInput.value = before + after;
    newCommentInput.focus();

  newCommentInput.addEventListener('keydown', e=>{

function excelDateToStr(v){
  if(v === null || v === undefined || v === '') return '';
  if(typeof v === 'string'){
    const m = v.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if(m) return `${m[1]}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')}`;
    return v.trim();
  }
  if(v instanceof Date && !isNaN(v.getTime())){
    return `${v.getFullYear()}/${String(v.getMonth()+1).padStart(2,'0')}/${String(v.getDate()).padStart(2,'0')}`;
  }
  if(typeof v === 'number'){
    // 엑셀 시리얼 날짜 값 보정 (1900 날짜계 기준)
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}/${String(d.m).padStart(2,'0')}/${String(d.d).padStart(2,'0')}`;
  }
  return String(v).trim();
}
function inferTypeFromDoc(doc){
  const d = (doc||'').toUpperCase();
  if(d.startsWith('NPO')) return 'MDM';
  if(d.startsWith('E00')) return 'ECO';
  return '기타업무';
}
// 일괄등록용 엑셀 양식 다운로드 — handleExcelImport()가 읽는 컬럼명과 정확히 일치시켜서,
// 이 양식을 채워 그대로 업로드하면(과거에 이미 끝난 업무 포함) 바로 반영되도록 한다.
function downloadExcelImportTemplate(){
  const header = ['번호','문서 제목','MODEL','유형','담당자','상태','요청일','수신일','완료일','비고'];
  const sample1 = ['NPO-2509-001','예시) 신규자재 SAP 등록 요청','GMDSS','MDM','User 1','완료','2026/09/01','2026/09/01','2026/09/05','과거에 이미 끝난 업무도 이렇게 상태를 "완료"로 적으면 이력으로 등록됩니다'];
  const sample2 = ['E00-2509-002','예시) 진행 중인 ECO 건','VSAT C1','ECO','User 2','진행 중','2026/09/10','2026/09/08','',''];
  const noteRow = ['※ 상태는 다음 중 하나: '+STATUS_ORDER.join(' / '),'','유형: '+Object.keys(TYPE_META).join(' / '),'','','','날짜는 YYYY/MM/DD','','',''];
  const aoa = [header, sample1, sample2, [], noteRow];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:14},{wch:32},{wch:10},{wch:8},{wch:10},{wch:10},{wch:11},{wch:11},{wch:11},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '업무일괄등록');
  XLSX.writeFile(wb, '업무_일괄등록_양식.xlsx');
}
function bindExcelDrop(zone){
  zone.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();zone.classList.add('drag');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
  zone.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();zone.classList.remove('drag');const file=e.dataTransfer.files[0];if(file)handleExcelImport(file);});
}
async function handleExcelImport(file){
  if(!/\.xlsx?$/i.test(file.name)){alert('엑셀 파일(.xlsx 또는 .xls)을 선택해 주세요.');return;}
  if(typeof XLSX==='undefined'){alert('엑셀 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.');return;}
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(!rows.length){ alert('엑셀에서 데이터를 찾지 못했습니다.'); return; }

    // '번호'(문서번호=ECO/문서 키) 기준으로 그룹핑 — 활동명이 달라도 같은 번호면 하나의 업무로 합침
    const groups = {};
    rows.forEach(r=>{
      const doc = String(r['번호'] ?? r['문서번호'] ?? r['문서 번호'] ?? '').trim();
      if(!doc) return;
      if(!groups[doc]) groups[doc] = r; // 첫 행 기준 대표값 사용 (제목/담당자 등은 보통 동일)
    });
    if(!Object.keys(groups).length){ alert('엑셀에서 문서번호("번호") 컬럼을 찾지 못했습니다.'); return; }

    const toCreate = [];
    const toUpdate = [];
    Object.keys(groups).forEach(doc=>{
      const r = groups[doc];
      const title = String(r['문서 제목'] ?? r['제목'] ?? r['프로젝트 이름'] ?? '').trim();
      const assigneeRaw = String(r['담당자'] ?? '').trim();
      // 외부(Notion 등) 내보내기가 "USER1"처럼 공백/대소문자가 다르게 적는 경우, 실제 팀원 이름으로 정규화
      const normKey = s => s.toLowerCase().replace(/\s+/g,'');
      const matchedUser = assigneeRaw ? USERS.find(u => normKey(u.name) === normKey(assigneeRaw)) : null;
      const assignee = matchedUser ? matchedUser.name : assigneeRaw;
      const dueRequest = excelDateToStr(r['요청일'] ?? r['완료요청일'] ?? '');
      const receivedDate = excelDateToStr(r['수신일'] ?? '');
      const endDate = excelDateToStr(r['완료일'] ?? r['종료일'] ?? '');
      const model = String(r['MODEL'] ?? r['모델'] ?? '').trim();
      const note = String(r['비고'] ?? '').trim();
      // 상태/유형은 양식에 정해진 값과 정확히 일치할 때만 반영하고, 아니면 기존 방식(신규=시작 전, 문서번호로 유형 추정)대로 둔다.
      const statusRaw = String(r['상태'] ?? '').trim();
      const status = STATUS_ORDER.includes(statusRaw) ? statusRaw : '';
      const typeRaw = String(r['유형'] ?? '').trim();
      const type = Object.keys(TYPE_META).includes(typeRaw) ? typeRaw : inferTypeFromDoc(doc);

      const existing = TASKS.find(t => t.docNumber === doc);
      if(existing){
        toUpdate.push({ existing, patch:{title, assignee, dueRequest, receivedDate, endDate, status, note} });
      } else {
        toCreate.push({ doc, title: title || doc, assignee, dueRequest, receivedDate, endDate, type, model, status, note });
      }
    });

    openExcelReview(toCreate, toUpdate);
  }catch(err){
    console.error('엑셀 업로드 오류:', err);
    alert('엑셀 파일을 읽는 중 오류가 발생했습니다. 파일 형식을 확인해 주세요.');
  }
}

let pasteListenerRef = null;

let ocrWorkerPromise = null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = Tesseract.createWorker('kor+eng');
  }
  return ocrWorkerPromise;
}

// Tesseract는 스크린샷 속 작은 글자(특히 영문+숫자 혼합 모델명)를 자주 오독한다(예: S↔5, O↔0).
// 단순 canvas 확대보다 Lanczos 리샘플링이 작은 획을 더 또렷하게 보존한다(별도 라이브러리 없이 구현).
function resizeOcrCanvas(source, width, height){
  const sw = source.width, sh = source.height;
  const src = source.getContext('2d').getImageData(0, 0, sw, sh).data;
  const weights = (from, to) => Array.from({length: to}, (_, i) => {
    const center = (i + .5) * from / to - .5, result = []; let sum = 0;
    const stretch = Math.max(1, from / to), radius = 3 * stretch;
    for(let j = Math.ceil(center - radius); j <= Math.floor(center + radius); j++){
      const d = (center - j) / stretch;
      const v = Math.abs(d) < 1e-8 ? 1 : Math.abs(d) >= 3 ? 0 : Math.sin(Math.PI*d) * Math.sin(Math.PI*d/3) / (Math.PI*Math.PI*d*d/3);
      result.push({index: Math.max(0, Math.min(from-1, j)), weight: v}); sum += v;
    }
    result.forEach(r => r.weight /= sum); return result;
  });
  const wx = weights(sw, width), wy = weights(sh, height), temp = new Float32Array(width*sh*3);
  for(let y=0; y<sh; y++) for(let x=0; x<width; x++){
    const out=(y*width+x)*3;
    for(const t of wx[x]){ const pos=(y*sw+t.index)*4; for(let c=0;c<3;c++) temp[out+c]+=src[pos+c]*t.weight; }
  }
  const canvas = document.createElement('canvas'); canvas.width=width; canvas.height=height;
  const ctx = canvas.getContext('2d'), data = ctx.createImageData(width, height);
  for(let y=0; y<height; y++) for(let x=0; x<width; x++){
    const out=(y*width+x)*4; const values=[0,0,0];
    for(const t of wy[y]){ const pos=(t.index*width+x)*3; for(let c=0;c<3;c++) values[c]+=temp[pos+c]*t.weight; }
    for(let c=0;c<3;c++) data.data[out+c]=Math.round(values[c]); data.data[out+3]=255;
  }
  ctx.putImageData(data, 0, 0); return canvas;
}
async function loadImageAsOcrCanvas(file){
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width; canvas.height = bitmap.height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); // 투명 배경 PNG 대비
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0);
  return canvas;
}
// 목표 폭(3600px)에 맞춰 필요한 만큼만 확대한다 — 너무 작은 스크린샷은 키우고, 이미 큰 스크린샷은
// 과도하게(느려지기만 하고) 키우지 않는다.
async function upscaleImageForOcr(file){
  try{
    const base = await loadImageAsOcrCanvas(file);
    const pixels = base.width * base.height;
    const scale = Math.min(3, Math.max(1, 3600/base.width), Math.sqrt(12000000/Math.max(1,pixels)));
    if(scale <= 1.01) return base;
    return resizeOcrCanvas(base, Math.round(base.width*scale), Math.round(base.height*scale));
  }catch(e){
    return null; // 실패 시 null — 호출부가 폴백 처리
  }
}
// 확대본과 별도로, 대비를 높인 버전을 하나 더 만든다(하드 이진화 대신 부드러운 대비 강화 —
// 글자 획 경계의 안티에일리어싱을 살려두는 쪽이 Tesseract 인식에 더 유리하다).
// 배경색이 있거나 흐릿한 스크린샷에서 확대본과는 다른 오독 패턴이 나오는 경우가 많아, 두 버전을
// 함께 인식시켜 서로 비교하는 용도로 쓴다(아래 analyzeScreenshot 참고).
function contrastOcrImage(canvas){
  const copy = document.createElement('canvas'); copy.width=canvas.width; copy.height=canvas.height;
  const ctx = copy.getContext('2d'); ctx.drawImage(canvas, 0, 0);
  const data = ctx.getImageData(0, 0, copy.width, copy.height);
  for(let i=0; i<data.data.length; i+=4){
    const v = Math.max(0, Math.min(255, (data.data[i]*.299 + data.data[i+1]*.587 + data.data[i+2]*.114 - 45) * 1.5));
    data.data[i]=data.data[i+1]=data.data[i+2]=v;
  }
  ctx.putImageData(data, 0, 0); return copy;
}
// Tesseract가 내놓는 단순 텍스트(data.text)는 여러 열로 된 표를 읽을 때 줄 순서가 뒤섞이기 쉽다
// (Windchill 상세화면 같은 2~3열 표에서 특히 심함). 대신 단어별 좌표(TSV)를 y좌표로 묶어 행을
// 재구성하면 원래 표 순서에 훨씬 가까운 텍스트를 얻을 수 있다.
function ocrRowsFromTsv(tsv){
  const words = String(tsv||'').split('\n').slice(1).map(line=>{
    const c = line.replace(/\r$/,'').split('\t');
    return {level:+c[0], x:+c[6], y:+c[7], w:+c[8], h:+c[9], confidence:+c[10], text:c.slice(11).join('\t').trim()};
  }).filter(w=>w.level===5 && w.text && w.h>0);
  const rows = [];
  for(const word of words.sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2) || a.x-b.x)){
    const cy = word.y + word.h/2;
    let row = rows.find(r=>Math.abs(r.cy-cy) <= Math.max(6, Math.min(r.h,word.h)*0.6));
    if(!row){ row={cy, h:word.h, words:[]}; rows.push(row); }
    row.words.push(word);
    row.cy = row.words.reduce((sum,w)=>sum+w.y+w.h/2,0)/row.words.length;
  }
  return rows.sort((a,b)=>a.cy-b.cy).map(row=>{
    const ws = row.words.sort((a,b)=>a.x-b.x);
    return ws.map((w,i)=>{
      const previous = ws[i-1];
      const gap = previous ? w.x-previous.x-previous.w : 0;
      const connected = previous && gap<Math.min(previous.h,w.h)*.2 && (/[가-힣]$/.test(previous.text)||/^[가-힣]/.test(w.text));
      return (i ? (gap>Math.max(18,row.h*1.1) ? '\t' : connected ? '' : ' ') : '') + w.text;
    }).join('');
  }).join('\n');
}
// NPO-xxxx-xxx / E00-xxxx-xxx 형식의 문서번호는 자주 오독되는 문자(O↔0, I/L↔1)가 있는 자리가
// 정해져 있어서, 정규식으로 패턴을 확인한 뒤 그 자리의 문자만 보정한다. Windchill에서 "E00-..."은
// 파란 하이퍼링크로 렌더링되는데, 이 스타일에서 "E"가 "6"으로 오독되는 사례가 실사용 중 확인되어
// (예: "E00-2605-006" → "600-2605-006") 앞자리에 6도 E의 오독으로 인정한다.
function normalizeOcrDocNumber(value){
  const m = String(value||'').toUpperCase().match(/\b(NP[O0]|[E6][O0]{2})\s*[-–—_]\s*([\dOIl]{4})\s*[-–—_]\s*([\dOIl]{3})\b/);
  if(!m) return '';
  const digits = s => s.toUpperCase().replace(/O/g,'0').replace(/[IL]/g,'1');
  return (m[1].startsWith('NP') ? 'NPO' : 'E00') + '-' + digits(m[2]) + '-' + digits(m[3]);
}

// Windchill ECO/MDM 상세 화면 등에는 우리 스키마와 무관한 시스템 메타데이터 라벨이 많다.
// 아래 LABEL_MAP에서 이런 라벨도 "인식은 하되 버리는" 필드(dropOnly:true)로 등록해두면 —
// (1) 표의 칸 경계로 인정되어 옆/아래 칸 값이 서로 섞이지 않고, (2) 그러면서도 화면(비고 등)에는
// 절대 노출되지 않는다. 완전히 무시하면 라벨이 안 잘려서 오히려 다른 필드 값에 섞여 들어간다.
const OCR_DROP_LABELS = [
  '등록자','등록일','ECR 요청자','ECO 유형','Priority','Grade','호환 여부',
  'Hierarchy1','Hierarchy2','Hierarchy3','Hierarchy4','자재유형','분류','등록 구분','최종 수정일','관련 요청자 이메일',
];
// 표 끝 경계 표시용(값을 갖지 않는 섹션 제목) — 바로 위 다단락 필드(비고/사유/설명 등)가 여기까지 잘못
// 이어붙는 것을 막는 용도로만 쓰고, 그 자체는 어떤 필드에도 매핑하지 않는다.
const OCR_STOP_LABELS = ['첨부 파일','관련 객체','적용시점 관리','이력','세부 내용','상세 정보','기본 정보'];
// 라벨을 하나도 못 찾아 원문을 통째로 비고에 넣는 최후의 폴백 경로 전용 — 최소한 뻔히 불필요한
// 시스템 메타데이터 줄만이라도 거른다(정상 매칭 시엔 LABEL_MAP의 dropOnly로 이미 걸러지므로 안 쓰임).
function stripOcrDropLines(text){
  const drop = [...OCR_DROP_LABELS, ...OCR_STOP_LABELS];
  return text.split('\n').filter(line=>{
    const t = line.trim();
    if(!t) return true;
    return !drop.some(label => t.startsWith(label));
  }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

// 화면에서 흔히 쓰이는 라벨 → 우리 스키마 필드 매핑 (라벨:값이 같은 줄에 있는 표/양식 캡처를 전제로 함).
// ECO/MDM 상세화면(Windchill)은 라벨이 우리 자체 등록폼과 다르게 표기되므로(ECO 명/요청 제목 등)
// 같은 필드를 가리키는 여러 표기를 함께 등록해둔다. multiline:true인 항목은 다음 라벨이 나오기
// 전까지 여러 줄을 그대로 유지한다(비고성 서술 내용이라 첫 줄만 자르면 내용이 잘려나가기 때문).
const LABEL_MAP = [
  {key:'docNumber',  labels:['문서번호','문서 번호','ECO 번호','요청 번호','번호']},
  {key:'title',      labels:['프로젝트 이름','프로젝트명','ECO 명','요청 제목','제목']},
  {key:'dueRequest', labels:['완료요청일','완료 요청일']},
  {key:'type',       labels:['유형']},
  {key:'model',      labels:['MODEL','모델']},
  // 담당자는 항상 프로세스 보드에 등록된 User 중에서 사람이 직접 고른다 — 스크린샷 속 이름이 같은
  // 사람이라는 보장이 없으므로 절대 자동 반영하지 않는다. 그래도 라벨 자체는 표의 칸 경계로는
  // 인정해야 옆/아래 칸 값이 섞이지 않으므로 dropOnly로 등록(인식은 하되 값은 버림).
  {key:'assignee',   labels:['담당자','ECO 담당자','MDM 담당자'], dropOnly:true},
  {key:'status',     labels:['상태','문서 상태']},
  {key:'ecrNumber',  labels:['ECR 번호']},
  // 요청자/작업자/도착일은 사용자가 실제 화면에서 표시해준 "가져와야 할 항목" 범위에 없어서
  // (등록자·작업자 모두 대개 "생산기술팀(공용)" 같은 공용 계정으로 찍혀 실제 의미가 없고, 도착일도
  // Windchill 내부 결재/위임 타임스탬프라 우리 팀이 실제로 접수한 날짜와는 다름) 값은 버리고
  // 칸 경계로만 쓴다. 수신일은 대신 등록 시점(오늘)을 기본값으로 채운다(analyzeScreenshot 참고).
  {key:'requester',  labels:['요청자'], dropOnly:true},
  {key:'worker',     labels:['작업자'], dropOnly:true},
  // "활동"은 Windchill 상세화면 상단 탭 이름(세부 내용/적용시점 관리/관련 객체/활동/이력) 중 하나라서,
  // 실제 필드로 인식하면 탭바의 다음 칸("이력" 등)이 값으로 잘못 붙는 사고가 난다(탭 사이 간격이
  // 좁아 옆 탭 이름이 별도 라벨로 인식되지 않고 그대로 값에 흡수됨). 그래서 값은 버리고 칸 경계로만 쓴다.
  {key:'activity',   labels:['활동'], dropOnly:true},
  {key:'arrival',    labels:['도착일'], dropOnly:true},
  {key:'ecoReason',  labels:['ECO 사유'], multiline:true},
  {key:'changeDetails', labels:['변경 내용'], multiline:true},
  {key:'description', labels:['설명'], multiline:true},
  {key:'note',       labels:['비고'], multiline:true},
  ...OCR_DROP_LABELS.map(label=>({key:'_drop_'+label, labels:[label], dropOnly:true})),
  ...OCR_STOP_LABELS.map(label=>({key:'_stop_'+label, labels:[label], dropOnly:true})),
];

// 라벨 문자 사이에 OCR이 공백을 잘못 넣거나 빼는 경우(예: "MO DEL")를 흡수하기 위해,
// 라벨의 각 글자 사이에 임의 개수의 공백/탭을 허용하는 패턴으로 바꾼다.
function ocrLabelPattern(label){
  return [...label.replace(/\s/g,'')].map(c => c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('[ \\t]*');
}
function extractLabeledFields(rawText){
  const text = rawText.replace(/\r/g, '').replace(/\u00a0/g, ' ').replace(/[│┃]/g, '|');
  const allLabels = LABEL_MAP.flatMap(l => l.labels).sort((a,b) => b.replace(/\s/g,'').length - a.replace(/\s/g,'').length);
  // 라벨은 줄 시작이거나 공백 1칸 이상/탭/세로줄(표 칸 경계, OCR이 테두리를 '|'로 읽는 경우 포함) 뒤에
  // 오는 경우만 인정. 원래는 오탐 방지를 위해 공백 2칸 이상만 인정했는데, 실제 Windchill 화면은
  // OCR이 옆 칸과의 간격을 공백 1칸으로만 읽어내는 경우가 흔해서(줄 재구성 시 탭으로 분리되지 않음)
  // 그 경우 라벨이 아예 인식되지 않아 문서번호·완료요청일 등이 통째로 앞 칸 값에 묻혀 유실되는
  // 문제가 반복됐다. 공백 1칸까지 인정하도록 낮춤 — 라벨 목록이 충분히 특이해서 일반 문장 속
  // 우연한 오탐 위험은 낮다고 판단.
  const labelRegex = new RegExp('(^[ \\t|]*|\\t+|[ ]+|[ ]*\\|[ ]*)(' + allLabels.map(ocrLabelPattern).join('|') + ')(?=[ \\t:：|]|$)[ \\t]*[:：]?[ \\t]*', 'gm');

  const hits = [];
  let m;
  while((m = labelRegex.exec(text))){
    // ocrLabelPattern은 라벨 글자 "사이"에만 공백을 허용하므로, 매치된 문자열에서 공백을 지우면
    // 항상 라벨 원문(공백 제거)과 정확히 같다 — 그 값으로 어느 라벨이 매치됐는지 되찾는다.
    const collapsed = m[2].replace(/[ \t]/g, '');
    const matchedEntry = LABEL_MAP.find(l => l.labels.some(lab => lab.replace(/\s/g,'') === collapsed));
    if(!matchedEntry) continue;
    hits.push({ key: matchedEntry.key, start: m.index, valueStart: labelRegex.lastIndex });
    if(m.index === labelRegex.lastIndex) labelRegex.lastIndex++;
  }

  const entryByKey = Object.fromEntries(LABEL_MAP.map(e => [e.key, e]));
  const results = {};
  for(let i = 0; i < hits.length; i++){
    const entry = entryByKey[hits[i].key];
    if(entry && entry.dropOnly) continue; // 표 칸 경계로만 쓰고 값은 버림(옆/아래 칸이 섞이는 것 방지)
    const end = (i + 1 < hits.length) ? hits[i+1].start : text.length;
    let raw = text.slice(hits[i].valueStart, end);
    if(!(entry && entry.multiline)){
      const nl = raw.indexOf('\n');
      if(nl !== -1) raw = raw.slice(0, nl);
    }
    const value = (entry && entry.multiline)
      ? raw.split('\n').map(s=>s.replace(/^[ \t|]+|[ \t|]+$/g,'')).join('\n').replace(/\n{3,}/g,'\n\n').trim()
      : raw.replace(/[ \t]+/g, ' ').replace(/^\|+|\|+$/g, '').trim();
    if(value && !results[hits[i].key]) results[hits[i].key] = value;
  }
  if(results.docNumber){
    results.docNumber = normalizeOcrDocNumber(results.docNumber) || results.docNumber;
  } else {
    // 표 안의 "ECO 번호"/"요청 번호" 칸은 옆 칸과의 간격이 좁아 경계로 인식되지 않아 값을 놓치는
    // 경우가 있다. Windchill 상세화면은 거의 항상 맨 위 제목표시줄에도 같은 문서번호가
    // "E00-2607-015, [V5-8300] ..." 처럼 그대로 나오므로, 표에서 못 찾았으면 첫 줄에서 한 번 더 찾는다.
    const firstLine = text.split('\n').find(s => s.trim()) || '';
    const headerDoc = normalizeOcrDocNumber(firstLine);
    if(headerDoc) results.docNumber = headerDoc;
  }
  return results;
}

function todayDateStr(){
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

/* ================= 커스텀 날짜 선택기 (달력 팝업) ================= */
function formatSlashDate(y,m,d){ return `${y}/${String(m+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`; }
function parseSlashDateParts(s){
  const m = String(s||'').match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(!m) return null;
  return {y:+m[1], m:+m[2]-1, d:+m[3]};
}
let closeOpenDatePicker = null;
function attachDatePicker(fieldEl){
  if(!fieldEl) return;
  const input = fieldEl.querySelector('.date-picker-input');
  const iconBtn = fieldEl.querySelector('.date-picker-icon-btn');
  const openPicker = ()=>{
    if(closeOpenDatePicker) closeOpenDatePicker();
    const popup = document.createElement('div');
    popup.className = 'date-picker-popup open';
    fieldEl.appendChild(popup);
    const parsed = parseSlashDateParts(input.value);
    const today = new Date();
    let viewY = parsed ? parsed.y : today.getFullYear();
    let viewM = parsed ? parsed.m : today.getMonth();
    function draw(){
      const first = new Date(viewY, viewM, 1);
      const startOffset = (first.getDay()+6)%7; // 월요일 시작
      const daysInMonth = new Date(viewY, viewM+1, 0).getDate();
      const daysInPrevMonth = new Date(viewY, viewM, 0).getDate();
      let cells = '';
      for(let i=0;i<startOffset;i++){
        const dd = daysInPrevMonth - startOffset + 1 + i;
        const py = viewM===0? viewY-1 : viewY, pm = viewM===0? 11 : viewM-1;
        cells += `<button type="button" class="dp-cell dp-muted" data-y="${py}" data-m="${pm}" data-d="${dd}">${dd}</button>`;
      }
      for(let d=1; d<=daysInMonth; d++){
        const isToday = viewY===today.getFullYear() && viewM===today.getMonth() && d===today.getDate();
        const isSelected = parsed && viewY===parsed.y && viewM===parsed.m && d===parsed.d;
        cells += `<button type="button" class="dp-cell ${isToday?'dp-today':''} ${isSelected?'dp-selected':''}" data-y="${viewY}" data-m="${viewM}" data-d="${d}">${d}</button>`;
      }
      const trailing = (7 - ((startOffset + daysInMonth) % 7)) % 7;
      for(let i=1;i<=trailing;i++){
        const ny = viewM===11? viewY+1 : viewY, nm = viewM===11? 0 : viewM+1;
        cells += `<button type="button" class="dp-cell dp-muted" data-y="${ny}" data-m="${nm}" data-d="${i}">${i}</button>`;
      }
      popup.innerHTML = `
        <div class="dp-head">
          <button type="button" class="dp-nav-btn" data-nav="-1" aria-label="이전 달">‹</button>
          <span class="dp-title">${viewY}년 ${viewM+1}월</span>
          <button type="button" class="dp-nav-btn" data-nav="1" aria-label="다음 달">›</button>
        </div>
        <div class="dp-weekdays">${['월','화','수','목','금','토','일'].map(w=>`<span>${w}</span>`).join('')}</div>
        <div class="dp-grid">${cells}</div>
        <div class="dp-foot">
          <button type="button" data-today="1">오늘</button>
          <button type="button" data-clear="1">지우기</button>
        </div>
      `;
      popup.querySelector('[data-nav="-1"]').onclick = ()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} draw(); };
      popup.querySelector('[data-nav="1"]').onclick = ()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} draw(); };
      popup.querySelectorAll('.dp-cell').forEach(cell=>{
        cell.onclick = ()=>{
          input.value = formatSlashDate(+cell.dataset.y, +cell.dataset.m, +cell.dataset.d);
          input.dispatchEvent(new Event('change', {bubbles:true}));
          closePicker();
        };
      });
      popup.querySelector('[data-today="1"]').onclick = ()=>{
        const n = new Date();
        input.value = formatSlashDate(n.getFullYear(), n.getMonth(), n.getDate());
        input.dispatchEvent(new Event('change', {bubbles:true}));
        closePicker();
      };
      popup.querySelector('[data-clear="1"]').onclick = ()=>{
        input.value = '';
        input.dispatchEvent(new Event('change', {bubbles:true}));
        closePicker();
      };
    }
    draw();
    function onOutside(e){ if(!fieldEl.contains(e.target)) closePicker(); }
    function onEsc(e){ if(e.key==='Escape'){ e.stopPropagation(); closePicker(); } }
    function closePicker(){
      popup.remove();
      document.removeEventListener('mousedown', onOutside, true);
      document.removeEventListener('keydown', onEsc, true);
      closeOpenDatePicker = null;
    }
    closeOpenDatePicker = closePicker;
    setTimeout(()=>{
      document.addEventListener('mousedown', onOutside, true);
      document.addEventListener('keydown', onEsc, true);
    }, 0);
  };
  iconBtn.addEventListener('click', openPicker);
  input.addEventListener('click', openPicker);
}

function normalizeDate(s){
  if(!s) return '';
  const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  // 예전엔 매칭에 실패하면 원본 문자열(OCR이 잘못 읽은 깨진 값, 예: "2026709-")을 그대로 반환해서
  // 날짜칸에 그대로 들어가버렸다 — 매칭 실패나 말이 안 되는 월/일이면 빈 값으로 돌려서, 호출하는 쪽이
  // "인식 실패"로 취급하고 직접 입력하도록 유도한다(깨진 값을 그냥 넣어주는 것보다 안전함).
  if(!m) return '';
  const y=+m[1], mo=+m[2], d=+m[3];
  if(mo<1||mo>12||d<1||d>31) return '';
  return `${y}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
}

// 스크린샷 OCR로 자동 채워진 값은 글자색을 다르게 표시해서 "내가 입력한 게 아니라 자동으로
// 채워졌다"는 걸 한눈에 알 수 있게 한다. 값이 비어 있으면 표시를 지운다.
function applyAutoFilledValue(el, value){
  if(!el) return;
  el.value = value || '';
  if(value){ el.classList.add('auto-filled'); el.dataset.autoFilled = value; }
  else { el.classList.remove('auto-filled'); delete el.dataset.autoFilled; }
}
// 사람이 그 칸을 직접 고치면(타이핑/선택/달력에서 날짜 선택) 자동채움 표시를 벗긴다 — 새 값이
// 자동으로 채워진 값과 같아도(예: 달력에서 같은 날짜를 다시 선택) "직접 확인했다"는 뜻이므로 지운다.
function clearAutoFilledOnEdit(el){
  if(!el) return;
  const clear = ()=>{ el.classList.remove('auto-filled'); delete el.dataset.autoFilled; };
  el.addEventListener('input', clear);
  el.addEventListener('change', clear);
}

// 서로 다른 전처리(확대본/이진화본)로 두 번 인식한 결과를 필드 단위로 비교한다.
// 값이 둘 다 있는데 서로 다르면 "확신할 수 없는" 필드로 보고, 1번 결과를 기본값으로 채우되
// 두 값을 나란히 비고에 남겨서 사용자가 스스로 판단하게 한다 — 임의로 하나를 정답으로 우기지 않는다.
function reconcileOcrFields(r1, r2){
  const merged = {};
  const disagreements = [];
  const allKeys = new Set([...Object.keys(r1), ...Object.keys(r2)]);
  allKeys.forEach(k=>{
    const v1 = (r1[k]||'').trim(), v2 = (r2[k]||'').trim();
    if(v1 && v2 && v1 !== v2){
      merged[k] = v1;
      disagreements.push({key:k, v1, v2});
    } else {
      merged[k] = v1 || v2;
    }
  });
  return { merged, disagreements };
}
const OCR_FIELD_LABEL = Object.fromEntries(LABEL_MAP.map(l=>[l.key, l.labels[0]]));

// 스크린샷 OCR과 표 텍스트 붙여넣기 둘 다, "라벨:값 텍스트를 해석해서 폼에 채우는" 마지막 단계는
// 완전히 동일하다 — 차이는 그 텍스트를 어떻게 얻었는지(OCR 두 번 vs 클립보드 그대로)뿐이다.
// source: 상태 메시지에 쓸 말("OCR"|"텍스트"), rawText: 라벨을 하나도 못 찾았을 때 폴백으로 보여줄 원문,
// rawTextVerb: 그 폴백 메시지에 쓸 동사("인식된"|"붙여넣은").
function applyExtractedFields(r, disagreements, {source, rawText, rawTextVerb}){
  const statusEl = document.getElementById('shotStatus');
  let inferredType = (r.type && TYPE_META[r.type]) ? r.type : '';
  const doc = (r.docNumber || '').toUpperCase();
  if(!inferredType){
    if(doc.startsWith('NPO')) inferredType = 'MDM';
    else if(doc.startsWith('E00')) inferredType = 'ECO';
  }

  const noteParts = [];
  if(r.ecrNumber) noteParts.push('ECR 번호: ' + r.ecrNumber);
  if(r.ecoReason) noteParts.push('ECO 사유:\n' + r.ecoReason);
  if(r.changeDetails) noteParts.push('변경 내용:\n' + r.changeDetails);
  if(r.description) noteParts.push('설명:\n' + r.description);
  if(r.note) noteParts.push(r.note);
  // 예전엔 두 인식 방식이 다르게 나온 항목을 비고에 "⚠ ... vs ..." 문구로 영구히 남겼는데,
  // 등록 후에도 계속 비고에 남아있어 지저분했다 — 이제는 등록 화면의 상태 메시지(statusEl)로만
  // 잠깐 알려주고, 저장되는 비고에는 넣지 않는다.

  const dueNormalized = normalizeDate(r.dueRequest);
  // "도착일"은 우리 스키마의 "수신일"에 대응한다. 화면에 그 정보가 없으면(=인식 실패가 아니라
  // 애초에 그 항목이 없는 화면이면) 업무를 등록하는 지금 이 순간을 수신일로 보는 게 합리적이므로
  // 오늘 날짜를 기본값으로 넣는다 — 단, 라벨을 아예 하나도 못 찾은 경우(엉뚱한 내용일 수 있음)는
  // 추측성 기본값을 넣지 않는다.
  const foundAnyField = Object.keys(r).length > 0;
  const receivedNormalized = normalizeDate(r.arrival) || (foundAnyField ? todayDateStr() : '');

  applyAutoFilledValue(document.getElementById('nTitle'), r.title || '');
  if(inferredType) applyAutoFilledValue(document.getElementById('nType'), inferredType);
  applyAutoFilledValue(document.getElementById('nModel'), r.model || '');
  // 담당자는 스크린샷/붙여넣은 텍스트(Windchill 등록자/ECO 담당자/MDM 담당자 등)에서 절대 자동으로
  // 채우지 않는다 — 그 이름이 프로세스 보드에 등록된 우리 팀원과 같은 사람이라는 보장이 없으므로,
  // 항상 사람이 직접 보드에 등록된 User 중에서 고르게 한다. (r.assignee는 표 칸 경계 인식용으로만 쓰고 버림)
  applyAutoFilledValue(document.getElementById('nDoc'), r.docNumber || '');
  applyAutoFilledValue(document.getElementById('nDue'), dueNormalized);
  applyAutoFilledValue(document.getElementById('nReceived'), receivedNormalized);
  if(r.status && STATUS_ORDER.includes(r.status)) applyAutoFilledValue(document.getElementById('nStatus'), r.status);

  // 라벨을 하나도 못 찾았으면(표 레이아웃이 달라서 등) 아무 필드도 안 채워져서 "아무것도 안 들어간"
  // 것처럼 보인다 — 이 경우엔 원문 텍스트를 비고에 넣어서 최소한 뭐라도 보이게 한다.
  // 단, Windchill ECO/MDM 상세화면처럼 우리 스키마와 무관한 시스템 메타데이터(Hierarchy·Grade 등)가
  // 섞여 들어오는 경우가 많아 stripOcrDropLines로 그 줄들은 먼저 걸러낸다(정상적으로 라벨이
  // 매칭된 경우엔 이미 LABEL_MAP의 dropOnly 항목이 값 단계에서 걸러지므로 여기까지 오지 않는다).
  if(!foundAnyField){
    const cleaned = stripOcrDropLines((rawText||'').trim());
    applyAutoFilledValue(document.getElementById('nNote'), cleaned
      ? `(라벨을 자동으로 찾지 못해 ${rawTextVerb} 원문을 그대로 넣었습니다)\n` + cleaned
      : '');
  } else {
    applyAutoFilledValue(document.getElementById('nNote'), noteParts.join('\n\n'));
  }

  const missing = [];
  if(!r.title) missing.push('프로젝트 이름');
  if(!r.model) missing.push('MODEL');
  if(!r.status) missing.push('상태');
  if(r.dueRequest && !dueNormalized) missing.push('완료요청일(날짜 인식 실패)');
  const disagreeNote = disagreements.length
    ? ` 2가지 인식 방식 결과가 ${disagreements.length}개 항목에서 달라요 — ` +
      disagreements.map(d => `${OCR_FIELD_LABEL[d.key]||d.key} "${d.v1}" vs "${d.v2}"`).join(', ') + ' (직접 확인해주세요, 비고에는 남기지 않았습니다)'
    : '';
  // 담당자는 항상 직접 선택해야 하므로(자동으로 채우지 않음) 매번 안내한다.
  statusEl.textContent = !foundAnyField
    ? `${source}은(는) 읽었지만 항목 라벨을 찾지 못했습니다 — 비고에 원문을 넣어뒀으니 직접 옮겨주세요. 담당자도 직접 선택해주세요.`
    : missing.length
      ? `${source} 인식 완료 — 못 찾은 항목(${missing.join(', ')})은 직접 입력해주세요. 담당자도 직접 선택해주세요. 오탈자도 함께 확인해주세요.${disagreeNote}`
      : `${source} 인식 완료 — 담당자를 직접 선택해주세요. 오탈자가 있을 수 있으니 내용을 확인한 뒤 추가를 눌러주세요.${disagreeNote}`;
  statusEl.className = disagreements.length ? 'shot-status busy' : 'shot-status done';
}

async function analyzeScreenshot(file){
  const statusEl = document.getElementById('shotStatus');
  statusEl.textContent = 'OCR 엔진을 불러오는 중… (최초 1회는 다소 시간이 걸릴 수 있어요)';
  statusEl.className = 'shot-status busy';
  try{
    const worker = await getOcrWorker();
    statusEl.textContent = '이미지에서 텍스트를 인식하는 중… (정확도 확인을 위해 2가지 방식으로 읽습니다)';
    const baseCanvas = await upscaleImageForOcr(file); // 실패 시 null → 아래에서 원본 파일로 폴백
    const { data: data1 } = await worker.recognize(baseCanvas || file, {}, {text:true, tsv:true});
    // 표 형태 캡처는 단어 좌표(TSV) 기준으로 줄을 다시 조립해야 열이 섞이지 않는다.
    const text = (data1.tsv ? ocrRowsFromTsv(data1.tsv) : '') || data1.text || '';
    if(!text.trim()) throw new Error('인식된 텍스트가 없습니다.');

    let text2 = '';
    if(baseCanvas){
      const contrasted = contrastOcrImage(baseCanvas);
      const { data: data2 } = await worker.recognize(contrasted, {}, {text:true, tsv:true});
      text2 = (data2.tsv ? ocrRowsFromTsv(data2.tsv) : '') || data2.text || '';
    }

    const r1 = extractLabeledFields(text);
    const r2 = text2 ? extractLabeledFields(text2) : {};
    const { merged: r, disagreements } = reconcileOcrFields(r1, r2);
    applyExtractedFields(r, disagreements, {source:'OCR', rawText:text, rawTextVerb:'인식된'});
  }catch(e){
    statusEl.textContent = '텍스트 인식에 실패했습니다. 더 선명한 이미지로 다시 시도하거나 직접 입력해 주세요.';
    statusEl.className = 'shot-status error';
  }
}

// Windchill 화면에서 표를 직접 드래그로 선택해 복사(Ctrl+C)한 텍스트를 그대로 붙여넣는 경로 —
// OCR과 똑같은 라벨:값 해석 로직을 타지만, 글자를 그대로 복사한 것이라 오독이 전혀 없어 OCR보다
// 훨씬 정확하다. 두 번 읽어 비교할 필요도 없으므로 disagreements는 항상 빈 배열.
function applyPastedText(text){
  const statusEl = document.getElementById('shotStatus');
  try{
    if(!text || !text.trim()) return;
    const r = extractLabeledFields(text);
    applyExtractedFields(r, [], {source:'텍스트', rawText:text, rawTextVerb:'붙여넣은'});
  }catch(e){
    statusEl.textContent = '붙여넣은 텍스트를 처리하는 중 오류가 발생했습니다. 직접 입력해 주세요.';
    statusEl.className = 'shot-status error';
  }
}

async function createTaskFromForm(){
  const title = document.getElementById('nTitle').value.trim();
  const type = document.getElementById('nType').value;
  const status = document.getElementById('nStatus').value;
  const model = document.getElementById('nModel').value.trim() || '미분류';
  const blankActionItems = {};
  checklistFor(type).forEach(i=>{ blankActionItems[i.key] = false; });
  const newTask = {
    id: 't' + Date.now(),
    title,
    model,
    assignee: document.getElementById('nAssignee').value.trim(),
    docNumber: document.getElementById('nDoc').value.trim(),
    link: document.getElementById('nLink').value.trim(),
    partNumber: document.getElementById('nPartNumber').value.trim(),

    status,
    dueRequest: document.getElementById('nDue').value.trim(),
    receivedDate: document.getElementById('nReceived').value.trim(),
    type,
    endDate: '',
    ecnStep: type==='ECO' ? 'assigned' : 'na',
    actionItems: blankActionItems,
    author: currentUserLabel(),
    authorId: currentUserId,
    comments: [],
    delayReason: status==='장기 지연' ? 'manual' : null,
    delayOverrideAt: null
  };
  await ensureModelKnown(model);

  await logActivity('create', `<b>${escapeHtml(currentUserLabel())}</b>님이 새 업무 "<b>${escapeHtml(newTask.title)}</b>"를 등록했습니다.`, newTask.id);
  closeModal();
  renderCurrent();
}

/* ================= THEME ================= */
// 저장된 선택이 없으면 OS(시스템) 다크모드 설정을 따르고, 버튼으로 직접 켜고 끌 수 있다.
// BOM 비교 도구(iframe)도 같은 origin이라 localStorage를 공유하므로, 그쪽에서 로드 시 이 값을 그대로 읽어 적용한다.
function isDarkActive(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t === 'dark') return true;
  if(t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(theme){
  if(theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = isDarkActive() ? '☀️ 라이트 모드' : '🌙 다크 모드';
  // BOM 비교 도구 / 라벨데이터 변환기(둘 다 iframe)는 한 번 만들어지면 재사용되므로,
  // 테마를 바꿀 때 그쪽 문서에도 바로 반영한다.
  try{
    ['sapBomCompareFrame','labelDataFrame','labelPreviewFrame'].forEach(id=>{
      const frameDoc = document.getElementById(id)?.contentDocument;
      if(frameDoc && frameDoc.documentElement){
        if(theme === 'dark' || theme === 'light') frameDoc.documentElement.setAttribute('data-theme', theme);
        else frameDoc.documentElement.removeAttribute('data-theme');
      }
    });
  }catch(e){}
  // 업무유형/상태 색상은 렌더링 시점에 getComputedStyle로 읽어 인라인 style로 굳혀두므로,
  // 테마를 바꾼 뒤에는 현재 화면을 다시 그려야 새 팔레트 색이 반영된다.
  if(typeof renderCurrent === 'function' && typeof TASKS !== 'undefined' && TASKS.length) renderCurrent();
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('ppe_theme'); }catch(e){}
  applyTheme(saved);
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.addEventListener('click', ()=>{
    const next = isDarkActive() ? 'light' : 'dark';
    try{ localStorage.setItem('ppe_theme', next); }catch(e){}
    applyTheme(next);
  });
}
initTheme();

/* ================= NOTIFICATIONS (담당자 지정 / @멘션) =================
   같은 브라우저 탭이 열려 있는 동안에만 동작한다(탭을 완전히 닫으면 알림이 오지 않음) —
   서버 푸시(Web Push/VAPID) 없이, 15초 폴링 중 "나에게 온" 변화를 감지해서 그 자리에서
   브라우저 Notification(윈도우 알림센터에 뜸)을 띄우고, 탭이 안 보이는 동안은 제목도 반짝인다. */
const NOTIFY_TITLE_ORIG = document.title;
let notifyTitleBlinkTimer = null;
let notifyAssigneeSnapshot = null; // taskId -> assignee, 폴링 때마다 갱신되는 기준선(최초 로드 시점엔 알림을 울리지 않기 위함)
let notifyCommentCountSnapshot = null; // taskId -> comments.length

// 브라우저 권한(Notification.permission)은 한 번 허용하면 스크립트로 다시 끌 수 없다(브라우저 설정에서만
// 가능) — 그래서 "끄기"는 권한을 되돌리는 게 아니라, 별도의 앱 차원 선호값(notifyPref)으로 실제 알림
// 발송 여부만 가로막는다. 권한 요청은 최초 1회만 필요하고, 그 뒤로는 이 선호값만 토글하면 된다.
const NOTIFY_PREF_KEY = 'ppe_notify_pref';
let notifyPref = true;
try{ const saved = localStorage.getItem(NOTIFY_PREF_KEY); if(saved !== null) notifyPref = saved === '1'; }catch(e){}
function notifySupported(){ return typeof Notification !== 'undefined'; }
function notifyEnabled(){ return notifySupported() && Notification.permission === 'granted' && notifyPref; }
function renderNotifyToggleBtn(){
  const btn = document.getElementById('notifyToggleBtn');
  if(!btn) return;
  if(!notifySupported()){ btn.style.display = 'none'; return; }
  if(Notification.permission === 'denied'){ btn.textContent = '🔕 알림 차단됨 (브라우저 설정에서 허용 필요)'; btn.disabled = true; return; }
  btn.disabled = false;
  if(Notification.permission !== 'granted'){ btn.textContent = '🔔 알림 켜기'; return; }
  btn.textContent = notifyPref ? '🔔 알림 켜짐 (끄려면 클릭)' : '🔕 알림 꺼짐 (켜려면 클릭)';
}
document.getElementById('notifyToggleBtn')?.addEventListener('click', async ()=>{
  if(!notifySupported()) return;
  if(Notification.permission !== 'granted'){
    try{ await Notification.requestPermission(); }catch(e){}
    if(Notification.permission === 'granted'){ notifyPref = true; try{ localStorage.setItem(NOTIFY_PREF_KEY,'1'); }catch(e){} }
  } else {
    notifyPref = !notifyPref;
    try{ localStorage.setItem(NOTIFY_PREF_KEY, notifyPref ? '1' : '0'); }catch(e){}
  }
  renderNotifyToggleBtn();
});
function startTitleBlink(){
  if(notifyTitleBlinkTimer) return;
  let on = false;
  notifyTitleBlinkTimer = setInterval(()=>{
    on = !on;
    document.title = on ? '🔔 새 알림 — ' + NOTIFY_TITLE_ORIG : NOTIFY_TITLE_ORIG;
  }, 1000);
}
function stopTitleBlink(){
  if(notifyTitleBlinkTimer){ clearInterval(notifyTitleBlinkTimer); notifyTitleBlinkTimer = null; }
  document.title = NOTIFY_TITLE_ORIG;
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) stopTitleBlink(); });
window.addEventListener('focus', stopTitleBlink);

// 이 탭이 띄운 윈도우 알림 — 탭이 닫히거나 새로고침되면 함께 지운다.
// (남겨두면 나중에 눌렀을 때 크롬이 보드가 아닌 사이트 맨 앞 주소 jaeheungnam-ctrl.github.io/ 를 열어 404가 뜸)
const openNotifications_ = new Set();
window.addEventListener('pagehide', ()=>{ openNotifications_.forEach(n=>{ try{ n.close(); }catch(e){} }); openNotifications_.clear(); });
function notifyUser(title, body, taskId){
  if(notifyEnabled()){
    try{
      const n = new Notification(title, { body, tag: 'ppe-' + (taskId || Date.now()) });
      openNotifications_.add(n);
      n.onclose = ()=> openNotifications_.delete(n);
      n.onclick = (e)=>{ e.preventDefault(); window.focus(); if(taskId) openDetail(taskId); n.close(); };
    }catch(e){}
  }
  if(document.hidden) startTitleBlink();
}

// "@handle" 언급을 찾아서 지금 로그인한 사용자와 일치하면 알림을 준다. 대소문자 구분 없음, 단어 경계 기준.
function findMentionedUser(text){
  if(!text) return null;
  const matches = String(text).match(/@([a-z0-9_.\-가-힣]+)/gi) || [];
  for(const m of matches){
    const h = m.slice(1).toLowerCase();
    const u = USERS.find(u => u.handle && u.handle.toLowerCase() === h);
    if(u) return u;
  }
  return null;
}
// 코멘트 표시용 — 등록된 팀원의 handle과 일치하는 "@handle"만 강조 표시(그 외 "@"는 그냥 텍스트로 둠)
function highlightMentions(text){
  const esc = escapeHtml(text);
  return esc.replace(/@([a-z0-9_.\-가-힣]+)/gi, (whole, h) => {
    const u = USERS.find(u => u.handle && u.handle.toLowerCase() === h.toLowerCase());
    return u ? `<mark class="mention-tag">@${escapeHtml(u.handle)}</mark>` : whole;
  });
}
// 서버에서 새로 받아온 tasks와, 그 직전 스냅샷을 비교해서 "나에게 온" 변화(담당자 지정/코멘트 멘션)를 찾아 알린다.
// 최초 로드(스냅샷이 아직 없음)에서는 기존에 이미 있던 배정/댓글까지 전부 알림이 뜨면 안 되므로 건너뛴다.
function checkNotifyDiff(newTasks){
  const me = currentUser();
  const hadSnapshot = !!notifyAssigneeSnapshot;
  const nextAssignee = new Map();
  const nextCommentCount = new Map();
  const assignedToMe = [];
  newTasks.forEach(t=>{
    nextAssignee.set(t.id, t.assignee || '');
    nextCommentCount.set(t.id, (t.comments||[]).length);
    if(hadSnapshot && me){
      const prevAssignee = notifyAssigneeSnapshot.get(t.id);
      // 이름 변경으로 담당자 이름만 바뀐 경우(예전 이름이 이제 팀원 목록에 없음)는 새 배정이 아니므로 알리지 않는다
      const renamedOnly = prevAssignee && !USERS.some(u=>u.name===prevAssignee);
      if(prevAssignee !== undefined && prevAssignee !== t.assignee && t.assignee && t.assignee === me.name && !renamedOnly){
        assignedToMe.push(t);
      }
      const prevCount = notifyCommentCountSnapshot.get(t.id) || 0;
      const comments = t.comments || [];
      if(comments.length > prevCount){
        comments.slice(prevCount).forEach(c=>{
          if(c.authorId === currentUserId) return; // 내가 남긴 댓글은 알림 대상에서 제외
          const mentioned = findMentionedUser(c.text);
          if(mentioned && mentioned.id === currentUserId){
            notifyUser(`${c.author||'누군가'}님이 언급했습니다`, `"${t.title}": ${c.text}`, t.id);
          }
        });
      }
    }
  });
  // 한 번에 여러 건이 배정되면 알림 하나로 묶는다(알림이 몰아서 뜨지 않게)
  if(assignedToMe.length === 1) notifyUser('담당자로 지정되었습니다', `"${assignedToMe[0].title}" 업무의 담당자로 지정되었습니다.`, assignedToMe[0].id);
  else if(assignedToMe.length > 1) notifyUser(`업무 ${assignedToMe.length}건의 담당자로 지정되었습니다`, assignedToMe.slice(0,3).map(t=>`"${t.title}"`).join(', ') + (assignedToMe.length>3 ? ` 외 ${assignedToMe.length-3}건` : ''));
  notifyAssigneeSnapshot = nextAssignee;
  notifyCommentCountSnapshot = nextCommentCount;
}
renderNotifyToggleBtn();

/* ================= INIT ================= */
(async function init(){
  await fbInit_(); // Firebase 모드면 라이브러리·로그인 상태를 먼저 준비(아니면 즉시 통과)
  await loadUsers();
  resolveIdentity_();
  applyMenuPermissions();
  await loadMyOnlyPref();
  await loadLastViewed();
  await loadActivity();
  await loadAnnouncements();
  await loadModels();
  await loadPrinters();
  await loadChecklists();
  await loadTasks();
  await loadLabelLink();
  if(LABEL_LINK && !linkedTask()) await setLabelLink(null); // 연결된 업무가 사라졌으면 정리
  renderCurrent();
  startBoardShared();
  // 창마다 확인 시점을 흩어 모든 창이 같은 순간에 서버를 부르지 않게 한다(서버 동시 처리 한도 보호).
  setTimeout(()=>setInterval(refreshBoardShared,15000), Math.random()*15000);
  window.addEventListener('focus',()=>{ renderCurrent(); reconnectNow_(); refreshBoardShared(); });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) return;
    // 탭이 안 보이는 동안에는 데이터는 갱신했어도 화면은 다시 그리지 않았으므로, 다시 보일 때 한 번 그려준다
    // (그 사이 revision이 그대로면 refreshBoardShared 자체는 아무 것도 다시 그리지 않고 끝나기 때문).
    renderCurrent();
    reconnectNow_();
    refreshBoardShared();
  });
})();
</script>
