        <p>진행 상황에 따라 시작 전 → 진행 중 → 완료로 이동하며, 지연 시 장기 지연으로 표시해 팀 전체가 인지합니다.</p>
      </div>
    </div>

    <div class="proc-grid">
      <div class="panel">
        <h3>액션 아이템 체크리스트 <span class="muted-cell" style="font-weight:400; font-size:11px;">(MDM 기준 예시 — 유형별로 다르며 기본 설정에서 편집 가능)</span></h3>

/* ================= FILTER HELPERS ================= */
function uniqueValues(key){
  const set = new Set();
  TASKS.forEach(t=>{ if(t[key]) set.add(t[key]); });
  return Array.from(set).sort();
}
// MODEL 입력칸에 붙이는 자동완성 — 한번 골라도 다음에 열면 항상 전체 목록부터 보여줌
function setupModelCombobox(inputEl){
  if(!inputEl || inputEl.dataset.comboReady) return;
  inputEl.dataset.comboReady = '1';
  const wrapper = document.createElement('div');
  wrapper.className = 'combo-wrap';
  inputEl.parentNode.insertBefore(wrapper, inputEl);
  wrapper.appendChild(inputEl);
  const list = document.createElement('div');
  list.className = 'combo-list';
  wrapper.appendChild(list);

  function renderList(filterText){
    const opts = MODELS.filter(m => !filterText || m.toLowerCase().includes(filterText.toLowerCase()));
    if(!opts.length){ list.style.display = 'none'; return; }
    list.innerHTML = opts.map(m=>`<div class="combo-opt" data-val="${escapeHtml(m)}">${escapeHtml(m)}</div>`).join('');
    list.style.display = 'block';
    list.querySelectorAll('.combo-opt').forEach(opt=>{
      opt.addEventListener('mousedown', (e)=>{
        e.preventDefault();
        inputEl.value = opt.dataset.val;
        inputEl.dispatchEvent(new Event('input', {bubbles:true}));
        inputEl.dispatchEvent(new Event('change', {bubbles:true}));
        list.style.display = 'none'; // 우리 자신의 input 리스너가 재오픈시킨 뒤 최종적으로 닫음
      });
    });
  }
  inputEl.addEventListener('focus', ()=> renderList(''));
  inputEl.addEventListener('click', ()=> renderList(''));
  inputEl.addEventListener('input', ()=> renderList(inputEl.value));
  document.addEventListener('click', (e)=>{ if(!wrapper.contains(e.target)) list.style.display = 'none'; });
}
function filteredTasks(){
  const q = filter.q.trim().toLowerCase();
  return TASKS.filter(t=>{
    if(filter.model!=='all' && t.model!==filter.model) return false;
    if(filter.type!=='all' && t.type!==filter.type) return false;
    if(filter.assignee!=='all' && (t.assignee||'미배정')!==filter.assignee) return false;
    if(filter.status!=='all' && t.status!==filter.status) return false;
    if(filter.myOnly){
      const u = currentUser();
      if(!u || t.assignee !== u.name) return false;
    }
    if(q && !(t.title.toLowerCase().includes(q) || (t.docNumber||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

let delayCollapsed = true;
function renderBoard(){
  const el = document.getElementById('view-board');
  // 렌더링할 때마다 컬럼 DOM을 새로 만들기 때문에, 다시 그리기 전에 각 컬럼(및 장기 지연 서브리스트)의
  // 스크롤 위치를 상태값 기준으로 기억해뒀다가 새로 그린 뒤 그대로 복원한다.
  const scrollMemo = {};
  el.querySelectorAll('.col-body, .delay-sublist').forEach(z=>{
    if(z.dataset.status) scrollMemo[z.dataset.status] = z.scrollTop;
  });
  const wrap = document.createElement('div');
  renderToolbar(wrap);

  const list = filteredTasks();
  // 컬럼 헤더 아래 진행 바(전체 중 이 컬럼 비중)를 보여주기 위한 기준값
  const totalForBar = Math.max(1, list.length);
  const cols = BOARD_COLUMNS.map(status=>{
    const items = list.filter(t=>t.status===status);
    const sc = statusColor(status);
    const barPct = Math.round(items.length / totalForBar * 100);
    let extra = '';
    if(status === '진행 대기'){
      const delayItems = list.filter(t=>t.status==='장기 지연');
      const dsc = statusColor('장기 지연');
      extra = `
        <div class="delay-subsection ${delayCollapsed?'collapsed':''}">
          <button class="delay-subhead" id="delayToggle">
            <span class="chev">▾</span>
            <span class="dot" style="background:${dsc.c}"></span>
            <span class="name">장기 지연</span>
            <span class="cnt">${delayItems.length}</span>
          </button>
          <div class="delay-sublist" data-status="장기 지연">
            ${delayItems.length? delayItems.map(t=>cardHtml(t)).join('') : `<div class="empty-col">아직 없습니다</div>`}
          </div>
        </div>
      `;
    }
    return `
      <div class="col" style="--col-tint:${sc.t}; --col-accent:${sc.c}">
        <div class="col-head"><span class="dot" style="background:${sc.c}"></span><span class="name">${status}</span><span class="cnt">${items.length}</span></div>
        <div class="col-progress"><div class="col-progress-fill" style="width:${barPct}%; background:${sc.c}"></div></div>
        <div class="col-body" data-status="${status}">
          ${items.length? items.map(t=>cardHtml(t)).join('') : `<div class="empty-col">여기로 카드를 끌어와 놓을 수 있습니다</div>`}
          ${extra}
        </div>
      </div>
    `;
  }).join('');

  wrap.insertAdjacentHTML('beforeend', `<div class="board">${cols}</div>`);
  el.innerHTML = '';
  el.appendChild(wrap);
  el.querySelectorAll('.col-body, .delay-sublist').forEach(z=>{
    if(z.dataset.status && scrollMemo[z.dataset.status] != null) z.scrollTop = scrollMemo[z.dataset.status];
  });
  el.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> openDetail(c.dataset.id));
  });
  el.querySelectorAll('.advance-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      advanceStatus(btn.dataset.advanceId);
    });
  });
  const delayToggle = el.querySelector('#delayToggle');
  if(delayToggle) delayToggle.addEventListener('click', ()=>{
    delayCollapsed = !delayCollapsed;
    renderBoard();
  });

  // ---- 드래그 앤 드롭으로 카드를 다른 상태 컬럼에 끌어다 놓기 ----
  let dragId = null;
  el.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('dragstart', (e)=>{
      dragId = c.dataset.id;
      c.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', c.dataset.id); }catch(err){}
    });
    c.addEventListener('dragend', ()=>{
      c.classList.remove('dragging');
      el.querySelectorAll('.drag-over').forEach(z=>z.classList.remove('drag-over'));
      dragId = null;
    });
  });
  // delay-sublist가 col-body 안에 중첩돼 있으므로, 이벤트 버블링으로 두 핸들러가 같이 실행되는 걸 막기 위해 stopPropagation
  el.querySelectorAll('.col-body, .delay-sublist').forEach(zone=>{
    zone.addEventListener('dragover', (e)=>{
      if(!dragId) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      el.querySelectorAll('.drag-over').forEach(z=>{ if(z!==zone) z.classList.remove('drag-over'); });
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      zone.classList.remove('drag-over');
      const id = dragId || e.dataTransfer.getData('text/plain');
      const targetStatus = zone.dataset.status;
      if(id && targetStatus) moveTaskToStatus(id, targetStatus);
      dragId = null;
    });
  });
}

        ${dueBadgeHtml(t)}

      </div>
      ${author ? `

        ${avatarHtml(author,16)}<span style="color:${author.color}; font-weight:600;">${escapeHtml(author.name)}</span><span class="muted-cell">작성</span>
      </div>` : ''}
      ${next ? `

    <div class="stat-strip">
      <div class="stat-chip">표시 중 <b>${list.length}</b>건</div>
      <div class="stat-chip">완료 <b>${done}</b>건</div>
      <div class="stat-chip">장기 지연 <b>${delay}</b>건</div>
    </div>
  `;
  wrap.appendChild(stripEl);

  if(list.length===0){
    wrap.insertAdjacentHTML('beforeend', `<div class="no-result">조건에 맞는 업무를 찾지 못했습니다. 검색어나 필터를 조정해 보세요.</div>`);

  const groups = {};
  list.forEach(t=>{ (groups[t.model] = groups[t.model]||[]).push(t); });

  const sortedItems = sortListItems(list.slice());
  // 그룹(MODEL)별로 나눠 보여주되, 각 그룹 안의 순서는 정렬 결과(sortedItems)의 순서를 그대로 따른다.
  const groupsHtml = groupNames.map(name=>{
    const nameSet = new Set(groups[name].map(t=>t.id));
    const items = sortedItems.filter(t=> nameSet.has(t.id));
    const collapsed = collapsedGroups[name];
    return `
      <div class="group ${collapsed?'collapsed':''}" data-group="${escapeHtml(name)}">
        <div class="group-head">
          <span class="chev">▾</span>
          <span class="gname">${escapeHtml(name)}</span>
          <span class="gcount">${items.length}건</span>
        </div>
        <table>
          <thead><tr>
            ${listSortHeaderHtml('type', '유형', 'width:56px')}
            ${listSortHeaderHtml('title', '프로젝트 이름', '')}
            <th class="mono" style="width:110px">문서번호</th>
            ${listSortHeaderHtml('assignee', '담당자', 'width:120px')}
            <th style="width:44px" title="등록한 사람">작성</th>
            ${listSortHeaderHtml('due', '완료요청일', 'width:96px', 'mono')}
            ${listSortHeaderHtml('status', '상태', 'width:104px')}
          </tr></thead>
          <tbody>
            ${items.map(t=>{
              const tc = typeColor(t.type); const sc = statusColor(t.status);
              const author = resolveAuthor(t);
              const sameAsAssignee = author && t.assignee && t.assignee === author.name;
              const urgency = dueUrgency(t);
              const dueColor = urgency==='overdue' ? 'var(--s-delay)' : (urgency==='soon' ? 'var(--accent)' : null);
              return `
                <tr data-id="${t.id}">
                  <td><span class="tag" style="background:${tc.t}; color:${tc.c}">${t.type}</span></td>
                  <td class="td-title">${escapeHtml(t.title)}</td>
                  <td class="mono muted-cell">${taskLinkHtml(t)} ${unreadBadgeHtml(t)}</td>
                  <td>${t.assignee? `<span class="assignee-badge"><span class="avatar">${initials(t.assignee)}</span>${escapeHtml(t.assignee)}</span>` : quickAssignSelectHtml(t)}</td>
                  <td>${author
                      ? (sameAsAssignee
                          ? `<span class="same-author-dot" style="background:${author.color}" title="담당자 본인이 작성"></span>`
                          : `<span title="${escapeHtml(author.name)}">${avatarHtml(author,20)}</span>`)
                      : `<span class="muted-cell">—</span>`}</td>
                  <td class="mono" style="${dueColor? `color:${dueColor}; font-weight:700;` : 'color:var(--muted-2)'}">${escapeHtml(t.dueRequest||'—')}${urgency==='overdue'?' ⚠':''}</td>
                  <td><span class="status-pill" style="background:${sc.t}; color:${sc.c}"><span class="d" style="background:${sc.c}"></span>${t.status}</span></td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  }).join('');

  wrap.insertAdjacentHTML('beforeend', groupsHtml);
  el.innerHTML = '';
  el.appendChild(wrap);

  el.querySelectorAll('.group-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      const g = h.closest('.group');

      g.classList.toggle('collapsed');
    });

  el.querySelectorAll('th.sortable').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.sortKey;
      if(listSort.key === key) listSort.dir = (listSort.dir === 'asc' ? 'desc' : 'asc');
      else listSort = {key, dir:'asc'};
      renderList();
    });
  });
  el.querySelectorAll('tbody tr').forEach(r=>{
    r.addEventListener('click', ()=> openDetail(r.dataset.id));
  });
  el.querySelectorAll('select.quick-assign').forEach(sel=>{
    sel.addEventListener('click', e=> e.stopPropagation());

// 전체 목록 컬럼 헤더 — 클릭하면 그 컬럼으로 정렬(같은 컬럼 재클릭 시 방향 반전)
function listSortHeaderHtml(key, label, styleExtra, extraClass){
  const active = listSort.key === key;
  const arrow = active ? (listSort.dir==='asc' ? ' ▲' : ' ▼') : '';
  const cls = ['sortable', extraClass, active?'sort-active':''].filter(Boolean).join(' ');
  return `<th class="${cls}" style="${styleExtra||''}" data-sort-key="${key}" title="클릭하여 정렬">${label}${arrow}</th>`;
}
function sortListItems(items){
  const dir = listSort.dir === 'desc' ? -1 : 1;
  const key = listSort.key;
  function val(t){
    switch(key){
      case 'type': return t.type||'';
      case 'title': return t.title||'';
      case 'assignee': return t.assignee||''; // 미배정을 항상 앞쪽에 두기 위해 빈 문자열 유지
      case 'status': return STATUS_ORDER.indexOf(t.status);
      case 'due': default: return t.dueRequest||'';
    }
  }
  items.sort((a,b)=>{
    const va = val(a), vb = val(b);
    if(va < vb) return -1*dir;
    if(va > vb) return 1*dir;
    return (a.title||'').localeCompare(b.title||'');
  });
  return items;
}
// 미배정 업무를 목록에서 바로 지정할 수 있게 하는 인라인 담당자 선택 — 모달을 열지 않아도 됨
function quickAssignSelectHtml(t){
  return `<select class="quick-assign" data-id="${t.id}" aria-label="담당자 빠른 지정">${assigneeOptions('')}</select>`;
}
async function quickAssignTask(id, name){
  const t = TASKS.find(x=>x.id===id);
  if(!t) return;
  t.assignee = name || '';
  await persist();
  if(name) await logActivity('update', `"<b>${escapeHtml(t.title)}</b>" 담당자가 <b>${escapeHtml(name)}</b>(으)로 지정되었습니다.`, t.id);
  renderCurrent();
}

const ACTIVITY_KEY = 'ppe_activity_log';       // 공유 — 모든 팀원이 같은 알림을 봄
const NOTIF_SEEN_KEY = 'ppe_notif_last_seen';  // 개인별 — 내가 마지막으로 알림함을 연 시각
const ACTIVITY_MAX = 200;
let ACTIVITY_LOG = [];
let notifLastSeen = 0;

async function loadActivity(){
  try{
    const res = await window.storage.get(ACTIVITY_KEY, true);
    if(res && res.value) ACTIVITY_LOG = JSON.parse(res.value);
  }catch(e){ ACTIVITY_LOG = []; }
  try{
    const res2 = await window.storage.get(NOTIF_SEEN_KEY+'_'+currentUserId, false);
    if(res2 && res2.value) notifLastSeen = Number(res2.value) || 0;
  }catch(e){ notifLastSeen = 0; }
}
async function persistActivity(){
  try{ await window.storage.set(ACTIVITY_KEY, JSON.stringify(ACTIVITY_LOG), true); }catch(e){boardSync.error=e.message;boardSyncStatus();}
}
async function logActivity(type, message, taskId){
  ACTIVITY_LOG.unshift({ id:'a'+Date.now()+Math.random().toString(36).slice(2,6), ts:Date.now(), type, message, taskId: taskId||null, by: currentUserLabel() });
  if(ACTIVITY_LOG.length > ACTIVITY_MAX) ACTIVITY_LOG.length = ACTIVITY_MAX;
  await persistActivity();
}
function unreadNotifCount(){
  return ACTIVITY_LOG.filter(a=>a.ts > notifLastSeen).length;
}
function renderNotifBadge(){
  const badge = document.getElementById('notifNavBadge');
  if(!badge) return;
  const n = currentView==='notif' ? 0 : unreadNotifCount();
  if(n > 0){ badge.textContent = n > 99 ? '99+' : String(n); badge.style.display = ''; }
  else badge.style.display = 'none';
}
async function markNotifSeen(){
  notifLastSeen = Date.now();

}

      <button class="settings-tab ${settingsTab==='sync'?'active':''}" data-tab="sync">PC 간 공유 설정</button>
      <button class="settings-tab" data-tab="labelrules">라벨 변환 규칙 ↗</button>
    </div>
    <div id="settingsBody"></div>
  `;
  el.querySelectorAll('.settings-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      // "라벨 변환 규칙"은 별도 탭 화면을 새로 그리지 않고, 라벨데이터 변환기 화면으로 바로 이동한다.
      // (iframe은 브라우저 특성상 다른 부모로 옮기면 새로고침되어 작업 내용이 사라지므로,
      //  안에 복제해서 넣는 대신 이렇게 같은 화면으로 이동시키는 방식을 쓴다.)
      if(btn.dataset.tab === 'labelrules'){ goToLabelData(); return; }
      settingsTab = btn.dataset.tab; renderSettings();
    });
  });
  if(settingsTab==='sync') renderSyncSettings();
  if(settingsTab==='models') renderModelSettings();
  if(settingsTab==='users') renderUserSettings();
  if(settingsTab==='checklist') renderChecklistSettings();
}

        <div class="settings-item-list" data-type="${escapeHtml(type)}">
          ${CHECKLISTS[type].map((item,idx)=>`
            <div class="checklist-item-wrap" data-type="${escapeHtml(type)}" data-idx="${idx}" draggable="true">
              <div class="checklist-edit-row">
                <span class="ci-drag-handle" title="드래그해서 순서 변경">⠿</span>
                <input type="text" class="ci-label" value="${escapeHtml(item.label)}" style="flex:1;">
                <span class="tag" style="background:var(--border-soft); color:var(--muted);">${item.type==='email'?'메일':item.type==='link'?'링크':item.type==='materialList'?'신규자재목록':'체크'}</span>
                <button type="button" class="btn btn-ghost ci-save-label" style="font-size:12px; padding:5px 10px;">저장</button>
                <button class="closebtn ci-remove" title="삭제">✕</button>
              </div>
              ${item.type==='email' ? `
                <textarea class="ci-email-template" data-type="${escapeHtml(type)}" data-idx="${idx}" placeholder="메일 템플릿 ({{docNumber}}, {{title}}, {{mdmNumber}}, {{mdmTitle}}, {{partNumber}}, {{link}} 사용 가능)">${escapeHtml(item.emailTemplate||'')}</textarea>
                <div style="display:flex; justify-content:flex-end; margin:-6px 0 10px;">
                  <button type="button" class="btn btn-ghost ci-save-template" data-type="${escapeHtml(type)}" data-idx="${idx}" style="font-size:12px; padding:5px 10px;">저장</button>
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
        <div class="checklist-add-row">
          <input type="text" class="ci-new-label" data-type="${escapeHtml(type)}" placeholder="새 항목 이름">
          <select class="ci-new-type" data-type="${escapeHtml(type)}">
            <option value="check">일반 체크</option>

        </div>
      </div>
    `).join('')}
  `;

  body.querySelectorAll('.ci-label').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const row = inp.closest('.checklist-edit-row');
      CHECKLISTS[row.dataset.type][Number(row.dataset.idx)].label = inp.value.trim();
      await persistChecklists();
    });
  });
  body.querySelectorAll('.ci-email-template').forEach(ta=>{
    ta.addEventListener('change', async ()=>{
      CHECKLISTS[ta.dataset.type][Number(ta.dataset.idx)].emailTemplate = ta.value;
      await persistChecklists();
    });
  });
  body.querySelectorAll('.ci-save-template').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const ta = body.querySelector(`.ci-email-template[data-type="${btn.dataset.type}"][data-idx="${btn.dataset.idx}"]`);
      if(!ta) return;
      CHECKLISTS[btn.dataset.type][Number(btn.dataset.idx)].emailTemplate = ta.value;
      await persistChecklists();
      const original = btn.textContent;
      btn.textContent = '✅ 저장됨';
      setTimeout(()=>{ btn.textContent = original; }, 1500);
    });
  });
  body.querySelectorAll('.ci-save-label').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const wrap = btn.closest('.checklist-item-wrap');
      const inp = wrap.querySelector('.ci-label');
      CHECKLISTS[wrap.dataset.type][Number(wrap.dataset.idx)].label = inp.value.trim();
      await persistChecklists();
      const original = btn.textContent;
      btn.textContent = '✅ 저장됨';
      setTimeout(()=>{ if(btn.isConnected) btn.textContent = original; }, 1500);
    });
  });
  // 체크리스트 항목 순서를 드래그 앤 드롭으로 바꿀 수 있게
  let ciDragType = null, ciDragIdx = null;
  body.querySelectorAll('.checklist-item-wrap').forEach(w=>{
    w.addEventListener('dragstart', e=>{
      ciDragType = w.dataset.type; ciDragIdx = Number(w.dataset.idx);
      w.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', w.dataset.idx); }catch(err){}
    });
    w.addEventListener('dragend', ()=>{
      w.classList.remove('dragging');
      body.querySelectorAll('.drag-over').forEach(z=>z.classList.remove('drag-over'));
      ciDragType = null; ciDragIdx = null;
    });
    w.addEventListener('dragover', e=>{
      if(ciDragType===null || ciDragType!==w.dataset.type) return;
      e.preventDefault();
      body.querySelectorAll('.drag-over').forEach(z=>{ if(z!==w) z.classList.remove('drag-over'); });
      w.classList.add('drag-over');
    });
    w.addEventListener('dragleave', ()=> w.classList.remove('drag-over'));
    w.addEventListener('drop', async e=>{
      e.preventDefault();
      w.classList.remove('drag-over');
      const type = w.dataset.type, targetIdx = Number(w.dataset.idx);
      if(ciDragType!==type || ciDragIdx===null || ciDragIdx===targetIdx) return;
      const arr = CHECKLISTS[type];
      const [moved] = arr.splice(ciDragIdx, 1);
      arr.splice(targetIdx, 0, moved);
      await persistChecklists();
      renderChecklistSettings();
    });
  });
  body.querySelectorAll('.ci-remove').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const row = btn.closest('.checklist-item-wrap');
      const type = row.dataset.type, idx = Number(row.dataset.idx);
      if(CHECKLISTS[type].length <= 1){ alert('최소 한 개 항목은 남아 있어야 합니다.'); return; }
      if(!confirm('이 항목을 삭제할까요? 이미 체크된 업무의 해당 기록도 함께 사라집니다.')) return;
      CHECKLISTS[type].splice(idx, 1);
      await persistChecklists();
      renderChecklistSettings();
    });
  });
  body.querySelectorAll('.ci-add').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const type = btn.dataset.type;
      const labelInput = body.querySelector(`.ci-new-label[data-type="${type}"]`);
      const typeSelect = body.querySelector(`.ci-new-type[data-type="${type}"]`);
      const label = labelInput.value.trim();
      if(!label){ alert('항목 이름을 입력해 주십시오.'); return; }
      const itemType = typeSelect.value;
      const key = 'c' + Date.now();
      const newItem = { key, label, type: itemType };
      if(itemType==='email') newItem.emailTemplate = '제목: {{docNumber}} - {{title}}\n\n내용을 입력하세요.';
      if(itemType==='link') newItem.linkLabel = '열기';
      CHECKLISTS[type].push(newItem);
      await persistChecklists();
      renderChecklistSettings();
    });
  });
}

/* ================= 공지사항 (기능 업데이트/점검 안내) ================= */
const ANNOUNCE_KEY = 'ppe_announcements';            // 공유 — 모든 팀원이 같은 공지사항을 봄
const ANNOUNCE_SEEN_KEY = 'ppe_announce_last_seen';   // 개인별 — 내가 마지막으로 공지사항을 연 시각
const ANNOUNCE_MAX = 100;
let ANNOUNCEMENTS = [];
let announceLastSeen = 0;
async function loadAnnouncements(){
  try{
    const res = await window.storage.get(ANNOUNCE_KEY, true);
    if(res && res.value) ANNOUNCEMENTS = JSON.parse(res.value);
  }catch(e){ ANNOUNCEMENTS = []; }
  try{
    const res2 = await window.storage.get(ANNOUNCE_SEEN_KEY+'_'+currentUserId, false);
    if(res2 && res2.value) announceLastSeen = Number(res2.value) || 0;
  }catch(e){ announceLastSeen = 0; }
}
async function persistAnnouncements(){
  try{ await window.storage.set(ANNOUNCE_KEY, JSON.stringify(ANNOUNCEMENTS), true); }catch(e){boardSync.error=e.message;boardSyncStatus();}
}
async function addAnnouncement(title, body){
  ANNOUNCEMENTS.unshift({ id:'an'+Date.now()+Math.random().toString(36).slice(2,6), ts:Date.now(), title, body, by: currentUserLabel() });
  if(ANNOUNCEMENTS.length > ANNOUNCE_MAX) ANNOUNCEMENTS.length = ANNOUNCE_MAX;
  await persistAnnouncements();
}
async function deleteAnnouncement(id){
  ANNOUNCEMENTS = ANNOUNCEMENTS.filter(a=>a.id!==id);
  await persistAnnouncements();
}
function unreadAnnounceCount(){
  return ANNOUNCEMENTS.filter(a=>a.ts > announceLastSeen).length;
}
function renderAnnounceBadge(){
  const badge = document.getElementById('announceNavBadge');
  if(!badge) return;
  const n = currentView==='announce' ? 0 : unreadAnnounceCount();
  if(n > 0){ badge.textContent = n > 99 ? '99+' : String(n); badge.style.display = ''; }
  else badge.style.display = 'none';
}
async function markAnnounceSeen(){
  announceLastSeen = Date.now();
  try{ await window.storage.set(ANNOUNCE_SEEN_KEY+'_'+currentUserId, String(announceLastSeen), false); }catch(e){}
}
function renderAnnouncements(){
  const el = document.getElementById('view-announce');
  markAnnounceSeen().then(renderAnnounceBadge);
  const listHtml = ANNOUNCEMENTS.length ? ANNOUNCEMENTS.map(a=>`
    <div class="announce-item">
      <div class="announce-head">
        <span class="announce-title">📢 ${escapeHtml(a.title)}</span>
        <button type="button" class="closebtn announce-del" data-id="${escapeHtml(a.id)}" title="삭제">✕</button>
      </div>
      <div class="announce-body">${escapeHtml(a.body||'').replace(/\n/g,'<br>')}</div>
      <div class="announce-meta">${new Date(a.ts).toLocaleString('ko-KR')} · ${escapeHtml(a.by||'')}</div>
    </div>
  `).join('') : `<div class="notif-empty">아직 등록된 공지사항이 없습니다.</div>`;
  el.innerHTML = `
    <div class="panel" style="max-width:640px; margin-bottom:16px;">
      <button type="button" class="btn" id="announceAddBtn">+ 새 공지사항 작성</button>
      <div id="announceForm" style="display:none; margin-top:12px;">
        <input type="text" id="announceTitleInput" placeholder="제목 (예: BOM 비교 도구 EBOM↔EBOM 모드 추가)" style="width:100%; border:1px solid var(--border); border-radius:7px; padding:8px 10px; font-size:12.8px; margin-bottom:8px;">
        <textarea id="announceBodyInput" placeholder="내용" style="width:100%; min-height:90px; border:1px solid var(--border); border-radius:7px; padding:8px 10px; font-size:12.8px; font-family:inherit;"></textarea>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button type="button" class="btn" id="announceSaveBtn">등록</button>
          <button type="button" class="btn-ghost" id="announceCancelBtn">취소</button>
        </div>
      </div>
    </div>
    <div class="announce-list">${listHtml}</div>
  `;
  document.getElementById('announceAddBtn').addEventListener('click', ()=>{
    document.getElementById('announceForm').style.display = 'block';
  });
  document.getElementById('announceCancelBtn').addEventListener('click', ()=>{
    document.getElementById('announceForm').style.display = 'none';
    document.getElementById('announceTitleInput').value = '';
    document.getElementById('announceBodyInput').value = '';
  });
  document.getElementById('announceSaveBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('announceTitleInput').value.trim();
    const body = document.getElementById('announceBodyInput').value.trim();
    if(!title){ alert('제목을 입력해 주세요.'); return; }
    await addAnnouncement(title, body);
    renderAnnouncements();
  });
  el.querySelectorAll('.announce-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('이 공지사항을 삭제할까요?')) return;
      await deleteAnnouncement(btn.dataset.id);
      renderAnnouncements();
    });
  });
}
// 대시보드 "담당자별 업무량"에서 이름을 클릭하면, 그 담당자(미배정 포함) 업무만 걸러서
// 전체 목록으로 이동한다 — 목록에서는 이미 클릭 → 상세 모달 → 수정이 전부 되므로 그대로 재사용.
function goToOwnerList(owner){
  currentView = 'list';
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view==='list'));
  filter = {q:'', model:'all', type:'all', assignee:owner, status:'all', myOnly:false};

function goToTask(taskId){
  const t = TASKS.find(x=>x.id===taskId);
  if(!t){ alert('해당 업무를 찾을 수 없습니다 (삭제되었을 수 있습니다).'); return; }
  currentView = 'list';
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view==='list'));
  // 담당자/상태/MODEL/"내 담당 건만" 필터가 켜져 있으면 이동해도 그 업무가 목록에서 걸러져 버리므로
  // (모달을 닫는 순간 빈 목록만 남았다) 알림에서 이동할 때는 필터를 함께 해제한다.
  filter = {q: t.docNumber || t.title, model:'all', type:'all', assignee:'all', status:'all', myOnly:false};

}

const LAST_VIEWED_KEY = 'ppe_last_viewed';
let LAST_VIEWED = {};
async function loadLastViewed(){
  try{
    const res = await window.storage.get(LAST_VIEWED_KEY, false);
    if(res && res.value) LAST_VIEWED = JSON.parse(res.value);
  }catch(e){ LAST_VIEWED = {}; }
}
async function markViewed(taskId){
  LAST_VIEWED[taskId] = Date.now();
  try{ await window.storage.set(LAST_VIEWED_KEY, JSON.stringify(LAST_VIEWED), false); }catch(e){}
}
function unreadCommentCount(t){
  if(!t.comments || !t.comments.length) return 0;
  const last = LAST_VIEWED[t.id] || 0;
  return t.comments.filter(c => c.ts > last).length;
}
function unreadBadgeHtml(t){
  const n = unreadCommentCount(t);
  if(!n) return '';
  return `<span class="unread-badge">💬 안읽음 ${n}</span>`;
}

function openDetail(id){
  const t = TASKS.find(x=>x.id===id);
  if(!t) return;

function excelDateToStr(v){
  if(v === null || v === undefined || v === '') return '';
  if(typeof v === 'string'){
    const m = v.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if(m) return `${m[1]}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')}`;
    return v.trim();
  }
  if(v instanceof Date && !isNaN(v.getTime())){
    return `${v.getFullYear()}/${String(v.getMonth()+1).padStart(2,'0')}/${String(v.getDate()).padStart(2,'0')}`;
  }
  if(typeof v === 'number'){
    // 엑셀 시리얼 날짜 값 보정 (1900 날짜계 기준)
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}/${String(d.m).padStart(2,'0')}/${String(d.d).padStart(2,'0')}`;
  }
  return String(v).trim();
}
function inferTypeFromDoc(doc){
  const d = (doc||'').toUpperCase();
  if(d.startsWith('NPO')) return 'MDM';
  if(d.startsWith('E00')) return 'ECO';
  return '기타업무';
}
// 일괄등록용 엑셀 양식 다운로드 — handleExcelImport()가 읽는 컬럼명과 정확히 일치시켜서,
// 이 양식을 채워 그대로 업로드하면(과거에 이미 끝난 업무 포함) 바로 반영되도록 한다.
function downloadExcelImportTemplate(){
  const header = ['번호','문서 제목','MODEL','유형','담당자','상태','요청일','수신일','완료일','비고'];
  const sample1 = ['NPO-2509-001','예시) 신규자재 SAP 등록 요청','GMDSS','MDM','User 1','완료','2026/09/01','2026/09/01','2026/09/05','과거에 이미 끝난 업무도 이렇게 상태를 "완료"로 적으면 이력으로 등록됩니다'];
  const sample2 = ['E00-2509-002','예시) 진행 중인 ECO 건','VSAT C1','ECO','User 2','진행 중','2026/09/10','2026/09/08','',''];
  const noteRow = ['※ 상태는 다음 중 하나: '+STATUS_ORDER.join(' / '),'','유형: '+Object.keys(TYPE_META).join(' / '),'','','','날짜는 YYYY/MM/DD','','',''];
  const aoa = [header, sample1, sample2, [], noteRow];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:14},{wch:32},{wch:10},{wch:8},{wch:10},{wch:10},{wch:11},{wch:11},{wch:11},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '업무일괄등록');
  XLSX.writeFile(wb, '업무_일괄등록_양식.xlsx');
}
function bindExcelDrop(zone){
  zone.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();zone.classList.add('drag');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
  zone.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();zone.classList.remove('drag');const file=e.dataTransfer.files[0];if(file)handleExcelImport(file);});
}
async function handleExcelImport(file){
  if(!/\.xlsx?$/i.test(file.name)){alert('엑셀 파일(.xlsx 또는 .xls)을 선택해 주세요.');return;}
  if(typeof XLSX==='undefined'){alert('엑셀 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.');return;}
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(!rows.length){ alert('엑셀에서 데이터를 찾지 못했습니다.'); return; }

    // '번호'(문서번호=ECO/문서 키) 기준으로 그룹핑 — 활동명이 달라도 같은 번호면 하나의 업무로 합침
    const groups = {};
    rows.forEach(r=>{
      const doc = String(r['번호'] ?? r['문서번호'] ?? r['문서 번호'] ?? '').trim();
      if(!doc) return;
      if(!groups[doc]) groups[doc] = r; // 첫 행 기준 대표값 사용 (제목/담당자 등은 보통 동일)
    });
    if(!Object.keys(groups).length){ alert('엑셀에서 문서번호("번호") 컬럼을 찾지 못했습니다.'); return; }

    const toCreate = [];
    const toUpdate = [];
    Object.keys(groups).forEach(doc=>{
      const r = groups[doc];
      const title = String(r['문서 제목'] ?? r['제목'] ?? r['프로젝트 이름'] ?? '').trim();
      const assigneeRaw = String(r['담당자'] ?? '').trim();
      // 외부(Notion 등) 내보내기가 "USER1"처럼 공백/대소문자가 다르게 적는 경우, 실제 팀원 이름으로 정규화
      const normKey = s => s.toLowerCase().replace(/\s+/g,'');
      const matchedUser = assigneeRaw ? USERS.find(u => normKey(u.name) === normKey(assigneeRaw)) : null;
      const assignee = matchedUser ? matchedUser.name : assigneeRaw;
      const dueRequest = excelDateToStr(r['요청일'] ?? r['완료요청일'] ?? '');
      const receivedDate = excelDateToStr(r['수신일'] ?? '');
      const endDate = excelDateToStr(r['완료일'] ?? r['종료일'] ?? '');
      const model = String(r['MODEL'] ?? r['모델'] ?? '').trim();
      const note = String(r['비고'] ?? '').trim();
      // 상태/유형은 양식에 정해진 값과 정확히 일치할 때만 반영하고, 아니면 기존 방식(신규=시작 전, 문서번호로 유형 추정)대로 둔다.
      const statusRaw = String(r['상태'] ?? '').trim();
      const status = STATUS_ORDER.includes(statusRaw) ? statusRaw : '';
      const typeRaw = String(r['유형'] ?? '').trim();
      const type = Object.keys(TYPE_META).includes(typeRaw) ? typeRaw : inferTypeFromDoc(doc);

      const existing = TASKS.find(t => t.docNumber === doc);
      if(existing){
        toUpdate.push({ existing, patch:{title, assignee, dueRequest, receivedDate, endDate, status, note} });
      } else {
        toCreate.push({ doc, title: title || doc, assignee, dueRequest, receivedDate, endDate, type, model, status, note });
      }
    });

    openExcelReview(toCreate, toUpdate);
  }catch(err){
    console.error('엑셀 업로드 오류:', err);
    alert('엑셀 파일을 읽는 중 오류가 발생했습니다. 파일 형식을 확인해 주세요.');
  }
}

// 화면에서 흔히 쓰이는 라벨 → 우리 스키마 필드 매핑 (라벨:값이 같은 줄에 있는 표/양식 캡처를 전제로 함)
const LABEL_MAP = [
  {key:'docNumber',  labels:['문서번호','문서 번호','번호']},
  {key:'title',      labels:['프로젝트 이름','프로젝트명','제목']},
  {key:'dueRequest', labels:['완료요청일','완료 요청일']},
  {key:'type',       labels:['유형']},
  {key:'model',      labels:['MODEL','모델']},
  {key:'assignee',   labels:['담당자']},
  {key:'status',     labels:['상태']},
  {key:'requester',  labels:['요청자']},
  {key:'worker',     labels:['작업자']},
  {key:'activity',   labels:['활동']},
  {key:'arrival',    labels:['도착일']},
  {key:'note',       labels:['비고']},
];

function extractLabeledFields(rawText){
  const text = rawText.replace(/\r/g, '');
  const allLabels = LABEL_MAP.flatMap(l => l.labels)
    .sort((a,b) => b.length - a.length)
    .map(l => l.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  // 라벨은 줄 시작이거나 2칸 이상 공백(표의 다음 칸) 뒤에 오는 경우만 인정 — 문장 속 우연한 단어 오탐 방지
  const labelRegex = new RegExp('(^|[ \\t]{2,})(' + allLabels.join('|') + ')\\s*[:：]?\\s*', 'gm');

  const hits = [];
  let m;
  while((m = labelRegex.exec(text))){
    hits.push({ label: m[2], start: m.index, valueStart: m.index + m[0].length });
    if(m.index === labelRegex.lastIndex) labelRegex.lastIndex++;
  }

  const results = {};
  for(let i = 0; i < hits.length; i++){
    const end = (i + 1 < hits.length) ? hits[i+1].start : text.length;
    let raw = text.slice(hits[i].valueStart, end);
    const nl = raw.indexOf('\n');
    if(nl !== -1) raw = raw.slice(0, nl);
    const value = raw.replace(/\s+/g, ' ').trim();
    const entry = LABEL_MAP.find(l => l.labels.includes(hits[i].label));
    if(entry && value && !results[entry.key]) results[entry.key] = value;
  }
  return results;
}

function todayDateStr(){

}

/* ================= 커스텀 날짜 선택기 (달력 팝업) ================= */
function formatSlashDate(y,m,d){ return `${y}/${String(m+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`; }
function parseSlashDateParts(s){
  const m = String(s||'').match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(!m) return null;
  return {y:+m[1], m:+m[2]-1, d:+m[3]};
}
let closeOpenDatePicker = null;
function attachDatePicker(fieldEl){
  if(!fieldEl) return;
  const input = fieldEl.querySelector('.date-picker-input');
  const iconBtn = fieldEl.querySelector('.date-picker-icon-btn');
  const openPicker = ()=>{
    if(closeOpenDatePicker) closeOpenDatePicker();
    const popup = document.createElement('div');
    popup.className = 'date-picker-popup open';
    fieldEl.appendChild(popup);
    const parsed = parseSlashDateParts(input.value);
    const today = new Date();
    let viewY = parsed ? parsed.y : today.getFullYear();
    let viewM = parsed ? parsed.m : today.getMonth();
    function draw(){
      const first = new Date(viewY, viewM, 1);
      const startOffset = (first.getDay()+6)%7; // 월요일 시작
      const daysInMonth = new Date(viewY, viewM+1, 0).getDate();
      const daysInPrevMonth = new Date(viewY, viewM, 0).getDate();
      let cells = '';
      for(let i=0;i<startOffset;i++){
        const dd = daysInPrevMonth - startOffset + 1 + i;
        const py = viewM===0? viewY-1 : viewY, pm = viewM===0? 11 : viewM-1;
        cells += `<button type="button" class="dp-cell dp-muted" data-y="${py}" data-m="${pm}" data-d="${dd}">${dd}</button>`;
      }
      for(let d=1; d<=daysInMonth; d++){
        const isToday = viewY===today.getFullYear() && viewM===today.getMonth() && d===today.getDate();
        const isSelected = parsed && viewY===parsed.y && viewM===parsed.m && d===parsed.d;
        cells += `<button type="button" class="dp-cell ${isToday?'dp-today':''} ${isSelected?'dp-selected':''}" data-y="${viewY}" data-m="${viewM}" data-d="${d}">${d}</button>`;
      }
      const trailing = (7 - ((startOffset + daysInMonth) % 7)) % 7;
      for(let i=1;i<=trailing;i++){
        const ny = viewM===11? viewY+1 : viewY, nm = viewM===11? 0 : viewM+1;
        cells += `<button type="button" class="dp-cell dp-muted" data-y="${ny}" data-m="${nm}" data-d="${i}">${i}</button>`;
      }
      popup.innerHTML = `
        <div class="dp-head">
          <button type="button" class="dp-nav-btn" data-nav="-1" aria-label="이전 달">‹</button>
          <span class="dp-title">${viewY}년 ${viewM+1}월</span>
          <button type="button" class="dp-nav-btn" data-nav="1" aria-label="다음 달">›</button>
        </div>
        <div class="dp-weekdays">${['월','화','수','목','금','토','일'].map(w=>`<span>${w}</span>`).join('')}</div>
        <div class="dp-grid">${cells}</div>
        <div class="dp-foot">
          <button type="button" data-today="1">오늘</button>
          <button type="button" data-clear="1">지우기</button>
        </div>
      `;
      popup.querySelector('[data-nav="-1"]').onclick = ()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} draw(); };
      popup.querySelector('[data-nav="1"]').onclick = ()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} draw(); };
      popup.querySelectorAll('.dp-cell').forEach(cell=>{
        cell.onclick = ()=>{
          input.value = formatSlashDate(+cell.dataset.y, +cell.dataset.m, +cell.dataset.d);
          input.dispatchEvent(new Event('change', {bubbles:true}));
          closePicker();
        };
      });
      popup.querySelector('[data-today="1"]').onclick = ()=>{
        const n = new Date();
        input.value = formatSlashDate(n.getFullYear(), n.getMonth(), n.getDate());
        input.dispatchEvent(new Event('change', {bubbles:true}));
        closePicker();
      };
      popup.querySelector('[data-clear="1"]').onclick = ()=>{
        input.value = '';
        input.dispatchEvent(new Event('change', {bubbles:true}));
        closePicker();
      };
    }
    draw();
    function onOutside(e){ if(!fieldEl.contains(e.target)) closePicker(); }
    function onEsc(e){ if(e.key==='Escape'){ e.stopPropagation(); closePicker(); } }
    function closePicker(){
      popup.remove();
      document.removeEventListener('mousedown', onOutside, true);
      document.removeEventListener('keydown', onEsc, true);
      closeOpenDatePicker = null;
    }
    closeOpenDatePicker = closePicker;
    setTimeout(()=>{
      document.addEventListener('mousedown', onOutside, true);
      document.addEventListener('keydown', onEsc, true);
    }, 0);
  };
  iconBtn.addEventListener('click', openPicker);
  input.addEventListener('click', openPicker);
}

function normalizeDate(s){
  if(!s) return '';
  const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(!m) return s;
  return `${m[1]}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')}`;
}

async function analyzeScreenshot(file){
  const statusEl = document.getElementById('shotStatus');
  statusEl.textContent = 'OCR 엔진을 불러오는 중… (최초 1회는 다소 시간이 걸릴 수 있어요)';
  statusEl.className = 'shot-status busy';
  try{
    const worker = await getOcrWorker();
    statusEl.textContent = '이미지에서 텍스트를 인식하는 중…';
    const { data } = await worker.recognize(file);
    const text = data.text || '';
    if(!text.trim()) throw new Error('인식된 텍스트가 없습니다.');

    const r = extractLabeledFields(text);

    let inferredType = (r.type && TYPE_META[r.type]) ? r.type : '';
    const doc = (r.docNumber || '').toUpperCase();
    if(!inferredType){
      if(doc.startsWith('NPO')) inferredType = 'MDM';
      else if(doc.startsWith('E00')) inferredType = 'ECO';
    }

    const noteParts = [];
    if(r.requester) noteParts.push('요청자: ' + r.requester);
    if(r.worker) noteParts.push('작업자: ' + r.worker);
    if(r.arrival) noteParts.push('도착일: ' + r.arrival);
    if(r.activity) noteParts.push('활동: ' + r.activity);
    if(r.note) noteParts.push(r.note);

    document.getElementById('nTitle').value = r.title || '';
    if(inferredType) document.getElementById('nType').value = inferredType;
    document.getElementById('nModel').value = r.model || '';
    setAssigneeSelection(document.getElementById('nAssignee'), r.assignee || '');
    document.getElementById('nDoc').value = r.docNumber || '';
    document.getElementById('nDue').value = normalizeDate(r.dueRequest);
    if(r.status && STATUS_ORDER.includes(r.status)) document.getElementById('nStatus').value = r.status;
    document.getElementById('nNote').value = noteParts.join(' / ');

    const missing = [];
    if(!r.title) missing.push('프로젝트 이름');
    if(!r.model) missing.push('MODEL');
    if(!r.assignee) missing.push('담당자');
    if(!r.status) missing.push('상태');
    statusEl.textContent = missing.length
      ? `OCR 인식 완료 — 못 찾은 항목(${missing.join(', ')})은 직접 입력해주세요. 오탈자도 함께 확인해주세요.`
      : 'OCR 인식 완료 — 오탈자가 있을 수 있으니 내용을 확인한 뒤 추가를 눌러주세요.';
    statusEl.className = 'shot-status done';
  }catch(e){
    statusEl.textContent = '텍스트 인식에 실패했습니다. 더 선명한 이미지로 다시 시도하거나 직접 입력해 주세요.';
    statusEl.className = 'shot-status error';
  }
}

  document.getElementById('closeModal').addEventListener('click', closeModal);

  const excelZone=document.getElementById('addExcelDrop'),excelInput=document.getElementById('addExcelInput');
  bindExcelDrop(excelZone);
  excelZone.addEventListener('click',e=>{if(e.target!==excelInput)excelInput.click();});
  excelZone.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();excelInput.click();}});
  excelInput.addEventListener('change',()=>{if(excelInput.files[0])handleExcelImport(excelInput.files[0]);});
  document.getElementById('downloadExcelTemplateBtn').addEventListener('click', downloadExcelImportTemplate);
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  setupModelCombobox(document.getElementById('nModel'));
  dropzone.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', ()=>{ if(fileInput.files[0]) analyzeScreenshot(fileInput.files[0]); });
  dropzone.addEventListener('dragover', e=>{ e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e=>{
    e.preventDefault(); dropzone.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if(f && /\.xlsx?$/i.test(f.name)) handleExcelImport(f);
    else if(f && f.type.startsWith('image/')) analyzeScreenshot(f);
  });

  if(pasteListenerRef) document.removeEventListener('paste', pasteListenerRef);
  pasteListenerRef = (e)=>{
    const items = (e.clipboardData || {}).items || [];
    for(const item of items){
      if(item.type && item.type.startsWith('image/')){
        const file = item.getAsFile();
        if(file) analyzeScreenshot(file);
        break;
      }
    }
  };
  document.addEventListener('paste', pasteListenerRef);

  document.getElementById('nLink').addEventListener('input',e=>{const link=document.getElementById('newLinkPreview'),url=safeTaskUrl(e.target.value.trim());link.hidden=!url; if(url)link.href=url;else link.removeAttribute('href');});
  document.getElementById('saveNew').addEventListener('click', async ()=>{
    const title = document.getElementById('nTitle').value.trim();
    if(!title){ alert('프로젝트 이름을 입력해 주십시오.'); return; }
    const link=document.getElementById('nLink').value.trim();if(link&&!safeTaskUrl(link)){alert('http:// 또는 https://로 시작하는 링크를 입력해 주세요.');return;}
    const docNumber = document.getElementById('nDoc').value.trim();
    if(docNumber){
      const dup = TASKS.find(t => t.docNumber && t.docNumber.trim().toLowerCase() === docNumber.toLowerCase());
      if(dup){ showDuplicateConfirm(dup); return; }
    }
    await createTaskFromForm();
  });
}

async function createTaskFromForm(){
  const title = document.getElementById('nTitle').value.trim();
  const type = document.getElementById('nType').value;
  const status = document.getElementById('nStatus').value;
  const model = document.getElementById('nModel').value.trim() || '미분류';
  const blankActionItems = {};
  checklistFor(type).forEach(i=>{ blankActionItems[i.key] = false; });
  const newTask = {
    id: 't' + Date.now(),
    title,
    model,
    assignee: document.getElementById('nAssignee').value.trim(),
    docNumber: document.getElementById('nDoc').value.trim(),
    link: document.getElementById('nLink').value.trim(),
    partNumber: document.getElementById('nPartNumber').value.trim(),
    note: document.getElementById('nNote').value.trim(),
    status,
    dueRequest: document.getElementById('nDue').value.trim(),
    receivedDate: document.getElementById('nReceived').value.trim(),
    type,
    endDate: '',
    ecnStep: type==='ECO' ? 'assigned' : 'na',
    actionItems: blankActionItems,
    author: currentUserLabel(),
    authorId: currentUserId,
    comments: [],
    delayReason: status==='장기 지연' ? 'manual' : null,
    delayOverrideAt: null
  };
  await ensureModelKnown(model);
  TASKS.unshift(newTask);
  await persist();
  await logActivity('create', `<b>${escapeHtml(currentUserLabel())}</b>님이 새 업무 "<b>${escapeHtml(newTask.title)}</b>"를 등록했습니다.`, newTask.id);
  closeModal();
  renderCurrent();
}

/* ================= THEME ================= */
// 저장된 선택이 없으면 OS(시스템) 다크모드 설정을 따르고, 버튼으로 직접 켜고 끌 수 있다.
// BOM 비교 도구(iframe)도 같은 origin이라 localStorage를 공유하므로, 그쪽에서 로드 시 이 값을 그대로 읽어 적용한다.
function isDarkActive(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t === 'dark') return true;
  if(t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(theme){
  if(theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = isDarkActive() ? '☀️ 라이트 모드' : '🌙 다크 모드';
  // BOM 비교 도구 / 라벨데이터 변환기(둘 다 iframe)는 한 번 만들어지면 재사용되므로,
  // 테마를 바꿀 때 그쪽 문서에도 바로 반영한다.
  try{
    ['sapBomCompareFrame','labelDataFrame'].forEach(id=>{
      const frameDoc = document.getElementById(id)?.contentDocument;
      if(frameDoc && frameDoc.documentElement){
        if(theme === 'dark' || theme === 'light') frameDoc.documentElement.setAttribute('data-theme', theme);
        else frameDoc.documentElement.removeAttribute('data-theme');
      }
    });
  }catch(e){}
  // 업무유형/상태 색상은 렌더링 시점에 getComputedStyle로 읽어 인라인 style로 굳혀두므로,
  // 테마를 바꾼 뒤에는 현재 화면을 다시 그려야 새 팔레트 색이 반영된다.
  if(typeof renderCurrent === 'function' && typeof TASKS !== 'undefined' && TASKS.length) renderCurrent();
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('ppe_theme'); }catch(e){}
  applyTheme(saved);
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.addEventListener('click', ()=>{
    const next = isDarkActive() ? 'light' : 'dark';
    try{ localStorage.setItem('ppe_theme', next); }catch(e){}
    applyTheme(next);
  });
}
initTheme();
